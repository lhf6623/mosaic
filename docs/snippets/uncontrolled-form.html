<mc-form on:submit="send($event)">
  <mc-form-item label="姓名" name="name" required>
    <mc-input default-value="张三"></mc-input>
  </mc-form-item>

  <mc-form-item label="备注" rules='[{"required":true}]'>
    <mc-textarea rows="2"></mc-textarea>
  </mc-form-item>

  <mc-form-item>
    <mc-button type="submit">发送</mc-button>
  </mc-form-item>
</mc-form>

<script>
  export default async () => ({
    proto: {
      send(event) {
        /* 非受控：event.data.value 就是那份快照 */
        fetch('/api', { method: 'POST', body: JSON.stringify(event.data.value) });
      },
    },
  });
</script>
