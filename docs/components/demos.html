<template component>
  <style>
    :host {
      display: block;
      position: relative;
      --doc-demos-gap: var(--mc-space-5, 20px);
    }
  </style>

  <slot></slot>

  <script>
    const TWO_COLS = 1320;
    const THREE_COLS = 2300;
    const GAP_FALLBACK = 20;

    export default () => ({
      tag: 'doc-demos',

      attached() {
        this._items = [...this.ele.children].filter((el) => el.classList?.contains('doc-demo'));
        if (!this._items.length) return;

        this._raf = 0;
        this._ro = new ResizeObserver(() => this.schedule());
        this._ro.observe(this.ele);
        for (const el of this._items) this._ro.observe(el);
        this.schedule();
      },

      detached() {
        this._ro?.disconnect();
        cancelAnimationFrame(this._raf);
      },

      proto: {
        schedule() {
          if (this._raf) return;
          this._raf = requestAnimationFrame(() => {
            this._raf = 0;
            this.layout();
          });
        },

        gapPx() {
          const raw = getComputedStyle(this.ele).getPropertyValue('--doc-demos-gap').trim();
          const rootFont = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
          const value = parseFloat(raw);
          if (!Number.isFinite(value)) return GAP_FALLBACK;
          return raw.endsWith('rem') ? value * rootFont : value;
        },

        layout() {
          const items = this._items;
          const width = this.ele.clientWidth;
          if (!items?.length || width <= 0) return;

          const gap = this.gapPx();
          const allowed = width >= THREE_COLS ? 3 : width >= TWO_COLS ? 2 : 1;
          const cols = Math.min(allowed, items.length);

          if (cols === 1) {
            for (const el of items) {
              for (const prop of ['position', 'left', 'top', 'width', 'margin', 'box-sizing']) {
                el.style.removeProperty(prop);
              }
            }
            this.ele.style.removeProperty('height');
            this.ele.removeAttribute('data-masonry');
            return;
          }

          const itemWidth = (width - (cols - 1) * gap) / cols;

          for (const el of items) {
            el.style.position = 'absolute';
            el.style.width = `${itemWidth}px`;
            el.style.margin = '0';
            el.style.boxSizing = 'border-box';
          }
          const heights = items.map((el) => el.offsetHeight);

          const colHeights = new Array(cols).fill(0);
          items.forEach((el, i) => {
            const preferred = i % cols;
            const min = Math.min(...colHeights);
            const col = colHeights[preferred] === min ? preferred : colHeights.indexOf(min);
            el.style.left = `${col * (itemWidth + gap)}px`;
            el.style.top = `${colHeights[col]}px`;
            colHeights[col] += heights[i] + gap;
          });

          this.ele.style.height = `${Math.max(...colHeights) - gap}px`;
          this.ele.setAttribute('data-masonry', '');
        },
      },
    });
  </script>
</template>
