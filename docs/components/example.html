<template component>
  <style>
    :host {
      display: block;
    }

    .head {
      display: flex;
      align-items: center;
      gap: var(--mc-space-3);
    }

    .title {
      min-width: 0;
    }

    .actions {
      display: flex;
      flex: none;
      gap: var(--mc-space-1);
      margin-left: auto;
    }

    .actions mc-button {
      --mc-button-accent: var(--mc-color-fg-muted);
      width: 28px;
      padding-inline: 0;
    }

    .actions mc-button.is-primary {
      --mc-button-accent: var(--mc-color-primary);
    }

    .actions mc-button[data-feedback='copied'] {
      --mc-button-accent: var(--mc-color-success);
    }

    .actions mc-button[data-feedback='failed'] {
      --mc-button-accent: var(--mc-color-danger);
    }

    .actions mc-button[hidden] {
      display: none;
    }

    .live {
      min-height: 2rem;
      margin-top: var(--mc-space-4);
    }

    .frame {
      display: block;
      width: 100%;
      min-height: 2rem;
      border: 0;
      background: transparent;
    }

    .load-error {
      margin: 0;
      color: rgb(var(--mc-color-danger));
      font-size: var(--mc-text-sm);
      line-height: var(--mc-text-sm-lh);
    }

    .panel {
      margin-top: var(--mc-space-4);
      padding-top: var(--mc-space-3);
      border-top: 1px solid rgb(var(--mc-color-border));
    }

    .panel[hidden] {
      display: none;
    }

    .envs {
      margin-bottom: var(--mc-space-3);
    }

    .envs::part(list) {
      display: flex;
      flex: 1;
    }

    .envs mc-tab {
      flex: 1;
    }

    .envs mc-tab::part(base) {
      flex: 1;
    }

    .envs[hidden] {
      display: none;
    }

    .error {
      margin: var(--mc-space-2) 0 0;
      padding: var(--mc-space-2) var(--mc-space-3);
      max-height: 10rem;
      overflow: auto;
      border-left: 2px solid rgb(var(--mc-color-danger));
      border-radius: var(--mc-radius-sm);
      background-color: rgb(var(--mc-color-danger-subtle));
      color: rgb(var(--mc-color-fg));
      font-family: var(--mc-font-mono);
      font-size: var(--mc-text-xs);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .error[hidden] {
      display: none;
    }
  </style>

  <div class="head">
    <div class="title"><slot name="title"></slot></div>
    <div class="actions">
      <mc-button
        size="sm"
        variant="ghost"
        class="is-primary"
        icon="play"
        title="运行"
        attr:disabled="!loaded"
        attr:hidden="!codeOpen"
        on:click="run()"></mc-button>
      <mc-button
        size="sm"
        variant="ghost"
        icon="refresh"
        title="重新运行"
        attr:disabled="!loaded"
        attr:hidden="!codeOpen"
        on:click="rerun()"></mc-button>
      <mc-button
        size="sm"
        variant="ghost"
        :icon="copyIcon()"
        attr:disabled="!loaded"
        attr:data-feedback="copyState || null"
        attr:title="copyTitle()"
        on:click="copy()"></mc-button>
      <mc-button
        size="sm"
        variant="ghost"
        icon="code"
        attr:disabled="!loaded"
        attr:title="codeOpen ? '收起代码' : '查看代码'"
        on:click="toggleCode()"></mc-button>
    </div>
  </div>

  <slot name="hint"></slot>

  <div class="live" part="preview"></div>
  <p class="load-error" attr:hidden="!previewError">{{previewError}}</p>

  <div class="panel" attr:hidden="!codeOpen">
    <mc-tabs
      class="envs"
      variant="segmented"
      no-panel
      attr:hidden="!plainAvailable"
      on:change="setEnv($event.data.value)">
      <mc-tab value="ofa" name="ofa.js 例子"></mc-tab>
      <mc-tab value="plain" name="普通例子"></mc-tab>
    </mc-tabs>
    <mc-code-editor
      class="editor"
      auto-resize
      on:input="onEditorInput($event)"
      on:change="onEditorChange($event)"
      on:keydown="onEditorKeydown($event)"></mc-code-editor>
    <pre class="error" attr:hidden="!errorText">{{errorText}}</pre>
  </div>

  <script>
    import { compileDemo, loadDemoText } from '../lib/demo-runtime.mjs';

    const COPY_FEEDBACK_MS = 3000;

    const CDN_RE =
      /https:\/\/(?:cdn|fastly|gcore|testingcf)\.jsdelivr\.net\/gh\/lhf6623\/mosaic@[^/]+\//g;

    const themeTargets = new Set();
    let themeObserver;
    let themeMq;

    const syncAllTheme = () => {
      for (const target of themeTargets) target.syncFrameTheme();
    };

    const watchTheme = (target) => {
      themeTargets.add(target);
      if (!themeObserver) {
        themeObserver = new MutationObserver(syncAllTheme);
        themeObserver.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['data-theme', 'class', 'style'],
        });
        themeMq = window.matchMedia?.('(prefers-color-scheme: dark)');
        themeMq?.addEventListener?.('change', syncAllTheme);
      }
      target.syncFrameTheme();
    };

    const unwatchTheme = (target) => {
      themeTargets.delete(target);
      if (themeTargets.size) return;
      themeObserver?.disconnect();
      themeObserver = undefined;
      themeMq?.removeEventListener?.('change', syncAllTheme);
      themeMq = undefined;
    };

    export default () => ({
      tag: 'doc-example',

      attrs: {
        src: '',
        plainSrc: '',
      },

      data: {
        env: 'ofa', // 当前代码视图
        codeOpen: false, // 代码区是否展开
        plainAvailable: false, // 有没有普通例子可切
        loaded: false, // 源文件是否读完（读完后按钮才可用）
        copyState: '', // '' | 'copied' | 'failed'，复制按钮的临时反馈
        errorText: '', // 编译错误
        previewError: '', // 预览加载失败
      },

      watch: {
        src() {
          if (this._mounted) this.loadSources();
        },
        plainSrc() {
          if (this._mounted) this.loadSources();
        },
      },

      ready() {
        this._live = this.shadow.$('.live');
        this._editorEl = this.shadow.$('.editor')?.ele ?? null;
        this._envTabs = this.shadow.$('.envs')?.ele ?? null; // 模式切换器（mc-tabs）

        this._sources = {};
        this._drafts = {};
        this._runSeq = 0;
        this._loadToken = 0;
        this._firstCompile = true;
        this._frame = undefined;
        this._frameRo = undefined;

        watchTheme(this);
        this._mounted = true;
        if (String(this.src ?? '').trim()) this.loadSources();
      },

      detached() {
        this._mounted = false;
        clearTimeout(this._copyTimer);
        unwatchTheme(this);
        this.teardownFrame();
        this._editorEl = null;
      },

      proto: {
        async loadSources() {
          const src = String(this.src ?? '').trim();
          if (!src) return;

          const pageSrc = this.ele.getRootNode()?.host?.getAttribute?.('src') || document.baseURI;
          let base;
          try {
            base = new URL(pageSrc, document.baseURI).href;
          } catch {
            base = document.baseURI;
          }

          let ofaUrl;
          try {
            ofaUrl = new URL(src, base).href;
          } catch {
            return;
          }
          let plainUrl = '';
          const plain = String(this.plainSrc ?? '').trim();
          if (plain) {
            try {
              plainUrl = new URL(plain, base).href;
            } catch {
              plainUrl = '';
            }
          }

          const token = ++this._loadToken;
          this.loaded = false;
          this.errorText = '';
          this.previewError = '';
          this._firstCompile = true;
          try {
            const ofaText = await loadDemoText(ofaUrl);
            let plainText = '';
            if (plainUrl) {
              try {
                plainText = await loadDemoText(plainUrl);
              } catch {
                plainText = ''; // 普通例子可缺省：不挡住主示例
              }
            }
            if (token !== this._loadToken || !this._mounted) return;

            this._sources = {
              ofa: { url: ofaUrl, text: ofaText },
              plain: plainText ? { url: plainUrl, text: plainText } : null,
            };
            this._drafts = { ofa: ofaText, plain: plainText };
            this.env = 'ofa'; // 默认看 ofa.js 例子；普通例子在代码区切换
            this.plainAvailable = !!plainText;
            this.syncEnvTabs(); // 重新读源会把视图拨回 ofa.js，切换器要跟着回位
            this.setEditorValue(this._drafts[this.env]);
            this.loaded = true;
            await this.renderLive();
          } catch (error) {
            if (token !== this._loadToken || !this._mounted) return;
            this.loaded = false;
            this.showPreviewError(error);
            this.showError(error);
          }
        },

        async renderLive() {
          if (this.env === 'plain' && this._sources.plain) {
            this.renderPlain(this._drafts.plain);
            return;
          }
          await this.renderOfa(this._drafts.ofa);
        },

        async renderOfa(text) {
          const seq = ++this._runSeq;
          let tag;
          try {
            tag = await compileDemo({
              text,
              url: this._sources.ofa.url,
              reuseTag: this._firstCompile,
            });
          } catch (error) {
            if (seq !== this._runSeq || !this._mounted) return;
            this.showPreviewError(error);
            this.showError(error);
            return;
          }
          if (seq !== this._runSeq || !this._mounted) return;
          this._firstCompile = false;
          this.teardownFrame();
          this._live.ele.replaceChildren(document.createElement(tag));
          this.previewError = '';
          this.hideError();
        },

        renderPlain(text) {
          this._runSeq += 1;
          this.teardownFrame();
          this._live.ele.replaceChildren();

          const frame = document.createElement('iframe');
          frame.className = 'frame';
          frame.title = '普通 HTML 示例预览';
          frame.setAttribute('part', 'preview');
          frame.srcdoc = this.previewHtml(text);
          this._frame = frame;
          this._live.ele.append(frame);
          this.shadow.$('.frame').one('load', () => this.onFrameLoad(frame));
          this._frameTimers = [100, 400, 1200].map((ms) =>
            setTimeout(() => {
              if (this._frame === frame) this.fitFrame();
            }, ms),
          );
          this.previewError = '';
          this.hideError();
        },

        previewHtml(text) {
          const siteRoot = new URL('.', document.baseURI).href;
          let html = String(text ?? '').replace(CDN_RE, siteRoot);
          if (!/<html\b/i.test(html)) return html;

          const theme = this.previewTheme();
          html = html.replace(/<html\b([^>]*)>/i, (match, attrs) => {
            const cleaned = attrs.replace(/\sdata-theme="[^"]*"/i, '');
            return '<html' + cleaned + ' data-theme="' + theme + '">';
          });
          const bridge =
            '<link rel="stylesheet" href="' +
            siteRoot +
            'packages/boot/mosaic.css" />\n' +
            '    <style>html { background: rgb(var(--mc-color-surface)); }</style>';
          if (/<\/head>/i.test(html)) html = html.replace(/<\/head>/i, bridge + '\n  </head>');
          else html = bridge + html;
          return html;
        },

        previewTheme() {
          return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
        },

        syncFrameTheme() {
          const frame = this._frame;
          if (!frame) return;
          try {
            const doc = frame.contentDocument;
            if (doc?.documentElement) doc.documentElement.dataset.theme = this.previewTheme();
          } catch {}
        },

        onFrameLoad(frame) {
          if (frame !== this._frame) return;
          this.syncFrameTheme();
          this.fitFrame();
          try {
            const doc = frame.contentDocument;
            if (!doc?.body) return;
            const FrameResizeObserver = doc.defaultView?.ResizeObserver;
            this._frameRo?.disconnect();
            if (FrameResizeObserver) {
              this._frameRo = new FrameResizeObserver(() => this.fitFrame());
              this._frameRo.observe(doc.body);
            }
            doc.fonts?.ready?.then(() => this.fitFrame());
          } catch {}
        },

        fitFrame() {
          const frame = this._frame;
          if (!frame) return;
          let doc;
          try {
            doc = frame.contentDocument;
          } catch {
            return;
          }
          const body = doc?.body;
          if (!body) return;
          const style = doc.defaultView?.getComputedStyle(body);
          const margin =
            (parseFloat(style?.marginTop ?? '') || 0) +
            (parseFloat(style?.marginBottom ?? '') || 0);
          const height = Math.ceil(body.scrollHeight + margin);
          if (height > 0) frame.style.height = height + 'px';
        },

        teardownFrame() {
          this._frameRo?.disconnect();
          this._frameRo = undefined;
          for (const timer of this._frameTimers ?? []) clearTimeout(timer);
          this._frameTimers = undefined;
          this._frame = undefined;
        },

        showPreviewError(error) {
          const message = error instanceof Error ? error.message : String(error);
          this.previewError = '示例加载失败：' + message;
        },

        async run() {
          if (!this._sources.ofa) return;
          await this.renderLive();
        },

        setEditorValue(text) {
          this._editorEl?.setAttribute('value', text ?? '');
        },

        onEditorInput(event) {
          if (!this._drafts) return;
          this._drafts[this.env] = event.data.value;
        },

        onEditorChange(event) {
          if (!this._drafts) return;
          this._drafts[this.env] = event.data.value;
        },

        onEditorKeydown(event) {
          if (!(event.ctrlKey || event.metaKey) || event.key !== 'Enter') return;
          event.preventDefault();
          this.run();
        },

        async rerun() {
          if (!this._sources.ofa) return;
          this._drafts = {
            ofa: this._sources.ofa.text,
            plain: this._sources.plain?.text ?? '',
          };
          this.setEditorValue(this._drafts[this.env]);
          await this.renderLive();
        },

        async copy() {
          const text = this._drafts[this.env] ?? '';
          if (!text) return;
          try {
            await navigator.clipboard.writeText(text);
            this.flashCopy(true);
          } catch {
            const area = document.createElement('textarea');
            area.value = text;
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.append(area);
            area.select();
            try {
              document.execCommand('copy');
              this.flashCopy(true);
            } catch {
              this.flashCopy(false);
            }
            area.remove();
          }
        },

        flashCopy(ok) {
          clearTimeout(this._copyTimer);
          this.copyState = ok ? 'copied' : 'failed';
          this._copyTimer = setTimeout(() => {
            this.copyState = '';
            this._copyTimer = undefined;
          }, COPY_FEEDBACK_MS);
        },

        copyTitle() {
          if (this.copyState === 'copied') return '已复制';
          if (this.copyState === 'failed') return '复制失败';
          return '复制代码';
        },

        copyIcon() {
          if (this.copyState === 'copied') return 'check';
          if (this.copyState === 'failed') return 'close';
          return 'copy';
        },

        toggleCode() {
          this.codeOpen = !this.codeOpen;
          if (this.codeOpen) this.setEditorValue(this._drafts[this.env]);
        },

        setEnv(env) {
          if (env === this.env) return;
          this.env = env;
          this.syncEnvTabs();
          this.setEditorValue(this._drafts[env] ?? '');
          if (this._sources.ofa) this.renderLive();
        },

        syncEnvTabs() {
          const tabs = this._envTabs;
          if (!tabs || !('value' in tabs)) return; // 还没升级：首屏默认就选 ofa，不会错
          tabs.value = this.env;
        },

        showError(error) {
          this.errorText = error instanceof Error ? error.message : String(error);
          console.warn('[mosaic] doc-example 示例编译失败：', error);
        },

        hideError() {
          this.errorText = '';
        },
      },
    });
  </script>
</template>
