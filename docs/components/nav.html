<!--
  <doc-nav> —— 文档站左栏二级菜单（`full` 模式给窄屏浮层的「全部菜单」）。
  整包数据交给 mc-menu 的 options（行由组件渲染，住在 mc-menu 的 shadow 里）；
  条目样式不要指望本组件的 <style>，状态走 options.attrs 的 data-* / style。
  ⚠️ 路由变化整包换 options，但 mc-menu 按 key 复用行：同分区切页只更新 current，不重建
  —— 改这里请手验。滚动只在**首次显示**时居中一次；之后换页 / 重新展开都不再改 scrollTop。
-->
<template component>
  <style>
    /* 高度接满宿主（宽屏那栏 fixed + 100%，解得开）；窄屏浮层宿主 auto 高时退回 auto，
       由下面 viewport 的 max-height 封顶。⚠️ max-height 不能挂宿主 —— 否则 viewport 的 100% 解不开，菜单会顶出浮层。 */
    mc-scroll-bar {
      height: 100%;
    }

    /* 两条都挂 viewport，不挂宿主：max-height 是窄屏浮层的「最高到哪」（宽屏不传 = none）；
       padding-inline 是 gutter（挂宿主会把条子一起推离栏边，浮层那份外壳把它设成 0）。 */
    mc-scroll-bar::part(viewport) {
      max-height: var(--doc-nav-max-height, none);
      padding-inline: var(--doc-scroll-pad-x, var(--mc-space-5));
    }
  </style>

  <!-- 条子走组件默认的 hover：菜单是拿来读的，常驻一条会压在条目背景上 -->
  <mc-scroll-bar label="站点菜单">
    <mc-menu id="nav-menu" :options="menuOptions"></mc-menu>
  </mc-scroll-bar>

  <script>
    import { displayName, menuOf, hasPage, SPEC_URL, TOPBAR } from '../site-map.js';
    import { hashOf } from '../routes.js';
    import { onRouteChange, routeState } from '../state/route.js';

    /** 页面节点 → options 一条：待建的不给死链（外链规范 + 压暗），链接走 options.href（行是运行时造的，olink 够不着） */
    const optionOf = (page, current) => {
      const ready = hasPage(page);
      return {
        label: displayName(page),
        href: ready ? hashOf(page.path) : SPEC_URL,
        current: ready && page.path === current,
        attrs: {
          target: ready ? null : '_blank',
          rel: ready ? null : 'noreferrer',
          title: page.summary ? (ready ? page.summary : `待建 —— ${page.summary}`) : null,
          'data-status': ready ? null : 'planned',
          /* 行在 mc-menu 的 shadow 里，页面 CSS 够不到；压暗走行上的内联 style（menu 会先写 attrs 再补缩进通道） */
          style: ready ? null : 'opacity: 0.72',
        },
      };
    };

    /** 一个分区的行：带 children 的节点出 group（标题 + 组内条目），其余是链接（左栏与「全部菜单」共用） */
    const optionsOf = (entry, current) =>
      menuOf(entry).map((node) =>
        node.children
          ? {
              type: 'group',
              label: displayName(node),
              children: node.children.map((page) => optionOf(page, current)),
            }
          : optionOf(node, current),
      );

    /** 全部菜单的顶层：整棵树、顶层分区可开合、当前这一支默认展开；展开认 label 不认对象（顶层 label 唯一） */
    const fullOptionsOf = (current, entry) =>
      TOPBAR.map((node) =>
        node.children
          ? {
              label: displayName(node),
              expanded: entry ? node.label === entry.label : false,
              children: optionsOf(node, current),
            }
          : optionOf(node, current),
      );

    export default () => ({
      /* ⚠️ 必须显式写 tag：不写时 ofa 按文件名推断标签名，文件一改名 / 挪目录就注册失败（P40） */
      tag: 'doc-nav',

      /* 对象 / 数组传播走 data + :options（普通 HTML 才用 property；这里是 ofa 模板） */
      data: { menuOptions: [] },

      ready() {
        this._menu = this.shadow.$('#nav-menu');
        this._bar = this.shadow.$('mc-scroll-bar');
        /* full = 外壳在标记上写死的 <doc-nav full>，读一次就够 */
        this._full = this.ele.hasAttribute('full');
        if (this._full) this._menu.attr('accordion', '');
        /* 只居中一次：左栏挂载即有高度；全量浮层要等第一次展开（0 → 有高度）再补 */
        this._centered = false;
        this._vpRo = new ResizeObserver(([entry]) => {
          if (entry.contentRect.height > 0) this.centerInitial();
        });
        this._vpRo.observe(this.ele);
        /* 路由信号统一来自 state/route.js，这里只订阅 */
        this._unwatch = onRouteChange(() => this.renderRows());
        this.renderRows();
      },

      // 组件随切页建毁，退订必须在 detached 里做，否则旧实例还会改新菜单
      detached() {
        this._unwatch?.();
        this._vpRo?.disconnect();
        cancelAnimationFrame(this._centerRaf);
        if (this._onLoad) window.removeEventListener('load', this._onLoad);
      },

      proto: {
        /* ⚠️ 不能叫 sync：ofa 的组件实例上已经有这个名字，注册时整个 proto 方法会被丢掉 */
        renderRows() {
          /* ⚠️ 别再调一次 locate()：routeState() 里已经是算好的 entry / node */
          const { path: current, entry } = routeState();
          this.menuOptions = this._full
            ? fullOptionsOf(current, entry)
            : entry
              ? optionsOf(entry, current)
              : [];
          /* 首次显示（或首帧行还没渲染出来）才居中；之后的换页只更新 current */
          this.centerInitial();
        },

        /** 这一栏真正的滚动视口：滚的是 mc-scroll-bar 里的 viewport，宿主 <doc-nav> 自己不滚 */
        viewport() {
          return this._bar?.shadow?.$('[part="viewport"]') ?? null;
        },

        /** 当前条可能在嵌套 mc-menu 的 shadow 里（full 模式的整棵树），逐层找 */
        currentRow() {
          const seen = new Set();
          const walk = (root) => {
            if (!root || seen.has(root)) return null;
            seen.add(root);
            const row = root.querySelector('mc-menu-item[current]');
            if (row) return row;
            for (const el of root.querySelectorAll('*')) {
              if (!el.shadowRoot) continue;
              const found = walk(el.shadowRoot);
              if (found) return found;
            }
            return null;
          };
          return walk(this._menu?.ele?.shadowRoot ?? null);
        },

        /** 首次显示前先等 load：刷新时浏览器会恢复上一个 scrollTop，落得比 ready 晚；
            在 load 前居中会被它盖掉，于是每次刷新停在不同的位置 */
        centerInitial() {
          if (this._centered || this._centerQueued) return;
          this._centerQueued = true;
          const start = () => {
            this._centerQueued = false;
            this.runCenterRetry();
          };
          if (document.readyState === 'complete') {
            this._centerRaf = requestAnimationFrame(() => requestAnimationFrame(start));
          } else {
            this._onLoad = () => {
              this._onLoad = null;
              this._centerRaf = requestAnimationFrame(() => requestAnimationFrame(start));
            };
            window.addEventListener('load', this._onLoad, { once: true });
          }
        },

        /** 唯一写 scrollTop 的地方：首次显示时把当前条滚到栏内竖直中间（首尾撞边界时退化成「保证可见」） */
        runCenterRetry() {
          if (this._centered) return;
          cancelAnimationFrame(this._centerRaf);
          /* rows 可能晚于本组件一两帧：首屏有高度但还没行，按帧重试到成功；
             浮层关着（高度 0）不重试，等 ResizeObserver 第一次展开 */
          let tries = 0;
          const tick = () => {
            if (this._centered) return;
            const viewport = this.viewport();
            if (!viewport) {
              if (tries++ < 120) this._centerRaf = requestAnimationFrame(tick);
              return;
            }
            const box = viewport.ele.getBoundingClientRect();
            if (box.height === 0) return;
            const row = this.currentRow();
            if (!row || row.getBoundingClientRect().height === 0) {
              if (tries++ < 120) this._centerRaf = requestAnimationFrame(tick);
              return;
            }
            const target = row.getBoundingClientRect();
            viewport.ele.scrollTop += target.top + target.height / 2 - (box.top + box.height / 2);
            this._centered = true;
          };
          this._centerRaf = requestAnimationFrame(tick);
        },
      },
    });
  </script>
</template>
