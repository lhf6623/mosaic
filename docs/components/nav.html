<!--
  <doc-nav> —— 文档站左栏二级菜单：渲染哪一支（routeState 的 entry + menuOf）+ 谁是当前页（data-current）；条目样式必须写在下面 <style> 里（组件模板自带 shadow root）。
  ⚠️ 路由变化只换 rows：o-fill 按 fill-key 复用节点，同分区切页不重建列表 —— 改这里时请手动验一次；mc-menu / mc-menu-item / mc-scroll-bar 由外壳 docs/layout.html 统一 <l-m> 进来。
-->
<template component>
  <style>
    /* 未实现的组件压暗一档；当前项高亮由 mc-menu 负责：插槽的 data-current → 宿主 data-current */
    a[data-status='planned'] {
      opacity: 0.72;
    }

    .fill-root {
      display: contents;
    }

    /* 滚动归 mc-scroll-bar：宿主 <doc-nav> 只管定位 + 尺寸（见 docs/doc-layout.html），滚的是这里面的 viewport。
       高度接满宿主 —— 宽屏那栏是 fixed + height:100%，有确定高度，100% 解得开。
       ⚠️ 浮层那份的宿主是 auto 高（外壳只给「最高到哪」），那时 100% 退回 auto：靠下面那条 max-height 封顶，
       不能反过来把 max-height 挂在宿主上 —— 宿主 auto 高时 viewport 的 100% 同样解不开，撑不出滚动区，菜单会顶出浮层。 */
    mc-scroll-bar {
      height: 100%;
    }

    /* 两条都挂在 viewport 上，而不是宿主 <doc-nav> 上：
       · max-height —— 窄屏浮层的「最高到哪」由外壳当令牌传进来（面板是浮层，菜单再长也不能撑满一屏）；
         宽屏那栏不传，`none` 就是不限高，宿主已经是一屏高。
       · padding-inline —— 条子贴的是 mc-scroll-bar 自己的右沿，宿主上的 padding 会把条子一起推离栏边，
         所以 gutter 挪到这里（宿主 doc-nav 的 padding-inline 现在是 0）。浮层那份宿主没有 gutter
         （面板自带内边距），外壳把 --doc-scroll-pad-x 设成 0。 */
    mc-scroll-bar::part(viewport) {
      max-height: var(--doc-nav-max-height, none);
      padding-inline: var(--doc-scroll-pad-x, var(--mc-space-5));
    }
  </style>

  <!-- 条子走组件默认的 hover（移入这一栏才淡入）：菜单是拿来读的，常驻一条会一直压在条目背景上 -->
  <mc-scroll-bar label="站点菜单">
    <mc-menu>
      <o-fill :value="rows" fill-key="key">
        <!-- ⚠️ 这层 .fill-root 不能删：o-fill 的模板只允许一个根子元素，而这一行要渲染两块（<o-if> + <o-else>）。
             多根时 ofa 会自己包一层同样的 div 并打一条 console 警告；显式写出语义一致、控制台干净（tests/site/11 盯着这条不变量）。 -->
        <div class="fill-root">
          <o-if :value="$data.pages">
            <mc-menu-item group>{{$data.name}}</mc-menu-item>
            <o-fill :value="$data.pages" fill-key="key">
              <mc-menu-item>
                <a
                  attr:href="$data.href"
                  attr:target="$data.target"
                  attr:rel="$data.rel"
                  attr:title="$data.title"
                  attr:data-status="$data.status"
                  attr:data-current="$data.current">
                  {{$data.name}}
                </a>
              </mc-menu-item>
            </o-fill>
          </o-if>
          <o-else>
            <mc-menu-item>
              <a
                attr:href="$data.href"
                attr:target="$data.target"
                attr:rel="$data.rel"
                attr:title="$data.title"
                attr:data-status="$data.status"
                attr:data-current="$data.current">
                {{$data.name}}
              </a>
            </mc-menu-item>
          </o-else>
        </div>
      </o-fill>
    </mc-menu>
  </mc-scroll-bar>

  <script>
    import { menuOf, hasPage, SPEC_URL } from '../site-map.js';
    import { hashOf } from '../routes.js';
    import { onRouteChange, routeState } from '../state/route.js';

    /** 左栏显示名：分组 `基础（9）`（括号里是隐藏项剔除后的子项数）；组件 `按钮（Button）`；其余原样 label */
    const displayName = (node) => {
      if (node.children) return `${node.label}（${node.children.length}）`;
      return node.zh ? `${node.zh}（${node.label}）` : node.label;
    };

    /* 节点 → 模板字段：待建的不给死链（外链规范 + 待建 tooltip），压暗靠 data-status。
       ⚠️ 链接一律 `attr:href`：`:` 只写 property，`getAttribute('href')` 会是 null；显示名与 tooltip 是两个字段。 */
    const linkOf = (page, current) => {
      const ready = hasPage(page);
      return {
        // 待建的没有 path，用 label 当 key（同层 label 唯一由 10 号套件守着）
        key: page.path ?? page.label,
        name: displayName(page),
        href: ready ? hashOf(page.path) : SPEC_URL,
        target: ready ? null : '_blank',
        rel: ready ? null : 'noreferrer',
        title: page.summary ? (ready ? page.summary : `待建 —— ${page.summary}`) : null,
        status: ready ? null : 'planned',
        current: ready && page.path === current ? 'page' : null,
      };
    };

    /** 左栏的行：分组节点 → 标题行 + 组内页面；其余就是一条链接 */
    const rowsOf = (entry, current) =>
      menuOf(entry).map((node) =>
        node.children
          ? {
              key: `group:${node.label}`,
              name: displayName(node),
              pages: node.children.map((page) => linkOf(page, current)),
            }
          : linkOf(node, current),
      );

    export default () => ({
      /* ⚠️ 一定要显式写 tag：不写时 ofa 用文件名推断标签名，文件一改名/挪目录就会注册失败，
         而外层只报 "wrong module address"，极难反查（见 ofa-pitfalls 的 P40） */
      tag: 'doc-nav',

      data: { rows: [] },

      ready() {
        /* 路由信号统一来自 docs/state/route.js（唯一挂 hashchange + router-change 的地方，见 P28）；这里只订阅 */
        this._unwatch = onRouteChange(() => this.renderRows());
        this.renderRows();
      },

      // 组件随切页建毁，退订必须在 detached 里做，否则旧实例还会改新菜单
      detached() {
        this._unwatch?.();
      },

      proto: {
        /* ⚠️ 不能叫 sync：ofa 的组件实例上已经有这个名字，注册时整个 proto 方法会被丢掉 */
        renderRows() {
          /* ⚠️ 别再调一次 locate()：routeState() 里已经是它算好的结果（entry = 当前页所在分区，node = 当前页自己） */
          const { path: current, entry } = routeState();
          this.rows = entry ? rowsOf(entry, current) : [];
        },
      },
    });
  </script>
</template>
