<!--
  <doc-nav> —— 文档站左栏二级菜单（`full` 模式给窄屏浮层的「全部菜单」）。
  整包数据交给 mc-menu 的 options（行由组件渲染）；条目样式只能写在本组件的 <style> 里。
  ⚠️ 路由变化整包换 options，但 mc-menu 按 key 复用行：同分区切页只更新 current，不重建
  —— 改这里请手验；换页后把当前条滚到栏内竖直中间。
-->
<template component>
  <style>
    /* 未实现组件压暗一档：状态经 options 的 attrs 落到 mc-menu-item 宿主上 */
    mc-menu-item[data-status='planned'] {
      opacity: 0.72;
    }

    /* 高度接满宿主（宽屏那栏 fixed + 100%，解得开）；窄屏浮层宿主 auto 高时退回 auto，
       由下面 viewport 的 max-height 封顶。⚠️ max-height 不能挂宿主 —— 否则 viewport 的 100% 解不开，菜单会顶出浮层。 */
    mc-scroll-bar {
      height: 100%;
    }

    /* 两条都挂 viewport，不挂宿主：max-height 是窄屏浮层的「最高到哪」（宽屏不传 = none）；
       padding-inline 是 gutter（挂宿主会把条子一起推离栏边，浮层那份外壳把它设成 0）。 */
    mc-scroll-bar::part(viewport) {
      max-height: var(--doc-nav-max-height, none);
      padding-inline: var(--doc-scroll-pad-x, var(--mc-space-5));
    }
  </style>

  <!-- 条子走组件默认的 hover：菜单是拿来读的，常驻一条会压在条目背景上 -->
  <mc-scroll-bar label="站点菜单">
    <mc-menu id="nav-menu"></mc-menu>
  </mc-scroll-bar>

  <script>
    import { displayName, menuOf, hasPage, SPEC_URL, TOPBAR } from '../site-map.js';
    import { hashOf } from '../routes.js';
    import { onRouteChange, routeState } from '../state/route.js';

    /** 页面节点 → options 一条：待建的不给死链（外链规范 + 压暗），链接走 options.href（行是运行时造的，olink 够不着） */
    const optionOf = (page, current) => {
      const ready = hasPage(page);
      return {
        label: displayName(page),
        href: ready ? hashOf(page.path) : SPEC_URL,
        current: ready && page.path === current,
        attrs: {
          target: ready ? null : '_blank',
          rel: ready ? null : 'noreferrer',
          title: page.summary ? (ready ? page.summary : `待建 —— ${page.summary}`) : null,
          'data-status': ready ? null : 'planned',
        },
      };
    };

    /** 一个分区的行：带 children 的节点出 group（标题 + 组内条目），其余是链接（左栏与「全部菜单」共用） */
    const optionsOf = (entry, current) =>
      menuOf(entry).map((node) =>
        node.children
          ? {
              type: 'group',
              label: displayName(node),
              children: node.children.map((page) => optionOf(page, current)),
            }
          : optionOf(node, current),
      );

    /** 全部菜单的顶层：整棵树、顶层分区可开合、当前这一支默认展开；展开认 label 不认对象（顶层 label 唯一） */
    const fullOptionsOf = (current, entry) =>
      TOPBAR.map((node) =>
        node.children
          ? {
              label: displayName(node),
              expanded: entry ? node.label === entry.label : false,
              children: optionsOf(node, current),
            }
          : optionOf(node, current),
      );

    export default () => ({
      /* ⚠️ 必须显式写 tag：不写时 ofa 按文件名推断标签名，文件一改名 / 挪目录就注册失败（P40） */
      tag: 'doc-nav',

      ready() {
        this._menu = this.ele.shadowRoot.querySelector('#nav-menu');
        this._bar = this.ele.shadowRoot.querySelector('mc-scroll-bar');
        /* full = 外壳在标记上写死的 <doc-nav full>，读一次就够 */
        this._full = this.ele.hasAttribute('full');
        if (this._full) this._menu.setAttribute('accordion', '');
        /* 行由 mc-menu 渲染（可能晚于本组件升级）：监听子节点变化兜底；同分区切页只改 current 时
           没有 childList 变化，renderRows() 末尾会再显式居中一次 */
        this._mo = new MutationObserver(() => this.centerCurrent());
        this._mo.observe(this._menu, { childList: true });
        /* 视口「0 高 → 有高度」这一跳补一次居中（浮层关着时换页算出的 scrollTop 被夹成 0） */
        this._shownH = 0;
        this._vpRo = new ResizeObserver(([entry]) => {
          const height = entry.contentRect.height;
          if (height > 0 && this._shownH === 0) this.centerCurrent();
          this._shownH = height;
        });
        this._vpRo.observe(this.ele);
        /* 路由信号统一来自 state/route.js，这里只订阅 */
        this._unwatch = onRouteChange(() => this.renderRows());
        this.renderRows();
      },

      // 组件随切页建毁，退订必须在 detached 里做，否则旧实例还会改新菜单
      detached() {
        this._unwatch?.();
        this._mo?.disconnect();
        this._vpRo?.disconnect();
        cancelAnimationFrame(this._centerRaf);
      },

      proto: {
        /* ⚠️ 不能叫 sync：ofa 的组件实例上已经有这个名字，注册时整个 proto 方法会被丢掉 */
        renderRows() {
          /* ⚠️ 别再调一次 locate()：routeState() 里已经是算好的 entry / node */
          const { path: current, entry } = routeState();
          this._menu.options = this._full
            ? fullOptionsOf(current, entry)
            : entry
              ? optionsOf(entry, current)
              : [];
          /* 同一分区切页时行会按 key 复用、不再触发 childList —— 居中不能只靠 MutationObserver */
          this.centerCurrent();
        },

        /** 这一栏真正的滚动视口：滚的是 mc-scroll-bar 里的 viewport，宿主 <doc-nav> 自己不滚 */
        viewport() {
          return this._bar?.shadowRoot?.querySelector('[part="viewport"]') ?? null;
        },

        /** 唯一写 scrollTop 的地方：把当前条滚到栏内竖直中间（首尾撞边界时退化成「保证可见」） */
        centerCurrent() {
          cancelAnimationFrame(this._centerRaf);
          this._centerRaf = requestAnimationFrame(() => {
            const viewport = this.viewport();
            const row = this._menu?.shadowRoot?.querySelector('mc-menu-item[current]');
            if (!viewport || !row) return;
            const box = viewport.getBoundingClientRect();
            if (box.height === 0) return; // 视口还量不出高度（窄屏浮层关着）：等 ResizeObserver 那一跳
            const target = row.getBoundingClientRect();
            viewport.scrollTop += target.top + target.height / 2 - (box.top + box.height / 2);
          });
        },
      },
    });
  </script>
</template>
