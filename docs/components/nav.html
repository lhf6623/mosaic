<template component>
  <style>
    mc-scroll-bar {
      height: 100%;
    }

    mc-scroll-bar::part(viewport) {
      max-height: var(--doc-nav-max-height, none);
      padding-inline: var(--doc-scroll-pad-x, var(--mc-space-5));
    }
  </style>

  <mc-scroll-bar label="站点菜单">
    <mc-menu
      id="nav-menu"
      attr:current="currentKey"
      :options="menuOptions"
      attr:accordion="full"></mc-menu>
  </mc-scroll-bar>

  <script>
    import { menuOf, TOPBAR } from '../site-map.js';
    import { onRouteChange, routeState } from '../state/route.js';

    export default () => ({
      tag: 'doc-nav',

      /* full 由外壳在窄屏浮层里写（`<doc-nav full>`）：整棵树 + 手风琴 */
      data: { menuOptions: [], currentKey: '', full: false },

      ready() {
        this.full = this.ele.hasAttribute('full');
        this._menu = this.shadow.$('#nav-menu');
        this._onNavigate = (event) => {
          if (event.detail?.key === routeState().node?.key) event.preventDefault();
        };
        this._menu.on('navigate', this._onNavigate);
        this._bar = this.shadow.$('mc-scroll-bar');
        this._centered = false;
        this._vpRo = new ResizeObserver(([entry]) => {
          if (entry.contentRect.height > 0) this.centerInitial();
        });
        this._vpRo.observe(this.ele);
        this._unwatch = onRouteChange(() => this.renderRows());
        this.renderRows();
      },

      detached() {
        this._unwatch?.();
        this._menu?.off('navigate', this._onNavigate);
        this._vpRo?.disconnect();
        cancelAnimationFrame(this._centerRaf);
        if (this._onLoad) window.removeEventListener('load', this._onLoad);
      },

      proto: {
        renderRows() {
          const { node, entry } = routeState();
          this.currentKey = node?.key ?? '';
          this.menuOptions = this.full ? TOPBAR : entry ? menuOf(entry) : [];
          this.centerInitial();
        },

        viewport() {
          return this._bar?.shadow?.$('[part="viewport"]') ?? null;
        },

        currentRow() {
          const seen = new Set();
          const walk = (root) => {
            if (!root || seen.has(root)) return null;
            seen.add(root);
            const row = root.querySelector('mc-menu-item[current]');
            if (row) return row;
            for (const el of root.querySelectorAll('*')) {
              if (!el.shadowRoot) continue;
              const found = walk(el.shadowRoot);
              if (found) return found;
            }
            return null;
          };
          return walk(this._menu?.ele?.shadowRoot ?? null);
        },

        centerInitial() {
          if (this._centered || this._centerQueued || this._centering) return;
          this._centerQueued = true;
          const start = () => {
            this._centerQueued = false;
            this.runCenterRetry();
          };
          if (document.readyState === 'complete') {
            this._centerRaf = requestAnimationFrame(() => requestAnimationFrame(start));
          } else {
            this._onLoad = () => {
              this._onLoad = null;
              this._centerRaf = requestAnimationFrame(() => requestAnimationFrame(start));
            };
            window.addEventListener('load', this._onLoad, { once: true });
          }
        },

        runCenterRetry() {
          if (this._centered) return;
          cancelAnimationFrame(this._centerRaf);
          this._centering = true;
          let tries = 0;
          let lastMax = -1;
          let stable = 0;
          let settled = 0;
          const finish = () => {
            this._centered = true;
            this._centering = false;
          };
          const retry = () => {
            if (tries++ < 120) this._centerRaf = requestAnimationFrame(tick);
            else this._centering = false;
          };
          const tick = () => {
            if (this._centered) return;
            const viewport = this.viewport();
            if (!viewport) {
              retry();
              return;
            }
            const view = viewport.ele;
            const box = view.getBoundingClientRect();
            if (box.height === 0) {
              this._centering = false;
              return;
            }
            const row = this.currentRow();
            const target = row?.getBoundingClientRect();
            if (!target || target.height === 0) {
              retry();
              return;
            }
            const max = view.scrollHeight - view.clientHeight;
            const want = target.top - box.top + view.scrollTop + target.height / 2 - box.height / 2;
            if (want > max + 0.5) {
              stable = max === lastMax ? stable + 1 : 0;
              lastMax = max;
              settled = 0;
              if (stable < 3) {
                retry();
                return;
              }
              view.scrollTop = max; // 边界行：退化成「保证可见」
              finish();
              return;
            }
            const to = Math.max(want, 0); // want < 0：当前条在上边界附近，居中不了，退化成贴顶
            view.scrollTop = to;
            settled = Math.abs(view.scrollTop - to) <= 1 ? settled + 1 : 0;
            if (settled < 2) retry();
            else finish();
          };
          this._centerRaf = requestAnimationFrame(tick);
        },
      },
    });
  </script>
</template>
