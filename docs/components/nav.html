<!--
  <doc-nav> —— 文档站左栏二级菜单：渲染哪一支（routeState 的 entry + menuOf）+ 谁是当前页（options 的 current）。
  整包数据交给 mc-menu 的 `options`（行由组件自己渲染），这里不再手写菜单项；条目样式必须写在下面 <style> 里（组件模板自带 shadow root）。
  ⚠️ 路由变化整包换 options：菜单会重建列表（一栏就几十行，换来的是单一渲染源）—— 改这里时请手动验一次；mc-menu / mc-scroll-bar 由外壳 docs/layout.html 统一 <l-m> 进来。
  换页后把当前页那一条**滚到这一栏的竖直中间**（centerCurrent）：一栏装的是整棵导航树，不居中就得自己翻。
-->
<template component>
  <style>
    /* 未实现的组件压暗一档：状态经 options 的 attrs 落到行（mc-menu-item）宿主上 */
    mc-menu-item[data-status='planned'] {
      opacity: 0.72;
    }

    /* 二级条目缩进一档（组件自己算：带 children 的 group 用 --mc-menu-group-indent，
       默认 12px → 条目落在 28px），分组标题留在最左 —— 只有标题 + 子项拉不开层级，一栏读下来全是平的。
       这里不再覆盖任何缩进令牌；真要改这一栏的深浅，覆盖 --mc-menu-group-indent 就行。 */

    /* 滚动归 mc-scroll-bar：宿主 <doc-nav> 只管定位 + 尺寸（见 docs/doc-layout.html），滚的是这里面的 viewport。
       高度接满宿主 —— 宽屏那栏是 fixed + height:100%，有确定高度，100% 解得开。
       ⚠️ 浮层那份的宿主是 auto 高（外壳只给「最高到哪」），那时 100% 退回 auto：靠下面那条 max-height 封顶，
       不能反过来把 max-height 挂在宿主上 —— 宿主 auto 高时 viewport 的 100% 同样解不开，撑不出滚动区，菜单会顶出浮层。 */
    mc-scroll-bar {
      height: 100%;
    }

    /* 两条都挂在 viewport 上，而不是宿主 <doc-nav> 上：
       · max-height —— 窄屏浮层的「最高到哪」由外壳当令牌传进来（面板是浮层，菜单再长也不能撑满一屏）；
         宽屏那栏不传，`none` 就是不限高，宿主已经是一屏高。
       · padding-inline —— 条子贴的是 mc-scroll-bar 自己的右沿，宿主上的 padding 会把条子一起推离栏边，
         所以 gutter 挪到这里（宿主 doc-nav 的 padding-inline 现在是 0）。浮层那份宿主没有 gutter
         （面板自带内边距），外壳把 --doc-scroll-pad-x 设成 0。 */
    mc-scroll-bar::part(viewport) {
      max-height: var(--doc-nav-max-height, none);
      padding-inline: var(--doc-scroll-pad-x, var(--mc-space-5));
    }
  </style>

  <!-- 条子走组件默认的 hover（移入这一栏才淡入）：菜单是拿来读的，常驻一条会一直压在条目背景上 -->
  <mc-scroll-bar label="站点菜单">
    <mc-menu id="nav-menu"></mc-menu>
  </mc-scroll-bar>

  <script>
    import { displayName, menuOf, hasPage, SPEC_URL } from '../site-map.js';
    import { hashOf } from '../routes.js';
    import { onRouteChange, routeState } from '../state/route.js';

    /** 页面节点 → options 的一条：待建的不给死链（外链规范 + 待建 tooltip），压暗靠 attrs 里的 data-status。
        链接走 options 的 href（最终地址）—— 行是运行时造的，olink 够不着。 */
    const optionOf = (page, current) => {
      const ready = hasPage(page);
      return {
        label: displayName(page),
        href: ready ? hashOf(page.path) : SPEC_URL,
        current: ready && page.path === current,
        attrs: {
          target: ready ? null : '_blank',
          rel: ready ? null : 'noreferrer',
          title: page.summary ? (ready ? page.summary : `待建 —— ${page.summary}`) : null,
          'data-status': ready ? null : 'planned',
        },
      };
    };

    /** 左栏的行：分组节点 → 带 children 的 group（标题 + 组内条目常显、缩进一档）；其余就是一条链接 */
    const optionsOf = (entry, current) =>
      menuOf(entry).map((node) =>
        node.children
          ? {
              type: 'group',
              label: displayName(node),
              children: node.children.map((page) => optionOf(page, current)),
            }
          : optionOf(node, current),
      );

    export default () => ({
      /* ⚠️ 一定要显式写 tag：不写时 ofa 用文件名推断标签名，文件一改名/挪目录就会注册失败，
         而外层只报 "wrong module address"，极难反查（见 ofa-pitfalls 的 P40） */
      tag: 'doc-nav',

      ready() {
        this._menu = this.ele.shadowRoot.querySelector('#nav-menu');
        this._bar = this.ele.shadowRoot.querySelector('mc-scroll-bar');
        /* 行是 mc-menu 自己渲染的（它可能晚于 doc-nav 升级完），所以居中的**时机**就认它的子节点：
           一落 DOM 就重新居中。不用赌「options 写下去那一拍行已经在了」—— 换页整包换 options 也走这条。
           MutationObserver 的回调在渲染完成后跑，读几何前不必再等帧。 */
        this._mo = new MutationObserver(() => this.centerCurrent());
        this._mo.observe(this._menu, { childList: true });
        /* 视口「0 高 → 有高度」这一跳补一次居中：窄屏浮层关着时换页算出的 scrollTop 被夹成了 0。
           只补这一跳 —— 之后用户自己滚到哪就是哪，窗口 resize 不该把人拽回去。 */
        this._shownH = 0;
        this._vpRo = new ResizeObserver(([entry]) => {
          const height = entry.contentRect.height;
          if (height > 0 && this._shownH === 0) this.centerCurrent();
          this._shownH = height;
        });
        this._vpRo.observe(this.ele);
        /* 路由信号统一来自 docs/state/route.js（唯一挂 hashchange + router-change 的地方，见 P28）；这里只订阅 */
        this._unwatch = onRouteChange(() => this.renderRows());
        this.renderRows();
      },

      // 组件随切页建毁，退订必须在 detached 里做，否则旧实例还会改新菜单
      detached() {
        this._unwatch?.();
        this._mo?.disconnect();
        this._vpRo?.disconnect();
        cancelAnimationFrame(this._centerRaf);
      },

      proto: {
        /* ⚠️ 不能叫 sync：ofa 的组件实例上已经有这个名字，注册时整个 proto 方法会被丢掉 */
        renderRows() {
          /* ⚠️ 别再调一次 locate()：routeState() 里已经是它算好的结果（entry = 当前页所在分区，node = 当前页自己） */
          const { path: current, entry } = routeState();
          this._menu.options = entry ? optionsOf(entry, current) : [];
        },

        /** 这一栏真正的滚动视口：滚的是 mc-scroll-bar 里的 viewport，宿主 <doc-nav> 自己不滚 */
        viewport() {
          return this._bar?.shadowRoot?.querySelector('[part="viewport"]') ?? null;
        },

        /** 把当前条目滚到这一栏的竖直中间。左栏装的是整棵导航树（几十行），当前页常常落在视口外，
            不居中的话每次换页都得自己翻。这里是**唯一**写 scrollTop 的地方；
            首尾的页面会先撞到滚动边界（浏览器自己夹住），那时这个动作退化成「保证它可见」。 */
        centerCurrent() {
          cancelAnimationFrame(this._centerRaf);
          this._centerRaf = requestAnimationFrame(() => {
            const viewport = this.viewport();
            const row = this._menu?.querySelector('mc-menu-item[current]');
            if (!viewport || !row) return;
            const box = viewport.getBoundingClientRect();
            if (box.height === 0) return; // 视口还量不出高度（窄屏浮层关着）：等 ResizeObserver 那一跳
            const target = row.getBoundingClientRect();
            viewport.scrollTop += target.top + target.height / 2 - (box.top + box.height / 2);
          });
        },
      },
    });
  </script>
</template>
