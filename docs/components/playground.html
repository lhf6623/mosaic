<!--
  <doc-playground> —— 组件文档页的「可编辑示例」：读 demos/*.html 运行时编译成预览；编辑后走同一条路径重编译，
  「重置」用文件原文重新渲染（一份源，没有第二份片段会漂移）。
  ⚠️ 标题 / 说明留在页面里：<doc-toc> 只扫页面 shadow 里的 h2/h3，收进组件会让目录缺条目（同 doc-spec）。
  ⚠️ 首屏预览也走编译，失败直接显示在预览区（不能白屏）；重置不刷新页面、不写回文件（站点没有后端）。
  ⚠️ 不用 iframe / 虚拟文件系统：demo 本来就是页内组件，同页编译同一套信任模型。
-->
<template component>
  <style>
    :host {
      display: block;
    }

    /* 预览区：初始预览与编辑后的预览都渲染在这里（同一条运行时编译路径） */
    .live {
      min-height: 2rem;
    }

    /* 首屏编译失败时的兜底提示（不能白屏；错误同时写进编辑抽屉的错误区） */
    .load-error {
      margin: 0;
      color: rgb(var(--mc-color-danger));
      font-size: var(--mc-text-sm);
      line-height: var(--mc-text-sm-lh);
    }

    .drawer {
      margin-top: var(--mc-space-4);
      border-top: 1px solid rgb(var(--mc-color-border));
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--mc-space-2);
      min-height: 42px;
      padding: var(--mc-space-1) 0;
      color: rgb(var(--mc-color-fg-muted));
      font-size: var(--mc-text-sm);
      line-height: var(--mc-text-sm-lh);
    }

    /* 改过且还没重置：一个小胶囊，免得读者滚回来不知道现在看的是不是官方样例 */
    .dirty {
      display: none;
      padding: 0 var(--mc-space-2);
      border: 1px solid rgb(var(--mc-color-warning));
      border-radius: var(--mc-radius-full);
      color: rgb(var(--mc-color-warning));
      font-size: var(--mc-text-xs);
      line-height: 1.6;
    }

    :host([data-dirty]) .dirty {
      display: inline-flex;
    }

    .panel[hidden] {
      display: none;
    }

    .status {
      min-width: 0;
      color: rgb(var(--mc-color-fg-subtle));
      font-size: var(--mc-text-xs);
      line-height: var(--mc-text-xs-lh);
    }

    :host([data-state='error']) .status {
      color: rgb(var(--mc-color-danger));
    }

    .actions {
      display: flex;
      flex: none;
      flex-wrap: wrap;
      gap: var(--mc-space-2);
      /* 栏里没有文字标签了：按钮组靠右，dirty / status 留在左侧 */
      margin-left: auto;
    }

    /* 图标按钮：方形、只放一个图标，提示信息走 title */
    .btn mc-icon {
      font-size: 15px;
    }

    /* 收起态：复制常驻（不用展开就能拿走源码），状态栏与运行 / 重置展开后才出现 */
    :host(:not([data-open])) .status,
    :host(:not([data-open])) [data-act='run'],
    :host(:not([data-open])) [data-act='reset'] {
      display: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: var(--mc-radius-md);
      background-color: transparent;
      color: rgb(var(--mc-color-fg-muted));
      font-family: inherit;
      font-size: var(--mc-text-xs);
      line-height: 1;
      cursor: pointer;
    }

    .btn:hover {
      background-color: rgb(var(--mc-color-surface-sunken));
      color: rgb(var(--mc-color-fg));
    }

    .btn:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring));
      outline-offset: 1px;
    }

    .btn-primary {
      color: rgb(var(--mc-color-primary));
    }

    .btn-primary:hover {
      background-color: rgb(var(--mc-color-primary-subtle));
      color: rgb(var(--mc-color-primary));
    }

    /* 编辑器没就绪：运行 / 重置置灰且不响应 hover（复制不依赖编辑器，始终可用） */
    .btn:disabled,
    .btn:disabled:hover {
      background-color: transparent;
      color: rgb(var(--mc-color-fg-subtle));
      cursor: not-allowed;
    }

    .btn[data-feedback='copied'] {
      color: rgb(var(--mc-color-success));
    }

    .btn[data-feedback='failed'] {
      color: rgb(var(--mc-color-danger));
    }

    /* 编辑器盒：高度由 JS 按内容自适应（min/max 见下面的常量），无 JS 时退到 300px */
    .editor-host {
      height: var(--doc-playground-editor-h, 300px);
      position: relative;
      border: 1px solid rgb(var(--mc-color-border));
      border-radius: var(--mc-radius-md);
      /* 跟 mc-code 的代码块同一块底（surface-code），编辑前后视觉不跳 */
      background-color: rgb(var(--mc-color-surface-code));
      overflow: hidden;
    }

    /* 首次打开才下载 CodeMirror：盖一层明显的加载态（状态栏那行字太弱），挂载完成后由脚本隐藏 */
    .editor-loading {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--mc-space-2);
      border-radius: var(--mc-radius-md);
      /* 必须与 .editor-host 同色：这层盖在编辑器上，不同色会在加载完成时闪一下 */
      background-color: rgb(var(--mc-color-surface-code));
      color: rgb(var(--mc-color-fg-muted));
      font-size: var(--mc-text-sm);
    }

    .editor-loading[hidden] {
      display: none;
    }

    .editor-loading-hint {
      color: rgb(var(--mc-color-fg-subtle));
      font-size: var(--mc-text-xs);
    }

    .fallback-editor {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: var(--mc-space-2) var(--mc-space-3);
      border: 0;
      resize: none;
      background: transparent;
      color: rgb(var(--mc-color-fg));
      font-family: var(--mc-font-mono);
      font-size: var(--mc-text-sm);
      line-height: 1.7;
      tab-size: 2;
      outline: none;
    }

    .error {
      margin: var(--mc-space-2) 0 0;
      padding: var(--mc-space-2) var(--mc-space-3);
      max-height: 10rem;
      overflow: auto;
      border-left: 2px solid rgb(var(--mc-color-danger));
      border-radius: var(--mc-radius-sm);
      background-color: rgb(var(--mc-color-danger-subtle));
      color: rgb(var(--mc-color-fg));
      font-family: var(--mc-font-mono);
      font-size: var(--mc-text-xs);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .error[hidden] {
      display: none;
    }

    @media (max-width: 40rem) {
      .editor-host {
        height: 240px;
      }
    }
  </style>

  <!-- 预览：初始渲染与编辑后的结果都落在这里，每次 replaceChildren 换掉。
       demo 编译出来的标签名运行期才知道，模板写不出来 —— 这是本组件唯一按编译结果造结构的例外 -->
  <div class="live" part="preview"></div>

  <div class="drawer" part="drawer">
    <div class="bar" part="bar">
      <span class="dirty" part="dirty">已修改</span>
      <span class="status" part="status"></span>
      <div class="actions" id="actions">
        <button type="button" class="btn btn-primary" data-act="run" title="运行示例" disabled>
          <mc-icon name="play"></mc-icon>
        </button>
        <button type="button" class="btn" data-act="reset" title="重置为文件原文" disabled>
          <mc-icon name="refresh"></mc-icon>
        </button>
        <button type="button" class="btn" data-act="copy" title="复制源码">
          <mc-icon name="copy"></mc-icon>
        </button>
        <button type="button" class="btn" data-act="toggle" title="展开编辑">
          <mc-icon name="edit"></mc-icon>
        </button>
      </div>
    </div>

    <div class="panel" id="panel" hidden>
      <div class="editor-host" id="editor-host" part="editor">
        <!-- 首次打开要下载 CodeMirror：状态栏那行小字太弱，盖一层明显的加载态 -->
        <div class="editor-loading" id="editor-loading" hidden>
          <mc-spinner color="primary"></mc-spinner>
          <span>正在加载编辑器…</span>
          <span class="editor-loading-hint">首次打开会慢一点</span>
        </div>
      </div>
      <pre class="error" id="error" part="error" hidden></pre>
    </div>
  </div>

  <script>
    import { compileDemo, loadDemoText, parseDemoSource } from '../lib/demo-runtime.mjs';
    import { mountCodeEditor } from '../lib/code-editor.mjs';

    /* 改动停下多久自动跑（太短：每个字都重编译；太长：没有「立刻看到」的爽感） */
    const RUN_DELAY = 500;

    const COPY_FEEDBACK_MS = 3000;

    /* 提示里只显示当前平台那一个键：Mac / iOS 是 Cmd，其余是 Ctrl（不让读者自己二选一） */
    const IS_MAC = /mac|iphone|ipad|ipod/i.test(navigator.platform || navigator.userAgent);
    const MOD_KEY = IS_MAC ? 'Cmd' : 'Ctrl';

    /** 编辑器就绪 / 重置后的默认提示（外层 <template component> 由站点自动补，不显示在编辑器里） */
    const HINT = `改动自动运行 · ${MOD_KEY} + Enter 立即运行 · Ctrl-Space 补全`;

    /* 主题信号全页只盯一份：实例集合 + 一个观察者，换主题时统一落到各宿主的 data-dark */
    const darkTargets = new Set();
    /** @type {MutationObserver | undefined} */
    let themeObserver;
    /** @type {MediaQueryList | undefined} */
    let themeMq;

    const syncAllDark = () => {
      for (const target of darkTargets) target.syncDark();
    };

    const watchTheme = (target) => {
      darkTargets.add(target);
      if (!themeObserver) {
        themeObserver = new MutationObserver(syncAllDark);
        themeObserver.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['data-theme', 'class', 'style'],
        });
        themeMq = window.matchMedia?.('(prefers-color-scheme: dark)');
        themeMq?.addEventListener?.('change', syncAllDark);
      }
      target.syncDark();
    };

    const unwatchTheme = (target) => {
      darkTargets.delete(target);
      if (darkTargets.size) return;
      themeObserver?.disconnect();
      themeObserver = undefined;
      themeMq?.removeEventListener?.('change', syncAllDark);
      themeMq = undefined;
    };

    export default () => ({
      /* ⚠️ 显式 tag：不写按文件名推断，文件一改名就注册失败（P40） */
      tag: 'doc-playground',

      attrs: {
        /* 示例文件地址；ofa 编译页面时已把相对地址改写成绝对地址 */
        src: '',
      },

      watch: {
        src() {
          if (this._mounted) this.loadSource();
        },
      },

      ready() {
        this._live = this.shadow.$('.live');
        this._panel = this.shadow.$('#panel');
        this._statusEl = this.shadow.$('.status');
        this._errorEl = this.shadow.$('.error');
        this._editorHost = this.shadow.$('#editor-host');
        this._loadingEl = this.shadow.$('#editor-loading');
        this._actions = this.shadow.$('#actions');

        this._mounted = true;
        this._open = false;
        this._runSeq = 0;
        this._loadToken = 0;
        this._fitRaf = 0;
        this._loadingTimer = 0;
        /** 文件原文编译出来的 tag：重置时直接复用（不用再 fetch / 编译） */
        this._baseTag = undefined;

        this._onAction = (event) => this.onAction(event);
        this._actions.on('click', this._onAction);

        this._runBtn = this._actions.ele.querySelector('[data-act="run"]');
        this._resetBtn = this._actions.ele.querySelector('[data-act="reset"]');
        if (this._runBtn) this._runBtn.title = `运行示例（${MOD_KEY} + Enter）`;
        this._copyBtn = this._actions.ele.querySelector('[data-act="copy"]');

        /* 语法配色走 :host([data-dark])：shadow 里看不到 <html data-theme>，只能自己落到宿主上（令牌本身会自动跟主题） */
        watchTheme(this);

        /* 视口高度变了，自适应上限跟着变；宽度变了要先 refresh 让 CM 重新折行 */
        this._onResize = () => {
          this._editor?.refresh();
          this.scheduleFit();
        };
        window.addEventListener('resize', this._onResize);

        if (String(this.src ?? '').trim()) this.loadSource();
      },

      detached() {
        this._mounted = false;
        clearTimeout(this._runTimer);
        clearTimeout(this._copyTimer);
        clearTimeout(this._loadingTimer);
        cancelAnimationFrame(this._fitRaf);
        window.removeEventListener('resize', this._onResize);
        unwatchTheme(this);
        this._actions?.off('click', this._onAction);
        this._editor?.destroy();
        this._editor = undefined;
      },

      proto: {
        /** 取示例文件 → 缓存原文与「编辑器里显示的源码」；换了 src 就整块重来 */
        async loadSource() {
          const raw = String(this.src ?? '').trim();
          if (!raw) return;
          let url;
          try {
            url = new URL(raw, document.baseURI).href;
          } catch {
            return;
          }
          if (this._source?.loaded && this._source.url === url) return;

          const token = ++this._loadToken;
          this._source = { url, loaded: false };
          this._baseTag = undefined;
          try {
            const text = await loadDemoText(url);
            if (token !== this._loadToken || !this._mounted) return;
            const parsed = parseDemoSource(text);
            this._source = { url, text, parsed, loaded: true };
            if (this._editor) {
              this._editor.setValue(parsed.inner);
              this.scheduleFit();
            }
            await this.renderBase();
          } catch (error) {
            if (token !== this._loadToken) return;
            this.showPreviewError(error);
            this.showError(error);
            this.setStatus('示例文件加载失败', 'error');
          }
        },

        /** 编译文件原文并渲染初始预览；结果 tag 留着给「重置」复用 */
        async renderBase() {
          if (!this._source?.loaded) return;
          const seq = ++this._runSeq;
          this.setStatus('正在加载示例…');
          let tag;
          try {
            /* 初始预览保留 demo 文件自己的标签（测试按它查页面里的演示；换页回来直接复用定义） */
            tag = await compileDemo({
              text: this._source.parsed.inner,
              url: this._source.url,
              reuseTag: true,
            });
          } catch (error) {
            if (seq !== this._runSeq || !this._mounted) return;
            this.showPreviewError(error);
            this.showError(error);
            this.setStatus('示例加载失败', 'error');
            return;
          }
          if (seq !== this._runSeq || !this._mounted) return;
          this._baseTag = tag;
          this.renderBaseElement();
          this.hideError();
          this.ele.removeAttribute('data-dirty');
          this.setStatus(this._editor ? HINT : '');
        },

        renderBaseElement() {
          if (!this._baseTag) return;
          this._live.ele.replaceChildren(document.createElement(this._baseTag));
        },

        /** 首屏 / 重置失败时的预览区兜底：文字直接给在示例位置，不能白屏（文案运行期才知道，节点只能现造） */
        showPreviewError(error) {
          const message = error instanceof Error ? error.message : String(error);
          const note = document.createElement('p');
          note.className = 'load-error';
          note.textContent = `示例加载失败：${message}`;
          this._live.ele.replaceChildren(note);
        },

        /** 第一次展开抽屉才建编辑器（CM 懒加载）；重复展开复用同一个实例 */
        openEditor() {
          if (this._editorPromise) return this._editorPromise;
          this._editorPromise = this.createEditor().catch((error) => {
            this._editorPromise = undefined;
            this.setActionsEnabled(false);
            this.showError(error);
            this.setStatus('编辑器加载失败', 'error');
          });
          return this._editorPromise;
        },

        async createEditor() {
          if (!this._source?.loaded) await this.loadSource();
          if (!this._source?.loaded) return;
          this.setStatus('正在加载编辑器…');
          this.showEditorLoading();
          let editor;
          try {
            editor = await mountCodeEditor(this._editorHost.ele, {
              value: this._source.parsed.inner,
              onChange: () => this.onEdit(),
              onRun: () => this.run(),
              /* 折叠后内容变矮：跟着重算编辑区高度 */
              onFold: () => this.scheduleFit(),
            });
          } finally {
            this.hideEditorLoading();
          }
          if (!this._mounted) {
            editor.destroy();
            return;
          }
          this._editor = editor;
          this.setActionsEnabled(true);
          this.setStatus(HINT);
          this.scheduleFit();
        },

        /** 用户改动：先标「已修改」，停下 RUN_DELAY 毫秒后自动跑 */
        onEdit() {
          if (this._suppress) return;
          const changed =
            Boolean(this._editor) &&
            Boolean(this._source?.loaded) &&
            this._editor.getValue() !== this._source.parsed.inner;
          this.ele.toggleAttribute('data-dirty', changed);
          this.setStatus('已修改 · 即将自动运行');
          this.scheduleFit();
          clearTimeout(this._runTimer);
          this._runTimer = setTimeout(() => this.run(), RUN_DELAY);
        },

        /** 编译并替换预览。失败时保留上一次成功的预览 + 显示错误，不把页面搞成白块 */
        async run() {
          clearTimeout(this._runTimer);
          this._runTimer = undefined;
          if (!this._editor || !this._source?.loaded) return;

          const text = this._editor.getValue();
          const seq = ++this._runSeq;
          const started = performance.now();
          this.setStatus('正在编译…');

          let tag;
          try {
            tag = await compileDemo({ text, url: this._source.url });
          } catch (error) {
            if (seq !== this._runSeq) return; // 期间又跑了一次：这次结果作废
            this.showError(error);
            this.setStatus('编译失败', 'error');
            return;
          }
          if (seq !== this._runSeq || !this._mounted) return;

          try {
            const next = document.createElement(tag);
            this._live.ele.replaceChildren(next);
          } catch (error) {
            if (seq !== this._runSeq) return;
            this.showError(error);
            this.setStatus('示例渲染失败', 'error');
            return;
          }

          this.ele.toggleAttribute('data-dirty', text !== this._source.parsed.inner);
          this.hideError();
          this.setStatus(`预览已更新 · ${Math.max(1, Math.round(performance.now() - started))}ms`);
        },

        /** 重置：编辑器文本回原文、预览用原文重新渲染（不刷新页面、不写回文件） */
        reset() {
          clearTimeout(this._runTimer);
          this._runTimer = undefined;
          this._runSeq += 1;
          this.hideError();
          this.setStatus(HINT);
          if (this._editor && this._source?.loaded) {
            this._suppress = true;
            this._editor.setValue(this._source.parsed.inner);
            this._suppress = false;
          }
          this.ele.removeAttribute('data-dirty');
          this.scheduleFit();
          if (this._baseTag) this.renderBaseElement();
          else this.renderBase();
        },

        /** 复制源码。反馈只换图标（✓ / ✕）三秒，不写状态栏文字；收起态直接复制文件原文 */
        async copy() {
          if (!this._editor && !this._source?.loaded) await this.loadSource();
          const text = this._editor?.getValue() ?? this._source?.parsed?.inner;
          if (!text) return;
          try {
            await navigator.clipboard.writeText(text);
            this.flashCopy(true);
          } catch {
            /* 剪贴板 API 不可用时的降级：一次性 textarea，不进页面结构、用完即删 */
            const area = document.createElement('textarea');
            area.value = text;
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.append(area);
            area.select();
            try {
              document.execCommand('copy');
              this.flashCopy(true);
            } catch {
              this.flashCopy(false);
            }
            area.remove();
          }
        },

        /** 复制按钮的临时反馈：图标换成 ✓ / ✕、颜色跟语义色走，三秒后恢复 */
        flashCopy(ok) {
          const btn = this._copyBtn;
          if (!btn) return;
          clearTimeout(this._copyTimer);
          btn.dataset.feedback = ok ? 'copied' : 'failed';
          btn.querySelector('mc-icon')?.setAttribute('name', ok ? 'check' : 'x');
          btn.title = ok ? '已复制' : '复制失败';
          this._copyTimer = setTimeout(() => this.resetCopy(), COPY_FEEDBACK_MS);
        },

        resetCopy() {
          clearTimeout(this._copyTimer);
          this._copyTimer = undefined;
          const btn = this._copyBtn;
          if (!btn) return;
          delete btn.dataset.feedback;
          btn.querySelector('mc-icon')?.setAttribute('name', 'copy');
          btn.title = '复制源码';
        },

        /** 运行 / 重置依赖编辑器，没就绪就置灰；复制随时可用 */
        setActionsEnabled(enabled) {
          if (this._runBtn) this._runBtn.disabled = !enabled;
          if (this._resetBtn) this._resetBtn.disabled = !enabled;
        },

        /** 展开 / 收起：同一行里换出「运行 / 重置 / 复制」与状态，编辑器在下面展开 */
        setOpen(open) {
          this._open = open;
          this.ele.toggleAttribute('data-open', open);
          this._panel.ele.hidden = !open;
          const toggle = this._actions.ele.querySelector('[data-act="toggle"]');
          if (toggle) {
            const label = open ? '收起编辑' : '展开编辑';
            toggle.querySelector('mc-icon')?.setAttribute('name', open ? 'close' : 'edit');
            toggle.title = label;
          }
          if (open) {
            this.openEditor();
            this.scheduleFit();
          }
        },

        /** 首次加载才显示：晚 150ms 再亮，缓存命中时不会闪一下 */
        showEditorLoading() {
          if (!this._loadingEl || this._editor) return;
          clearTimeout(this._loadingTimer);
          this._loadingTimer = setTimeout(() => {
            this._loadingEl.ele.hidden = false;
          }, 150);
        },

        hideEditorLoading() {
          clearTimeout(this._loadingTimer);
          if (this._loadingEl) this._loadingEl.ele.hidden = true;
        },

        /** rAF 合并：连续敲字 / 拖窗口时不用每次都量 */
        scheduleFit() {
          if (this._fitRaf) return;
          this._fitRaf = requestAnimationFrame(() => {
            this._fitRaf = 0;
            this.fitEditorHeight();
          });
        },

        /** 高度 = 内容高度：不设上下限，量到多高就写多高（+2 是盒子的上下边框） */
        fitEditorHeight() {
          const host = this._editorHost?.ele;
          const editor = this._editor;
          if (!host || !editor) return;
          const content = Math.ceil(editor.getContentHeight());
          if (!content) return; // 面板还藏着 / 量不到高：先不动
          const next = `${content + 2}px`;
          if (host.style.height === next) return;
          host.style.height = next;
          editor.refresh();
        },

        toggle() {
          this.setOpen(!this._open);
        },

        onAction(event) {
          const act = event.target?.closest?.('[data-act]')?.dataset?.act;
          if (act === 'run') this.run();
          else if (act === 'reset') this.reset();
          else if (act === 'copy') this.copy();
          else if (act === 'toggle') this.toggle();
        },

        setStatus(text, tone) {
          this._statusEl.ele.textContent = text;
          if (tone) this.ele.dataset.state = tone;
          else this.ele.removeAttribute('data-state');
        },

        showError(error) {
          this._errorEl.ele.textContent = error instanceof Error ? error.message : String(error);
          this._errorEl.ele.hidden = false;
          console.warn('[mosaic] doc-playground 示例编译失败：', error);
        },

        hideError() {
          this._errorEl.ele.hidden = true;
          this._errorEl.ele.textContent = '';
        },

        /** 亮暗：读 color-scheme（令牌层切主题就是切它，且继承、穿得进 shadow root），退到系统偏好 */
        syncDark() {
          const scheme = (getComputedStyle(this.ele).colorScheme || '').toLowerCase();
          const dark = scheme.includes('dark')
            ? true
            : scheme.includes('light')
              ? false
              : (window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false);
          this.ele.toggleAttribute('data-dark', dark);
        },
      },
    });
  </script>
</template>
