<template component>
  <style>
    :host {
      display: block;
    }
  </style>

  <slot></slot>

  <script>
    import { parseSpecMd, SECTIONS } from '../lib/md-spec.mjs';

    const textByUrl = new Map();
    let warned = false;

    function loadText(url) {
      if (!textByUrl.has(url)) {
        const p = (async () => {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.text();
        })();
        textByUrl.set(url, p);
        p.catch(() => textByUrl.delete(url)); // 失败不缓存，允许重试
      }
      return textByUrl.get(url);
    }

    export default () => ({
      tag: 'doc-spec',

      attrs: {
        src: '',
      },

      watch: {
        src() {
          this.onAttrChange();
        },
      },

      ready() {
        this._sections = [];
        this.ele.setAttribute('data-state', 'loading');
        this._mounted = true;
        this.load();
      },

      detached() {
        this._mounted = false;
      },

      proto: {
        onAttrChange() {
          if (!this._mounted) return;
          this.load();
        },

        async load() {
          const src = String(this.src ?? '').trim();
          if (!src) return;

          let url;
          try {
            url = new URL(src, document.baseURI).href;
          } catch {
            return;
          }
          this._url = url;

          try {
            const text = await loadText(url);
            if (this._url !== url || !this.ele.isConnected) return;

            const { html, sections } = parseSpecMd(text, { baseUrl: url });
            if (!sections.length) {
              console.warn(
                `[mosaic] doc-spec: ${url} 里没有可渲染的节（${SECTIONS.join(' / ')}），参考区为空`,
              );
            }
            this._sections = sections;
            this.ele.innerHTML = html;
            this.ele.setAttribute('data-state', 'ready');
          } catch (err) {
            if (this._url !== url || !this.ele.isConnected) return;
            this.ele.setAttribute('data-state', 'error');
            if (!warned) {
              warned = true;
              console.warn(
                `[mosaic] doc-spec 规范 md 加载失败，参考区为空：src=${src} → ${url}`,
                err,
              );
            }
          }
        },
      },
    });
  </script>
</template>
