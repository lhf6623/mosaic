<!--
  <doc-cards> —— 组件总览页的「全部组件」卡片墙（原来是 docs/site.js 里 el() 手搓 DOM）。

  数据来自 docs/site-map.js 的 GROUPS（静态纯模块）：分组 → 卡片。已实现的卡片给一个明确的
  操作入口（卡内那个「查看文档」链接），待建的**不给死链**（和左栏菜单同一条策略：显示
  stage 标记），所以有链接与没链接是两段标记（o-if / o-else 各写一份）。

  ⚠️ 卡片本体是项目自己的 <mc-card> —— 站点第一次拿它搭页面。排版三条策略：
     · **收紧**：站点把 --mc-card-pad 降到 space-3，并把 part=base / part=body 变成 flex 列、
       操作 margin-top: auto 钉在底边 —— 等高网格里多出来的空间落在摘要与操作之间，
       不再让卡片下半截空一片（原来页脚自带 16+16 内边距 + 32px 空档，一张卡 267px 高）；
     · **分层**：标题 text-lg + semibold，标签名 mono 小字、不给底色，摘要 text-sm + 弱化色；
       状态只有一行小字（已实现 = success 色，待建 = 里程碑，fg-subtle），不再是三种胶囊；
     · **一个轻出口**：可点的是卡内那个真 <a>（href / 右键 / 新标签页 / olink 都在），样式是
       「文字按钮」（主色、无边框、hover 才有浅底），不做整卡可点。**已实现与待建的面完全一样**
       —— 区分就是「底边有没有这个按钮」，待建那边在同一位置放一行 muted「待建」。
  ⚠️ 卡片样式（.doc-comp-*）从 content.css 搬到这里 —— 组件自带 shadow root，那边够不到。
     站点套件按 .doc-comp-card / .doc-comp-card-action 这类 class 计数与断言。
-->
<template component>
  <style>
    :host {
      display: block;
    }

    .doc-comp-group {
      margin-top: var(--mc-space-8);
    }

    .doc-comp-group h3 {
      margin-top: 0;
      margin-bottom: var(--mc-space-1);
    }

    .doc-comp-group-desc {
      margin-top: 0;
      margin-bottom: var(--mc-space-4);
      font-size: var(--mc-text-sm);
      color: rgb(var(--mc-color-fg-subtle));
    }

    .doc-comp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
      gap: var(--mc-space-4);
    }

    /* 站点自己定密度：12px 内边距 + 卡片内部 flex 列（操作钉底） */
    mc-card.doc-comp-card {
      --mc-card-pad: var(--mc-space-3);
    }
    mc-card.doc-comp-card::part(base) {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    mc-card.doc-comp-card::part(body) {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
    }
    /* 标题行与正文之间只留一个内边距：组件默认还留了「分隔线下方」那一份呼吸位，
       这里没画线（divider="none"），那份就多余了 */
    mc-card.doc-comp-card::part(header) {
      margin-block-end: 0;
    }

    /* 待建的卡片**外观与已实现完全一致** —— 区分交给底边那个「查看文档」按钮的有无，
       不再额外描边 / 压暗（同一面墙里两种面看起来才整齐） */

    .doc-comp-card-name {
      font-size: var(--mc-text-lg);
      font-weight: var(--mc-weight-semibold);
      color: rgb(var(--mc-color-fg));
    }

    /* 状态只有一行小字：已实现（success）/ 里程碑（弱化） */
    .doc-comp-badge {
      flex: none;
      font-size: var(--mc-text-xs);
      color: rgb(var(--mc-color-fg-subtle));
    }
    .doc-comp-badge[data-status='ready'] {
      color: rgb(var(--mc-color-success));
    }

    /* 标签名：等宽小字，不给底色（原来那个灰方块会和状态胶囊一起抢视线） */
    .doc-comp-card-tag {
      margin-bottom: var(--mc-space-1);
      color: rgb(var(--mc-color-fg-subtle));
      font-size: var(--mc-text-xs);
      /* 原来这个位置是 <code>（自带等宽）；<code> 里的 {{ }} 不会被 ofa 编译（P8），
         所以换成 <span>，等宽字体在这里补回来 */
      font-family: var(--mc-font-mono);
    }

    .doc-comp-card-desc {
      margin: 0;
      font-size: var(--mc-text-sm);
      color: rgb(var(--mc-color-fg-muted));
    }

    /* 操作入口：卡内一个真链接，样式做成「文字按钮」—— 24 张卡里不该有 24 个紫描边按钮。
       margin-top: auto 把它钉到卡片底边，等高网格里每张卡的出口都在同一水平线上 */
    mc-card .doc-comp-card-action {
      align-self: flex-end;
      margin-top: auto;
      margin-inline-end: calc(var(--mc-space-1) * -1); /* 让文字与右边缘视觉对齐 */
      padding: var(--mc-space-1) var(--mc-space-2);
      border-radius: var(--mc-radius-md);
      color: rgb(var(--mc-color-primary));
      font-size: var(--mc-text-sm);
      font-weight: var(--mc-weight-medium);
      text-decoration: none;
      transition: background-color var(--mc-duration-fast) var(--mc-ease-standard);
    }
    mc-card .doc-comp-card-action:hover {
      background-color: rgb(var(--mc-color-primary-subtle));
    }

    /* 待建卡的底边也压一行字：网格里每张卡的下沿节奏一致，不留空半截 */
    .doc-comp-card-planned {
      align-self: flex-end;
      margin-top: auto;
      font-size: var(--mc-text-sm);
      color: rgb(var(--mc-color-fg-subtle));
    }
  </style>

  <o-fill :value="sections" fill-key="label">
    <section class="doc-comp-group">
      <h3>{{$data.label}}</h3>
      <o-if :value="$data.summary">
        <p class="doc-comp-group-desc">{{$data.summary}}</p>
      </o-if>
      <div class="doc-comp-grid">
        <o-fill :value="$data.cards" fill-key="key">
          <!-- ⚠️ 与左栏菜单同一个理由：o-fill 的模板只允许一个根子元素，而这一行要按
               「已实现 / 待建」渲染两张不同的卡（<o-if> + <o-else>）。显式写这层 display:contents
               包裹，免得 ofa 自己包一层再打 temp_multi_child 警告（布局与自动包裹逐像素相同）。 -->
          <div style="display: contents">
            <o-if :value="$data.href">
              <mc-card divider="none" class="doc-comp-card" attr:data-status="$data.status">
                <span slot="header" class="doc-comp-card-name">{{$data.label}}</span>
                <span slot="suffix" class="doc-comp-badge" attr:data-status="$data.status"
                  >{{$data.badge}}</span
                >
                <span class="doc-comp-card-tag">{{$data.tagName}}</span>
                <p class="doc-comp-card-desc">{{$data.summary}}</p>
                <a class="doc-comp-card-action" attr:href="$data.href"
                  >查看文档<span aria-hidden="true"> →</span></a
                >
              </mc-card>
            </o-if>
            <o-else>
              <mc-card divider="none" class="doc-comp-card" attr:data-status="$data.status">
                <span slot="header" class="doc-comp-card-name">{{$data.label}}</span>
                <span slot="suffix" class="doc-comp-badge" attr:data-status="$data.status"
                  >{{$data.badge}}</span
                >
                <span class="doc-comp-card-tag">{{$data.tagName}}</span>
                <p class="doc-comp-card-desc">{{$data.summary}}</p>
                <span class="doc-comp-card-planned">待建</span>
              </mc-card>
            </o-else>
          </div>
        </o-fill>
      </div>
    </section>
  </o-fill>

  <script>
    import { GROUPS, hasPage } from '../site-map.js';
    import { hashOf } from '../routes.js';

    export default () => ({
      tag: 'doc-cards',

      data: { sections: [] },

      ready() {
        /* 展示策略都收在这里：已实现的给站内链接（hashOf 带部署前缀），
           待建的不给 href、只显示 stage 标记 */
        this.sections = GROUPS.map((group) => ({
          label: group.label,
          summary: group.summary ?? null,
          cards: group.items.map((item) => {
            const ready = hasPage(item);
            return {
              // 待建的没有 path，用 tagName 当 fill-key（与左栏菜单同一套约定）
              key: item.path ?? item.tagName,
              label: item.label,
              tagName: item.tagName,
              summary: item.summary,
              status: ready ? 'ready' : 'planned',
              badge: ready ? '已实现' : item.stage,
              href: ready ? hashOf(item.path) : null,
            };
          }),
        }));
      },
    });
  </script>
</template>
