<template page>
  <!--
    组件文档页的**分区布局页**：左栏菜单 + 正文 + 右栏本页目录。packages/<slug>/page.html 用 `export const parent` 挂上来，上面还有一层外壳 docs/layout.html。
    ⚠️ 左右两栏是 position: fixed（不在文档流里），正文靠 .doc-content 的 padding 留位；两栏高度固定 100%（注释见下面的 <style>）。
    左栏可收起：把手在栏右沿，状态只在内存（刷新复位，不落盘）；小屏仍由 @media 隐藏、菜单走顶栏浮层。
  -->
  <style>
    /* ---------- 浮动侧栏 + 正文留位 ----------
     * 左右两栏 position: fixed、不在文档流里（高度 = 视口高、自己滚，顶部 padding 让开顶栏），所以没有 sticky 的滑动区间问题，页面高度变化也不带动它们；正文用 padding 留位，中栏宽度不设上限。
     * ⚠️ fixed 的包含块是视口，祖先链上不能有 transform / filter / perspective / contain:paint / will-change —— 否则两栏会退化成跟着内容滚。
     * 两栏不在正文的滚动链上，滚轮在栏内到底会被吞掉 —— 外壳 docs/layout.html 里有一段只在边界接管的转发
     * （用 composedPath() 认 <doc-nav>/<doc-toc>，再读它们里面那个 mc-scroll-bar 的 viewport）。 */

    .doc-split {
      display: block;
      min-width: 0;
    }

    /* 左右两栏：浮在窗口两侧，整屏高。样式挂在标签上（都是自定义元素）。
       ⚠️ 这里**不写** overflow / scrollbar-width：滚动归各自组件里那层 mc-scroll-bar（nav.html / toc.html 的 shadow 内），
       宿主只负责「定位 + 尺寸 + 纵向让位」。宿主上再挂一层 overflow = 多出一个永远滚不动的容器，
       「谁在滚、到没到底」就有了两个答案 —— 外壳那段滚轮接力认的是组件里那个 viewport（见 layout.html）。
       ⚠️ 横向内边距也不在这里：条子贴的是**宿主的边**（mc-scroll-bar 的条子贴它自己的右沿），
       而宿主的 padding 会把滚动条一起推离栏边 —— 那条 gutter 改由组件给 viewport（见两个组件的 <style>）。 */
    doc-nav,
    doc-toc {
      display: block; /* 自定义元素默认是 inline，不写会塌成 0 宽 */
      position: fixed;
      top: 0;
      height: 100%;
      z-index: var(--mc-z-sticky); /* 顶栏比它高一档，见 layout.html */
      /* 两栏给一层**框架底色**（见 shell.css 的 --doc-frame-bg）：它们本来是透明的、吃 body 的底色，
         亮色下框架与正文同为白，分隔靠这层的 border-right；暗色下框架是纯黑、正文是 surface，靠明度差分开。 */
      background-color: var(--doc-frame-bg);
      /* 只让开顶栏那一条，**不加额外间距**：菜单自己每项都有内边距，再垫一档上下都会显脏。
         顶栏这 3.5rem 是让位不是间距 —— 去掉的话前几条会钻到顶栏底下（顶栏不透明、压在上面）。 */
      padding-top: var(--doc-topbar, 3.5rem);
      padding-bottom: 0;
      padding-inline: 0;
    }

    doc-nav {
      left: 0;
      width: 15rem;
      border-right: 1px solid rgb(var(--mc-color-border));
    }

    /* 右栏：本页目录（<doc-toc> 扫标题生成，见 docs/components/toc.html）。宽度 15rem 是按缩进后最长标题（「卡片外观（variant="surface"）」= 172px）反算的，
       内边距因此用 space-4 而不是左栏的 space-5（两处都在各自组件的 <style> 里，条子要贴栏边）。
       宽度、内边距、toc.html 的缩进量要一起改，否则最长标题会被截断。 */
    doc-toc {
      right: 0;
      width: 15rem;
      border-left: 1px solid rgb(var(--mc-color-border));
    }

    /* 中栏 = 分区布局页里包住 <slot> 的那一栏：左右 padding 就是两栏的占位，宽度**不设上限**（两栏是 fixed，不占它的宽度），只留一条下限 20rem 兜底。
       它自己不滚（滚的是外壳的 .doc-main），正文的实际内边距由子页面自己的 .doc-body 负责；窄屏处理在下面两条断点上。 */
    .doc-split > .doc-content {
      min-width: 20rem;
      padding-inline: 15rem 15rem;
    }

    /* 左栏把手：贴在栏右沿（顶栏下方），收起后停靠视口左缘。状态由宿主属性 data-nav-hidden 驱动，
       不落盘（刷新复位）；小屏由下面的 @media 把左栏和把手一起交给顶栏浮层。 */
    .doc-nav-handle {
      position: fixed;
      top: calc(var(--doc-topbar, 3.5rem) + 0.75rem);
      left: 15rem;
      z-index: calc(var(--mc-z-sticky) + 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid rgb(var(--mc-color-border));
      border-radius: var(--mc-radius-md);
      background-color: var(--doc-frame-bg);
      color: rgb(var(--mc-color-fg-muted));
      font-size: 15px;
      cursor: pointer;
      transform: translateX(-50%);
    }

    .doc-nav-handle:hover {
      background-color: rgb(var(--mc-color-surface-sunken));
      color: rgb(var(--mc-color-fg));
    }

    .doc-nav-handle:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring));
      outline-offset: 1px;
    }

    :host([data-nav-hidden]) doc-nav {
      transform: translateX(-100%);
    }

    :host([data-nav-hidden]) .doc-nav-handle {
      left: 0;
      transform: none;
      border-left: 0;
      border-radius: 0 var(--mc-radius-md) var(--mc-radius-md) 0;
    }

    :host([data-nav-hidden]) .doc-split > .doc-content {
      padding-left: 0;
    }

    @media (prefers-reduced-motion: no-preference) {
      doc-nav,
      .doc-nav-handle,
      .doc-split > .doc-content {
        transition:
          transform 0.2s ease,
          left 0.2s ease,
          padding-left 0.2s ease,
          border-radius 0.2s ease;
      }
    }

    /* ⚠️ 条目自己的样式（待建压暗、当前项高亮）不在这里：<doc-nav> 是 ofa 组件模板、自带 shadow root，
       这里只能作用到宿主标签本身；那些规则写在 docs/components/nav.html 的 <style> 里。 */

    /* 中档宽度放不下右栏：收掉它，右侧的占位也跟着去掉 */
    @media (max-width: 78rem) {
      doc-toc {
        display: none;
      }

      .doc-split > .doc-content {
        padding-right: 0;
      }
    }

    @media (max-width: 52rem) {
      /* 窄屏放不下浮动侧栏：左栏整个收进**头部那颗图标按钮的浮层**（外壳 layout.html 里，复用同一个 <doc-nav> 组件）；
         这里只需要把它藏掉 —— 留着的话菜单会先在正文上面顶一大块，那正是要换掉的那种展示。 */
      doc-nav {
        display: none;
      }

      .doc-nav-handle {
        display: none;
      }

      .doc-split > .doc-content {
        padding-inline: 0;
      }
    }
  </style>
  <div class="doc-split">
    <doc-nav></doc-nav>

    <div class="doc-content">
      <slot></slot>
    </div>

    <doc-toc></doc-toc>

    <button
      type="button"
      class="doc-nav-handle"
      aria-expanded="true"
      aria-label="隐藏左侧菜单"
      title="隐藏左侧菜单">
      <mc-icon name="chevron-left"></mc-icon>
    </button>
  </div>

  <script>
    // 挂在文档站外壳下面（相对本文件解析）
    export const parent = './layout.html';

    /* 不落盘：SPA 内保持（模块级变量），刷新复位；小屏仍由 @media 接管 */
    let navHidden = false;

    export default () => ({
      data: {},

      ready() {
        this._nav = this.ele.shadowRoot.querySelector('doc-nav');
        this._handle = this.ele.shadowRoot.querySelector('.doc-nav-handle');
        this._onToggle = () => this.toggleNav();
        this._handle?.addEventListener('click', this._onToggle);
        this.applyNavState();
      },

      detached() {
        this._handle?.removeEventListener('click', this._onToggle);
      },

      proto: {
        toggleNav() {
          navHidden = !navHidden;
          this.applyNavState();
        },

        /** 宿主属性驱动 CSS（左栏滑出 / 正文让位 / 把手换边）；inert 保证收起的菜单不会被 Tab 聚焦 */
        applyNavState() {
          this.ele.toggleAttribute('data-nav-hidden', navHidden);
          this._nav?.toggleAttribute('inert', navHidden);
          if (!this._handle) return;
          const label = navHidden ? '显示左侧菜单' : '隐藏左侧菜单';
          this._handle.title = label;
          this._handle.setAttribute('aria-label', label);
          this._handle.setAttribute('aria-expanded', String(!navHidden));
          this._handle
            .querySelector('mc-icon')
            ?.setAttribute('name', navHidden ? 'chevron-right' : 'chevron-left');
        },
      },
    });
  </script>
</template>
