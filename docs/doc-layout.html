<template page>
  <style>
    .doc-split {
      display: block;
      min-width: 0;
    }

    doc-nav,
    doc-toc {
      display: block; /* 自定义元素默认是 inline，不写会塌成 0 宽 */
      position: fixed;
      top: 0;
      height: 100%;
      z-index: var(--mc-z-sticky); /* 顶栏比它高一档，见 layout.html */
      background-color: var(--doc-frame-bg);
      padding-top: var(--doc-topbar, 3.5rem);
      padding-bottom: 0;
      padding-inline: 0;
    }

    doc-nav {
      left: 0;
      width: 15rem;
      border-right: 1px solid rgb(var(--mc-color-border));
    }

    doc-toc {
      right: 0;
      width: 15rem;
      border-left: 1px solid rgb(var(--mc-color-border));
    }

    .doc-split > .doc-content {
      min-width: 20rem;
      padding-inline: 15rem 15rem;
    }

    .doc-nav-handle {
      position: fixed;
      top: calc(var(--doc-topbar, 3.5rem) + 0.75rem);
      left: 15rem;
      z-index: calc(var(--mc-z-sticky) + 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid rgb(var(--mc-color-border));
      border-radius: var(--mc-radius-md);
      background-color: var(--doc-frame-bg);
      color: rgb(var(--mc-color-fg-muted));
      font-size: 15px;
      cursor: pointer;
      transform: translateX(-50%);
    }

    .doc-nav-handle:hover {
      background-color: rgb(var(--mc-color-surface-sunken));
      color: rgb(var(--mc-color-fg));
    }

    .doc-nav-handle:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring));
      outline-offset: 1px;
    }

    :host([data-nav-hidden]) doc-nav {
      transform: translateX(-100%);
    }

    :host([data-nav-hidden]) .doc-nav-handle {
      left: 0;
      transform: none;
      border-left: 0;
      border-radius: 0 var(--mc-radius-md) var(--mc-radius-md) 0;
    }

    :host([data-nav-hidden]) .doc-split > .doc-content {
      padding-left: 0;
    }

    @media (prefers-reduced-motion: no-preference) {
      doc-nav,
      .doc-nav-handle,
      .doc-split > .doc-content {
        transition:
          transform 0.2s ease,
          left 0.2s ease,
          padding-left 0.2s ease,
          border-radius 0.2s ease;
      }
    }

    @media (max-width: 78rem) {
      doc-toc {
        display: none;
      }

      .doc-split > .doc-content {
        padding-right: 0;
      }
    }

    @media (max-width: 52rem) {
      doc-nav {
        display: none;
      }

      .doc-nav-handle {
        display: none;
      }

      .doc-split > .doc-content {
        padding-inline: 0;
      }
    }
  </style>
  <div class="doc-split">
    <doc-nav></doc-nav>

    <div class="doc-content">
      <slot></slot>
    </div>

    <doc-toc></doc-toc>

    <button type="button" class="doc-nav-handle" title="隐藏左侧菜单">
      <mc-icon name="chevron-left"></mc-icon>
    </button>
  </div>

  <script>
    export const parent = './layout.html';

    let navHidden = false;

    export default () => ({
      data: {},

      ready() {
        this._nav = this.shadow.$('doc-nav')?.ele ?? null;
        this._handle$ = this.shadow.$('.doc-nav-handle');
        this._handle = this._handle$?.ele ?? null;
        this._icon = this.shadow.$('mc-icon')?.ele ?? null;
        this._onToggle = () => this.toggleNav();
        this._handle$?.on('click', this._onToggle);
        this.applyNavState();
      },

      detached() {
        this._handle$?.off('click', this._onToggle);
      },

      proto: {
        toggleNav() {
          navHidden = !navHidden;
          this.applyNavState();
        },

        applyNavState() {
          this.ele.toggleAttribute('data-nav-hidden', navHidden);
          this._nav?.toggleAttribute('inert', navHidden);
          if (!this._handle) return;
          this._handle.title = navHidden ? '显示左侧菜单' : '隐藏左侧菜单';
          this._icon?.setAttribute('name', navHidden ? 'chevron-right' : 'chevron-left');
        },
      },
    });
  </script>
</template>
