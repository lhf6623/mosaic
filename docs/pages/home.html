<template page>
  <link rel="stylesheet" href="../content.css" />

  <style>
    /* 首页 = 一块方块场（<doc-block-field>）+ 中间的身份与两个入口。
       视差、方块、颜色全归组件，这一页只管「放在哪、中间留多大」（docs/README.md §二）。 */

    .hero {
      position: relative;
      min-height: calc(100vh - var(--doc-topbar, 3.5rem));
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .hero-core {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--mc-space-8);
      padding: var(--mc-space-6);
      text-align: center;
    }

    .hero-wordmark {
      margin: 0;
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 0.94;
      font-weight: var(--mc-weight-semibold);
      /* 宽度轴：Archivo 是可变字体，字标拉宽一档就有自己的声音（同外壳的品牌字标） */
      font-variation-settings: 'wdth' 112;
      letter-spacing: -0.038em;
      color: rgb(var(--mc-color-fg));
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: var(--mc-space-3);
    }
  </style>

  <!-- 方块场是站点组件（docs/components/）；入口是项目自己的按钮 -->
  <l-m src="../components/block-field.html"></l-m>
  <l-m src="../../packages/button/button.html"></l-m>

  <section class="hero">
    <doc-block-field></doc-block-field>

    <div class="hero-core">
      <h1 class="hero-wordmark">Mosaic</h1>
      <nav class="hero-cta">
        <mc-button color="primary" size="lg" on:click="openInstall()">快速开始</mc-button>
        <mc-button variant="outline" color="neutral" size="lg" on:click="openBrowse()">
          组件浏览
        </mc-button>
      </nav>
    </div>
  </section>

  <script>
    import { hashOf } from '../routes.js';
    import { TOPBAR, firstPageOf } from '../site-map.js';

    /* 「浏览组件」落到组件分区的第一个页面。分区自己可能没有落地页（「组件」就是），
       landing 的算法与外壳顶栏同一套（docs/layout.html），这里不抄第二份路径。 */
    const componentsEntry = TOPBAR.find((entry) => entry.label === '组件');
    const BROWSE_PATH =
      (componentsEntry && (componentsEntry.path ?? firstPageOf(componentsEntry)?.path)) ??
      'packages/button/page.html';

    export const parent = '../layout.html';

    export default () => ({
      data: {},

      proto: {
        openInstall() {
          location.hash = hashOf('docs/pages/install.html');
        },

        openBrowse() {
          location.hash = hashOf(BROWSE_PATH);
        },
      },
    });
  </script>
</template>
