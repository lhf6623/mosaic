<template page>
  <link rel="stylesheet" href="../content.css" />
  <div class="doc-body">
    <h1>常见问题</h1>
    <p class="doc-lead">页面出问题时，从这几条开始查。</p>

    <h2>组件完全不出现</h2>
    <p>
      打开开发者工具看控制台：有 404 或者 Failed to fetch，就是
      <code>&lt;l-m src="…"&gt;</code>
      的地址不对，版本号和路径都检查一下。地址没问题、标签却是空的，确认 ofa.js 那段
      <code>&lt;script type="module"&gt;</code>
      在组件之前。另外，双击 HTML 文件用
      <code>file://</code>
      打开是不行的，得走 HTTP。
    </p>

    <h2>改了文件，页面没变化</h2>
    <p>
      多半是服务器给了缓存。开发时换一个不发缓存头的静态服务器，或者在开发者工具里勾上禁用缓存再刷新。
    </p>

    <h2>结构出来了，样式没有</h2>
    <p>
      自托管时漏拷了组件的样式基座。打开网络面板搜
      <code>component-base.css</code>
      ，如果它是 404，把
      <code>packages/</code>
      按原目录结构补齐 —— 这个文件在
      <code>packages/boot/</code>
      下。
    </p>

    <h2>工具类不生效</h2>
    <p>
      先确认页面引了
      <code>mosaic.css</code>
      ，它是可选包，组件不会替你引。引了还是不生效，多半是用到了子集之外的类：目前只有布局、间距、排版、语义色这些手写类，像
      <code>mt-7</code>
      、
      <code>bg-gradient-to-r</code>
      都没有，需要就自己写 CSS。
    </p>

    <h2>
      没有
      <code>dark:</code>
      或
      <code>md:</code>
      变体
    </h2>
    <p>
      工具类是手写的，没有这些前缀。暗色也别用变体来做：
      <code>dark:</code>
      在 shadow DOM 里只能跟随系统偏好，跟不了页面上手动的主题切换。颜色差异一律改令牌，见
      <a olink href="./theme.html">调整主题</a>
      。
    </p>

    <h2>切了主题，组件颜色不变</h2>
    <p>两种情况。一是颜色在组件上写死了 hex，换成令牌就会跟着变；二是只覆盖了一种主题状态。</p>
    <p>
      亮色和暗色是两个独立状态，覆盖写在哪一态就只管哪一态，改法见
      <a olink href="./theme.html">调整主题</a>
      。
    </p>

    <h2>对象数据为什么有时能绑、有时不能</h2>
    <p>
      先分清楚两件事：
      <strong>写在 HTML 标签上的属性，只能是文字</strong>
      —— 这是 Web Components 的规矩， 跟用不用 SPA 没关系；
      <strong>JS 里的 property 可以放对象</strong>
      （
      <code>el.data = [...]</code>
      ）。ofa 的
      <code>:xxx="对象"</code>
      只是框架帮忙传值：有时候它直接写进组件的 property（对象还在），有时候先变成一段 JSON
      文字再写进标签属性（函数就丢了）。 所以「有
      <code>o-app</code>
      就能直接传对象」也不成立 —— 刷新首屏和点链接进来，结果都可能不一样。
    </p>
    <p>
      想稳定传对象，就别指望绑定：先在 HTML 里把组件放好，再用 JS 给 property 赋值 ——
      <code>form.rules = …</code>
      、
      <code>table.data = …</code>
      、
      <code>menu.options = …</code>
      。标签属性里就写 JSON 文字（
      <code>rules='…'</code>
      这种静态配置），别塞函数。
    </p>

    <h2>按钮点不动、开关关不掉</h2>
    <p>
      <code>disabled</code>
      /
      <code>checked</code>
      /
      <code>loading</code>
      这类属性只看
      <strong>在不在</strong>
      ，不看值写的是什么 —— 这是 HTML 自己的规矩，
      <code>&lt;input disabled="false"&gt;</code>
      浏览器一样当成禁用。所以普通页面上写裸属性就够了：
      <code>&lt;mc-button disabled&gt;</code>
      。
    </p>
    <p>
      在 ofa 模板里按条件开关，要写
      <code>attr:disabled="saving"</code>
      —— 它为假时会把属性整个摘掉。写成
      <code>:disabled="saving"</code>
      则相反：条件为假时标签上会留下
      <code>disabled="false"</code>
      —— 属性还在，按钮就永远关不掉。
    </p>
  </div>
  <script>
    export const parent = '../doc-layout.html';

    export default () => ({ data: {} });
  </script>
</template>
