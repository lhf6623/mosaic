    <h1>Mosaic UI</h1>
    <p class="doc-lead">

    <h2>是什么</h2>
    <p>
      组件就是一个
      <code>.html</code>
      文件。放在 CDN 或者你自己的服务器上，用
      <code>&lt;l-m src="…"&gt;</code>

      目录，也没有需要先跑一遍的构建。
    </p>
    <p>

      里，页面上的全局选择器进不去，它也不会改到你页面的其它地方。反过来也有代价：想改组件内部的样子，得用它开放的
      CSS 变量或者
      <code>::part()</code>
      ，靠覆盖 class 是不行的。
    </p>

    <h2>用什么写的</h2>
    <p>

    </p>
