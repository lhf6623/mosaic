<template page>
  <link rel="stylesheet" href="../content.css" />
  <div class="doc-body">
    <h1>Mosaic UI</h1>
    <p class="doc-lead">
      一套跑在 ofa.js 上的 Web Components 组件库：页面引一个 ofa.js，再按需引组件文件，没有
      npm，也没有构建步骤。
    </p>

    <h2>是什么</h2>
    <p>
      组件就是一个
      <code>.html</code>
      文件。放在 CDN 或者你自己的服务器上，用
      <code>&lt;l-m src="…"&gt;</code>
      引进来，标签就能用了。仓库里的文件就是发布出去的文件，没有 dist
      目录，也没有需要先跑一遍的构建。
    </p>
    <p>
      样式跟着组件走。每个组件把样式关在自己的 shadow DOM
      里，页面上的全局选择器进不去，它也不会改到你页面的其它地方。反过来也有代价：想改组件内部的样子，得用它开放的
      CSS 变量或者
      <code>::part()</code>
      ，靠覆盖 class 是不行的。
    </p>

    <h2>用什么写的</h2>
    <p>
      原生自定义元素加 shadow DOM，运行时依赖只有 ofa.js（当前钉在
      4.7.5）。对外的接口就是标签属性、事件和 CSS 变量，没有 JS 配置对象。
    </p>

    <h2>有多少组件</h2>
    <!-- ⚠️ {{categoryLabels}} 与 {{categoryCount}} 之间不能有空格（「布局五类里」要连排）；prettier 只在已有空白处折行，所以现在这样折是安全的 -->
    <p>
      现在有 {{componentCount}}
      个组件，分在{{categoryLabels}}{{categoryCount}}类里，左栏「组件」下面是全部。
    </p>

    <h2>主题</h2>
    <p>
      颜色全部写在 CSS 变量上，亮色和暗色两套都有。换品牌色就是覆盖对应的变量，做法见
      <a olink href="./theme.html">调整主题</a>
      。
    </p>
  </div>
  <script>
    import { SITE } from '../site-map.js';

    /* 统计从导航数据派生：加组件只要往 site-map 挂一条，这一页不用再手改（也就不会写错） */
    const components = [];
    const collect = (nodes) => {
      for (const node of nodes) {
        if (node.type === 'component' && node.path) components.push(node);
        if (node.children) collect(node.children);
      }
    };
    collect(SITE);

    /* 「组件」那一支的直接子节点就是分类（基础 / 表单 / 反馈 / 浮层 / 布局），hidden 的整支不算 */
    const categories = (SITE.find((node) => node.label === '组件')?.children ?? []).filter(
      (node) => node.hidden !== true,
    );

    /* 分类个数写中文数字，保持原句语气（「分在……五类里」）；超过十类就直接落数字 */
    const CN_NUM = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
    const categoryCount = CN_NUM[categories.length] ?? String(categories.length);

    export const parent = '../doc-layout.html';

    export default () => ({
      data: {
        componentCount: components.length,
        categoryCount,
        categoryLabels: categories.map((node) => node.label).join('、'),
      },
    });
  </script>
</template>
