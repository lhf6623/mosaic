    <h2>三条不可谈判的约束</h2>
    <ol>
      <li><strong>使用者侧零工具链</strong> —— 任何「请先安装 X」的方案直接否决</li>
      <li>
        <strong>组件不过打包器</strong> —— <code>packages/**.html</code> 源 = 产物。 ofa.js
        的组件就是一个可独立寻址的 <code>.html</code>，不该变成 JS bundle
      </li>
      <li>
        <strong>定制点只用原生 CSS</strong> —— <code>style="…"</code> + 令牌 +
        <code>::part()</code>， 不用 JS 配置对象
      </li>
    </ol>

    <h2>技术红线</h2>
    <p>下面每一条都有实测依据。违反了不会报错，只会静默失效。</p>

    <table class="doc-table">
      <thead>
        <tr>
          <th>红线</th>
          <th>后果</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>用 <code>presetWind3</code>，不用 <code>presetWind4</code></td>
          <td>
            wind4 的 theme 色不支持 <code>&lt;alpha-value&gt;</code>，会产出非法 CSS
            且整条声明静默失效
          </td>
        </tr>
        <tr>
          <td>必须开 <code>outputToCssLayers</code></td>
          <td>
            <code>adoptedStyleSheets</code> 在 shadow root 内的优先级<strong>高于</strong> 组件自身
            <code>&lt;style&gt;</code>，不分层的话工具类会反过来盖住组件样式
          </td>
        </tr>
        <tr>
          <td>组件里禁止 <code>dark:</code> 变体</td>
          <td>
            它生成的是后代选择器，匹配不到 shadow 树外面的 <code>&lt;html data-theme&gt;</code>
          </td>
        </tr>
        <tr>
          <td>组件只消费语义令牌，不碰原始色阶</td>
          <td>原始色阶不随主题切换，必然在某个主题下出现可读性问题</td>
        </tr>
        <tr>
          <td>构建缺输入必须大声失败</td>
          <td>
            实测 UnoCSS 会<strong>静默跳过</strong>缺失的输入文件，退出码 0， 产出没有令牌的坏 CSS
          </td>
        </tr>
        <tr>
          <td>文档里锁精确版本</td>
          <td>
            <code>@latest</code> / <code>@1</code> 有 7 天缓存，最长 7 天不生效； 精确版本是 1 年
            <code>immutable</code>
          </td>
        </tr>
      </tbody>
    </table>
