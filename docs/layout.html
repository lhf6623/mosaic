<template page>
  <!-- 文档站外壳（嵌套路由的布局页）：子页面用 export const parent 挂上来，正文走 <slot> -->
  <script>
    /* 外壳的脚本：页面模块也能静态 import（ofa 编译期会把相对说明符改写成绝对 URL，实测），
       所以导航数据、路由工具、路由状态都直接用站点共用模块，不再各抄一份。

       这里同时是**站点级行为**的归属地（原来在 docs/site.js，已并入）：
         · 换页复位：把 `.doc-main` 滚回顶部；
         · 滚轮接力：两栏滚到底后把滚轮转给正文带（两栏是 fixed，滚轮链终点是视口，视口不滚）。
       两者都是「外壳的事」——滚的是外壳的正文带，接管的是外壳进出的两个浮动栏。 */
    import { hashOf } from './routes.js';
    import { TOPBAR, firstPageOf, locate, menuOf } from './site-map.js';
    import { onRouteChange, routeState } from './state/route.js';

    const THEME_KEY = 'mosaic-doc-theme';
    const THEMES = ['auto', 'light', 'dark'];

    /**
     * 存下来的三态主题（没有 / 非法 / 隐私模式读不了 → auto，跟随系统）。
     * ⚠️ 在 data 里就算好、而不是等 ready()：下拉的初始值要在**第一次渲染**就带上，
     * 否则会先画一个「自动」再跳成存下来的值（闪一下）。页面的 data-theme 由
     * docs/theme-boot.js 在 head 里同步落好，是另一条路。
     */
    const storedTheme = () => {
      try {
        const v = localStorage.getItem(THEME_KEY);
        if (THEMES.includes(v)) return v;
      } catch {
        /* 隐私模式读不了 localStorage */
      }
      return 'auto';
    };

    /** 三态的中文名：下拉触发框显示当前那一项 */
    const THEME_LABELS = { auto: '自动', light: '亮色', dark: '暗色' };

    /** data 的初始主题：theme（值）+ themeLabel（触发框文案），只读一次 localStorage */
    const initialTheme = () => {
      const theme = storedTheme();
      return { theme, themeLabel: THEME_LABELS[theme] };
    };

    /** 行高兜底：deltaMode 为「行」时的像素换算（同 packages/code 的滚轮接力） */
    const WHEEL_LINE = 16;

    function wheelPixels(event) {
      if (event.deltaMode === 1) return event.deltaY * WHEEL_LINE;
      if (event.deltaMode === 2) return event.deltaY * window.innerHeight;
      return event.deltaY;
    }

    export default () => ({
      data: {
        ...initialTheme(),
        menuOpen: false,
        narrowMenuOpen: false,
        hasMenu: false,
        narrow: false,
        showMenu: false,
        links: [],
      },

      ready() {
        /* 顶栏入口来自 docs/site-map.js 的 TOPBAR（加一个入口 = 那里加一行）。
           ⚠️ 链接一律用 hashOf() 生成、不走 olink：olink 是编译期指令，这份数据是运行时拼的 */
        this.links = TOPBAR.map((entry) => {
          /* 分区可能没有自己的落地页（「组件」就是）：入口落到子树里第一个有页面的节点，
             否则顶栏会出现一个点不动的入口。path 仍是 o-fill 的 fill-key，必须唯一。 */
          const landing = entry.path ?? firstPageOf(entry)?.path ?? null;
          return landing ? { path: landing, label: entry.label, aria: null } : null;
        }).filter(Boolean);
        this.syncTopNav();
        this.syncMenuButton();

        /* 窄屏才有那颗菜单按钮（宽屏左栏常驻）。**媒体查询是唯一真相**，与
           docs/doc-layout.html 里藏左栏的那条 @media 用同一个断点（52rem）。
           宽屏下不渲染浮层 —— DOM 里就不会平白多出一份 <doc-nav>。 */
        this._mq = window.matchMedia('(max-width: 52rem)');
        this.narrow = this._mq.matches;
        this._onMQ = (event) => {
          this.narrow = event.matches;
          this.syncShowMenu();
        };
        this._mq.addEventListener('change', this._onMQ);

        /* 侧栏滚到底后把滚轮接力给正文带。
           ⚠️ 不能用 event.target：跨了两层 shadow 之后它在 document 层被重定向成外层宿主
           （实测是 o-page），只能用 composedPath() 认 <doc-nav> / <doc-toc> */
        this._onWheel = (event) => this.forwardWheel(event);
        document.addEventListener('wheel', this._onWheel, { passive: false });

        /* 顶栏入口的点击走**事件委托**：这些行是 o-fill 渲染出来的，而 ofa 的 `on:` 绑定
           在 o-fill 模板里拿不到 `$data`（实测真实点击也不触发，仓库里没有先例）。
           监听挂在外层 <nav> 上 —— 事件跨 shadow 冒泡到这里时 target 已被重定向成
           <mc-button> 宿主，从它的 data-path 取路由。 */
        this._topNav = this.ele.shadowRoot?.querySelector('.doc-top-nav');
        this._onTopNavClick = (event) => {
          const path = event.target?.closest?.('mc-button')?.dataset?.path;
          if (path) this.openEntry(path);
        };
        this._topNav?.addEventListener('click', this._onTopNavClick);

        /* 路由变化：只改 links[i].aria 这一个字段（o-fill 按 fill-key 复用节点，绝不重建 DOM，
           04 套件盯着这条），顺带把正文带滚回顶部 */
        this._unwatch = onRouteChange(() => {
          this.syncTopNav();
          this.syncMenuButton();
          this.hideNarrowMenu();
          this.resetScroll();
        });
      },

      detached() {
        this._unwatch?.();
        document.removeEventListener('wheel', this._onWheel);
        this._topNav?.removeEventListener('click', this._onTopNavClick);
        this._mq?.removeEventListener('change', this._onMQ);
      },

      proto: {
        /** 顶栏入口：改 hash 切页（不整页刷新）。hashOf 负责带上部署前缀（开发 / · Pages /mosaic/） */
        openEntry(path) {
          location.hash = hashOf(path);
        },

        /** 正文带：页面上唯一的滚动容器，住在外壳自己的 shadow root 里（不用穿透查） */
        mainScroller() {
          return this.ele.shadowRoot.querySelector('.doc-main');
        },

        resetScroll() {
          this.mainScroller()?.scrollTo({ top: 0 });
        },

        /** 只有「栏内还能滚」时才不插手；到了边界就把这一次滚轮转给正文带 */
        forwardWheel(event) {
          if (!event.deltaY || event.ctrlKey || event.metaKey) return;

          const host = event
            .composedPath()
            .find((node) => node instanceof Element && node.matches?.('doc-nav, doc-toc'));
          if (!host) return;

          const down = event.deltaY > 0;
          const atTop = host.scrollTop <= 0;
          const atBottom = host.scrollTop + host.clientHeight >= host.scrollHeight - 1;
          if ((down && !atBottom) || (!down && !atTop)) return;

          const scroller = this.mainScroller();
          if (!scroller) return;

          event.preventDefault(); // 拦掉「被吞掉的那一次」，改由我们转发
          scroller.scrollTop += wheelPixels(event);
        },

        /* 当前路由命中哪一支就点亮哪条入口。组件页靠「是「组件」的孩子」天然归属，
           不再需要那条 packages/<slug>/page.html 的兜底正则。
           ⚠️ 按**分区的 label** 比，不按 path：分区自己可能没有落地页（path 是落到的子页），
           按 path 比的话「组件」这一支永远点不亮。 */
        syncTopNav() {
          const entryLabel = locate(routeState().path)?.entry?.label ?? null;
          for (const link of this.links) {
            const next = link.label === entryLabel ? 'page' : null;
            if (link.aria !== next) link.aria = next;
          }
        },

        /**
         * 窄屏那颗菜单按钮露不露：看**当前分区有没有左栏菜单**（首页那种没有，就不该出现
         * 一个点开是空的浮层）。与宽度无关 —— 宽度由 CSS 的媒体查询管。
         */
        syncMenuButton() {
          const entry = locate(routeState().path)?.entry ?? null;
          this.hasMenu = entry ? menuOf(entry).length > 0 : false;
          this.syncShowMenu();
        },

        /** 露不露那颗按钮 = 这一页有菜单 **且** 处在窄屏 */
        syncShowMenu() {
          this.showMenu = this.hasMenu && this.narrow;
        },

        /**
         * 路由一变就把窄屏菜单收起来 —— 点条目本质就是导航，收在这里比在点击上判路径稳：
         * 面板内容是**插槽里的 light DOM**（在浮层 shadow 之外），在浮层上挂委托、或让 ofa 的
         * `on:` 去接，都够不着里面那个 <a>（实测点完不收起）。
         */
        hideNarrowMenu() {
          /* ⚠️ 组件方法在 ofa 的包装上，**裸元素上没有**：`$('.doc-menu')` 才有 hide()。
             直接 `el.hide()` 抛 TypeError —— 而且在路由回调里抛会把后面的 resetScroll() 一起带崩。 */
          const menu = this.ele.shadowRoot?.querySelector('.doc-menu');
          if (menu) $(menu)?.hide();
        },

        /** 点菜单项：落主题 → 存起来 → 收起菜单（菜单不像 select 会自己收，得手动关） */
        pickTheme(mode) {
          this.applyTheme(THEMES.includes(mode) ? mode : 'auto');
          try {
            localStorage.setItem(THEME_KEY, this.theme);
          } catch {
            /* 写不了就算了 */
          }
          const menu = this.ele.shadowRoot?.querySelector('mc-dropdown');
          if (menu) menu.open = false;
        },

        /** 落主题：auto 就是不写 data-theme（跟随系统，交给 theme-boot.js 与媒体查询） */
        applyTheme(mode) {
          if (mode === 'auto') delete document.documentElement.dataset.theme;
          else document.documentElement.dataset.theme = mode;

          this.theme = mode;
          this.themeLabel = THEME_LABELS[mode];
        },
      },
    });
  </script>

  <style>
    /* 外壳样式住在这里（布局页的 shadow root）；文档级 shell.css 只管视口与高度链 */

    /* <l-m> 是加载占位，不写这条它会作为 flex item 多占一个 gap（见 P13） */
    l-m {
      display: none;
    }

    :host {
      display: block;
      --doc-topbar: 3.5rem;
    }

    /* 顶栏是固定的一行（外壳锁一屏，正文带在它下面自己滚）。
       z-index 要比浮动侧栏高一档：侧栏是 fixed，而且是被 <slot> 投影进来的
       （在绘制顺序里靠后），同层会盖住顶栏 */
    .doc-top {
      position: relative;
      z-index: calc(var(--mc-z-sticky) + 1);
      display: flex;
      align-items: center;
      gap: var(--mc-space-5);
      height: var(--doc-topbar);
      padding-inline: var(--mc-space-5);
      border-bottom: 1px solid rgb(var(--mc-color-border));
      background-color: rgb(var(--mc-color-surface));
    }

    .doc-top-nav {
      display: flex;
      align-items: center;
      gap: var(--mc-space-1);
      min-width: 0;
      flex: 1 1 auto;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }

    .doc-top-nav::-webkit-scrollbar {
      display: none;
    }

    /* 顶栏四处（三个入口 + 主题触发框）都是 mc-button 的 inline 形态：盒子 / 排版 / 悬停 /
       焦点环全归组件，页面只剩一件它表达不了的事 —— **次要文字色**（`color` 维度里最接近的
       `neutral` 是填充档 213 218 224，当文字用浅得看不见），所以把强调色接到前景族上。
       ⚠️ 色槽由**外层样式表**覆盖：语义色名走 CSS，外层规则压得住 :host([color=…])。 */
    .doc-top-nav mc-button,
    .doc-top-actions mc-button {
      flex: none;
      --mc-button-accent: var(--mc-color-fg-muted);
    }

    /* 当前页用**主色**：与左栏、主题下拉里「选中项」同一个约定（`mc-menu-item[data-current]`
       就是主色 + primary-subtle 底）—— 不然头部是前景灰、菜单是主色紫，两处「当前」对不上。
       这里**只给颜色不给底色**（文字按钮不补底色，见上一条注释）；字重也不用写：
       组件默认就是 medium，正好是选中项那一档。 */
    .doc-top-nav mc-button[aria-current] {
      --mc-button-accent: var(--mc-color-primary);
    }

    /* 窄屏菜单浮层：面板要放得下「加载指示（Spinner）」这种长标签，菜单又可能 30+ 条，
       所以给它一个宽度下限 + 高度上限。
       ⚠️ 滚动容器必须是**里面的 <doc-nav>**，不能是这层面板包装：外壳那段滚轮接力认的是
       `doc-nav` / `doc-toc`，它按宿主的 scrollTop/scrollHeight 判「滚到底了没」。容器换成包装层，
       <doc-nav> 自己就不滚（可滚高度恒为 0）→ 永远被判成「已经在底部」→ 滚轮被 preventDefault
       转发给正文带：**面板纹丝不动、页面在滚**（实测面板 scrollTop 一直 0、正文 scrollTop 240）。
       让 <doc-nav> 自己滚，同时也就拿到了和宽屏左栏一样的行为：栏内滚到底再把滚轮交给正文带。 */
    .doc-menu {
      --mc-popover-panel-min-width: 14rem;
    }

    .doc-menu-panel doc-nav {
      /* ⚠️ 自定义元素默认 display:inline —— 不写这行它没有盒子（clientHeight 恒为 0），
         下面的 max-height / overflow 全是空转，滚动更无从谈起（实测滚轮直接落到页面上）。
         宽屏那份能滚是因为 doc-layout 给它写了 display:block，这份在外壳里，得自己来。 */
      display: block;
      max-height: min(70vh, 32rem);
      overflow-y: auto;
    }

    .doc-brand {
      font-weight: var(--mc-weight-semibold);
      font-size: var(--mc-text-lg);
      letter-spacing: -0.01em;
      color: rgb(var(--mc-color-fg));
      text-decoration: none;
    }

    /* 顶栏右侧的一对控件：仓库入口 + 主题切换，贴在一起 */
    .doc-top-actions {
      margin-left: auto;
      flex: none;
      display: flex;
      align-items: center;
      gap: var(--mc-space-2);
    }

    .doc-github {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--mc-control-h-sm);
      height: var(--mc-control-h-sm);
      border-radius: var(--mc-radius-full);
      color: rgb(var(--mc-color-fg-muted));
      text-decoration: none;
    }

    .doc-github:hover {
      background-color: rgb(var(--mc-color-surface-sunken));
      color: rgb(var(--mc-color-fg));
    }

    /* 焦点环用 ring 令牌，不用 currentColor（两者底色都浅）。
       ⚠️ 主题切换的焦点环在 mc-button 内部那个原生按钮上，组件自带了同款（--mc-color-ring），
       所以这里只管 GitHub 那颗。 */
    .doc-github:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring));
      outline-offset: 2px;
    }

    /* 外壳 = 一屏高的纵向 flex：顶栏定高（flex: none），正文带吃掉剩下的（flex: 1 + min-height: 0）。
       不需要把高度一层层从 body 传下来 —— 这一层自己声明 height: 100vh。
       正文带因此正好从顶栏下面开始：它的滚动条不会像窗口滚动条那样伸进头部里去。 */
    .doc-shell {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 正文带：**唯一的滚动容器**。全宽 → 滚动条贴窗口右缘；
       左右两栏是 position: fixed（见 docs/content.css 的分栏注释），不占这里的布局。 */
    .doc-main {
      flex: 1;
      min-height: 0; /* 不写这一条，flex 子项会被内容撑高、滚不起来 */
      display: block;
      width: 100%;
      min-width: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* 子页面只负责铺满宽度；正文多宽由页面自己决定（组件页还要先给浮动侧栏留出位置，
       见 docs/content.css 的分栏注释 —— 宽度不设上限，只留下限）。
       ::slotted 的实参只能是复合选择器，所以不能写成 .doc-main ::slotted(o-page) */
    ::slotted(o-page) {
      display: block;
      width: 100%;
    }
  </style>

  <!-- 站点级组件：外壳只注册一次，页面不用自己写 <l-m>；mc-collapse 就是演示区的「查看代码」抽屉 -->
  <l-m src="../packages/code/code.html"></l-m>
  <l-m src="../packages/icon/icon.html"></l-m>
  <l-m src="../packages/collapse/collapse.html"></l-m>
  <l-m src="../packages/collapse/collapse-item.html"></l-m>
  <!-- 文档站自己的组件在 docs/components/ 下：标签名由组件里显式声明的 tag 决定，约定 doc- + 文件名
       （nav.html → tag: 'doc-nav'；不写 tag 会按文件名推断出非法元素名，见 ofa-pitfalls P40）。左栏 <doc-nav>、右栏 <doc-toc> 都用 mc-menu 渲染 -->
  <l-m src="./components/nav.html"></l-m>
  <l-m src="./components/toc.html"></l-m>
  <l-m src="../packages/menu/menu.html"></l-m>
  <l-m src="../packages/menu/menu-item.html"></l-m>
  <!-- 顶栏右侧的主题切换：项目自己的下拉**菜单**（mc-dropdown；菜单项用已注册的 mc-menu-item） -->
  <l-m src="../packages/dropdown/dropdown.html"></l-m>
  <l-m src="../packages/popover/popover.html"></l-m>
  <!-- 面包屑已从组件页去掉：mc-breadcrumb 由它自己的文档页按需注册 -->
  <!-- 组件文档页的参考区：把组件单元自己的 api.md 渲染进页面（页面上不再手抄表格），
       渲染进 light DOM，右栏 <doc-toc> 才收得到那几节的标题 -->
  <l-m src="./components/spec.html"></l-m>
  <!-- 页面占位也是组件（原来在 layout 的脚本里手搓 DOM）：设计令牌的色板 -->
  <l-m src="./components/palette.html"></l-m>

  <!-- 一屏高的外壳容器：顶栏 + 正文带（flex 纵向，正文带吃掉剩下的高度并自己滚） -->
  <div class="doc-shell">
    <header class="doc-top">
      <a class="doc-brand" href="./pages/home.html" olink>Mosaic</a>

      <!-- 一级菜单就是页面本身（入口来自 TOPBAR，由 ready() 拼成 data.links 后交给模板）；
           二级菜单不在这里，哪个页面需要就自己放 <doc-nav> -->
      <nav class="doc-top-nav">
        <!-- 入口是 mc-button（inline 形态），不是 <a>：导航改由 openEntry() 改 hash。
             ⚠️ 这是**有意**放弃 href 的（中键 / 右键复制链接 / 状态栏预览都没有了），
             换来的是「顶栏每一处都由项目自己的组件渲染」。改回锚点前先看提交记录里的取舍。
             aria-current 由新增的 aria 转发落到内部那个原生按钮上，读屏才看得到「当前页」。 -->
        <o-fill :value="links" fill-key="path">
          <mc-button inline attr:aria-current="$data.aria" attr:data-path="$data.path"
            >{{$data.label}}</mc-button
          >
        </o-fill>
      </nav>

      <!-- 右侧一对控件：仓库入口 + 主题切换。GitHub 是**外链**（不用 olink / hashOf），
           图标按钮必须有 aria-label，装饰性 SVG 加 aria-hidden（无障碍基线，见 design-spec 第八节） -->
      <div class="doc-top-actions">
        <a
          class="doc-github"
          href="https://github.com/lhf6623/mosaic"
          target="_blank"
          rel="noreferrer"
          aria-label="GitHub 仓库"
          title="GitHub 仓库"
        >
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
        </a>

        <!-- 主题切换：项目自己的下拉**菜单**。触发元素是我们写的按钮，无障碍名直接写在它
             身上（不用跨 shadow）；当前主题挂在菜单项的 aria-current 上 —— mc-menu-item 会
             把它镜像成 [data-current] 换底色加粗（复用「当前页」那套状态机）。
             placement 用 bottom-end：这颗控件在顶栏最右边，左对齐会顶出视口。 -->
        <mc-dropdown
          trigger="click"
          placement="bottom-end"
          on:open="menuOpen = true"
          on:close="menuOpen = false"
        >
          <!-- 触发元素用项目自己的 mc-button（inline 形态）：样式归组件，不再手写一颗。
               无障碍名由 .sr-only 那半句 + 当前值拼出来（「切换深浅色：自动」）——
               mc-button 的可访问名来自插槽文字，所以可见文字与隐藏文字要一起给。 -->
          <mc-button
            slot="trigger"
            inline
            aria-haspopup="menu"
            attr:aria-expanded="menuOpen ? 'true' : 'false'"
          >
            <span class="sr-only">切换深浅色：</span>
            <span>{{themeLabel}}</span>
          </mc-button>
          <mc-menu-item
            ><button
              type="button"
              attr:aria-current="theme === 'auto' ? 'true' : null"
              on:click="pickTheme('auto')"
            >
              自动
            </button></mc-menu-item
          >
          <mc-menu-item
            ><button
              type="button"
              attr:aria-current="theme === 'light' ? 'true' : null"
              on:click="pickTheme('light')"
            >
              亮色
            </button></mc-menu-item
          >
          <mc-menu-item
            ><button
              type="button"
              attr:aria-current="theme === 'dark' ? 'true' : null"
              on:click="pickTheme('dark')"
            >
              暗色
            </button></mc-menu-item
          >
        </mc-dropdown>

        <!-- 窄屏的菜单入口：一颗图标按钮 + 浮层（宽屏时左栏常驻，这颗按钮由 CSS 收起来）。
             o-if 管的是「这一页有没有菜单」—— 首页那种没有左栏的页面，不该出现一个点开是空的浮层。
             面板里放的是**同一个 <doc-nav> 组件**：窄屏那份与左栏那份共用渲染与数据。
             ⚠️ 它是 disclosure（按钮 + 展开区块），不是 ARIA menu —— 用 aria-expanded，不用 aria-haspopup。 -->
        <o-if :value="showMenu">
          <mc-popover
            class="doc-menu"
            placement="bottom-end"
            arrow="none"
            on:open="narrowMenuOpen = true"
            on:close="narrowMenuOpen = false"
          >
            <mc-button
              class="doc-menu-btn"
              inline
              aria-label="打开菜单"
              attr:aria-expanded="narrowMenuOpen ? 'true' : 'false'"
            >
              <mc-icon name="menu"></mc-icon>
            </mc-button>
            <div slot="panel" class="doc-menu-panel">
              <doc-nav></doc-nav>
            </div>
          </mc-popover>
        </o-if>
      </div>
    </header>

    <main class="doc-main">
      <slot></slot>
    </main>
  </div>
