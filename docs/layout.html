<template page>
  <!-- 文档站外壳（嵌套路由的布局页）：子页面用 export const parent 挂上来，正文走 <slot> -->
  <script>
    /* 外壳的脚本：页面模块也能静态 import（ofa 编译期会把相对说明符改写成绝对 URL，实测），
       所以导航数据、路由工具、路由状态都直接用站点共用模块，不再各抄一份。

       这里同时是**站点级行为**的归属地（原来在 docs/site.js，已并入）：
         · 换页复位：把 `.doc-main` 滚回顶部；
         · 滚轮接力：两栏滚到底后把滚轮转给正文带（两栏是 fixed，滚轮链终点是视口，视口不滚）。
       两者都是「外壳的事」——滚的是外壳的正文带，接管的是外壳进出的两个浮动栏。 */
    import { hashOf } from './routes.js';
    import { TOPBAR, locate } from './site-map.js';
    import { onRouteChange, routeState } from './state/route.js';

    const THEME_KEY = 'mosaic-doc-theme';
    const THEMES = ['auto', 'light', 'dark'];
    const THEME_LABELS = { auto: '自动', light: '亮色', dark: '暗色' };

    /** 行高兜底：deltaMode 为「行」时的像素换算（同 packages/code 的滚轮接力） */
    const WHEEL_LINE = 16;

    function wheelPixels(event) {
      if (event.deltaMode === 1) return event.deltaY * WHEEL_LINE;
      if (event.deltaMode === 2) return event.deltaY * window.innerHeight;
      return event.deltaY;
    }

    export default () => ({
      data: { themeLabel: '自动', links: [] },

      ready() {
        this.readTheme();

        /* 顶栏入口来自 docs/site-map.js 的 TOPBAR（加一个入口 = 那里加一行）。
           ⚠️ 链接一律用 hashOf() 生成、不走 olink：olink 是编译期指令，这份数据是运行时拼的 */
        this.links = TOPBAR.map((entry) => ({
          path: entry.path,
          label: entry.label,
          href: hashOf(entry.path),
          aria: null,
        }));
        this.syncTopNav();

        /* 侧栏滚到底后把滚轮接力给正文带。
           ⚠️ 不能用 event.target：跨了两层 shadow 之后它在 document 层被重定向成外层宿主
           （实测是 o-page），只能用 composedPath() 认 <doc-nav> / <doc-toc> */
        this._onWheel = (event) => this.forwardWheel(event);
        document.addEventListener('wheel', this._onWheel, { passive: false });

        /* 路由变化：只改 links[i].aria 这一个字段（o-fill 按 fill-key 复用节点，绝不重建 DOM，
           04 套件盯着这条），顺带把正文带滚回顶部 */
        this._unwatch = onRouteChange(() => {
          this.syncTopNav();
          this.resetScroll();
        });
      },

      detached() {
        this._unwatch?.();
        document.removeEventListener('wheel', this._onWheel);
      },

      proto: {
        /** 正文带：页面上唯一的滚动容器，住在外壳自己的 shadow root 里（不用穿透查） */
        mainScroller() {
          return this.ele.shadowRoot.querySelector('.doc-main');
        },

        resetScroll() {
          this.mainScroller()?.scrollTo({ top: 0 });
        },

        /** 只有「栏内还能滚」时才不插手；到了边界就把这一次滚轮转给正文带 */
        forwardWheel(event) {
          if (!event.deltaY || event.ctrlKey || event.metaKey) return;

          const host = event
            .composedPath()
            .find((node) => node instanceof Element && node.matches?.('doc-nav, doc-toc'));
          if (!host) return;

          const down = event.deltaY > 0;
          const atTop = host.scrollTop <= 0;
          const atBottom = host.scrollTop + host.clientHeight >= host.scrollHeight - 1;
          if ((down && !atBottom) || (!down && !atTop)) return;

          const scroller = this.mainScroller();
          if (!scroller) return;

          event.preventDefault(); // 拦掉「被吞掉的那一次」，改由我们转发
          scroller.scrollTop += wheelPixels(event);
        },

        /* 当前路由命中哪一支就点亮哪条入口。组件页靠「是「组件」的孩子」天然归属，
           不再需要那条 packages/<slug>/page.html 的兜底正则 */
        syncTopNav() {
          const entryPath = locate(routeState().path)?.entry?.path ?? null;
          for (const link of this.links) {
            const next = link.path === entryPath ? 'page' : null;
            if (link.aria !== next) link.aria = next;
          }
        },

        // 三态主题。首帧由 docs/theme-boot.js（head 里的同步经典脚本）应用
        readTheme() {
          let mode = 'auto';
          try {
            const v = localStorage.getItem(THEME_KEY);
            if (THEMES.includes(v)) mode = v;
          } catch {
            /* 隐私模式读不了，跟随系统 */
          }
          this._theme = mode;
          this.themeLabel = THEME_LABELS[mode];
        },

        cycleTheme() {
          const next = THEMES[(THEMES.indexOf(this._theme ?? 'auto') + 1) % THEMES.length];
          if (next === 'auto') delete document.documentElement.dataset.theme;
          else document.documentElement.dataset.theme = next;

          this._theme = next;
          this.themeLabel = THEME_LABELS[next];
          try {
            localStorage.setItem(THEME_KEY, next);
          } catch {
            /* 写不了就算了 */
          }
        },
      },
    });
  </script>

  <style>
    /* 外壳样式住在这里（布局页的 shadow root）；文档级 shell.css 只管视口与高度链 */

    /* <l-m> 是加载占位，不写这条它会作为 flex item 多占一个 gap（见 P13） */
    l-m {
      display: none;
    }

    :host {
      display: block;
      --doc-topbar: 3.5rem;
    }

    /* 顶栏是固定的一行（外壳锁一屏，正文带在它下面自己滚）。
       z-index 要比浮动侧栏高一档：侧栏是 fixed，而且是被 <slot> 投影进来的
       （在绘制顺序里靠后），同层会盖住顶栏 */
    .doc-top {
      position: relative;
      z-index: calc(var(--mc-z-sticky) + 1);
      display: flex;
      align-items: center;
      gap: var(--mc-space-5);
      height: var(--doc-topbar);
      padding-inline: var(--mc-space-5);
      border-bottom: 1px solid rgb(var(--mc-color-border));
      background-color: rgb(var(--mc-color-surface));
    }

    .doc-top-nav {
      display: flex;
      align-items: center;
      gap: var(--mc-space-1);
      min-width: 0;
      flex: 1 1 auto;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }

    .doc-top-nav::-webkit-scrollbar {
      display: none;
    }

    .doc-top-nav a {
      padding: var(--mc-space-1) var(--mc-space-3);
      border-radius: var(--mc-radius-md);
      color: rgb(var(--mc-color-fg-muted));
      text-decoration: none;
      font-size: var(--mc-text-sm);
      white-space: nowrap;
    }

    .doc-top-nav a:hover {
      background-color: rgb(var(--mc-color-surface-sunken));
      color: rgb(var(--mc-color-fg));
    }

    .doc-top-nav a[aria-current='page'] {
      background-color: rgb(var(--mc-color-primary-subtle));
      color: rgb(var(--mc-color-primary));
      font-weight: var(--mc-weight-medium);
    }

    .doc-brand {
      font-weight: var(--mc-weight-semibold);
      font-size: var(--mc-text-lg);
      letter-spacing: -0.01em;
      color: rgb(var(--mc-color-fg));
      text-decoration: none;
    }

    .doc-theme {
      margin-left: auto;
      flex: none;
      height: var(--mc-control-h-sm);
      padding-inline: var(--mc-space-3);
      border: 1px solid rgb(var(--mc-color-border-strong));
      border-radius: var(--mc-radius-full);
      background-color: transparent;
      color: rgb(var(--mc-color-fg-muted));
      font-size: var(--mc-text-xs);
      cursor: pointer;
    }

    .doc-theme:hover {
      background-color: rgb(var(--mc-color-surface-sunken));
      color: rgb(var(--mc-color-fg));
    }

    /* 外壳 = 一屏高的纵向 flex：顶栏定高（flex: none），正文带吃掉剩下的（flex: 1 + min-height: 0）。
       不需要把高度一层层从 body 传下来 —— 这一层自己声明 height: 100vh。
       正文带因此正好从顶栏下面开始：它的滚动条不会像窗口滚动条那样伸进头部里去。 */
    .doc-shell {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 正文带：**唯一的滚动容器**。全宽 → 滚动条贴窗口右缘；
       左右两栏是 position: fixed（见 docs/content.css 的分栏注释），不占这里的布局。 */
    .doc-main {
      flex: 1;
      min-height: 0; /* 不写这一条，flex 子项会被内容撑高、滚不起来 */
      display: block;
      width: 100%;
      min-width: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* 子页面只负责铺满宽度；正文多宽由页面自己决定（组件页还要先给浮动侧栏留出位置，
       见 docs/content.css 的分栏注释 —— 宽度不设上限，只留下限）。
       ::slotted 的实参只能是复合选择器，所以不能写成 .doc-main ::slotted(o-page) */
    ::slotted(o-page) {
      display: block;
      width: 100%;
    }
  </style>

  <!-- 站点级组件：外壳只注册一次，页面不用自己写 <l-m>；mc-collapse 就是演示区的「查看代码」抽屉 -->
  <l-m src="../packages/code/code.html"></l-m>
  <l-m src="../packages/collapse/collapse.html"></l-m>
  <l-m src="../packages/collapse/collapse-item.html"></l-m>
  <!-- 文档站自己的组件都在 docs/components/ 下，文件名带 doc- 前缀就是标签名（nav.html → doc-nav）。
       三栏里的两块：左栏二级菜单（<doc-nav>）与右栏本页目录（<doc-toc>）都用 mc-menu 渲染 -->
  <l-m src="./components/nav.html"></l-m>
  <l-m src="./components/toc.html"></l-m>
  <l-m src="../packages/menu/menu.html"></l-m>
  <l-m src="../packages/menu/menu-item.html"></l-m>
  <!-- 组件页头部的面包屑 / 页尾的翻页：都从导航数据派生、订阅 docs/state/route.js；
       页面里只写 <doc-crumb> / <doc-pager> -->
  <l-m src="../packages/breadcrumb/breadcrumb.html"></l-m>
  <l-m src="../packages/breadcrumb/breadcrumb-item.html"></l-m>
  <l-m src="./components/crumb.html"></l-m>
  <l-m src="./components/pager.html"></l-m>
  <!-- 两个「页面占位」也是组件（原来在 layout 的脚本里手搓 DOM）：组件总览的卡片墙、设计令牌的色板 -->
  <l-m src="./components/cards.html"></l-m>
  <l-m src="./components/palette.html"></l-m>

  <!-- 一屏高的外壳容器：顶栏 + 正文带（flex 纵向，正文带吃掉剩下的高度并自己滚） -->
  <div class="doc-shell">
    <header class="doc-top">
      <a class="doc-brand" href="./pages/home.html" olink>Mosaic</a>

      <!-- 一级菜单就是页面本身（入口来自 TOPBAR，由 ready() 拼成 data.links 后交给模板）；
           二级菜单不在这里，哪个页面需要就自己放 <doc-nav> -->
      <nav class="doc-top-nav">
        <o-fill :value="links" fill-key="path">
          <a attr:href="$data.href" attr:aria-current="$data.aria">{{$data.label}}</a>
        </o-fill>
      </nav>

      <button class="doc-theme" type="button" on:click="cycleTheme" aria-label="切换深浅色">
        <span>{{themeLabel}}</span>
      </button>
    </header>

    <main class="doc-main">
      <slot></slot>
    </main>
  </div>
</template>
