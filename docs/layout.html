<template page>
  <!-- 文档站外壳（嵌套路由的布局页）：子页面用 export const parent 挂上来，正文走 <slot> -->
  <script>
    const THEME_KEY = 'mosaic-doc-theme';
    const THEMES = ['auto', 'light', 'dark'];
    const THEME_LABELS = { auto: '自动', light: '亮色', dark: '暗色' };

    const setCurrent = (a, on) => {
      if (!a) return;
      if (on && !a.hasAttribute('aria-current')) a.setAttribute('aria-current', 'page');
      else if (!on && a.hasAttribute('aria-current')) a.removeAttribute('aria-current');
    };

    /*
     * 取「相对仓库根」的路由路径：hash 形式、文件形式都吃，并去掉部署前缀。
     *
     * ⚠️ ofa 的 hash 是按**相对域名根**解析的：开发时是 `#/docs/pages/home.html`，
     * GitHub Pages 项目页是 `#/mosaic/docs/pages/home.html`；而页面 `src` 给的是
     * pathname（`/mosaic/docs/pages/home.html`）。两边不归一成同一个坐标系，顶栏
     * 高亮在子路径部署下就永远匹配不上（线上实测：打开首页空高亮、设计令牌页亮成
     * 「组件」）。页面模块不能 import，这份逻辑与 docs/routes.js 的 toRepoPath 相同，
     * 只是各写一份。
     */
    const SITE_ROOT = new URL('.', document.baseURI).pathname; // '/' 或 '/mosaic/'
    const pathOf = (url) => {
      const u = new URL(url, location.href);
      const raw = decodeURIComponent(u.hash || u.pathname)
        .replace(/^#\/?/, '')
        .replace(/^\//, '');
      const prefix = SITE_ROOT.replace(/^\/|\/$/g, '');
      return prefix && (raw === prefix || raw.startsWith(`${prefix}/`))
        ? raw.slice(prefix.length).replace(/^\//, '')
        : raw;
    };

    export default () => ({
      data: { themeLabel: '自动' },

      ready() {
        this.readTheme();
        this.syncTopNav();

        // 冷启动带 hash 时子页面可能晚一拍挂上，补几拍（自限）
        let tries = 0;
        const settle = () => {
          this.syncTopNav();
          if (++tries < 20 && !this.ele.querySelector('o-page')) setTimeout(settle, 50);
        };
        settle();
      },

      // 布局页切页时不重建，顶栏高亮只能靠这个钩子（olink 不触发 hashchange，见 P28）
      routerChange() {
        this.syncTopNav();
      },

      proto: {
        currentPath() {
          const child = [...this.ele.querySelectorAll('o-page')].at(-1);
          const src = child?.getAttribute('src') || this.app?.current?.src || '';
          return src ? pathOf(new URL(src, location.href).href) : '';
        },

        // 先精确匹配五个入口；都不中时 packages/<slug>/page.html 一律算「组件」
        syncTopNav() {
          const current = this.currentPath();
          const links = [...this.ele.shadowRoot.querySelectorAll('.doc-top-nav a')];
          const base = this.ele.getAttribute('src') || location.href;

          let matched = false;
          for (const a of links) {
            const on = current !== '' && pathOf(new URL(a.getAttribute('href'), base).href) === current;
            if (on) matched = true;
            setCurrent(a, on);
          }

          if (!matched) {
            setCurrent(
              links.find((a) => a.dataset.section === 'components'),
              /(^|\/)packages\/[^/]+\/page\.html$/.test(current),
            );
          }
        },

        // 三态主题。首帧由 docs/theme-boot.js（head 里的同步经典脚本）应用
        readTheme() {
          let mode = 'auto';
          try {
            const v = localStorage.getItem(THEME_KEY);
            if (THEMES.includes(v)) mode = v;
          } catch {
            /* 隐私模式读不了，跟随系统 */
          }
          this._theme = mode;
          this.themeLabel = THEME_LABELS[mode];
        },

        cycleTheme() {
          const next = THEMES[(THEMES.indexOf(this._theme ?? 'auto') + 1) % THEMES.length];
          if (next === 'auto') delete document.documentElement.dataset.theme;
          else document.documentElement.dataset.theme = next;

          this._theme = next;
          this.themeLabel = THEME_LABELS[next];
          try {
            localStorage.setItem(THEME_KEY, next);
          } catch {
            /* 写不了就算了 */
          }
        },
      },
    });
  </script>

  <style>
    /* 外壳样式住在这里（布局页的 shadow root）；文档级 shell.css 只管视口与高度链 */

    /* <l-m> 是加载占位，不写这条它会作为 flex item 多占一个 gap（见 P13） */
    l-m {
      display: none;
    }

    :host {
      display: flex;
      flex-direction: column;
      min-height: 0;
      --doc-topbar: 3.5rem;
    }

    .doc-top {
      position: relative;
      z-index: var(--mc-z-sticky);
      flex: none;
      display: flex;
      align-items: center;
      gap: var(--mc-space-5);
      height: var(--doc-topbar);
      padding-inline: var(--mc-space-5);
      border-bottom: 1px solid rgb(var(--mc-color-border));
      background-color: rgb(var(--mc-color-surface));
    }

    /* 窄屏放不下时自己横滚，不把顶栏撑破 */
    .doc-top-nav {
      display: flex;
      align-items: center;
      gap: var(--mc-space-1);
      min-width: 0;

      scrollbar-width: none;
    }

    .doc-top-nav::-webkit-scrollbar {
      display: none;
    }

    .doc-top-nav a {
      padding: var(--mc-space-1) var(--mc-space-3);
      border-radius: var(--mc-radius-md);
      color: rgb(var(--mc-color-fg-muted));
      text-decoration: none;
      font-size: var(--mc-text-sm);
      white-space: nowrap;
    }

    .doc-top-nav a:hover {
      background-color: rgb(var(--mc-color-surface-sunken));

    }

    .doc-top-nav a[aria-current='page'] {

      color: rgb(var(--mc-color-primary));
      font-weight: var(--mc-weight-medium);
    }

    .doc-brand {
      font-weight: var(--mc-weight-semibold);
      font-size: var(--mc-text-lg);
      letter-spacing: -0.01em;
      color: rgb(var(--mc-color-fg));

    }

    .doc-theme {
      margin-left: auto;

      border: 1px solid rgb(var(--mc-color-border-strong));
      border-radius: var(--mc-radius-full);
      background-color: transparent;
      color: rgb(var(--mc-color-fg-muted));
      font-size: var(--mc-text-xs);
      cursor: pointer;
    }

    .doc-theme:hover {
      background-color: rgb(var(--mc-color-surface-sunken));
      color: rgb(var(--mc-color-fg));
    }

    /* 正文带：子页面的滚动容器（带二级菜单的页面在这里正好一屏，滚动落在页面内部） */
    .doc-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow-y: auto;
      overscroll-behavior: contain;

      /* width 不能省：flex 交叉轴上的 auto margin 会让它缩成内容宽 */
      width: 100%;
      max-width: 82rem;
      margin-inline: auto;
    }
  </style>

  <!-- 站点级组件：外壳只注册一次，页面自己不用写 <l-m>。
       · mc-code     文档页里的代码块（组件文档见 packages/code/page.html）
       · mc-collapse 演示区的「查看代码」抽屉就是它（作者写在页面里，见 content.css） -->
  <l-m src="../packages/code/code.html"></l-m>
  <l-m src="../packages/collapse/collapse.html"></l-m>
  <l-m src="../packages/collapse/collapse-item.html"></l-m>

  <header class="doc-top">
    <a class="doc-brand" href="./pages/home.html" olink>Mosaic</a>

    <!-- 一级菜单就是页面本身；二级菜单不在这里，哪个页面需要就自己放 <doc-nav> -->
    <nav class="doc-top-nav">
      <a href="./pages/home.html" olink>首页</a>
      <a href="./pages/guide.html" olink>快速开始</a>
      <a href="../packages/color/page.html" olink>设计令牌</a>
      <a href="./pages/specs.html" olink>规范</a>
      <a href="./pages/components.html" olink data-section="components">组件</a>
    </nav>

    <button class="doc-theme" type="button" on:click="cycleTheme" aria-label="切换深浅色">
      <span>{{themeLabel}}</span>
    </button>
  </header>

  <main class="doc-main">
    <slot></slot>
  </main>
</template>
