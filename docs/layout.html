<template page>
  <script>
    import { goto, route } from './routes.js';
    import { TOPBAR, firstPageOf } from './site-map.js';
    import { onRouteChange, routeState } from './state/route.js';

    const THEME_KEY = 'mosaic-doc-theme';
    const THEMES = ['auto', 'light', 'dark'];

    const SITE_TITLE = document.title;

    const COMPONENT_SECTION = '组件';

    const storedTheme = () => {
      try {
        const v = localStorage.getItem(THEME_KEY);
        if (THEMES.includes(v)) return v;
      } catch {}
      return 'auto';
    };

    const THEME_LABELS = { auto: '自动', light: '亮色', dark: '暗色' };

    const initialTheme = () => {
      const theme = storedTheme();
      return { theme, themeLabel: THEME_LABELS[theme] };
    };

    const WHEEL_LINE = 16;

    function wheelPixels(event) {
      if (event.deltaMode === 1) return event.deltaY * WHEEL_LINE;
      if (event.deltaMode === 2) return event.deltaY * window.innerHeight;
      return event.deltaY;
    }

    export default () => ({
      data: {
        ...initialTheme(),
        menuOpen: false,
        narrowMenuOpen: false,
        narrow: false,
        showMenu: false,
        links: [],
      },

      ready() {
        this.links = TOPBAR.map((entry) => {
          const landing = entry.href ?? firstPageOf(entry)?.href ?? null;
          return landing ? { path: landing, label: entry.label, current: null } : null;
        }).filter(Boolean);
        this._mq = window.matchMedia('(max-width: 52rem)');
        this.narrow = this._mq.matches;
        this._onMQ = (event) => {
          this.narrow = event.matches;
          this.syncShowMenu();
        };
        this._mq.addEventListener('change', this._onMQ);

        this._sysMQ = window.matchMedia('(prefers-color-scheme: dark)');
        this._onSysMQ = () => {
          if (this.theme === 'auto') this.applyTheme('auto');
        };
        this._sysMQ.addEventListener('change', this._onSysMQ);

        this.syncTopNav();
        this.syncShowMenu();

        this._onWheel = (event) => this.forwardWheel(event);
        document.addEventListener('wheel', this._onWheel, { passive: false });

        this._topNav = this.shadow.$('.doc-top-nav');
        this._onTopNavClick = (event) => {
          const path = event.target?.closest?.('mc-button')?.dataset?.path;
          if (path) this.openEntry(path);
        };
        this._topNav?.on('click', this._onTopNavClick);

        this._unwatch = onRouteChange((next) => {
          this.syncTopNav(next);
          this.syncTitle(next);
          this.hideNarrowMenu();
          this.resetScroll();
        });

        this.syncTitle();
      },

      detached() {
        this._unwatch?.();
        document.removeEventListener('wheel', this._onWheel);
        this._topNav?.off('click', this._onTopNavClick);
        this._mq?.removeEventListener('change', this._onMQ);
        this._sysMQ?.removeEventListener('change', this._onSysMQ);
      },

      proto: {
        openEntry(path) {
          if (route() === path) return;
          goto(path);
        },

        mainScroller() {
          return this.shadow.$('.doc-main')?.ele ?? null;
        },

        resetScroll() {
          this.mainScroller()?.scrollTo({ top: 0 });
        },

        scrollViewportOf(host) {
          return $(host)?.shadow?.$('mc-scroll-bar')?.shadow?.$('[part="viewport"]')?.ele ?? null;
        },

        forwardWheel(event) {
          if (!event.deltaY || event.ctrlKey || event.metaKey) return;

          const host = event
            .composedPath()
            .find((node) => node instanceof Element && node.matches?.('doc-nav, doc-toc'));
          if (!host) return;

          const viewport = this.scrollViewportOf(host);
          if (!viewport) return;

          const down = event.deltaY > 0;
          const atTop = viewport.scrollTop <= 0;
          const atBottom = viewport.scrollTop + viewport.clientHeight >= viewport.scrollHeight - 1;
          if ((down && !atBottom) || (!down && !atTop)) return;

          const scroller = this.mainScroller();
          if (!scroller) return;

          event.preventDefault(); // 拦掉「被吞掉的那一次」，改由我们转发
          scroller.scrollTop += wheelPixels(event);
        },

        syncTopNav(state = routeState()) {
          const entryLabel = state.entry?.label ?? null;
          for (const link of this.links) {
            const next = link.label === entryLabel ? 'page' : null;
            if (link.current !== next) link.current = next;
          }
        },

        syncTitle(state = routeState()) {
          const name = state.node?.label?.replace('（', ' ').replace('）', '') ?? null;
          const inComponents = state.entry?.label === COMPONENT_SECTION;
          const next = inComponents && name ? name + ' - Mosaic' : SITE_TITLE;
          if (document.title !== next) document.title = next;
        },

        syncShowMenu() {
          this.showMenu = this.narrow;
        },

        hideNarrowMenu() {
          this.shadow.$('.doc-menu')?.hide?.();
        },

        pickTheme(event) {
          event.preventDefault();
          const mode = event.detail?.key;
          this.applyTheme(THEMES.includes(mode) ? mode : 'auto');
          try {
            localStorage.setItem(THEME_KEY, this.theme);
          } catch {}
          const menu = this.shadow.$('mc-dropdown')?.ele;
          if (menu) menu.open = false;
        },

        applyTheme(mode) {
          document.documentElement.dataset.theme =
            mode === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;

          this.theme = mode;
          this.themeLabel = THEME_LABELS[mode];
        },
      },
    });
  </script>
