<template page>
  <!-- 文档站外壳（嵌套路由的布局页）：子页面用 export const parent 挂上来，正文走 <slot> -->
  <script>
    /* 页面模块也能静态 import：ofa 编译期会把相对说明符改写成绝对 URL（实测），
       所以导航数据、路由工具、aria-current 都直接用站点共用模块，不再各抄一份 */
    import { hashOf, repoPathOf } from './routes.js';
    import { el, setCurrent } from './dom.js';
    import { NAV, locate } from './site-map.js';

    const THEME_KEY = 'mosaic-doc-theme';
    const THEMES = ['auto', 'light', 'dark'];
    const THEME_LABELS = { auto: '自动', light: '亮色', dark: '暗色' };

    export default () => ({
      data: { themeLabel: '自动' },

      ready() {
        this.readTheme();
        this.renderTopNav();
        this.syncTopNav();

        // 冷启动带 hash 时子页面可能晚一拍挂上，补几拍（自限）
        let tries = 0;
        const settle = () => {
          this.syncTopNav();
          if (++tries < 20 && !this.ele.querySelector('o-page')) setTimeout(settle, 50);
        };
        settle();
      },

      // 布局页切页时不重建，顶栏高亮只能靠这个钩子（olink 不触发 hashchange，见 P28）
      routerChange() {
        this.syncTopNav();
      },

      proto: {
        currentPath() {
          const child = [...this.ele.querySelectorAll('o-page')].at(-1);
          const src = child?.getAttribute('src') || this.app?.current?.src || '';
          return src ? repoPathOf(src) : '';
        },

        /* 顶栏入口来自 docs/nav.js（加一个入口 = 那里加一行）。
           ⚠️ 链接用 hashOf() 生成，不用 olink：olink 是编译期指令，运行时造的 <a olink> 不会被处理 */
        renderTopNav() {
          const links = NAV.map((entry) =>
            el('a', { href: hashOf(entry.to), textContent: entry.label }),
          );
          this.ele.shadowRoot.querySelector('.doc-top-nav').replaceChildren(...links);
        },

        /* 当前路由命中哪一支就点亮哪条入口。组件页靠「是「组件」的孩子」天然归属，
           不再需要那条 packages/<slug>/page.html 的兜底正则 */
        syncTopNav() {
          const current = this.currentPath();
          const entry = current ? (locate(current)?.entry ?? null) : null;
          const links = [...this.ele.shadowRoot.querySelectorAll('.doc-top-nav a')];

          links.forEach((a, i) => setCurrent(a, entry === NAV[i]));
        },

        // 三态主题。首帧由 docs/theme-boot.js（head 里的同步经典脚本）应用
        readTheme() {
          let mode = 'auto';
          try {
            const v = localStorage.getItem(THEME_KEY);
            if (THEMES.includes(v)) mode = v;
          } catch {
            /* 隐私模式读不了，跟随系统 */
          }
          this._theme = mode;
          this.themeLabel = THEME_LABELS[mode];
        },

        cycleTheme() {
          const next = THEMES[(THEMES.indexOf(this._theme ?? 'auto') + 1) % THEMES.length];
          if (next === 'auto') delete document.documentElement.dataset.theme;
          else document.documentElement.dataset.theme = next;

          this._theme = next;
          this.themeLabel = THEME_LABELS[next];
          try {
            localStorage.setItem(THEME_KEY, next);
          } catch {
            /* 写不了就算了 */
          }
        },
      },
    });
  </script>

  <style>
    /* 外壳样式住在这里（布局页的 shadow root）；文档级 shell.css 只管视口与高度链 */

    /* <l-m> 是加载占位，不写这条它会作为 flex item 多占一个 gap（见 P13） */
    l-m {
      display: none;
    }

    :host {
      display: flex;
      flex-direction: column;
      min-height: 0;
      --doc-topbar: 3.5rem;
    }

    .doc-top {
      position: relative;
      z-index: var(--mc-z-sticky);
      flex: none;
      display: flex;
      align-items: center;
      gap: var(--mc-space-5);
      height: var(--doc-topbar);
      padding-inline: var(--mc-space-5);
      border-bottom: 1px solid rgb(var(--mc-color-border));
      background-color: rgb(var(--mc-color-surface));
    }

    .doc-top-nav {
      display: flex;
      align-items: center;
      gap: var(--mc-space-1);
      min-width: 0;
      flex: 1 1 auto;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }

    .doc-top-nav::-webkit-scrollbar {
      display: none;
    }

    .doc-top-nav a {
      padding: var(--mc-space-1) var(--mc-space-3);
      border-radius: var(--mc-radius-md);
      color: rgb(var(--mc-color-fg-muted));
      text-decoration: none;
      font-size: var(--mc-text-sm);
      white-space: nowrap;
    }

    .doc-top-nav a:hover {
      background-color: rgb(var(--mc-color-surface-sunken));
      color: rgb(var(--mc-color-fg));
    }

    .doc-top-nav a[aria-current='page'] {
      background-color: rgb(var(--mc-color-primary-subtle));
      color: rgb(var(--mc-color-primary));
      font-weight: var(--mc-weight-medium);
    }

    .doc-brand {
      font-weight: var(--mc-weight-semibold);
      font-size: var(--mc-text-lg);
      letter-spacing: -0.01em;
      color: rgb(var(--mc-color-fg));
      text-decoration: none;
    }

    .doc-theme {
      margin-left: auto;
      flex: none;
      height: var(--mc-control-h-sm);
      padding-inline: var(--mc-space-3);
      border: 1px solid rgb(var(--mc-color-border-strong));
      border-radius: var(--mc-radius-full);
      background-color: transparent;
      color: rgb(var(--mc-color-fg-muted));
      font-size: var(--mc-text-xs);
      cursor: pointer;
    }

    .doc-theme:hover {
      background-color: rgb(var(--mc-color-surface-sunken));
      color: rgb(var(--mc-color-fg));
    }

    /* 正文带：整页唯一的滚动容器（页面自己的左右栏都 sticky 在它里面）。
       ⚠️ 这里是**全宽**的：滚动条因此贴窗口右缘；82rem 的内容带移到下面 slotted 的子页面上 ——
       把 max-width 留在容器上会让滚动条跟着内缩，那正是之前「滚动条在中间」的来源。 */
    .doc-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      width: 100%;
    }

    /* 内容带：只约束子页面，不约束承载它的滚动容器。
       ::slotted 的实参只能是复合选择器，所以不能写成 .doc-main ::slotted(o-page) */
    ::slotted(o-page) {
      width: 100%;
      max-width: 82rem;
      margin-inline: auto;
    }
  </style>

  <!-- 站点级组件：外壳只注册一次，页面不用自己写 <l-m>；mc-collapse 就是演示区的「查看代码」抽屉 -->
  <l-m src="../packages/code/code.html"></l-m>
  <l-m src="../packages/collapse/collapse.html"></l-m>
  <l-m src="../packages/collapse/collapse-item.html"></l-m>
  <!-- 左栏二级菜单（<doc-nav>）与右栏本页目录（<doc-toc>）都用 mc-menu 渲染 -->
  <l-m src="../packages/menu/menu.html"></l-m>
  <l-m src="../packages/menu/menu-item.html"></l-m>

  <header class="doc-top">
    <a class="doc-brand" href="./pages/home.html" olink>Mosaic</a>

    <!-- 一级菜单就是页面本身；二级菜单不在这里，哪个页面需要就自己放 <doc-nav> -->
    <!-- 入口来自 docs/nav.js，由 renderTopNav() 渲染（加一个入口 = NAV 加一行） -->
    <nav class="doc-top-nav"></nav>

    <button class="doc-theme" type="button" on:click="cycleTheme" aria-label="切换深浅色">
      <span>{{themeLabel}}</span>
    </button>
  </header>

  <main class="doc-main">
    <slot></slot>
  </main>
</template>
