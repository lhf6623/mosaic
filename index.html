<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Mosaic — 基于 ofa.js 的免构建 UI 框架</title>
    <meta
      name="description"
      content="基于 ofa.js 的免安装、免构建 Web Components UI 框架。手写工具类子集 + 三层 CSS 变量令牌。" />

    <!-- 首帧主题（head 里的同步脚本，防闪色） -->
    <script src="./docs/theme-boot.js"></script>

    <link rel="stylesheet" href="./packages/boot/mosaic.css" />
    <!-- 站点自带字体：只覆盖文档站的 --mc-font-sans / --mc-font-mono，
         框架默认（token-defaults.css）保持 system-ui —— 使用者引组件不该多出一次网络请求 -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./docs/fonts/archivo-var-latin.woff2"
      crossorigin />
    <link rel="stylesheet" href="./docs/fonts/fonts.css" />
    <link rel="stylesheet" href="./docs/shell.css" />

    <!-- ofa.js 必须排在站点样式注入器之前：模块按文档顺序执行 -->
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.5/dist/ofa.min.mjs"
      type="module"></script>
    <script src="./docs/adopt-styles.js" type="module"></script>
  </head>

  <body>
    <!-- 只做引入：路由库 + 应用挂载点；外壳（顶栏 / 正文带）在布局页 docs/layout.html -->
    <l-m src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.5/libs/router/dist/router.min.mjs"></l-m>
    <o-router>
      <o-app src="./app-config.js"></o-app>
    </o-router>
  </body>
</html>
