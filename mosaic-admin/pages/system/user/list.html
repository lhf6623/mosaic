<!-- page: {"label":"用户列表","group":"系统","order":20} -->
<template page>
  <link rel="stylesheet" href="../../../styles/page.css" />
  <l-m src="../../../components/erp-page.html"></l-m>
  <l-m src="../../../components/user-detail-drawer.html"></l-m>

  <style>
    l-m {
      display: none;
    }
  </style>

  <erp-page
    id="page"
    :schema="schema"
    :loader="loader"
    on:cell-action="onCellAction($event)"></erp-page>

  <user-detail-drawer id="detail"></user-detail-drawer>

  <script>
    import { getUserPage } from '../../../shared/api/user.js';
    import { getDict, dictMap } from '../../../shared/api/dicts.js';
    import { userPageSchema } from '../../../shared/modules/system/user/schema.js';
    import { userGridRows } from '../../../shared/modules/system/user/cell.js';
    import { userQuery } from '../../../shared/modules/system/user/logic.js';

    let sexMapPromise;
    const sexMap = () => (sexMapPromise ??= getDict('sex').then(dictMap));

    export default async () => ({
      data: { schema: userPageSchema },

      proto: {
        async loader({ current, pageSize, search }) {
          const data = await getUserPage(userQuery(search, current, pageSize));
          return {
            rows: userGridRows(data?.records ?? [], await sexMap()),
            total: Number(data?.total ?? 0),
            current: Number(data?.current ?? current),
            pageSize: Number(data?.size ?? pageSize),
          };
        },

        onCellAction(event) {
          if (event.detail.action === 'detail') this.shadow.$('#detail').ele.show(event.detail.row);
        },
      },
    });
  </script>
</template>
