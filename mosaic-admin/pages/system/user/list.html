<!-- page: {"label":"用户列表","group":"系统","order":20} -->
<template page>
  <link rel="stylesheet" href="../../../styles/page.css" />
  <l-m src="../../../components/erp-page.html"></l-m>
  <l-m src="../../../components/user-detail-drawer.html"></l-m>

  <style>
    l-m {
      display: none;
    }
  </style>

  <erp-page
    id="page"
    on:search="onSearch($event)"
    on:page-change="onPageChange($event)"
    on:cell-click="onCellClick($event)"></erp-page>

  <user-detail-drawer id="detail"></user-detail-drawer>

  <script>
    import { PAGE_SIZE } from '../../../config.js';
    import { getUserPage } from '../../../shared/api/user.js';
    import { getDict, dictMap } from '../../../shared/api/dicts.js';
    import { userPageSchema } from '../../../shared/modules/system/user/schema.js';
    import { userGridRows } from '../../../shared/modules/system/user/cell.js';
    import { userQuery } from '../../../shared/modules/system/user/logic.js';

    export default async () => ({
      data: {},

      ready() {
        this.init();
      },

      proto: {
        async init() {
          await customElements.whenDefined('erp-page');
          await customElements.whenDefined('user-detail-drawer');
          await new Promise((resolve) => requestAnimationFrame(resolve));
          this._page = this.shadow.$('#page').ele;
          this._page.schema = userPageSchema;
          this._search = {};
          this._sexMap = dictMap(await getDict('sex'));
          await this.load(1);
        },

        async load(page) {
          this._page.setLoading(true);
          this._page.setError('');
          try {
            const data = await getUserPage(userQuery(this._search, page, PAGE_SIZE));
            const rows = data?.records ?? [];
            this._page.setRows(userGridRows(rows, this._sexMap));
            this._page.setPage({
              current: Number(data?.current ?? page),
              pageSize: Number(data?.size ?? PAGE_SIZE),
              total: Number(data?.total ?? rows.length),
            });
            this._page.footer = '共 ' + Number(data?.total ?? rows.length) + ' 条';
          } catch (error) {
            this._page.setRows([]);
            this._page.setError('加载失败：' + error.message);
          } finally {
            this._page.setLoading(false);
          }
        },

        onSearch(event) {
          this._search = event.data.values;
          this.load(1);
        },

        onPageChange(event) {
          this.load(event.data.current);
        },

        onCellClick(event) {
          this.shadow.$('#detail').ele.show(event.detail.row);
        },
      },
    });
  </script>
</template>
