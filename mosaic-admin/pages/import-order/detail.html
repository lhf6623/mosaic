<!-- page: {"label":"委托单详情","group":"委托","order":30,"hidden":true} -->
<template page>
  <link rel="stylesheet" href="../../styles/page.css" />
  <l-m src="../../components/order-detail.html"></l-m>

  <style>
    l-m {
      display: none;
    }
  </style>

  <order-detail id="detail"></order-detail>

  <script>
    export default async () => ({
      data: {},

      ready() {
        this.init();
        window.addEventListener('hashchange', () => this.resync());
      },

      proto: {
        orderId() {
          return new URLSearchParams(location.hash.split('?')[1] ?? '').get('id') ?? '';
        },

        async init() {
          await customElements.whenDefined('order-detail');
          this._id = this.orderId();
          if (this._id) this.shadow.$('#detail').ele.load(this._id);
        },

        resync() {
          const id = this.orderId();
          if (id && id !== this._id) {
            this._id = id;
            this.init();
          }
        },
      },
    });
  </script>
</template>
