<!-- erp 编辑抽屉 · 表单第 1 节（基本信息）：mc-form + 校验 + 真接口保存（/api/orderImport/update）。 -->
<template component>
  <link rel="stylesheet" href="../styles/page.css" />
  <l-m src="../vendor/mosaic/drawer/drawer.html"></l-m>
  <l-m src="../vendor/mosaic/form/form.html"></l-m>
  <l-m src="../vendor/mosaic/form/form-item.html"></l-m>
  <l-m src="../vendor/mosaic/input/input.html"></l-m>
  <l-m src="../vendor/mosaic/button/button.html"></l-m>

  <style>
    l-m {
      display: none;
    }

    .head-title {
      font-size: var(--mc-text-lg);
      font-weight: var(--mc-weight-semibold);
    }

    .head-sub {
      margin-inline-start: var(--mc-space-2);
      color: rgb(var(--mc-color-fg-subtle));
      font-size: var(--mc-text-sm);
    }

    mc-form {
      display: block;
    }

    .status {
      margin-block-start: var(--mc-space-3);
      font-size: var(--mc-text-sm);
    }

    .status[data-error] {
      color: rgb(var(--mc-color-danger));
    }

    .status[data-ok] {
      color: rgb(var(--mc-color-success, 22 163 74));
    }
  </style>

  <mc-drawer
    id="drawer"
    size="lg"
    closable
    mask-closable
    attr:open="open ? '' : null"
    on:close="open = false">
    <span slot="header" class="head">
      <span class="head-title">编辑委托单 · 基本信息</span>
      <span class="head-sub" attr:data-visible="headingSub ? '' : null">{{headingSub}}</span>
    </span>

    <p class="status" attr:data-error="statusError ? '' : null" attr:data-ok="statusOk ? '' : null">
      {{status}}
    </p>

    <mc-form id="form" on:submit="onSubmit($event)" on:invalid="onInvalid($event)">
      <mc-form-item label="客户名称" name="customerName">
        <mc-input id="f-customerName" readonly></mc-input>
      </mc-form-item>
      <mc-form-item label="委托单号" name="entrustNo">
        <mc-input id="f-entrustNo" placeholder="EDI + 8 位数字"></mc-input>
      </mc-form-item>
      <mc-form-item label="订单编号" name="orderNo">
        <mc-input id="f-orderNo" placeholder="订单编号"></mc-input>
      </mc-form-item>
      <mc-form-item label="订单日期" name="orderDate">
        <mc-input id="f-orderDate" type="date"></mc-input>
      </mc-form-item>
      <mc-form-item label="服务协议号" name="cusContractNo">
        <mc-input id="f-cusContractNo"></mc-input>
      </mc-form-item>
      <mc-form-item label="客户合同号" name="customerContractNo">
        <mc-input id="f-customerContractNo"></mc-input>
      </mc-form-item>
      <mc-form-item label="供应商名称" name="supplierName">
        <mc-input id="f-supplierName"></mc-input>
      </mc-form-item>
      <mc-form-item label="业务名称" name="saleManName">
        <mc-input id="f-saleManName"></mc-input>
      </mc-form-item>
      <mc-form-item label="报关币别" name="currencyName">
        <mc-input id="f-currencyName" readonly></mc-input>
      </mc-form-item>
      <mc-form-item label="报关总价" name="totalMoney">
        <mc-input id="f-totalMoney" type="number" placeholder="大于 0 的数字"></mc-input>
      </mc-form-item>
    </mc-form>

    <mc-button slot="footer" variant="outline" on:click="open = false">取消</mc-button>
    <mc-button slot="footer" attr:disabled="saving ? '' : null" on:click="submit()">
      {{saveLabel}}
    </mc-button>
  </mc-drawer>

  <script>
    import {
      getOrderImportDetail,
      getOrderImportDetailPage,
      updateOrderImport,
    } from '../shared/api/order-import.js';

    const FIELD_IDS = [
      'customerName',
      'entrustNo',
      'orderNo',
      'orderDate',
      'cusContractNo',
      'customerContractNo',
      'supplierName',
      'saleManName',
      'currencyName',
      'totalMoney',
    ];

    export default async () => ({
      tag: 'order-form-drawer',

      data: {
        open: false,
        headingSub: '',
        status: '',
        statusError: false,
        statusOk: false,
        saving: false,
        saveLabel: '保存',
      },

      ready() {
        this._detail = null;
        this._lines = [];
        Object.defineProperty(this.ele, 'show', {
          configurable: true,
          value: (orderId) => this.openForm(orderId),
        });
        customElements.whenDefined('mc-form').then(() => this.applyRules());
      },

      proto: {
        form() {
          return this.shadow.$('#form')?.ele;
        },

        field(name) {
          return this.shadow.$('#f-' + name)?.ele;
        },

        /** 校验规则：必填走声明式，格式 / 范围走 validator（property 通道才能带函数） */
        applyRules() {
          const form = this.form();
          if (!form) return;
          form.rules = {
            entrustNo: [
              { required: true, message: '委托单号必填', trigger: ['blur', 'input'] },
              {
                trigger: ['blur', 'input'],
                validator: (_rule, value) =>
                  /^EDI\d{8}$/.test(String(value ?? '').trim())
                    ? ''
                    : '委托单号应以 EDI 开头 + 8 位数字',
              },
            ],
            orderNo: [{ required: true, message: '订单编号必填' }],
            orderDate: [{ required: true, message: '订单日期必填' }],
            totalMoney: [
              { required: true, message: '报关总价必填' },
              {
                validator: (_rule, value) =>
                  Number(value) > 0 ? '' : '报关总价必须是大于 0 的数字',
              },
            ],
          };
        },

        async openForm(orderId) {
          this.open = true;
          this.headingSub = '';
          this.status = '';
          this.statusError = false;
          this.statusOk = false;
          try {
            const [detail, lines] = await Promise.all([
              getOrderImportDetail(orderId),
              getOrderImportDetailPage({ orderId, current: 1, size: 200 }),
            ]);
            this._detail = detail;
            this._lines = lines?.records ?? [];
            this.headingSub = detail.entrustNo + ' · ' + (detail.customerName ?? '');
            this.form()?.clearValidate();
            /* 等一帧让抽屉里的控件真正挂上，再写值（mc-input 的 value 是受控通道） */
            requestAnimationFrame(() => {
              for (const name of FIELD_IDS) {
                const control = this.field(name);
                if (control) control.value = String(detail[name] ?? '');
              }
            });
          } catch (error) {
            this.status = '加载失败：' + error.message;
            this.statusError = true;
          }
        },

        submit() {
          this.form()?.submit();
        },

        onInvalid(event) {
          this.statusError = true;
          this.statusOk = false;
          this.status = '请先修正标红字段：' + (event.data.fields ?? []).join('、');
        },

        async onSubmit(event) {
          const values = event.data.value ?? {};
          const payload = {
            ...this._detail,
            ...values,
            totalMoney: Number(values.totalMoney),
            orderImportDetailDTOList: this._lines.map((line) => ({ ...line, id: line.id || 0 })),
            orderDeliveryTakeDTOList: [],
            orderDeliverySendDTOList: [],
          };
          this.saving = true;
          this.saveLabel = '保存中…';
          this.status = '';
          this.statusError = false;
          this.statusOk = false;
          try {
            await updateOrderImport(payload);
            this.status = '保存成功（已回写旧仓 dev 接口）';
            this.statusOk = true;
            this.ele.dispatchEvent(new CustomEvent('saved', { bubbles: true, composed: true }));
          } catch (error) {
            this.status = '保存失败：' + error.message;
            this.statusError = true;
          } finally {
            this.saving = false;
            this.saveLabel = '保存';
          }
        },
      },
    });
  </script>
</template>
