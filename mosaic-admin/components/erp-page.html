<!-- erp-page — 列表页壳：schema 驱动的「一条工具栏 + 撑满高度的网格 + 分页」。
     去掉页面大标题 / 说明行：标题由外壳（面包屑 + 标签）表达，列表页只留操作。
     搜索区与工具栏用 HTML 字符串 + 事件委托：多键对象数组不进 ofa 响应式数据（见 data-grid README）。
     单元格函数不经过这里：业务模块先把 rows 加工成带 cells 的行，再 setRows()。 -->
<template component>
  <link rel="stylesheet" href="../styles/page.css" />

  <l-m src="../vendor/mosaic/input/input.html"></l-m>
  <l-m src="../vendor/mosaic/button/button.html"></l-m>
  <l-m src="../vendor/mosaic/data-grid/data-grid.html"></l-m>
  <l-m src="../vendor/mosaic/ellipsis/ellipsis.html"></l-m>
  <l-m src="../vendor/mosaic/pagination/pagination.html"></l-m>

  <style>
    l-m {
      display: none;
    }

    :host {
      display: block;
      height: 100%;
    }

    /* 满高 flex：工具栏与页脚固定，只有网格内部滚动（外层 .view 不再出滚动条） */
    /* 显式覆盖：不要吃 page.css 通用 .page 的 padding/gap/max-width */
    .list-page {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      padding: 0;
      gap: 0;
      max-width: none;
      box-sizing: border-box;
    }

    /* 极简：内容白底铺满，不用卡片投影/外框；层级只靠一条条细分隔线与字重 */
    .list-panel {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background-color: rgb(var(--mc-color-surface));
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--mc-space-3);
      padding: var(--mc-space-3) var(--mc-space-4);
      border-block-end: 1px solid rgb(var(--mc-color-border));
      background-color: rgb(var(--mc-color-surface));
    }

    .filters,
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--mc-space-2);
    }

    .filters mc-input {
      width: 11rem;
    }

    .grid-wrap {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      /* 列多时让网格自己横向滚动：flex 子项不设 min-width:0 会把宿主撑宽、被面板裁掉 */
      min-width: 0;
      overflow: hidden;
    }

    .grid-wrap mc-data-grid {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      height: 100%;
    }

    /* 页脚只留一条紧凑行：分页器 28px + 上下 4px */
    .footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--mc-space-3);
      padding: var(--mc-space-1) var(--mc-space-4);
      border-block-start: 1px solid rgb(var(--mc-color-border));
      background-color: rgb(var(--mc-color-surface));
    }

    .footer-text {
      margin: 0;
      color: rgb(var(--mc-color-fg-muted));
      font-size: var(--mc-text-sm);
      font-variant-numeric: tabular-nums;
    }

    .page-hint {
      margin: 0;
      color: rgb(var(--mc-color-fg-subtle));
      font-size: var(--mc-text-sm);
      line-height: 1.6;
    }

    .footer mc-pagination {
      margin-inline-start: auto;
    }

    .error-text {
      color: rgb(var(--mc-color-danger));
    }
  </style>

  <section class="list-page">
    <div class="list-panel">
      <div class="toolbar">
        <div class="filters" id="search" :html="searchHtml"></div>
        <div class="actions" id="toolbar" :html="toolbarHtml"></div>
      </div>

      <div class="grid-wrap">
        <mc-data-grid
          id="grid"
          selectable
          style="
            --mc-data-grid-head-bg: var(--mc-color-surface);
            --mc-data-grid-head-fg: var(--mc-color-fg-subtle);
            --mc-data-grid-hover-bg: var(--mc-color-primary-subtle);
            --mc-data-grid-pad-x: var(--mc-space-3);
          "
          on:select-change="forwardSelect($event)"
          on:cell-click="forwardClick($event)"
          on:cell-dblclick="forwardDblClick($event)"
          on:cell-action="forwardAction($event)"></mc-data-grid>
      </div>

      <div class="footer">
        <p class="page-hint error-text" attr:data-visible="errorText ? '' : null">{{errorText}}</p>
        <p class="footer-text" attr:data-visible="footerText ? '' : null">{{footerText}}</p>
        <mc-pagination
          id="pager"
          size="sm"
          sizer
          show-total
          page-sizes="10,20,50,100"
          attr:data-visible="pagerVisible ? '' : null"
          on:change="onPageChange($event)"></mc-pagination>
      </div>
    </div>
  </section>

  <script>
    import { can } from '../shared/perm.js';
    import { formatMoney } from '../shared/format.js';

    const escapeHtml = (value) =>
      String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    export default async () => ({
      tag: 'erp-page',
      /* 模板 :schema / :loader 的落点是组件参数；声明出来才收得到 */
      attr: {
        schema: null,
        loader: null,
      },

      data: {
        searchHtml: '',
        toolbarHtml: '',
        footerText: '',
        errorText: '',
        pagerVisible: false,
        gridLoading: false,
        selectedCount: 0,
      },

      watch: {
        schema(value) {
          if (!this._mounted) return;
          this.applySchema(value);
          this.startLoad();
        },
        loader(value) {
          if (!this._mounted) return;
          this._loader = typeof value === 'function' ? value : null;
          this.startLoad();
        },
      },

      ready() {
        this._schema = { search: [], toolbar: [], columns: [] };
        this._fields = [];
        this._rows = [];
        this._loader = null;
        this._searchValues = {};
        this._current = 1;
        this._pageSize = 20;
        this._loadToken = 0;
        this._loaded = false;
        this._schemaApplied = false;
        this._footerHint = '';
        this._presetSchema = Object.prototype.hasOwnProperty.call(this.ele, 'schema')
          ? this.ele.schema
          : undefined;

        this._page = this.shadow.$('.list-page');
        this._search = this.shadow.$('#search');
        this._toolbar = this.shadow.$('#toolbar');
        this._grid = this.shadow.$('#grid');

        /* 页面通过 property 传 schema（对象，不进 data）；setRows 也挂宿主，页面直接调 */
        Object.defineProperty(this.ele, 'schema', {
          configurable: true,
          get: () => this._schema,
          set: (value) => {
            this.applySchema(value);
            this.startLoad();
          },
        });
        /* loader 必须声明 accessor：模板 :loader="loader" 绑到没有 accessor 的属性会被静默丢掉 */
        Object.defineProperty(this.ele, 'loader', {
          configurable: true,
          get: () => this._loader,
          set: (loader) => {
            this._loader = typeof loader === 'function' ? loader : null;
            this.startLoad();
          },
        });
        Object.defineProperty(this.ele, 'setRows', {
          configurable: true,
          value: (rows) => this.setRows(rows),
        });
        /* 查询 / 分页 / 加载都归组件：页面只交 schema + loader，首查也由这里触发 */
        Object.defineProperty(this.ele, 'setLoader', {
          configurable: true,
          value: (loader) => {
            this._loader = typeof loader === 'function' ? loader : null;
            this.startLoad();
          },
        });
        /* 一步到位：页面只写一次 mount({ schema, loader })，首查在挂载后自动发生 */
        Object.defineProperty(this.ele, 'mount', {
          configurable: true,
          value: ({ schema, loader } = {}) => {
            if (schema) this.applySchema(schema);
            this._loader = typeof loader === 'function' ? loader : null;
            this.startLoad();
          },
        });
        Object.defineProperty(this.ele, 'reload', {
          configurable: true,
          value: () => this.load(),
        });
        Object.defineProperty(this.ele, 'footerHint', {
          configurable: true,
          get: () => this._footerHint,
          set: (value) => {
            this._footerHint = String(value ?? '');
            this.renderFooter();
          },
        });
        Object.defineProperty(this.ele, 'getSelected', {
          configurable: true,
          value: () => this._grid?.ele?.selected ?? [],
        });
        Object.defineProperty(this.ele, 'clearSelection', {
          configurable: true,
          value: () => {
            this._grid?.ele?.clearSelection?.();
            this.selectedCount = 0;
            this.renderToolbar();
            this.renderFooter();
          },
        });
        Object.defineProperty(this.ele, 'footer', {
          configurable: true,
          get: () => this.footerText,
          set: (value) => {
            this.footerText = String(value ?? '');
          },
        });
        Object.defineProperty(this.ele, 'pageSize', {
          configurable: true,
          get: () => this._pageSize ?? 20,
        });
        Object.defineProperty(this.ele, 'setPage', {
          configurable: true,
          value: (pageInfo) => this.setPage(pageInfo),
        });
        Object.defineProperty(this.ele, 'setLoading', {
          configurable: true,
          value: (loading) => {
            this.gridLoading = Boolean(loading);
          },
        });
        Object.defineProperty(this.ele, 'setError', {
          configurable: true,
          value: (message) => {
            this.errorText = String(message ?? '');
            this.gridLoading = false;
          },
        });

        this._onPermissions = () => this.renderToolbar();
        window.addEventListener('admin-permissions-change', this._onPermissions);
        this._onDataChanged = (event) => {
          const targets = this._schema?.reloadOn;
          if (!targets) return;
          const list = Array.isArray(targets) ? targets : [targets];
          if (list.includes(event.detail?.module)) this.load();
        };
        window.addEventListener('admin-data-changed', this._onDataChanged);

        this._search.ele.addEventListener('input', (event) => this.onSearchInput(event));
        this._search.ele.addEventListener('change', (event) => this.onSearchInput(event));
        this._search.ele.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') this.emitSearch();
        });
        this._search.ele.addEventListener('click', (event) => this.onButtonClick(event));
        this._toolbar.ele.addEventListener('click', (event) => this.onButtonClick(event));
      },

      attached() {
        this._mounted = true;
        if (this._presetSchema !== undefined) {
          this.applySchema(this._presetSchema);
          this._presetSchema = undefined;
        } else {
          this.applySchema(this._schema);
        }
        this.setRows(this._rows);
        this.applyBoundConfig();
        this.startLoad();
      },

      detached() {
        window.removeEventListener('admin-permissions-change', this._onPermissions);
        window.removeEventListener('admin-data-changed', this._onDataChanged);
      },

      proto: {
        /** data 通道：与库组件同形（$event.data.*），冒泡 + composed 穿 shadow */
        emitData(name, data) {
          this.emit(name, { data, bubbles: true, composed: true });
        },
        /** detail 通道：不可序列化载荷（行对象 / 原始事件）走 CustomEvent */
        emitDetail(name, detail) {
          this.ele.dispatchEvent(new CustomEvent(name, { detail, bubbles: true, composed: true }));
        },

        /** schema → 搜索项 / 工具栏 / 列（对象存 plain 字段，渲染成字符串进 data） */
        applySchema(schema) {
          this._schema = schema ?? { search: [], toolbar: [], columns: [] };
          this._fields = (this._schema.search ?? []).map((field) => ({
            key: String(field.key ?? ''),
            label: String(field.label ?? ''),
            type: field.type === 'select' ? 'select' : 'input',
            placeholder: String(field.placeholder ?? ''),
            options: Array.isArray(field.options) ? field.options : [],
          }));

          this.renderSearch();
          this.renderToolbar();
          const indexColumn = this._schema.indexColumn
            ? {
                key: '__index',
                title: String(this._schema.indexColumn.title ?? '序号'),
                width: String(this._schema.indexColumn.width ?? '64px'),
                align: this._schema.indexColumn.align ?? 'center',
                /* 序号跟着复选框一起冻结在左侧 */
                fixed: this._schema.indexColumn.fixed ?? 'left',
              }
            : null;
          this._hasIndex = Boolean(indexColumn);
          this._grid?.ele &&
            (this._grid.ele.columns = indexColumn
              ? [indexColumn, ...(this._schema.columns ?? [])]
              : (this._schema.columns ?? []));
          this._schemaApplied = true;
        },

        renderSearch() {
          let html = '';
          /* v0 只支持 input：mc-select 的选项是**轻 DOM 的 mc-option**，动态渲染的挂载时序不可靠，
             等「动态 options」通道定下来再补 select 搜索项（见 README「刻意不做」）。 */
          for (const field of this._fields) {
            if (field.type !== 'input') continue;
            html +=
              '<mc-input data-field="' +
              escapeHtml(field.key) +
              '" placeholder="' +
              escapeHtml(field.placeholder || field.label) +
              '"></mc-input>';
          }
          if (this._fields.length) {
            html +=
              '<mc-button data-action="search">查询</mc-button>' +
              '<mc-button data-action="reset" variant="outline">重置</mc-button>';
          }
          this.searchHtml = html;
        },

        renderToolbar() {
          const buttons = (this._schema.toolbar ?? []).filter(
            (button) => !button.permission || can(button.permission),
          );
          let html = '';
          for (const button of buttons) {
            const disabled = button.requiresSelection && this.selectedCount === 0;
            html +=
              '<mc-button data-action="' +
              escapeHtml(button.action) +
              '"' +
              (button.variant ? ' variant="' + escapeHtml(button.variant) + '"' : '') +
              (disabled ? ' disabled' : '') +
              '>' +
              escapeHtml(button.label ?? button.action) +
              '</mc-button>';
          }
          this.toolbarHtml = html;
        },

        /** 行数据：页面把 cells 加工好后交进来（函数不经过组件） */
        setRows(rows) {
          this._rows = Array.isArray(rows) ? rows : [];
          this.renderRows();
        },

        /** 序号按「页码 × 每页条数」算全局值；其他列原样，cells 不动 */
        renderRows() {
          if (!this._grid?.ele) return;
          if (!this._hasIndex) {
            this._grid.ele.data = this._rows;
            this.applySummary();
            return;
          }
          const base = (Number(this._current ?? 1) - 1) * Number(this._pageSize ?? 20);
          this._grid.ele.data = this._rows.map((row, index) => ({
            ...row,
            __index: base + index + 1,
          }));
          this.applySummary();
        },

        /** 底部合计：schema 列上的 sum 配置（{ field, format }）决定哪列求和、怎么展示 */
        applySummary() {
          const grid = this._grid?.ele;
          if (!grid) return;
          const summary = {};
          for (const column of this._schema?.columns ?? []) {
            const spec = column.sum;
            if (!spec) continue;
            const field = typeof spec === 'string' ? spec : spec.field;
            const format = typeof spec === 'object' ? spec.format : undefined;
            if (!field) continue;
            const total = this._rows.reduce((acc, row) => {
              const amount = Number(row[field]);
              return Number.isFinite(amount) ? acc + amount : acc;
            }, 0);
            summary[column.key] = format === 'money' ? formatMoney(total) : String(total);
          }
          grid.summary = summary;
        },

        /** 分页：页大小 / 页码 / 总数交给 mc-pagination（runtime 通道：total 属性 + current property） */
        setPage({ current = 1, pageSize = 20, total = 0 } = {}) {
          const pager = this._pager?.ele ?? this.shadow.$('#pager')?.ele;
          if (!pager) return;
          this._pager = { ele: pager };
          pager.setAttribute('total', String(Number(total)));
          pager.setAttribute('page-size', String(Number(pageSize)));
          pager.current = Number(current);
          this._current = Number(current);
          this._pageSize = Number(pageSize);
          this.renderRows();
          /* 单页也要显示：条数选择器在里面，藏了就没法改每页条数 */
          this.pagerVisible = true;
        },

        onPageChange(event) {
          const current = Number(event.data?.current ?? 1);
          const pageSize = Number(event.data?.pageSize ?? this._pageSize ?? 20);
          /* 改每页条数就回第 1 页；只翻页就按新页码 */
          const page = pageSize !== this._pageSize ? 1 : current;
          this._pageSize = pageSize;
          this._current = page;
          this.emitData('page-change', { current: page, pageSize });
          if (this._loader) this.load();
        },

        /** 模板 :schema / :loader 绑定的参数（组件 data 通道）→ 内部配置 */
        applyBoundConfig() {
          if (this.schema) this.applySchema(this.schema);
          if (typeof this.loader === 'function') this._loader = this.loader;
          this.startLoad();
        },

        /** 首查只跑一次：schema + loader 都到齐后触发 */
        startLoad() {
          if (!this._loader || !this._schemaApplied || this._loaded) return;
          this._loaded = true;
          this.load();
        },

        /** 唯一加载入口：loader 结果 → rows / total / 分页；token 防旧请求覆盖新结果 */
        async load() {
          if (typeof this._loader !== 'function') return;
          const token = ++this._loadToken;
          const current = Number(this._current ?? 1);
          const pageSize = Number(this._pageSize ?? 20);
          this.gridLoading = true;
          this.errorText = '';
          try {
            const result = await this._loader({
              current,
              pageSize,
              search: { ...this._searchValues },
            });
            if (token !== this._loadToken) return;
            const rows = Array.isArray(result?.rows) ? result.rows : [];
            const total = Number(result?.total ?? rows.length);
            const nextCurrent = Number(result?.current ?? current);
            const nextSize = Number(result?.pageSize ?? result?.size ?? pageSize);
            this._current = nextCurrent;
            this._pageSize = nextSize;
            this.setRows(rows);
            this.setPage({ current: nextCurrent, pageSize: nextSize, total });
            this.renderFooter();
            this.emitData('load', { current: nextCurrent, pageSize: nextSize, total });
          } catch (error) {
            if (token !== this._loadToken) return;
            this.setRows([]);
            this.setError('加载失败：' + error.message);
          } finally {
            if (token === this._loadToken) this.gridLoading = false;
          }
        },

        /** 页脚：选中数 + 最近动作（页面只写 footerHint），没有就整行隐藏 */
        renderFooter() {
          const parts = [];
          if (this.selectedCount) parts.push('已选 ' + this.selectedCount + ' 条');
          if (this._footerHint) parts.push(this._footerHint);
          this.footerText = parts.join(' · ');
        },

        /** 查询：记下搜索值、回第 1 页、交给 loader */
        runSearch() {
          this._searchValues = this.searchValues();
          this._current = 1;
          this.emitData('search', { values: this._searchValues });
          if (this._loader) this.load();
        },

        /** 搜索区当前值：input / select 都按 data-field 读 */
        searchValues() {
          const values = {};
          for (const field of this._fields) {
            const control = this.shadow.$(`[data-field="${field.key}"]`);
            if (!control) continue;
            values[field.key] = control.ele?.value ?? '';
          }
          return values;
        },

        emitSearch() {
          this.runSearch();
        },

        resetSearch() {
          for (const field of this._fields) {
            const control = this.shadow.$(`[data-field="${field.key}"]`);
            if (control?.ele) control.ele.value = '';
          }
          this._searchValues = {};
          this._current = 1;
          this.emitData('search', { values: {} });
          if (this._loader) this.load();
        },

        onSearchInput(event) {
          if (event.type === 'change' && event.target instanceof Element) this.runSearch();
        },

        /** 查询 / 重置是壳的动作，其余 data-action 上抛给页面 */
        onButtonClick(event) {
          const button =
            event.target instanceof Element ? event.target.closest('[data-action]') : null;
          if (!button) return;
          const action = button.getAttribute('data-action');
          if (action === 'search') {
            this.emitSearch();
            return;
          }
          if (action === 'reset') {
            this.resetSearch();
            return;
          }
          this.emitData('action', { action });
        },

        /* 子组件事件原样上抛：data 通道带载荷键，detail 通道整块转发（与 data-grid 一致） */
        forwardSelect(event) {
          this.selectedCount = (event.data?.selected ?? []).length;
          this.renderToolbar();
          this.renderFooter();
          this.emitData('select-change', event.data);
        },
        forwardClick(event) {
          this.emitDetail('cell-click', event.detail);
        },
        forwardDblClick(event) {
          this.emitDetail('cell-dblclick', event.detail);
        },
        forwardAction(event) {
          this.emitDetail('cell-action', event.detail);
        },
      },
    });
  </script>
</template>
