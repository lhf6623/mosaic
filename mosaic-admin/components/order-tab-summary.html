<!-- 关联 Tab · 订单详情（原详情页四节，作为「详情」下的第一个子页签内容）。 -->
<template component>
  <link rel="stylesheet" href="../styles/page.css" />
  <style>
    .section {
      margin-block-start: var(--mc-space-4);
      border: 1px solid rgb(var(--mc-color-border));
      border-radius: var(--mc-radius-lg);
      background-color: rgb(var(--mc-color-surface));
    }
    .section:first-child {
      margin-block-start: 0;
    }
    .section-head {
      display: flex;
      align-items: center;
      gap: var(--mc-space-2);
      padding: var(--mc-space-3) var(--mc-space-4);
      border-block-end: 1px solid rgb(var(--mc-color-border));
    }
    .section-title {
      margin: 0;
      font-size: var(--mc-text-base);
      font-weight: var(--mc-weight-semibold);
    }
    .section-hint {
      color: rgb(var(--mc-color-fg-subtle));
      font-size: var(--mc-text-xs, 0.75rem);
    }
    .section-body {
      padding: var(--mc-space-4);
    }
    .facts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
      gap: var(--mc-space-3) var(--mc-space-4);
    }
    .fact-label {
      display: block;
      color: rgb(var(--mc-color-fg-subtle));
      font-size: var(--mc-text-xs, 0.75rem);
    }
    .fact-value {
      display: block;
      margin-block-start: 2px;
      color: rgb(var(--mc-color-fg));
      font-size: var(--mc-text-sm);
      overflow-wrap: anywhere;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid rgb(var(--mc-color-border));
      border-radius: var(--mc-radius-md);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--mc-text-sm);
      white-space: nowrap;
    }
    th,
    td {
      padding: var(--mc-space-2) var(--mc-space-3);
      border-block-end: 1px solid rgb(var(--mc-color-border));
      text-align: start;
    }
    th {
      background-color: rgb(var(--mc-color-surface-sunken));
      color: rgb(var(--mc-color-fg-muted));
      font-weight: var(--mc-weight-medium, 500);
    }
    tr:last-child td {
      border-block-end: 0;
    }
    .num {
      text-align: end;
      font-variant-numeric: tabular-nums;
    }
    .timeline {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .timeline-item {
      position: relative;
      padding-inline-start: var(--mc-space-5);
      padding-block-end: var(--mc-space-3);
      border-inline-start: 2px solid rgb(var(--mc-color-border));
      margin-inline-start: 0.4rem;
    }
    .timeline-item:last-child {
      padding-block-end: 0;
      border-inline-start-color: transparent;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      inset-inline-start: -0.4rem;
      inset-block-start: 0.35rem;
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background-color: rgb(var(--mc-color-primary));
    }
    .timeline-who {
      color: rgb(var(--mc-color-fg));
      font-size: var(--mc-text-sm);
    }
    .timeline-time {
      color: rgb(var(--mc-color-fg-subtle));
      font-size: var(--mc-text-xs, 0.75rem);
    }
    .state {
      padding: var(--mc-space-4) 0;
      color: rgb(var(--mc-color-fg-subtle));
      text-align: center;
    }
    .state[data-error] {
      color: rgb(var(--mc-color-danger));
    }
  </style>

  <div :html="bodyHtml"></div>

  <script>
    import {
      getOrderImportAuditList,
      getOrderImportDetail,
      getOrderImportDetailPage,
    } from '../shared/api/order-import.js';
    import { getDict, dictMap } from '../shared/api/dicts.js';
    import { formatMoney } from '../shared/format.js';

    const esc = (value) =>
      String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    const fact = (label, value) =>
      '<div class="fact"><span class="fact-label">' +
      esc(label) +
      '</span><span class="fact-value">' +
      (esc(value) || '—') +
      '</span></div>';
    const section = (title, hint, body) =>
      '<section class="section"><div class="section-head"><h2 class="section-title">' +
      esc(title) +
      '</h2>' +
      (hint ? '<span class="section-hint">' + esc(hint) + '</span>' : '') +
      '</div><div class="section-body">' +
      body +
      '</div></section>';

    export default async () => ({
      tag: 'order-tab-summary',
      attrs: { orderId: '' },
      data: { bodyHtml: '<p class="state">加载中…</p>' },
      ready() {
        Object.defineProperty(this.ele, 'load', {
          configurable: true,
          value: (orderId) => this.load(orderId),
        });
      },
      proto: {
        async load(orderId) {
          if (orderId) this.ele.orderId = orderId;
          this.bodyHtml = '<p class="state">加载中…</p>';
          try {
            const [detail, lines, audits, orderDict, auditDict] = await Promise.all([
              getOrderImportDetail(orderId),
              getOrderImportDetailPage({ orderId, current: 1, size: 500 }),
              getOrderImportAuditList(orderId).catch(() => []),
              getDict('order_import_process_status'),
              getDict('audit_status'),
            ]);
            const orderStatus = dictMap(orderDict).get(String(detail.orderStatus));
            const auditStatus = dictMap(auditDict).get(String(detail.auditStatus));
            this.bodyHtml = this.render(
              detail,
              lines?.records ?? [],
              audits ?? [],
              orderStatus,
              auditStatus,
            );
          } catch (error) {
            this.bodyHtml =
              '<p class="state" data-error>' + esc('加载失败：' + error.message) + '</p>';
          }
        },
        render(detail, lines, audits, orderStatus, auditStatus) {
          const tips = section(
            '要点',
            '',
            '<div class="facts">' +
              fact('客户名称', detail.customerName) +
              fact('委托方', detail.principalName) +
              fact('供应商', detail.supplierName) +
              fact('订单编号', detail.orderNo) +
              fact('订单日期', detail.orderDate) +
              fact('订单状态', orderStatus?.label ?? detail.orderStatus) +
              fact('审核状态', auditStatus?.label ?? detail.auditStatus) +
              fact('业务员', detail.saleManName) +
              fact('跟单员', detail.tradeManName) +
              fact('币种', detail.currencyName) +
              fact('总金额', formatMoney(detail.totalMoney)) +
              '</div>',
          );
          const trade = section(
            '贸易 / 报关',
            '旧仓是折叠区，一屏放不下',
            '<div class="facts">' +
              fact('成交方式', detail.incoterms) +
              fact('包装类型', detail.packageType) +
              fact('贸易方式', detail.tradeModeName ?? detail.tradeMode) +
              fact('抬头方式', detail.declareTitle) +
              fact('申报地海关', detail.customMaster) +
              fact('境内收发货人', detail.tradeName) +
              fact('境外发货人', detail.overseasConsignorEname) +
              fact('入境口岸', detail.entyPort) +
              fact('运输方式', detail.trafMode) +
              fact('贸易国', detail.tradeCountry) +
              '</div>',
          );
          const rows = lines
            .map(
              (line) =>
                '<tr><td>' +
                esc(line.productNo) +
                '</td><td>' +
                esc(line.productName) +
                '</td><td>' +
                esc(line.productModel) +
                '</td><td class="num">' +
                esc(line.qty) +
                '</td><td class="num">' +
                esc(formatMoney(line.price)) +
                '</td><td class="num">' +
                esc(formatMoney(line.totalMoney)) +
                '</td><td>' +
                esc(line.customsCode) +
                '</td></tr>',
            )
            .join('');
          const lineHtml = lines.length
            ? '<div class="table-wrap"><table><thead><tr><th>商品编号</th><th>品名</th><th>型号</th>' +
              '<th class="num">数量</th><th class="num">单价</th><th class="num">金额</th><th>报关编码</th>' +
              '</tr></thead><tbody>' +
              rows +
              '</tbody></table></div>'
            : '<p class="state">没有明细行</p>';
          const auditHtml = audits.length
            ? '<ul class="timeline">' +
              audits
                .map((audit) => {
                  const who = audit.realName
                    ? [].concat(audit.realName).filter(Boolean).join(' / ')
                    : audit.type === 'start'
                      ? '发起人'
                      : '待处理';
                  const task = audit.taskName ? esc(audit.taskName) + ' · ' : '';
                  return (
                    '<li class="timeline-item"><div class="timeline-who">' +
                    task +
                    esc(who) +
                    '</div><div class="timeline-time">' +
                    esc(audit.time ?? '待处理') +
                    '</div></li>'
                  );
                })
                .join('') +
              '</ul>'
            : '<p class="state">没有审批记录</p>';
          return (
            tips +
            trade +
            section('订单明细', '共 ' + lines.length + ' 行', lineHtml) +
            section('审批记录', '', auditHtml)
          );
        },
      },
    });
  </script>
</template>
