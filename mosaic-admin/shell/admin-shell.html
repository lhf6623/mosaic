<!-- 应用外壳（G2）：顶栏（品牌 / 面包屑 / 全局搜索 / 主题）+ 侧栏菜单 + 多标签页（上限 + 右键菜单）+ 常驻页面容器。
     为什么自建路由、不用 o-app：o-app 只复用同 src 的父页面，leaf 导航后会被销毁，多标签页状态必丢（P0 spike C）。
     这里每个标签一个常驻 <o-page>，切走只 display:none。 -->

  <style>

    .workbench-tabs {

    /* 每个标签一页，各自滚动：切走只隐藏，滚动位置也一起留着 */
    .views {

  </style>

  <div class="shell">
    <header class="topbar">
      <span class="brand">
        Mosaic
        <span class="brand-sub">Admin</span>
      </span>
      <span class="crumb">
        <span>{{group}}</span>
        <span class="crumb-sep">/</span>
        <span class="crumb-label">{{pageLabel}}</span>
      </span>
      <span class="actions">
        <div class="search">
          <mc-input
            id="search"
            size="sm"
            placeholder="搜索页面"
            on:input="onSearchInput($event)"
            on:keydown="onSearchKey($event)"
            on:focus="onSearchFocus()"
            on:blur="onSearchBlur()"></mc-input>
          <div class="search-panel" attr:data-open="searchOpen ? '' : null">
            <o-fill :value="searchResults" fill-key="file">
              <div
                class="search-row"
                attr:data-active="$data.active ? '' : null"
                on:click="$host.pickResult($data)">
                <span class="search-label">{{$data.label}}</span>
                <span class="search-group">{{$data.group}}</span>
              </div>
            </o-fill>
            <div class="search-empty" attr:data-open="searchEmpty ? '' : null">没有匹配页面</div>
          </div>
        </div>
        <span class="user" attr:data-visible="userName ? '' : null">
          <span class="user-name">{{userName}}</span>
          <button class="logout" type="button" on:click="logout()">退出</button>
        </span>
        <button class="theme-toggle" type="button" on:click="toggleTheme()">{{themeLabel}}</button>
        <span class="version">{{version}}</span>
      </span>
    </header>

    <div class="body">
      <aside class="sidebar">
        <mc-menu id="nav" attr:current="currentKey" :options="menuOptions"></mc-menu>
      </aside>

      <main class="workbench">
        <mc-tabs
          id="tabs"
          class="workbench-tabs"
          variant="line"
          no-panel
          on:change="onTabsChange($event)"
          on:close="onTabsClose($event)"
          on:contextmenu="onTabsContextMenu($event)"></mc-tabs>

        <div class="views" id="views"></div>
      </main>
    </div>
  </div>

  <div
    class="tab-menu"
    attr:data-open="tabMenuOpen ? '' : null"
    :style.left="tabMenuX + 'px'"
    :style.top="tabMenuY + 'px'">
    <button type="button" on:click="menuCloseCurrent()">关闭</button>
    <button type="button" on:click="menuCloseOthers()">关闭其他</button>
    <button type="button" on:click="menuCloseRight()">关闭右侧</button>
  </div>

  <script>
    import { APP_TITLE, APP_VERSION, LOGIN_ROUTE } from '../config.js';
    import { MENU, PAGES } from '../pages.registry.js';
    import { hasSession, readSession } from '../shared/http.js';
    import { logout as logoutSession } from '../shared/auth.js';

    const HOME = 'pages/home.html';
    const LOGIN = LOGIN_ROUTE;
    const REDIRECT_KEY = 'mosaic-admin-redirect';
    const THEME_KEY = 'mosaic-admin-theme';
    /** 标签上限：超了先关最久没激活的标签（当前标签与刚开的那个不关） */
    const MAX_TABS = 12;

    /** hash → 页面文件（admin 相对路径）；空 hash 回首页 */
    const routeFile = () => {
      /* hash 路由可带查询串（如 '#/pages/import-order/edit.html?id=…'），匹配注册表时只取文件段 */
      const raw = location.hash.replace(/^#\/?/, '').split('?')[0];
      try {
        return decodeURIComponent(raw) || HOME;
      } catch {
        return HOME;
      }
    };

    export default async () => ({
      data: {
        version: APP_VERSION,
        userName: '',
        menuOptions: MENU,
        tabs: [],
        currentKey: '',
        pageLabel: '',
        group: '',
        themeLabel: '',
        /* 全局搜索 */
        query: '',
        searchResults: [],
        searchOpen: false,
        searchEmpty: false,
        searchIndex: 0,
        /* 标签右键菜单 */
        tabMenuOpen: false,
        tabMenuX: 0,
        tabMenuY: 0,
        tabMenuFile: '',
      },

      ready() {
        this._pages = new Map();
        this._recent = [];
        this._views = this.shadow.$('#views').ele;
        this._theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
        this.themeLabel = this._theme === 'dark' ? '亮色' : '暗色';

        this._syncUser();
        this._onAuthChange = () => {
          this._syncUser();
          this.syncRoute();
        };
        this._onAuthExpired = () => {
          history.replaceState(null, '', '#/' + LOGIN);
          this.syncRoute();
        };
        window.addEventListener('admin-auth-change', this._onAuthChange);
        window.addEventListener('admin-auth-expired', this._onAuthExpired);

        this._onHashChange = () => this.syncRoute();
        window.addEventListener('hashchange', this._onHashChange);

        this._onDocClick = () => this.closeTabMenu();
        this._onDocKey = (event) => {
          if (event.key === 'Escape') {
            this.closeTabMenu();
            this.closeSearch();
          }
        };
        document.addEventListener('click', this._onDocClick);
        document.addEventListener('keydown', this._onDocKey);

        /* 首屏没有 hash 时补一个（replace，不额外压历史） */
        if (!location.hash) history.replaceState(null, '', '#/' + routeFile());
        this.syncRoute();
      },

      detached() {
        window.removeEventListener('hashchange', this._onHashChange);
        window.removeEventListener('admin-auth-change', this._onAuthChange);
        window.removeEventListener('admin-auth-expired', this._onAuthExpired);
        document.removeEventListener('click', this._onDocClick);
        document.removeEventListener('keydown', this._onDocKey);
        clearTimeout(this._searchTimer);
        clearTimeout(this._tabMenuTimer);
      },

      proto: {
        /* ---------- 路由 ---------- */

        pageOf(file) {
          return PAGES.find((page) => page.file === file) ?? null;
        },

        /** 当前登录用户在顶栏显示的字（昵称 / 用户名） */
        _syncUser() {
          const session = readSession();
          this.userName = session?.user?.name || session?.username || '';
        },

        syncRoute() {
          const file = routeFile();
          /* 未登录：任何页面都先回登录页（把原目标记下来，登录后回跳） */
          if (file !== LOGIN && !hasSession()) {
            sessionStorage.setItem(REDIRECT_KEY, '#/' + file);
            history.replaceState(null, '', '#/' + LOGIN);
            this.open(this.pageOf(LOGIN));
            return;
          }
          /* 已登录还停在登录页：直接回首页 */
          if (file === LOGIN && hasSession()) {
            history.replaceState(null, '', '#/' + HOME);
            this.open(this.pageOf(HOME));
            return;
          }
          /* 已经登录：登录页那个标签不留在标签条里 */
          if (file !== LOGIN && this._pages.has(LOGIN)) this.removeTab(LOGIN);
          const page = this.pageOf(file);
          if (!page) {
            console.warn('[admin] 未注册的页面：' + file);
            return;
          }
          this.open(page);
        },

        logout() {
          logoutSession();
          this.userName = '';
          location.hash = '#/' + LOGIN;
        },

        open(page) {
          if (!this._pages.has(page.file)) this.mount(page);
          this.activate(page.file, { fromRoute: true });
        },

        mount(page) {
          const view = document.createElement('div');
          view.className = 'view';

          const oPage = document.createElement('o-page');
          const loading = document.createElement('div');
          loading.className = 'loading';
          loading.textContent = '加载中…';
          view.append(loading);

          oPage.addEventListener('page-loaded', () => loading.remove(), { once: true });
          /* o-page 的 src 初始化后不可变；用绝对地址，避免组件 shadow 里的相对解析歧义 */
          oPage.setAttribute('src', new URL(page.file, document.baseURI).href);
          view.append(oPage);
          this._views.append(view);

          this._pages.set(page.file, { view, oPage });
          this.tabs = [...this.tabs, { file: page.file, label: page.label, active: false }];
          this._recent.push(page.file);
          this.trimTabs(page.file);
        },

        /** 标签上限：超了先关最久没激活的（当前 / 刚开的除外） */
        trimTabs(keep) {
          while (this.tabs.length > MAX_TABS) {
            const victim = this._recent.find(
              (file) => file !== keep && file !== this.tabs.find((tab) => tab.active)?.file,
            );
            if (!victim) break;
            this.removeTab(victim);
          }
        },

        activate(file, { fromRoute = false } = {}) {
          const page = this.pageOf(file);
          if (!page) return;

          this.tabs = this.tabs.map((tab) => ({ ...tab, active: tab.file === file }));
          for (const [key, entry] of this._pages) {
            if (key === file) entry.view.setAttribute('data-active', '');
            else entry.view.removeAttribute('data-active');
          }

          this._recent = this._recent.filter((item) => item !== file);
          this._recent.push(file);

          this.currentKey = file;
          this.pageLabel = page.label;
          this.group = page.group;
          document.title = page.label + ' - ' + APP_TITLE;

          if (!fromRoute && routeFile() !== file) location.hash = '#/' + file;

          this.syncTabs();
        },

        /** 把 tabs 数据同步给库组件（增量：能复用就复用，切页只改 value，不重建 DOM） */
        syncTabs() {
          const tabsEl = this.shadow.$('#tabs')?.ele;
          if (!tabsEl) return;
          const current = [...tabsEl.querySelectorAll('mc-tab')];
          const byValue = new Map(current.map((item) => [item.getAttribute('value'), item]));
          const next = this.tabs.map((tab) => {
            let item = byValue.get(tab.file);
            if (!item) {
              item = document.createElement('mc-tab');
              item.setAttribute('value', tab.file);
              item.setAttribute('closable', '');
            }
            if (item.getAttribute('name') !== tab.label) item.setAttribute('name', tab.label);
            return item;
          });
          const unchanged =
            current.length === next.length && current.every((item, index) => item === next[index]);
          if (!unchanged) tabsEl.replaceChildren(...next);
          tabsEl.value = this.currentKey;
          requestAnimationFrame(() => {
            const active = next.find((tab) => tab.getAttribute('value') === this.currentKey);
            active?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
          });
        },

        onTabsChange(event) {
          const file = event.data?.value;
          if (!file || file === this.currentKey) return;
          this.activate(file);
        },

        onTabsClose(event) {
          this.closeTab(null, event.data?.value);
        },

        onTabsContextMenu(event) {
          const tab = event.composedPath().find((el) => el?.tagName === 'MC-TAB');
          if (!tab) return;
          this.openTabMenu(event, tab.getAttribute('value'), tab.getBoundingClientRect());
        },

        /** 销毁一个标签的页面实例（不负责导航） */
        removeTab(file) {
          const entry = this._pages.get(file);
          if (!entry) return false;
          entry.view.remove();
          this._pages.delete(file);
          this.tabs = this.tabs.filter((tab) => tab.file !== file);
          this._recent = this._recent.filter((item) => item !== file);
          this.syncTabs();
          return true;
        },

        closeTab(event, file) {
          event?.stopPropagation();
          const wasActive = this.tabs.find((tab) => tab.file === file)?.active;
          const index = this.tabs.findIndex((tab) => tab.file === file);
          if (!this.removeTab(file)) return;
          if (!wasActive) return;
          const next = this.tabs[Math.min(index, this.tabs.length - 1)] ?? null;
          location.hash = '#/' + (next?.file ?? HOME);
        },

        /* ---------- 标签右键菜单 ---------- */

        openTabMenu(event, file, rect) {
          event.preventDefault();
          event.stopPropagation();
          this.tabMenuX = Math.round(rect.left);
          this.tabMenuY = Math.round(rect.bottom + 4);
          this.tabMenuFile = file;
          this.tabMenuOpen = true;
        },

        closeTabMenu() {
          if (this.tabMenuOpen) this.tabMenuOpen = false;
        },

        menuCloseCurrent() {
          const file = this.tabMenuFile;
          this.tabMenuOpen = false;
          if (file) this.closeTab(null, file);
        },

        menuCloseOthers() {
          const keep = this.tabMenuFile;
          this.tabMenuOpen = false;
          for (const tab of [...this.tabs]) {
            if (tab.file !== keep) this.removeTab(tab.file);
          }
          if (keep) location.hash = '#/' + keep;
        },

        menuCloseRight() {
          const keep = this.tabMenuFile;
          const index = this.tabs.findIndex((tab) => tab.file === keep);
          this.tabMenuOpen = false;
          if (index < 0) return;
          for (const tab of this.tabs.slice(index + 1)) this.removeTab(tab.file);
          location.hash = '#/' + keep;
        },

        /* ---------- 全局搜索（页面清单来自注册表） ---------- */

        onSearchFocus() {
          if (this.query.trim()) this.runSearch();
        },

        onSearchBlur() {
          /* 点结果时 blur 先发生：延迟关，让 click 走到 */
          clearTimeout(this._searchTimer);
          this._searchTimer = setTimeout(() => this.closeSearch(), 150);
        },

        onSearchInput(event) {
          this.query = String(event.data?.value ?? '');
          this.runSearch();
        },

        runSearch() {
          const keyword = this.query.trim().toLowerCase();
          if (!keyword) {
            this.searchOpen = false;
            this.searchResults = [];
            this.searchEmpty = false;
            return;
          }
          const hits = PAGES.filter(
            (page) =>
              !page.hidden &&
              (page.label.toLowerCase().includes(keyword) ||
                page.group.toLowerCase().includes(keyword) ||
                page.file.toLowerCase().includes(keyword)),
          )
            .slice(0, 8)
            .map((page, index) => ({
              file: page.file,
              label: page.label,
              group: page.group,
              active: index === 0,
            }));
          this.searchIndex = 0;
          this.searchResults = hits;
          this.searchEmpty = hits.length === 0;
          this.searchOpen = true;
        },

        onSearchKey(event) {
          if (!this.searchOpen) return;
          if (event.key === 'Escape') {
            event.preventDefault();
            this.closeSearch();
            return;
          }
          if (event.key === 'Enter') {
            event.preventDefault();
            this.pickResult(this.searchResults[this.searchIndex]);
            return;
          }
          if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault();
            const step = event.key === 'ArrowDown' ? 1 : -1;
            const total = this.searchResults.length;
            if (!total) return;
            this.searchIndex = (this.searchIndex + step + total) % total;
            this.searchResults = this.searchResults.map((item, index) => ({
              ...item,
              active: index === this.searchIndex,
            }));
          }
        },

        pickResult(result) {
          if (!result) return;
          this.closeSearch();
          this.shadow.$('#search')?.ele?.blur?.();
          location.hash = '#/' + result.file;
        },

        closeSearch() {
          this.searchOpen = false;
          this.searchEmpty = false;
        },

        /* ---------- 主题 ---------- */

        toggleTheme() {
          this._theme = this._theme === 'dark' ? 'light' : 'dark';
          document.documentElement.dataset.theme = this._theme;
          this.themeLabel = this._theme === 'dark' ? '亮色' : '暗色';
          try {
            localStorage.setItem(THEME_KEY, this._theme);
          } catch {
            /* 隐私模式写不进：主题只在本次会话生效，不打断使用 */
          }
        },
      },
    });
  </script>
</template>
