# mosaic CI —— push / PR 到 main 时跑完整门禁。
#
# 本地对应的就是这两条：
#   pnpm check      静态守卫（typecheck + check:docs + check:drift + check:size），秒级
#   pnpm test:all   真浏览器冒烟（13 站点套件 + 11 组件套件），约 1.5 分钟（本地）
#
# 浏览器：用镜像自带的 Chrome（tests/lib/harness.mjs 的 CHANNEL 默认就是它）—— 本地与 CI 同一条路。
# 曾经改成 playwright-core 自带 Chromium + 一步 install，事后证明那次失败跟浏览器无关
# （浏览器装好了、套件也跑起来了，同一处仍然红），白下载一遍，已回退。
# 真遇到镜像没有 Chrome：把 env.CHANNEL 换成 chromium，并在静态门禁前加
#   npx playwright-core install --with-deps chromium
#
# 冒烟测试连的是本地文档站，所以先把 tools/serve.mjs 起在后台（和 pnpm dev 同一条路），
# 再用 curl 等它就绪 —— 不等待会偶发「第一个套件 404」。
#
# 公开仓库的 job log 要登录才能下载，所以每一步失败都把关键行发成 ::error:: 注解
# （走 API 就能读到）：「CI 红了但看不到日志」时还有一条路。
#
# 没接 pnpm format:check：全仓还有几十个文件没格式化（历史遗留），接进来会一直红。
# 等清干净了再加，别让它长期挂着一条「反正一直红」的步骤 —— 那种红会训练人忽略 CI。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHANNEL: chrome
      CI: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 静态门禁（typecheck → check:docs → check:drift → check:size）
        run: |
          fail=0
          for c in typecheck check:docs check:drift check:size; do
            echo "=== pnpm $c ==="
            if pnpm "$c" > "/tmp/$c.log" 2>&1; then
              tail -n 3 "/tmp/$c.log"
            else
              cat "/tmp/$c.log"
              picked=$(grep -E '^[-+@]' "/tmp/$c.log" | head -n 8)
              [ -n "$picked" ] || picked=$(grep -E '· |✗|脱节|超预算|提交版|重建版' "/tmp/$c.log" | head -n 8)
              [ -n "$picked" ] || picked=$(tail -n 8 "/tmp/$c.log")
              echo "$picked" | sed 's/^/::error::/'
              fail=1
            fi
          done
          exit $fail

      - name: 记录浏览器版本（冒烟用镜像自带的 Chrome —— harness 的 CHANNEL 默认就是它）
        run: |
          google-chrome --version && exit 0
          echo '::error::镜像里没有 google-chrome —— 冒烟会起不来（换 Chromium 的做法见头注释）'

      - name: 起文档站并等它就绪
        run: |
          node tools/serve.mjs > /tmp/serve.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8642/index.html > /dev/null; then
              echo "文档站已就绪"
              exit 0
            fi
            sleep 0.5
          done
          echo "文档站没起来，serve 日志："
          cat /tmp/serve.log
          exit 1

      - name: 浏览器冒烟（全量）
        run: |
          if pnpm test:all > /tmp/smoke.log 2>&1; then
            tail -n 12 /tmp/smoke.log
          else
            cat /tmp/smoke.log
            # 从「失败清单」那段截（那里才是原因）；没有这段说明是启动期就崩了
            picked=$(sed -n '/失败清单/,$p' /tmp/smoke.log | head -n 12)
            [ -n "$picked" ] || picked=$(tail -n 12 /tmp/smoke.log)
            echo "$picked" | sed 's/^/::error::/'
            exit 1
          fi
