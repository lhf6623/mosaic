# mosaic CI —— push / PR 到 main 时跑完整门禁。
#
# 本地对应的就是这两条：
#   pnpm check      静态守卫（typecheck + check:docs + check:drift + check:size），秒级
#   pnpm test:all   真浏览器冒烟（13 站点套件 + 11 组件套件），约 1.5 分钟
#
# 冒烟测试连的是本地文档站，所以先把 tools/serve.mjs 起在后台（和本地 pnpm dev 同一条路），
# 再用 curl 等它就绪 —— 不等待就会偶发「第一个套件 404」。
#
# 浏览器：冒烟测试走 playwright-core + **系统 Chrome**（tests/lib/harness.mjs 的 CHANNEL，默认 chrome），
# ubuntu-latest 镜像自带 google-chrome-stable，所以不需要 playwright install。
# 哪天镜像里没有了：把 env.CHANNEL 换成 chromium，并在安装依赖后加一步
#   npx playwright install --with-deps chromium
#
# 没接 pnpm format:check：全仓还有几十个文件没格式化（历史遗留），接进来会一直红。
# 等清干净了再加，别让它长期挂着一条「反正一直红」的步骤 —— 那种红会训练人忽略 CI。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHANNEL: chrome
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 静态门禁
        run: pnpm check

      - name: 起文档站并等它就绪
        run: |
          node tools/serve.mjs > /tmp/serve.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8642/index.html > /dev/null; then
              echo "文档站已就绪"
              exit 0
            fi
            sleep 0.5
          done
          echo "文档站没起来，serve 日志："
          cat /tmp/serve.log
          exit 1

      - name: 浏览器冒烟（全量）
        run: pnpm test:all
