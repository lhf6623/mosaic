<template component>
  <mc-slider
    value="30"
    on:input="markInput($event)"
    on:change="markChange($event)"></mc-slider>

  <p class="mt-3 text-sm text-muted">
    最近一次事件：
    <strong>{{last}}</strong>
  </p>

  <script>
    export default async () => ({
      tag: 'demo-slider-events',

      data: { last: '（还没动过）' },

      proto: {
        /* 载荷是 { value }，值是 number —— 拖动看 input，松手 / 键盘结束看 change */
        markInput(event) {
          this.last = `input → ${event.data.value}`;
        },
        markChange(event) {
          this.last = `change → ${event.data.value}`;
        },
      },
    });
  </script>
</template>
