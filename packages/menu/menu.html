<!-- mc-menu — 数据驱动的垂直菜单容器（模板渲染：行由 o-fill 生成）。设计取舍见同目录 README.md「设计取舍」；本文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主 + 尺寸 / 色槽通道。菜单项在另一个 shadow root 里，容器选择器够不到它，
       所以只能像 mc-collapse 那样在 :host 上开一条通道，子项用 var() 带兜底值消费。 */
    :host {
      display: block;
      box-sizing: border-box;
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));

      /* 尺寸通道（三档，规范 1.3） */
      --mc-menu-item-h: var(--mc-control-h-md, var(--mc-def-control-h-md));
      --mc-menu-pad-x: var(--mc-space-4, var(--mc-def-space-4));
      --mc-menu-font: var(--mc-text-sm, var(--mc-def-text-sm));
      --mc-menu-gap: var(--mc-space-1, var(--mc-def-space-1));
      --mc-menu-radius: var(--mc-radius-md, var(--mc-def-radius-md));
      /* 压缩态宽度：默认 = 项高，于是三档尺寸下都是正方形 */
      --mc-menu-collapsed-w: var(
        --mc-menu-item-h,
        var(--mc-control-h-md, var(--mc-def-control-h-md))
      );
      --mc-menu-icon-size: 1.25em;
      --mc-menu-icon-gap: var(--mc-space-2, var(--mc-def-space-2));
      /* 每深一级的缩进量：子菜单逐级累加（数据驱动 children 的层级就靠它） */
      --mc-menu-indent-step: var(--mc-space-4, var(--mc-def-space-4));
      /* 分组标题下那一列条目的缩进：与上面那条分开 —— 侧栏的分组缩进通常比 collapsible 的逐级缩进浅 */
      --mc-menu-group-indent: var(--mc-space-3, var(--mc-def-space-3));

      /* 压缩态 / 浮层里弹出来的子菜单浮层 */
      --mc-menu-flyout-gap: var(--mc-space-2, var(--mc-def-space-2));
      --mc-menu-flyout-pad: var(--mc-space-2, var(--mc-def-space-2));
      --mc-menu-flyout-bg: var(--mc-color-surface-raised, var(--mc-def-color-surface-raised));
      --mc-menu-flyout-border: var(--mc-color-border-strong, var(--mc-def-color-border-strong));
      --mc-menu-flyout-radius: var(--mc-radius-lg, var(--mc-def-radius-lg));
      --mc-menu-flyout-shadow: var(--mc-shadow-panel, var(--mc-def-shadow-panel));
      --mc-menu-flyout-min-w: 8rem;

      /* 色槽：L3 组件令牌，默认引用 L2 语义令牌；按实例覆盖（style 上写 --mc-menu-*） */
      --mc-menu-item-color: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
      --mc-menu-item-color-hover: var(--mc-color-fg, var(--mc-def-color-fg));
      --mc-menu-item-color-current: var(--mc-color-primary, var(--mc-def-color-primary));
      --mc-menu-item-bg-hover: var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken));
      --mc-menu-item-bg-current: var(--mc-color-primary-subtle, var(--mc-def-color-primary-subtle));
      --mc-menu-group-color: var(--mc-color-fg-subtle, var(--mc-def-color-fg-subtle));
    }

    /* 2. 尺寸：默认 md 直接写在 1 区（规范 1.3） */
    :host([size='sm']) {
      --mc-menu-item-h: var(--mc-control-h-sm, var(--mc-def-control-h-sm));
      --mc-menu-pad-x: var(--mc-space-3, var(--mc-def-space-3));
      --mc-menu-font: var(--mc-text-xs, var(--mc-def-text-xs));
    }
    :host([size='lg']) {
      --mc-menu-item-h: var(--mc-control-h-lg, var(--mc-def-control-h-lg));
      --mc-menu-pad-x: var(--mc-space-5, var(--mc-def-space-5));
      --mc-menu-font: var(--mc-text-base, var(--mc-def-text-base));
    }

    /* 3. 压缩态：整栏收窄成方形；子菜单不再内联展开，脚本会把它们渲染进浮层 */
    :host([collapsed]) {
      width: var(--mc-menu-collapsed-w);
    }

    /* 4. 内部结构 */
    .mc-list {
      display: flex;
      flex-direction: column;
      gap: var(--mc-menu-gap);
      margin: 0;
      padding: 0;
    }

    /* 子菜单可以被脚本挂上 hidden（内联折叠）；:host 的 display:block 会压过 UA 的 [hidden] */
    :host([hidden]) {
      display: none;
    }

    /* 模板渲染：o-fill / o-if / .mc-node 都不生成盒子，行仍直接参与 .mc-list 的 flex 布局 */
    o-fill,
    o-if,
    .mc-node {
      display: contents;
    }

    /* 浮层面板：在 mc-menu 自己的 shadow 里，普通类规则就能压过 UA 的 [popover] 默认样式 */
    .mc-flyout {
      position: fixed;
      inset: auto;
      margin: 0;
      top: anchor(top);
      left: anchor(right);
      margin-inline-start: var(--mc-menu-flyout-gap, var(--mc-space-2, var(--mc-def-space-2)));
      width: max-content;
      min-width: var(--mc-menu-flyout-min-w, 8rem);
      max-height: min(24rem, calc(100vh - var(--mc-space-8, var(--mc-def-space-8))));
      overflow: auto;
      padding: var(--mc-menu-flyout-pad, var(--mc-space-2, var(--mc-def-space-2)));
      border: 1px solid rgb(var(--mc-menu-flyout-border, var(--mc-def-color-border-strong)));
      border-radius: var(--mc-menu-flyout-radius, var(--mc-def-radius-lg));
      background-color: rgb(var(--mc-menu-flyout-bg, var(--mc-def-color-surface-raised)));
      box-shadow: var(--mc-menu-flyout-shadow, var(--mc-shadow-panel, var(--mc-def-shadow-panel)));
      position-try-fallbacks:
        flip-block,
        flip-inline,
        flip-block flip-inline;
    }
  </style>

  <div class="mc-list" part="list">
    <slot></slot>
    <o-fill :value="rows" fill-key="key">
      <div class="mc-node">
        <o-if :value="$data.kind === 'group'">
          <mc-menu-item group attr:data-row-key="$data.key">{{$data.label}}</mc-menu-item>
        </o-if>
        <o-if :value="$data.kind !== 'group'">
          <mc-menu-item
            attr:data-row-key="$data.key"
            attr:icon="$data.icon"
            attr:label="$data.label"
            attr:href="$data.href"
            attr:current="$data.current ? '' : null"
            attr:disabled="$data.disabled ? '' : null"
            attr:data-expandable="$data.expandable ? '' : null"
            attr:data-expanded="$data.expanded ? '' : null"
            on:click="$host.onRowClick($data)"
            on:pointerenter="$host.openFlyout($data.key)"
            on:pointerleave="$host.scheduleClose($data.key)"
            on:focusin="$host.openFlyout($data.key)"
            on:focusout="$host.scheduleClose($data.key)"></mc-menu-item>
        </o-if>
        <o-if :value="$data.hasChildren">
          <o-if :value="$data.flyout">
            <div
              class="mc-flyout"
              popover="manual"
              attr:data-panel-key="$data.key"
              on:pointerenter="$host.cancelClose()"
              on:focusin="$host.cancelClose()"
              on:pointerleave="$host.scheduleClose($data.key)"
              on:focusout="$host.scheduleClose($data.key)">
              <mc-menu
                attr:data-level="$data.childLevel"
                data-flyout
                :options="$data.children"></mc-menu>
            </div>
          </o-if>
          <o-if :value="!$data.flyout">
            <mc-menu
              attr:data-level="$data.childLevel"
              attr:hidden="$data.expanded ? null : ''"
              :options="$data.children"></mc-menu>
          </o-if>
        </o-if>
      </div>
    </o-fill>
  </div>

  <script>
    /* 定住滚动条：开合原生浮层时浏览器可能顺手滚一下页面（火狐实测，见 ../boot/scroll-pin.js 的文件头） */
    import { attachFloatingScrollGuard } from '../boot/scroll-pin.js';

    export default async ({ load }) => {
      /* 数据驱动的项也是 mc-menu-item：菜单本体把同族子标签一起带进来（声明式用法本来也要引它） */
      await load('./menu-item.html');

      /* 指针从行移到浮层上要跨一条缝：给一段宽限时间，别让浮层在缝上闪掉 */
      const HOVER_CLOSE_DELAY = 120;
      /* 分组子项那一档缩进：行上写 --mc-item-step 覆盖默认的逐级步长（见 buildRows 的 step 形参） */
      const GROUP_STEP = 'var(--mc-menu-group-indent, var(--mc-space-3, var(--mc-def-space-3)))';
      /* 容器通道。嵌套实例自己的 :host 默认值会盖掉继承来的使用者覆盖（在根上写 style 的那份），
         所以建实例时把解析后的值复制成内联，整棵树共用同一套通道。 */
      const CHANNEL = [
        '--mc-menu-item-h',
        '--mc-menu-pad-x',
        '--mc-menu-font',
        '--mc-menu-gap',
        '--mc-menu-radius',
        '--mc-menu-collapsed-w',
        '--mc-menu-icon-size',
        '--mc-menu-icon-gap',
        '--mc-menu-indent-step',
        '--mc-menu-group-indent',
        '--mc-menu-flyout-gap',
        '--mc-menu-flyout-pad',
        '--mc-menu-flyout-bg',
        '--mc-menu-flyout-border',
        '--mc-menu-flyout-radius',
        '--mc-menu-flyout-shadow',
        '--mc-menu-flyout-min-w',
        '--mc-menu-item-color',
        '--mc-menu-item-color-hover',
        '--mc-menu-item-color-current',
        '--mc-menu-item-bg-hover',
        '--mc-menu-item-bg-current',
        '--mc-menu-group-color',
      ];
      /* 浮层的锚名要逐行唯一（同名锚会互相顶掉），拿实例序号拼一个 */
      let instances = 0;

      return {
        tag: 'mc-menu',

        attrs: {
          size: 'md',
          /* 压缩态：只剩 icon；有子菜单的行改成鼠标移入弹出浮层 */
          collapsed: null,
          /* 手风琴：同一层只允许一个子菜单展开（同 mc-collapse 的口径） */
          accordion: null,
          /* 默认展开：整棵摊开（每个父级行开场都是展开的），并往下传给嵌套实例。
             内联模式才有意义 —— 压缩态 / 浮层里的子菜单归 hover / focus 管。
             只摊开当前那一支不用写它：`current` 命中的分支自己会展开（见 buildRows）。 */
          expanded: null,
          /* 当前项：值是命中行的 href（最终地址）或 label 路径（祖先 label 用 / 连，如 `组件/表单`）。
             命中的行换底色加粗，**它所在的分支开场自动展开**；手风琴下同层优先留这一支。
             状态不进 options —— 路由变化只改这一个属性，行按 key 原地复用；嵌套实例由 syncChannels 下发 */
          current: null,
          /* 菜单树数据。声明进 attrs 是为了进 api.md 的「属性」表参与对账；属性通道只作 JSON 初值，
             运行时推荐 property，两条通道在 attached / watch 里汇到 data.optionList —— 规范化结果绝不写回这个键，
             否则会被 ofa 再序列化成属性文本（同 mc-pagination 的 blocks） */
          options: null,
        },

        data: {
          /* 渲染源：options 规范化后的数组。o-fill 只读它（P6：别写回 attrs 声明的键） */
          optionList: [],
          rows: [],
        },

        ready() {
          this._mounted = false;
          this._uid = ++instances;
          this._rowAttrs = new Map();
          this._flyoutRows = new Map();
          this._flyoutPanels = new Map();
          this._guards = new Map();
          this._openKeys = new Set();
          this._metaQueued = false;
          /* 挂载前赋的 property（createElement 之后马上 el.options = …）落在宿主上只是普通属性，先收下来；构造期不往宿主写属性（P31） */
          this._presetOptions = Object.prototype.hasOwnProperty.call(this.ele, 'options')
            ? this.ele.options
            : undefined;

          /* 公开的 property 通道：getter 读规范化后的数组，setter 写进去；属性通道由 watch / attached 里的
             MutationObserver 补（同 mc-pagination 的 blocks） */
          Object.defineProperty(this.ele, 'options', {
            configurable: true,
            get: () => this.optionList,
            set: (value) => {
              this._propOptions = true;
              this.applyOptions(value);
            },
          });
        },

        attached() {
          /* 初始值放在这里而不是 ready()：ofa 会把 data 的初值铺在实例上，构造期写进去的会被它盖掉。
             顺序 = 属性（JSON 兼容）→ 挂载前赋的 property（property 赢） */
          if (!this._applied) {
            this._applied = true;
            if (this.ele.hasAttribute('options')) {
              this.applyOptions(this.ele.getAttribute('options'));
            }
            if (this._presetOptions !== undefined) {
              this._propOptions = true;
              this.applyOptions(this._presetOptions);
              this._presetOptions = undefined;
            }
          }
          this._mounted = true;
          this._modeKey = this.modeKeyOf();
          this._currentAttr = this.ele.getAttribute('current');
          this._modeMo = new MutationObserver(() => {
            const key = this.modeKeyOf();
            const currentAttr = this.ele.getAttribute('current');
            const modeChanged = key !== this._modeKey;
            if (!modeChanged && currentAttr === this._currentAttr) return;
            this._modeKey = key;
            this._currentAttr = currentAttr;
            /* 换渲染结构才收浮层；只是换了当前项时开着的那层别塌掉 */
            if (modeChanged) this.closeFlyouts();
            /* 只换 current 时保留已摊开的分支（不开手风琴就没有「开一个收一个」）；结构变了才整棵重算 */
            this.rows = this.buildRows(this.optionList, { keepOpen: !modeChanged });
            this.scheduleMeta();
          });
          this._modeMo.observe(this.ele, {
            attributes: true,
            attributeFilter: ['data-flyout', 'data-level', 'accordion', 'expanded', 'current'],
          });
          this.rows = this.buildRows(this.optionList);

          /* options 的属性通道仍自己听一遍（同 mc-pagination 的 blocks）：绑定通道可能后到一段 JSON 文本；
             property 一旦写过值就不该再被它覆盖。我们从不写这个属性，所以不会自激 */
          this._attrMo = new MutationObserver(() => {
            if (this._propOptions) return;
            this.applyOptions(this.ele.getAttribute('options'));
          });
          this._attrMo.observe(this.ele, { attributes: true, attributeFilter: ['options'] });

          /* 点外部关浮层：必须用 composedPath（P20）—— contains(e.target) 在 shadow 边界上拿到的是被重定向后的宿主 */
          this._onDocPointerDown = (event) => {
            if (!this.hasOpenFlyout()) return;
            if (event.composedPath().includes(this.ele)) return;
            this.closeFlyouts();
          };
          document.addEventListener('pointerdown', this._onDocPointerDown, true);

          /* Esc 关浮层（不 preventDefault：没开浮层时一个键都不吞） */
          this._onKeyDown = (event) => {
            if (event.key !== 'Escape' || !this.hasOpenFlyout()) return;
            this.closeFlyouts();
          };
          this.ele.addEventListener('keydown', this._onKeyDown);

          /* 模板渲染是异步的：行落进 shadow 之后再接线（缩进 / 附加属性 / 浮层锚点 / 通道） */
          this._domMo = new MutationObserver(() => this.scheduleMeta());
          this._domMo.observe(this.shadow.ele, { childList: true, subtree: true });
          this.scheduleMeta();
        },

        detached() {
          this._attrMo?.disconnect();
          this._modeMo?.disconnect();
          this._domMo?.disconnect();
          document.removeEventListener('pointerdown', this._onDocPointerDown, true);
          this.ele.removeEventListener('keydown', this._onKeyDown);
          this.cancelClose();
          for (const guard of this._guards.values()) guard.dispose();
          this._guards.clear();
        },

        watch: {
          /* options 的属性 / 绑定通道先规范化（property 写过值后让位），渲染统一落在 optionList 那一条 */
          options(value) {
            if (!this._mounted || this._propOptions) return; // 首次触发落在构造期（P5）；attached 里会自己建一次
            this.applyOptions(value);
          },
          optionList() {
            if (!this._mounted) return;
            /* 换数据也按 key 保住已摊开的分支（展开是 UI 状态，不是数据）：同 key 的行才带得过来，新树自然全收起 */
            this.rows = this.buildRows(this.optionList, { keepOpen: true });
            this.scheduleMeta();
          },
          /* 压缩态换的是整个渲染结构（子菜单从内联折叠换成浮层），所以整棵重建 */
          collapsed() {
            if (!this._mounted) return;
            this.closeFlyouts();
            this.rows = this.buildRows(this.optionList);
            this.scheduleMeta();
          },
          /* 尺寸变了要重新下发通道：嵌套实例拿的是建立那一刻的内联副本 */
          size() {
            if (!this._mounted) return;
            queueMicrotask(() => this.syncChannels());
          },
        },

        proto: {
          /** 属性文本 / 数组 / null → 数组（属性通道的 JSON 兼容；首屏绑定也可能直接给数组） */
          toOptions(value) {
            if (value == null) return [];
            if (typeof value === 'string') {
              const text = value.trim();
              if (!text) return [];
              try {
                const parsed = JSON.parse(text);
                return Array.isArray(parsed) ? parsed : [];
              } catch {
                return [];
              }
            }
            return Array.isArray(value) ? value : [];
          },

          /** options 的三条通道（属性 / 绑定 / property）都汇到这里：同一段属性文本只规范化一次 */
          applyOptions(raw) {
            if (typeof raw === 'string' && raw === this._optionsSource) return; // watch 与 MutationObserver 可能各来一次
            this._optionsSource = raw;
            this.optionList = this.toOptions(raw);
          },

          /** 一条数据是什么：分组 / 有子菜单的父级 / 叶子 */
          kindOf(option) {
            const data = typeof option === 'string' ? { label: option } : (option ?? {});
            if (data.group || data.type === 'group') return 'group';
            return Array.isArray(data.children) && data.children.length ? 'parent' : 'leaf';
          },

          /** 当前项的目标：容器属性 `current` 的文本（空 = 没有当前项） */
          currentTarget() {
            const raw = this.ele.getAttribute('current');
            const text = raw == null ? '' : raw.trim();
            return text || null;
          },

          /** 目标 → 命中的那一行（返回它的 label 路径 + href），**当前项只有一个**：
              先按 label 路径精确命中，再按 href 全等（同一个 href 在树里出现多次时只认第一处）。
              对不上（写错 / 该页没进菜单）就是 null，不会有半截高亮 */
          resolveCurrent(items) {
            const target = this.currentTarget();
            if (!target) return null;
            let byHref = null;
            let byPath = null;
            const walk = (nodes, trail) => {
              for (const option of nodes ?? []) {
                if (byPath) return;
                const data = typeof option === 'string' ? { label: option } : (option ?? {});
                const label = String(data.label ?? '');
                const path = [...trail, label].filter(Boolean).join('/');
                if (this.kindOf(data) !== 'leaf') {
                  walk(data.children, [...trail, label]);
                  continue;
                }
                /* 禁用的行不给 href，也就不可能是当前项 */
                if (data.disabled || !data.href) continue;
                if (!byHref && data.href === target) byHref = { path, href: data.href };
                if (path === target) byPath = { path, href: data.href };
              }
            };
            walk(items, []);
            return byPath ?? byHref;
          },

          /** 换渲染结构的那几个属性：变了就整棵重建（watch 不够用，它们可能是内部写法） */
          modeKeyOf() {
            return [
              this.flyoutChildren(),
              this.baseLevel(),
              this.ele.hasAttribute('accordion'),
              this.ele.hasAttribute('expanded'),
            ].join(':');
          },

          /** 本实例的层级：根 = 0，父级渲染嵌套实例时写进 data-level（内部接线，不是给使用者的属性） */
          baseLevel() {
            const raw = this.ele.getAttribute('data-level');
            return raw ? Number(raw) || 0 : 0;
          },

          /** 子菜单是否走浮层：压缩态的根，以及浮层里的每一级（浮层里再内联展开会把它越撑越长） */
          flyoutChildren() {
            return this.ele.hasAttribute('collapsed') || this.ele.hasAttribute('data-flyout');
          },

          /** options → 模板用的扁平行模型。分组子项摊到同一层；父级的 children 留给嵌套 mc-menu。
              `keepOpen`：只换 `current` / 重新赋同 key 的 `options` 时用 —— 已经摊开的分支保持原样，
              当前项只负责「把命中的那一支补开」，收别人的事归 `accordion` 管（不开手风琴就没有「只能开一个」）。
              结构真变了（collapsed / expanded / accordion）就整棵重算，不带旧状态。 */
          buildRows(items, { keepOpen = false } = {}) {
            const level = this.baseLevel();
            const flyout = this.flyoutChildren();
            /* 默认展开的两条来路：`expanded` 属性（整棵摊开）、current 命中的那一支（自动） */
            const allExpanded = this.ele.hasAttribute('expanded');
            const target = this.resolveCurrent(items);
            /* 只换当前项时把上一份行模型的展开状态带过来（key 稳定，一一行对得上） */
            const prevOpen = keepOpen
              ? new Map(this.rows.map((row) => [row.key, row.expanded === true]))
              : null;
            /* 留给 syncChannels：嵌套实例拿到的 children 在另一个实例里，自己那份数据认不出目标 */
            this._currentPath = target?.path ?? null;
            const out = [];
            const seen = new Map();
            let index = 0;
            const push = (data, level, step, prefix, trail, kind) => {
              const label = String(data.label ?? '');
              /* label 路径：分组标题算一档，和使用者写 current="组件/表单/输入框" 的口径一致 */
              const path = [...trail, label].filter(Boolean).join('/');
              const base =
                data.key != null
                  ? String(data.key)
                  : kind === 'group'
                    ? 'g:' + label
                    : kind === 'parent'
                      ? 'p:' + label
                      : data.href
                        ? 'h:' + data.href
                        : 'l:' + label;
              let key = prefix + base;
              const n = seen.get(key) ?? 0;
              seen.set(key, n + 1);
              if (n) key += '#' + (n + 1);
              /* 命中的那一行在自己的分支里：开场摊开（不必写 expanded） */
              const currentBranch =
                kind === 'parent' && !!target && target.path.startsWith(path + '/');
              out.push({
                key,
                kind,
                label,
                path,
                level,
                step,
                icon: kind === 'group' ? null : (data.icon ?? null),
                href: kind === 'leaf' && !data.disabled ? (data.href ?? null) : null,
                /* 按路径比，不按 href：同一个 href 写了两行时只有命中的那一行亮 */
                current: kind === 'leaf' && !!target && path === target.path,
                disabled: !!data.disabled,
                expandable: kind === 'parent',
                hasChildren: kind === 'parent',
                children: kind === 'parent' ? data.children : null,
                childLevel: flyout ? 0 : level + 1,
                flyout,
                currentBranch,
                /* 浮层里的子菜单归 hover / focus 管，展开状态不参与 */
                expanded:
                  kind === 'parent' &&
                  !flyout &&
                  (allExpanded || currentBranch || prevOpen?.get(key) === true),
                attrs: data.attrs ?? null,
                anchor: '--mc-item-anchor-' + this._uid + '-' + index++,
              });
              return key;
            };
            const walk = (nodes, level, step, prefix, trail) => {
              for (const option of nodes ?? []) {
                const data = typeof option === 'string' ? { label: option } : (option ?? {});
                const kind = this.kindOf(data);
                const key = push(data, level, step, prefix, trail, kind);
                if (kind === 'group')
                  walk(data.children ?? [], level + 1, step ?? GROUP_STEP, key + '/', [
                    ...trail,
                    String(data.label ?? ''),
                  ]);
              }
            };
            walk(items, level, undefined, '', []);
            /* 手风琴：同一层只留一个 —— 含 current 的那一支优先（默认展开选中分支），否则最后开着的赢 */
            if (this.ele.hasAttribute('accordion')) {
              let keep = -1;
              let currentKeep = -1;
              for (let i = 0; i < out.length; i += 1) {
                if (out[i].kind !== 'parent' || !out[i].expanded) continue;
                keep = i;
                if (out[i].currentBranch) currentKeep = i;
              }
              if (currentKeep >= 0) keep = currentKeep;
              for (let i = 0; i < out.length; i += 1) {
                if (out[i].kind === 'parent' && i !== keep && out[i].expanded) {
                  out[i] = { ...out[i], expanded: false };
                }
              }
            }
            return out;
          },

          /** 行上的附加属性：这次没有的旧键要删掉，否则复用行会带着上一份 options 的 target / data-* */
          syncAttrs(el, attrs, applied) {
            const next = attrs && typeof attrs === 'object' ? attrs : {};
            for (const name of applied) {
              if (!(name in next) && el.hasAttribute(name)) el.removeAttribute(name);
            }
            applied.clear();
            for (const [name, value] of Object.entries(next)) {
              if (value == null || value === false) {
                if (el.hasAttribute(name)) el.removeAttribute(name);
                continue;
              }
              const text = value === true ? '' : String(value);
              /* 只在真的变了才写：syncMeta 可能被 shadow DOM 的 MutationObserver 再叫一次，
                 同值 setAttribute 会让 menu-item 的模型观察者再跑一轮 */
              if (el.getAttribute(name) !== text) el.setAttribute(name, text);
              applied.add(name);
            }
          },

          /** 把本实例解析后的通道复制成嵌套实例的内联样式（见 CHANNEL 处的注释） */
          copyChannel(sub) {
            const own = this.ele.style;
            const computed = this.ele.isConnected ? getComputedStyle(this.ele) : null;
            for (const name of CHANNEL) {
              const value =
                own.getPropertyValue(name).trim() || computed?.getPropertyValue(name).trim() || '';
              if (value) sub.style.setProperty(name, value);
            }
          },

          syncChannels() {
            // 批量取引用走 this.shadow.all（ofa 包装对象数组）；子菜单要对它写原生 style，逐个下 .ele
            const allExpanded = this.ele.hasAttribute('expanded');
            /* 当前项也往下发：发的是**相对那个子菜单的 label 路径**（绝对路径在子实例里没有上下文，
               发 href 又会把「同一个 href 写了两行」的歧义带下去） */
            const currentPath = this._currentPath ?? null;
            const models = new Map(this.rows.map((row) => [row.key, row]));
            for (const sub of this.shadow.all('mc-menu')) {
              this.copyChannel(sub.ele);
              /* `expanded` 也要传下去：嵌套实例是模板造的，拿不到使用者写在根上的那个属性 */
              if (sub.ele.hasAttribute('expanded') !== allExpanded) {
                sub.ele.toggleAttribute('expanded', allExpanded);
              }
              const item = sub.ele.closest('.mc-node')?.querySelector('mc-menu-item');
              const row = models.get(item?.getAttribute('data-row-key'));
              const relative =
                row && currentPath && currentPath.startsWith(row.path + '/')
                  ? currentPath.slice(row.path.length + 1)
                  : null;
              if ((sub.ele.getAttribute('current') || null) !== relative) {
                if (relative) sub.ele.setAttribute('current', relative);
                else sub.ele.removeAttribute('current');
              }
            }
          },

          /** rows 落 DOM 之后的接线：缩进、附加属性、浮层锚点、嵌套菜单的通道。 */
          syncMeta() {
            const rows = this.shadow.all('mc-menu-item[data-row-key]').map((row) => row.ele);
            const byKey = new Map(rows.map((el) => [el.getAttribute('data-row-key'), el]));
            const models = new Map(this.rows.map((row) => [row.key, row]));
            for (const [key, el] of byKey) {
              const row = models.get(key);
              if (!row) continue;
              /* 先同步附加属性（可能带 style），再写缩进通道：syncAttrs 写整段 style 会把它清掉 */
              let applied = this._rowAttrs.get(key);
              if (!applied) {
                applied = new Set();
                this._rowAttrs.set(key, applied);
              }
              this.syncAttrs(el, row.attrs, applied);
              const level = String(row.level);
              if (el.style.getPropertyValue('--mc-item-level') !== level) {
                el.style.setProperty('--mc-item-level', level);
              }
              const step = row.step ?? '';
              if (row.step) {
                if (el.style.getPropertyValue('--mc-item-step') !== step) {
                  el.style.setProperty('--mc-item-step', step);
                }
              } else if (el.style.getPropertyValue('--mc-item-step')) {
                el.style.removeProperty('--mc-item-step');
              }
            }
            for (const key of [...this._rowAttrs.keys()])
              if (!models.has(key)) this._rowAttrs.delete(key);

            this._flyoutRows.clear();
            this._flyoutPanels.clear();
            const panels = this.shadow.all('.mc-flyout[data-panel-key]').map((p) => p.ele);
            const panelByKey = new Map(panels.map((el) => [el.getAttribute('data-panel-key'), el]));
            for (const row of this.rows) {
              if (!row.flyout || !row.hasChildren) continue;
              const el = byKey.get(row.key);
              const panel = panelByKey.get(row.key);
              if (!el || !panel) continue;
              el.style.setProperty('anchor-name', row.anchor);
              panel.style.setProperty('position-anchor', row.anchor);
              this._flyoutRows.set(row.key, el);
              this._flyoutPanels.set(row.key, panel);
            }
            this.syncChannels();
          },

          scheduleMeta() {
            if (this._metaQueued) return;
            this._metaQueued = true;
            queueMicrotask(() => {
              this._metaQueued = false;
              this.syncMeta();
            });
          },

          /** 父级行点击：内联模式只翻自身（手风琴下先收同层其它分支）；浮层模式交给 hover / focus */
          onRowClick(row) {
            if (!row || row.kind !== 'parent' || row.flyout || row.disabled) return;
            const accordion = this.ele.hasAttribute('accordion');
            const targetKey = row.key;
            const next = this.rows.map((item) => {
              if (item.kind !== 'parent') return item;
              if (item.key === targetKey) return { ...item, expanded: !item.expanded };
              if (accordion && item.expanded) return { ...item, expanded: false };
              return item;
            });
            this.rows = next;
            this.scheduleMeta();
          },

          hasOpenFlyout() {
            return this._openKeys.size > 0;
          },

          openFlyout(key) {
            if (!this.flyoutChildren()) return;
            const row = this._flyoutRows.get(key);
            const panel = this._flyoutPanels.get(key);
            if (!row || !panel || row.hasAttribute('disabled')) return;
            this.cancelClose();
            for (const other of [...this._openKeys]) if (other !== key) this.closeFlyout(other);
            this._openKeys.add(key);
            row.setAttribute('data-open', '');
            if (!panel.matches(':popover-open')) {
              /* 显式开合那一瞬也要包 run()：toggle 事件是排队发的，挡不住同步动作那一下的位移 */
              let guard = this._guards.get(key);
              if (!guard) {
                guard = attachFloatingScrollGuard(this.ele, panel);
                this._guards.set(key, guard);
              }
              guard.run(() => panel.showPopover());
            }
          },

          closeFlyout(key) {
            const panel = this._flyoutPanels.get(key);
            const row = this._flyoutRows.get(key);
            if (panel?.matches(':popover-open')) {
              const guard = this._guards.get(key);
              if (guard) guard.run(() => panel.hidePopover());
              else panel.hidePopover();
            }
            /* 一起收起浮层里的每一级：外层关了、内层还挂在 top layer 就会变成一块孤儿面板 */
            for (const sub of panel?.querySelectorAll('mc-menu') ?? [])
              sub.__xhear__?.closeFlyouts?.();
            this._openKeys.delete(key);
            row?.removeAttribute('data-open');
          },

          closeFlyouts() {
            this.cancelClose();
            for (const key of [...this._flyoutPanels.keys()]) this.closeFlyout(key);
          },

          scheduleClose(key) {
            this.cancelClose();
            this._closeTimer = setTimeout(() => this.closeFlyout(key), HOVER_CLOSE_DELAY);
          },

          cancelClose() {
            clearTimeout(this._closeTimer);
            this._closeTimer = null;
          },
        },
      };
    };
  </script>
</template>
