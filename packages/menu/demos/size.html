<template component>
  <mc-space block wrap-items align="start">
    <mc-menu id="size-sm" size="sm" current="account" :options="menuOptions" style="width: 9rem"></mc-menu>
    <mc-menu id="size-md" size="md" current="account" :options="menuOptions" style="width: 9rem"></mc-menu>
    <mc-menu id="size-lg" size="lg" current="account" :options="menuOptions" style="width: 9rem"></mc-menu>
  </mc-space>

  <script>
    /* 尺寸写在容器上，options 渲染出来的整棵树跟着走。内容用短标签，三档并排时更好比较行高。 */
    const OPTIONS = [
      { key: 'account', label: '账户', icon: 'user' },
      { key: 'notify', label: '通知', icon: 'bell' },
      { key: 'privacy', label: '隐私', icon: 'lock' },
      { key: 'help', label: '帮助', icon: 'help', href: 'packages/menu/page.html' },
    ];

    export default async () => ({
      tag: 'demo-menu-size',
      data: { menuOptions: OPTIONS },

      ready() {
        /* 三档尺寸各是一个独立菜单：点哪个只改哪个的 current */
        for (const menu of this.shadow.all('mc-menu')) {
          menu.on('navigate', (event) => {
            /* 演示统一不跳转：点任何行只换当前项，真正的跳转见「跳转链接」演示 */
            event.preventDefault();
            menu.ele.setAttribute('current', event.detail.key);
          });
        }
      },
    });
  </script>
</template>
