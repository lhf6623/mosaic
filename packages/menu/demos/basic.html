<template component>
  <mc-space block wrap-items align="start">
    <mc-button size="sm" variant="outline" on:click="add()">加一项</mc-button>
    <mc-menu id="options-menu" :options="menuOptions" style="width: 13rem"></mc-menu>
  </mc-space>

  <script>
    import { hashOf } from '../../../docs/routes.js';

    /* href 是**最终地址**：站内链接的部署前缀由站点自己补（这里用 docs/routes.js 的 hashOf）。
       attrs = 行上的额外属性（target / rel / title 会转给内置 <a>，其余落在行上给 JS 钩子 / 行内样式） */
    const OPTIONS = [
      { label: '首页', icon: 'menu', href: hashOf('packages/menu/page.html'), current: true },
      { type: 'group', label: '导航' },
      {
        label: '组件',
        icon: 'file',
        /* children = 二级菜单：父级是个开合按钮（不导航），子项点开才出现 */
        children: [
          { label: '按钮', href: hashOf('packages/button/page.html') },
          { label: '图标', href: hashOf('packages/icon/page.html') },
          { label: '折叠面板', href: hashOf('packages/collapse/page.html') },
        ],
      },
      { label: '设置', icon: 'settings', href: hashOf('packages/color/page.html') },
      { label: '禁用项', icon: 'lock', disabled: true },
      {
        label: 'ofa.js',
        icon: 'external',
        href: 'https://ofajs.com',
        attrs: { target: '_blank', rel: 'noreferrer', title: '外链：新窗口打开' },
      },
    ];

    export default async () => ({
      tag: 'demo-menu-basic',

      /* 对象数组走 data + :options（ofa 模板口径）。重新赋值时按 key 复用行：同 key 只更新属性 */
      data: { menuOptions: OPTIONS, extra: 0 },

      proto: {
        /* 换一份 options：原样的行原地复用，只有多出来的那条才建新节点 */
        add() {
          this.extra += 1;
          this.menuOptions = [
            ...OPTIONS,
            { label: `动态项 ${this.extra}`, icon: 'star', href: hashOf('packages/tag/page.html') },
          ];
        },
      },
    });
  </script>
</template>
