<template component>
  <mc-menu id="options-menu" current="settings" :options="menuOptions" style="width: 13rem"></mc-menu>

  <script>
    /* href 照普通链接的写法写（按 document.baseURI 解析）；在 o-app 里站内链接自动交给
       ofa 路由，不在就原生跳转，两种环境不用写任何属性。attrs = 行上的额外属性
       （target / rel / title 转给内置 <a>，其余落在行上给 JS 钩子 / 行内样式）
       当前项在容器上（current="settings"，也收 href）：数据里不存高亮 / 展开这类状态 */
    const OPTIONS = [
      { key: 'group-nav', type: 'group', label: '导航' },
      {
        key: 'components',
        label: '组件',
        icon: 'file',
        /* children = 二级菜单：父级是个开合按钮（不导航），子项点开才出现 */
        children: [
          { key: 'components/button', label: '按钮', icon: 'plus', href: 'packages/button/page.html' },
          { key: 'components/icon', label: '图标', icon: 'star', href: 'packages/icon/page.html' },
          { key: 'components/collapse', label: '折叠面板', icon: 'folder', href: 'packages/collapse/page.html' },
        ],
      },
      { key: 'settings', label: '设置', icon: 'settings', href: 'packages/color/page.html' },
      { key: 'disabled', label: '禁用项', icon: 'lock', disabled: true },
      /* 没有 href 的行渲染成 <button>（按钮型）：点击只发 navigate 事件、不跳转，动作由宿主接 */
      { key: 'action', label: '动作项', icon: 'plus' },
      {
        key: 'ofajs',
        label: 'ofa.js',
        icon: 'external',
        href: 'https://ofajs.com',
        attrs: { target: '_blank', rel: 'noreferrer', title: '外链：新窗口打开' },
      },
    ];

    export default async () => ({
      tag: 'demo-menu-basic',

      /* 对象数组走 data + :options（ofa 模板口径） */
      data: { menuOptions: OPTIONS },

      /* 动作项（没有 href，渲染成 <button>）点完不跳转：把容器上的 current 指到它的 key，
         高亮跟着走 —— 按钮型行自己决定「点了算什么状态」 */
      ready() {
        const menu = this.shadow.$('#options-menu');
        menu?.on('navigate', (event) => {
          if (event.detail.key === 'action') menu.ele.setAttribute('current', 'action');
        });
      },
    });
  </script>
</template>
