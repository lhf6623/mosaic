<template component>
  <mc-menu id="groups-menu" :options="menuOptions" style="width: 12rem"></mc-menu>

  <script>
    /* 分组 = type: 'group'：标题不可交互。带 children 时标题下面一列条目**常显**、缩进一档
       （侧栏用法，doc-nav 就是这么渲染的）；不带 children 就是一条纯标题。 */
    const OPTIONS = [
      /* 不带 children：只有一条标题 */
      { key: 'group-start', type: 'group', label: '开始' },
      {
        key: 'group-guide',
        type: 'group',
        label: '指南',
        children: [
          { key: 'guide/install', label: '安装', icon: 'download', href: 'packages/menu/page.html' },
          { key: 'guide/config', label: '配置', icon: 'settings' },
          { key: 'guide/theme', label: '主题', icon: 'sun' },
        ],
      },
      {
        key: 'group-api',
        type: 'group',
        label: 'API',
        children: [
          { key: 'api/menu', label: 'Menu', icon: 'menu' },
          { key: 'api/menu-item', label: 'Menu Item', icon: 'file' },
        ],
      },
      /* 不带 children：只有一条标题 */
      { key: 'group-more', type: 'group', label: '更多' },
    ];

    export default async () => ({
      tag: 'demo-menu-groups',
      data: { menuOptions: OPTIONS },

      ready() {
        const menu = this.shadow.$('#groups-menu');
        menu?.on('navigate', (event) => {
          /* 演示统一不跳转：点任何行只换当前项，真正的跳转见「跳转链接」演示 */
          event.preventDefault();
          menu.ele.setAttribute('current', event.detail.key);
        });
      },
    });
  </script>
</template>
