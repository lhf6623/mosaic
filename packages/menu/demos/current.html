<template component>
  <mc-space block wrap-items align="start">
    <mc-menu
      id="current-menu"
      :current="currentItem"
      :options="menuOptions"
      style="width: 14rem"></mc-menu>

    <mc-space direction="vertical" gap="sm">
      <mc-button size="sm" on:click="pick('基础')">基础</mc-button>
      <mc-button size="sm" on:click="pick('组件/按钮')">组件/按钮</mc-button>
      <mc-button size="sm" on:click="pick('组件/表单/输入框')">组件/表单/输入框</mc-button>
      <mc-button size="sm" on:click="pick('设置')">设置</mc-button>
    </mc-space>
  </mc-space>

  <script>
    /* 当前项是容器上的一个属性：值写命中行的 href（就是数据里写的那个地址），或 label 路径（祖先 label 用 / 连接）。
       命中的行换底色加粗，**它所在的分支开场就展开** —— 不用再写 expanded，也不在数据里留状态。
       路由变化时只改这一个属性（下面几个按钮就是在改它）：行按 key 原地复用，不重建。
       禁用在数据里（disabled）：禁用的行不给 href（点不动、也进不了焦点顺序）。 */
    const OPTIONS = [
      { label: '基础', href: 'packages/menu/page.html' },
      {
        label: '组件',
        children: [
          { label: '按钮', href: 'packages/button/page.html' },
          {
            label: '表单',
            children: [
              { label: '输入框', href: 'packages/input/page.html' },
              { label: '下拉选择', href: 'packages/select/page.html' },
            ],
          },
        ],
      },
      { label: '设置', href: 'packages/color/page.html' },
      { label: '禁用项', disabled: true },
    ];

    export default async () => ({
      tag: 'demo-menu-current',
      data: { currentItem: '组件/表单/输入框', menuOptions: OPTIONS },

      proto: {
        /* 换当前项只动这一个属性：写 href 或 label 路径都行，这里用 label 路径更好读 */
        pick(label) {
          this.currentItem = label;
        },
      },
    });
  </script>
</template>
