<template component>
  <mc-space block wrap-items align="start">
    <mc-menu
      id="current-menu"
      :current="currentItem"
      :options="menuOptions"
      style="width: 14rem"></mc-menu>

    <mc-space direction="vertical" gap="sm">
      <mc-button size="sm" on:click="pick('overview')">概览</mc-button>
      <mc-button size="sm" on:click="pick('projects/active')">项目/进行中</mc-button>
      <mc-button size="sm" on:click="pick('team/roles/admin')">团队/角色/管理员</mc-button>
      <mc-button size="sm" on:click="pick('settings')">设置</mc-button>
    </mc-space>
  </mc-space>

  <script>
    /* 当前项是容器上的一个属性：值写命中行的 key。
       命中的行换底色加粗、路径上的父级换强调色，**它所在的分支开场就展开** —— 不用再写 expanded，
       也不在数据里留状态。内容按「后台路由」来配：初始当前项在第三层，右侧按钮改这一个属性。
       禁用在数据里（disabled）：禁用的行不给 href（点不动、也进不了焦点顺序）。 */
    const OPTIONS = [
      { key: 'overview', label: '概览', icon: 'menu', href: 'packages/menu/page.html' },
      {
        key: 'projects',
        label: '项目',
        icon: 'folder',
        children: [
          { key: 'projects/active', label: '进行中', icon: 'play' },
          { key: 'projects/archive', label: '已归档', icon: 'folder' },
        ],
      },
      {
        key: 'team',
        label: '团队',
        icon: 'user',
        children: [
          { key: 'team/members', label: '成员', icon: 'user' },
          {
            key: 'team/roles',
            label: '角色',
            icon: 'lock',
            children: [
              { key: 'team/roles/admin', label: '管理员', icon: 'star' },
              { key: 'team/roles/guest', label: '访客', icon: 'eye' },
            ],
          },
        ],
      },
      { key: 'settings', label: '设置', icon: 'settings', href: 'packages/color/page.html' },
      { key: 'audit', label: '审计日志', icon: 'lock', disabled: true },
    ];

    export default async () => ({
      tag: 'demo-menu-current',
      data: { currentItem: 'team/roles/admin', menuOptions: OPTIONS },

      ready() {
        const menu = this.shadow.$('#current-menu');
        menu?.on('navigate', (event) => {
          /* 演示统一不跳转：点任何行只换当前项，真正的跳转见「跳转链接」演示 */
          event.preventDefault();
          this.currentItem = event.detail.key;
        });
      },

      proto: {
        /* 换当前项只动这一个属性：值就是下面数据里的 key */
        pick(label) {
          this.currentItem = label;
        },
      },
    });
  </script>
</template>
