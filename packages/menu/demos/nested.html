<template component>
  <mc-menu id="nested-menu" :options="menuOptions" style="width: 14rem"></mc-menu>

  <script>
    /* 文件树：children 逐级渲染，每深一级缩进一档（--mc-menu-indent-step），父级行是开合开关、不导航。
       层级由容器自己算，使用者的数据里没有 level 这种字段。
       同一层里有 icon 与没 icon 的行混排：没写 icon 的行文字照样与同层对齐。 */
    const OPTIONS = [
      {
        key: 'src',
        label: 'src',
        icon: 'folder',
        children: [
          {
            key: 'src/components',
            label: 'components',
            icon: 'folder',
            children: [
              { key: 'src/components/button', label: 'button.ts', icon: 'file' },
              { key: 'src/components/input', label: 'input.ts', icon: 'file' },
              { key: 'src/components/table', label: 'table.ts', icon: 'file' },
              { key: 'src/components/index', label: 'index.ts' },
            ],
          },
          {
            key: 'src/tokens',
            label: 'tokens',
            icon: 'folder',
            children: [
              { key: 'src/tokens/color', label: 'color.css' },
              { key: 'src/tokens/spacing', label: 'spacing.css' },
            ],
          },
          { key: 'src/main', label: 'main.ts' },
        ],
      },
      {
        key: 'docs',
        label: 'docs',
        icon: 'folder',
        children: [
          { key: 'docs/guide', label: 'guide.md' },
          { key: 'docs/faq', label: 'faq.md' },
        ],
      },
      { key: 'readme', label: 'README.md', href: 'packages/menu/page.html' },
    ];

    export default async () => ({
      tag: 'demo-menu-nested',
      data: { menuOptions: OPTIONS },

      ready() {
        const menu = this.shadow.$('#nested-menu');
        menu?.on('navigate', (event) => {
          /* 演示统一不跳转：点任何行只换当前项，真正的跳转见「跳转链接」演示 */
          event.preventDefault();
          menu.ele.setAttribute('current', event.detail.key);
        });
      },
    });
  </script>
</template>
