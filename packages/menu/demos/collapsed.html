<template component>
  <!-- 外框：模拟真实侧栏那一档宽度 —— 最宽 240px，容器更窄时跟着收（宽度自适应，不写死）。
       菜单撑满它，压缩态再由容器自己收回方形 -->
  <div style="max-width: 240px">
    <mc-space direction="vertical" block>
      <!-- 开关：打开 = 压缩态（checked 是受控值，change 里回写演示的 data） -->
      <mc-switch
        style="align-self: start"
        attr:checked="collapsed ? '' : null"
        on:change="collapsed = $event.data.checked">压缩</mc-switch>

      <mc-menu
        id="collapsed-menu"
        current="home"
        attr:collapsed="collapsed ? '' : null"
        :options="menuOptions"></mc-menu>
    </mc-space>
  </div>

  <script>
    /* 压缩态：整栏收成方形，项上只留 icon、分组标题整行折掉；有子菜单的行鼠标移入（或键盘聚焦）
       后弹出浮层。内容按「工作台图标栏」来配：首页 / 项目 / 团队 / 设置，项目下面还有一层归档。
       ⚠️ 不要在压缩态那份菜单上写死 width（含 width: 100%）—— 行内宽度会压过
       --mc-menu-collapsed-w；展开态靠父级是块级布局自然撑满，压缩态由容器自己收回方形。 */
    const OPTIONS = [
      { key: 'group-workspace', type: 'group', label: '工作台' },
      { key: 'home', label: '首页', icon: 'menu', href: 'packages/menu/page.html' },
      {
        key: 'projects',
        label: '项目',
        icon: 'folder',
        children: [
          { key: 'projects/active', label: '进行中', icon: 'play' },
          {
            key: 'projects/archive',
            label: '已归档',
            icon: 'folder',
            children: [
              { key: 'projects/archive/2025', label: '2025', icon: 'calendar' },
              { key: 'projects/archive/2024', label: '2024', icon: 'calendar' },
            ],
          },
        ],
      },
      {
        key: 'team',
        label: '团队',
        icon: 'user',
        children: [
          { key: 'team/members', label: '成员', icon: 'user' },
          { key: 'team/roles', label: '角色', icon: 'lock' },
        ],
      },
      { key: 'settings', label: '设置', icon: 'settings' },
    ];

    export default async () => ({
      tag: 'demo-menu-collapsed',

      data: { collapsed: false, menuOptions: OPTIONS },

      ready() {
        const menu = this.shadow.$('#collapsed-menu');
        menu?.on('navigate', (event) => {
          /* 演示统一不跳转：点任何行只换当前项，真正的跳转见「跳转链接」演示 */
          event.preventDefault();
          menu.ele.setAttribute('current', event.detail.key);
        });
      },
    });
  </script>
</template>
