<template component>
  <!-- 外框：模拟真实侧栏那一档宽度 —— 最宽 240px，容器更窄时跟着收（宽度自适应，不写死）。
       菜单撑满它，压缩态再由容器自己收回方形 -->
  <div style="max-width: 240px">
    <mc-space direction="vertical" block>
      <!-- 开关：打开 = 压缩态（checked 是受控值，change 里回写演示的 data） -->
      <mc-switch
        style="align-self: start"
        attr:checked="collapsed ? '' : null"
        on:change="collapsed = $event.data.checked">压缩</mc-switch>

      <mc-menu
        id="collapsed-menu"
        current="home"
        attr:collapsed="collapsed ? '' : null"
        :options="menuOptions"></mc-menu>
    </mc-space>
  </div>

  <script>
    /* 压缩态：整栏收成方形，项上只留 icon、分组标题整行折掉；有子菜单的行鼠标移入（或键盘聚焦）
       后弹出浮层。⚠️ 不要在压缩态那份菜单上写死 width（含 width: 100%）—— 行内宽度会压过
       --mc-menu-collapsed-w；展开态靠父级是块级布局自然撑满，压缩态由容器自己收回方形。 */
    const OPTIONS = [
      { key: 'group-nav', type: 'group', label: '导航' },
      { key: 'home', label: '首页', icon: 'menu', href: 'packages/menu/page.html' },
      {
        key: 'components',
        label: '组件',
        icon: 'file',
        children: [
          { key: 'components/button', label: '按钮', icon: 'file', href: 'packages/button/page.html' },
          { key: 'components/icon', label: '图标', icon: 'star', href: 'packages/icon/page.html' },
          {
            key: 'components/form',
            label: '表单',
            icon: 'settings',
            children: [
              { key: 'components/form/input', label: '输入框', icon: 'edit', href: 'packages/input/page.html' },
              { key: 'components/form/select', label: '下拉选择', icon: 'check', href: 'packages/select/page.html' },
            ],
          },
        ],
      },
      { key: 'settings', label: '设置', icon: 'settings', href: 'packages/color/page.html' },
    ];

    export default async () => ({
      tag: 'demo-menu-collapsed',

      data: { collapsed: false, menuOptions: OPTIONS },
    });
  </script>
</template>
