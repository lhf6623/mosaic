<template component>
  <style>
    /* 外层样式两条路：① 宿主 style / 令牌（静态覆盖）② 行级内联 style（options.attrs.style） */
    #customize-demo mc-menu {
      width: 14rem;
      /* ① 令牌按实例覆盖：当前项的底色 / 字色、左右内边距、层级缩进。
         令牌是继承属性，能穿 shadow 边界，所以写在宿主上也进得去 */
      --mc-menu-item-bg-current: var(--mc-color-info-subtle);
      --mc-menu-item-color-current: var(--mc-color-info);
      --mc-menu-pad-x: var(--mc-space-5);
      --mc-menu-indent-step: var(--mc-space-3);
    }
  </style>

  <div id="customize-demo">
    <mc-menu id="customize-menu" :options="menuOptions"></mc-menu>
  </div>

  <script>
    import { hashOf } from '../../../docs/routes.js';

    /* ② 行级装饰走 options.attrs.style：行生成在 mc-menu 的 shadow 里，外层选择器选不中它，
       单行补的竖条 / 虚线框只能写成行上的内联 style（data-* 留给 JS 查状态，CSS 同样够不到）。 */
    const OPTIONS = [
      {
        label: '当前项换成信息色',
        href: hashOf('packages/menu/page.html'),
        current: true,
        attrs: { style: 'box-shadow: inset 3px 0 0 rgb(var(--mc-color-info))' },
      },
      { label: '行距和内边距也换了', href: hashOf('packages/button/page.html') },
      {
        label: '子菜单缩进也换了',
        expanded: true,
        children: [{ label: '子项', href: hashOf('packages/icon/page.html') }],
      },
      {
        label: '禁用项：外面补了虚线',
        disabled: true,
        attrs: { style: 'outline: 1px dashed rgb(var(--mc-color-border)); outline-offset: -1px' },
      },
    ];

    export default async () => ({
      tag: 'demo-menu-customize',
      data: { menuOptions: OPTIONS },
    });
  </script>
</template>
