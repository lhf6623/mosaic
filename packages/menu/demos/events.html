<template component>
  <mc-menu id="events-menu" :options="menuOptions" style="width: 14rem"></mc-menu>

  <p class="mt-3 text-sm text-muted">
    最近一次事件：
    <strong>{{last}}</strong>
  </p>

  <script>
    export default async () => ({
      tag: 'demo-menu-events',

      data: {
        menuOptions: [
          { key: 'create', label: '新建项目', icon: 'plus', meta: { action: 'create' } },
          { key: 'import-data', label: '导入数据', icon: 'upload', meta: { action: 'import' } },
          { key: 'export', label: '导出报表', icon: 'download', meta: { action: 'export' } },
          { key: 'docs', label: '查看文档', icon: 'link', href: 'packages/menu/page.html' },
        ],
        last: '（还没点过）',
      },

      /* navigate 在行上触发、冒泡 + composed，挂在容器上能收全部行；载荷在 event.detail。
         这个演示把跳转拦下来（preventDefault）—— 不然一点就 SPA 切页，日志看不到。
         按钮型行没有 href，靠 meta 带业务动作；链接行仍然有 href，但同样被拦下。 */
      ready() {
        const menu = this.shadow.$('#events-menu');
        menu?.on('navigate', (event) => {
          const meta = event.detail.meta ? ` · meta=${JSON.stringify(event.detail.meta)}` : '';
          this.last = `${event.detail.key} · href=${event.detail.href ?? '—'}${meta}`;
          menu.ele.setAttribute('current', event.detail.key);
          event.preventDefault();
        });
      },
    });
  </script>
</template>
