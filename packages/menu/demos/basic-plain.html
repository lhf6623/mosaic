<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.5/dist/ofa.min.mjs"
      type="module"></script>
  </head>
  <body>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/menu/menu.html"></l-m>

    <mc-menu id="options-menu" current="components/action" style="width: 13rem"></mc-menu>

    <script>
      /* options 是对象数组，用 property 传；href 照普通链接的写法写 —— 普通页面里就是原生跳转 */
      const OPTIONS = [
        { key: 'group-nav', type: 'group', label: '导航' },
        {
          key: 'components',
          label: '组件',
          icon: 'file',
          /* children = 二级菜单：父级是开合按钮（不导航），子项点开才出现 */
          children: [
            { key: 'components/button', label: '按钮', icon: 'plus', href: '#' },
            { key: 'components/icon', label: '图标', icon: 'star', href: '#' },
            { key: 'components/collapse', label: '折叠面板', icon: 'folder', href: '#' },
            /* 子菜单里同样可以有按钮型行：没有 href 就不跳转，点击只发 navigate */
            { key: 'components/action', label: '动作项', icon: 'edit' },
          ],
        },
        { key: 'settings', label: '设置', icon: 'settings', href: '#' },
        { key: 'disabled', label: '禁用项', icon: 'lock', disabled: true },
        /* 没有 href 的行渲染成 <button>（按钮型）：点击只发 navigate 事件、不跳转，动作由宿主接 */
        { key: 'action', label: '动作项', icon: 'plus' },
        {
          key: 'ofajs',
          label: 'ofa.js',
          icon: 'external',
          href: 'https://ofajs.com',
          attrs: { target: '_blank', rel: 'noreferrer', title: '外链：新窗口打开' },
        },
      ];

      const menu = document.getElementById('options-menu');

      /* 动作项（没有 href，渲染成 <button>）点完不跳转：把容器上的 current 指到它的 key，高亮跟着走 */
      menu.addEventListener('navigate', (event) => {
        if (!event.detail.href) menu.setAttribute('current', event.detail.key);
      });

      customElements.whenDefined('mc-menu').then(() => {
        menu.options = OPTIONS;
      });
    </script>

  </body>
</html>
