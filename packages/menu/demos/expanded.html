<template component>
  <mc-menu
    id="expanded-menu"
    expanded
    current="components/form/select"
    :options="menuOptions"
    style="width: 14rem"></mc-menu>

  <script>
    /* 默认展开是容器上的一个布尔属性：整棵摊开，每一级父级行开场就是展开的（数据里没有展开状态）。
       内容按「文档树」来配：指南 / 组件（表单下面还有两层）—— 打开页面时整条分支都摊开。 */
    const OPTIONS = [
      {
        key: 'guide',
        label: '指南',
        icon: 'file',
        children: [
          { key: 'guide/start', label: '快速开始', icon: 'play', href: 'packages/menu/page.html' },
          { key: 'guide/install', label: '安装', icon: 'download' },
          { key: 'guide/config', label: '配置', icon: 'settings' },
        ],
      },
      {
        key: 'components',
        label: '组件',
        icon: 'folder',
        children: [
          {
            key: 'components/form',
            label: '表单',
            icon: 'edit',
            children: [
              { key: 'components/form/input', label: '输入框', icon: 'edit' },
              { key: 'components/form/select', label: '下拉选择', icon: 'check' },
            ],
          },
          { key: 'components/table', label: '表格', icon: 'table' },
        ],
      },
      { key: 'api', label: 'API', icon: 'code' },
    ];

    export default async () => ({
      tag: 'demo-menu-expanded',
      data: { menuOptions: OPTIONS },

      ready() {
        const menu = this.shadow.$('#expanded-menu');
        menu?.on('navigate', (event) => {
          /* 演示统一不跳转：点任何行只换当前项，真正的跳转见「跳转链接」演示 */
          event.preventDefault();
          menu.ele.setAttribute('current', event.detail.key);
        });
      },
    });
  </script>
</template>
