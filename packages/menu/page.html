      <code>mc-menu</code>

    <p class="doc-lead">
      <b>推荐用法只有一种</b>

      <code>options</code>
      传对象数组，容器自己渲染出整棵树 ——
      分组、图标、层级缩进、二级菜单都在数据里，不用写任何菜单项标签。菜单项（
      <code>mc-menu-item</code>
      ）的属性和插槽是内部 / 兼容通道，
      <b>不推荐</b>
      手写；只有要
      <code>olink</code>
      或插槽里放别的东西时才走最后那条「自备控件」。
    </p>

        <code>options</code>

        <code>label</code>
        /
        <code>icon</code>
        /
        <code>href</code>
        /
        <code>current</code>
        /
        <code>disabled</code>

        <code>type: 'group'</code>

        <code>children</code>

        <code>href</code>
        是最终地址 —— 部署前缀由站点自己补（这里用
        <code>hashOf()</code>
        ），组件不碰路由；外链之类要写在链接上的属性放
        <code>attrs</code>

        <code>target</code>
        /
        <code>rel</code>
        /
        <code>title</code>
        会转给内置
        <code>&lt;a&gt;</code>

        <code>data-*</code>
