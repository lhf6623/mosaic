    <h1>Menu <code>mc-menu</code></h1>
    <p class="doc-lead">
      垂直菜单。容器 + 菜单项两个标签；交互元素（原生 <code>&lt;a&gt;</code> /
      <code>&lt;button&gt;</code>）由使用者写在菜单项里，组件不造链接、也不改使用者的 DOM。
    </p>

    <section class="doc-demo">
      <h3>基本用法</h3>
      <p class="doc-hint">
        一个菜单项里放一个原生 <code>&lt;a&gt;</code>，它自己就是整行；当前项在
        <code>&lt;a&gt;</code> 上写 <code>data-current</code>。 菜单与菜单项都撑满父容器 ——
        要限宽就写在菜单自己的 <code>style</code> 上，或者套一层定宽容器。
      </p>
