<!-- mc-breadcrumb-item — 面包屑的一级（配合 mc-breadcrumb）；设计取舍见 README.md 的「设计取舍」。经 CDN 直发。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主 = 一段文字。⚠️ --mc-breadcrumb-* 不能在这里写默认值，会盖掉容器继承来的通道；font 退回继承 */
    :host {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      max-width: 100%;
      font: inherit;
      color: rgb(
        var(--mc-breadcrumb-item-color, var(--mc-color-fg-muted, var(--mc-def-color-fg-muted)))
      );
    }

    /* 2. 维度 / 3. 尺寸：没有 variant 与 size（同容器） */

    /* 4. 当前项（最后一级）：字色更实 + 中等字重 */
    :host([current]) {
      color: rgb(var(--mc-breadcrumb-current-color, var(--mc-color-fg, var(--mc-def-color-fg))));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
    }

    /* 5. 插槽里的原生 <a>：行盒子在宿主上，链接只承载语义与交互。⚠️ ::slotted(a) 上的颜色/下划线安全
       （祖先 shadow 树没声明过），但 <button> 不承诺 —— shadow-base 的 reset 会赢（P33） */
    ::slotted(a) {
      color: inherit;
      text-decoration: none;
      border-radius: var(--mc-radius-sm, var(--mc-def-radius-sm));
      transition: color var(--mc-duration-fast, var(--mc-def-duration-fast))
        var(--mc-ease-standard, var(--mc-def-ease-standard));
    }
    ::slotted(a:hover) {
      color: rgb(var(--mc-breadcrumb-item-color-hover, var(--mc-color-fg, var(--mc-def-color-fg))));
      text-decoration: underline;
      text-underline-offset: 0.25em;
    }
    /* 焦点环用 ring 令牌，不用 currentColor（P16） */
    ::slotted(a:focus-visible) {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }
  </style>

  <slot></slot>

  <script>
    export default async () => ({
      tag: 'mc-breadcrumb-item',

      attrs: {
        // 布尔属性默认值必须是 null，否则 <mc-breadcrumb-item current> 会被默认值冲掉（P1）
        current: null,
      },

      attached() {
        // 宿主属性一律等构造期结束再写（P31）
        this.applyRole();
        this.applyCurrent();
      },

      watch: {
        current() {
          // 首次触发落在构造期，跳过（P5）
          if (this._currentWatchInit === undefined) {
            this._currentWatchInit = true;
            return;
          }
          this.applyCurrent();
        },
      },

      proto: {
        applyRole() {
          if (!this.ele.hasAttribute('role')) this.ele.setAttribute('role', 'listitem');
        },

        /** current → aria-current="page"。⚠️ 只摘掉组件自己写上去的那个，使用者手写的 aria-current 不动 */
        applyCurrent() {
          if (this.ele.hasAttribute('current')) {
            this.ele.setAttribute('aria-current', 'page');
            this._ariaCurrent = true;
          } else if (this._ariaCurrent) {
            this.ele.removeAttribute('aria-current');
            this._ariaCurrent = false;
          }
        },
      },
    });
  </script>
</template>
