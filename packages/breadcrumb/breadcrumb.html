<!-- mc-breadcrumb — 面包屑容器；设计取舍见 README.md 的「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主盒模型 + 色槽默认值 */
    :host {
      display: block;
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-text-sm, var(--mc-def-text-sm));
      line-height: var(--mc-text-sm-lh, var(--mc-def-text-sm-lh));
      color: rgb(var(--mc-color-fg-muted, var(--mc-def-color-fg-muted)));

      /* 分隔符。separator 属性会在 attached() 里落到同一个变量上，所以两条路都通：
         separator=">" 与 style="--mc-breadcrumb-sep: '·'" */
      --mc-breadcrumb-sep: '/';

      --mc-breadcrumb-item-color: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
      --mc-breadcrumb-item-color-hover: var(--mc-color-fg, var(--mc-def-color-fg));
      --mc-breadcrumb-current-color: var(--mc-color-fg, var(--mc-def-color-fg));
      --mc-breadcrumb-sep-color: var(--mc-color-fg-subtle, var(--mc-def-color-fg-subtle));
      --mc-breadcrumb-gap: var(--mc-space-2, var(--mc-def-space-2));
    }

    /* 2. 维度 / 3. 尺寸：面包屑是一行文字导航，没有 variant 与 size（规范 1.2） */

    /* 4. 状态：当前项在 mc-breadcrumb-item 上（current），容器不镜像状态 */

    /* 5. 内部结构 */
    .mc-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--mc-breadcrumb-gap);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* 分隔符 = 每一项自己的 ::before（第一项没有），间距由同一条 gap 通道补上；::slotted() 只接受复合选择器。
       ⚠️ 属性走 -attr 内部变量，不写 --mc-breadcrumb-sep：JS 覆盖 / 清理会把使用者的令牌一起抹掉 */
    ::slotted(mc-breadcrumb-item:not(:first-child))::before {
      content: var(
        --mc-breadcrumb-sep-attr,
        var(--mc-breadcrumb-sep)
      ); /* @internal：属性写进来的内部变量 */
      margin-inline-end: var(--mc-breadcrumb-gap);
      color: rgb(var(--mc-breadcrumb-sep-color));
      user-select: none;
    }
  </style>

  <nav part="base">
    <ol class="mc-list" part="list">
      <slot></slot>
    </ol>
  </nav>

  <script>
    export default async () => ({
      tag: 'mc-breadcrumb',

      attrs: {
        separator: '/',
      },

      attached() {
        // 宿主属性一律等构造期结束再写（P31：ready 还太早，写宿主会抛 NotSupportedError）
        this.applySeparator();
      },

      watch: {
        separator() {
          // 首次触发落在构造期，跳过（P5）
          if (this._sepWatchInit === undefined) {
            this._sepWatchInit = true;
            return;
          }
          this.applySeparator();
        },
      },

      proto: {
        /** separator → --mc-breadcrumb-sep-attr（content 兜底链第一段）。⚠️ 回默认值要删掉这个内部变量而不是写 '/'，
         *  否则写同一族变量会把「直接覆盖令牌」那条路堵死 */
        applySeparator() {
          const value = (this.ele.getAttribute('separator') ?? '').trim();
          if (!value || value === '/') this.ele.style.removeProperty('--mc-breadcrumb-sep-attr');
          else this.ele.style.setProperty('--mc-breadcrumb-sep-attr', JSON.stringify(value));
        },
      },
    });
  </script>
</template>
