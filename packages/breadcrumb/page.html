    <h2>注意事项</h2>

    <ul>
      <li>
        <strong>链接必须写在插槽里</strong>（原生 <code>&lt;a&gt;</code>）。组件不造链接：
        站内链接要经 ofa 的 <code>olink</code> 带部署前缀，而 <code>olink</code>
        只作用于页面模板里的元素。
      </li>
      <li>
        当前页写 <code>current</code>，组件据此给宿主加 <code>aria-current="page"</code>；
        不要自己在宿主上写 <code>aria-current</code> —— <code>current</code> 会覆盖它。
      </li>
      <li>
        每一级的 <code>role="listitem"</code> 由组件补；自己给
        <code>&lt;mc-breadcrumb-item&gt;</code> 写了 <code>role</code> 时组件不覆盖。
      </li>
      <li>
        面包屑<strong>不承诺插槽里放 <code>&lt;button&gt;</code></strong
        >：页面 reset 对 <code>&lt;button&gt;</code> 的优先级高于组件内部的
        <code>::slotted()</code> （见 <code>agent/pitfalls/README.md</code> 的 P33），要可点的级就用
        <code>&lt;a&gt;</code>。
      </li>
      <li>
        <strong
          >宿主页面对 <code>&lt;a&gt;</code> 的颜色规则也会赢过组件的
          <code>::slotted(a)</code></strong
        >（同一条 P33）：页面里写了 <code>a { color: … }</code> 时
        <code>--mc-breadcrumb-item-color</code> 与
        <code>--mc-breadcrumb-item-color-hover</code>
        都管不到链接色（悬停只剩组件加的下划线）—— 文档站的链接跟着正文链接色走就是这个原因。
        要精确控制就在页面上写一条特异性不低于页面 <code>a</code> 规则的样式（如
        <code>.doc-body mc-breadcrumb a { color: … }</code>）。
      </li>
      <li>
        <strong>每一级必须是 <code>&lt;mc-breadcrumb&gt;</code> 的直接子元素</strong
        >：分隔符与级间距走 <code>::slotted(...)</code>，一旦被 <code>o-fill</code> /
        <code>o-if</code> 包一层就静默消失（那两个元素把内容放进自己的 light DOM， 而且
        <code>display: contents</code> 让布局看着正常）。整块显隐请用属性钩子而不是
        <code>o-if</code> —— 详见 <code>agent/pitfalls/README.md</code> 的 P38。
      </li>
      <li>
        <code>separator</code> 属性与 <code>--mc-breadcrumb-sep</code> 令牌走两条通道：
        属性是非默认值时优先，写回默认值 <code>/</code>（或空值）时就以令牌为准 ——
        组件会清掉自己的内部变量，使用者写在 <code>style</code> 上的令牌照旧生效。
      </li>
      <li>
        面包屑是<strong>一行文字导航</strong>，没有 <code>size</code> /
        <code>variant</code> 维度。要改字号 / 行高就覆盖容器的 <code>font-size</code>（用
        <code>style</code>）。
      </li>
      <li>
        容器是块级元素、占满一行；要紧贴上一行就自己写 <code>style="display: inline-block"</code>。
      </li>
    </ul>
