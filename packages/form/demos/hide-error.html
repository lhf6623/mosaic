<template component>
  <!-- hide-error 是布尔属性：ofa 模板里必须用 attr:（`:hide-error` 会把 false 写成 hide-error="false"，属性仍在），改 data 就够了 -->
  <mc-form attr:hide-error="showError" on:submit="send($event)">
    <mc-form-item
      label="用户名"
      name="username"
      rules='[{"required":true,"message":"用户名不能为空"}]'>
      <mc-input placeholder="点提交看效果：红框在、文案不在"></mc-input>
    </mc-form-item>
    <mc-form-item>
      <mc-space block wrap-items>
        <mc-button type="submit">提交</mc-button>
        <mc-button variant="outline" on:click="toggle()">
          {{showError ? '显示文案' : '隐藏文案'}}
        </mc-button>
        <span class="text-sm text-muted">{{last}}</span>
      </mc-space>
    </mc-form-item>
  </mc-form>

  <script>
    export default async () => ({
      tag: 'demo-form-hide-error',

      /* showError 是这份演示的"真相"：绑到 hide-error 上，改它属性就跟着变（布尔属性走 attr:） */
      data: { showError: true, last: '（还没提交）' },

      proto: {
        send(event) {
          this.last = '没过：' + event.data.fields.join(' / ') + '（按钮照旧只是红框）';
        },
        toggle() {
          this.showError = !this.showError;
        },
      },
    });
  </script>
</template>
