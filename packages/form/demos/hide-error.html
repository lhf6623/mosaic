<template component>
  <!-- hide-error 用**属性绑定**驱动：改 data 就够了，组件里一行 setAttribute 都没有 -->
  <mc-form :hide-error="showError" on:submit="send($event)">
    <mc-form-item
      label="用户名"
      name="username"
      rules='[{"required":true,"message":"用户名不能为空"}]'>
      <mc-input placeholder="点提交看效果：红框在、文案不在"></mc-input>
    </mc-form-item>
    <mc-form-item>
      <div class="flex flex-wrap items-center gap-3">
        <mc-button type="submit">提交</mc-button>
        <mc-button variant="outline" on:click="toggle()">
          {{showError ? '显示文案' : '隐藏文案'}}
        </mc-button>
        <span class="text-sm text-muted">{{last}}</span>
      </div>
    </mc-form-item>
  </mc-form>

  <script>
    export default async () => ({
      tag: 'demo-form-hide-error',

      /* showError 是这份演示的"真相"：绑到 hide-error 上，改它属性就跟着变（ofa 的 :attr 绑定） */
      data: { showError: true, last: '（还没提交）' },

      proto: {
        send(event) {
          this.last = '没过：' + event.data.fields.join(' / ') + '（按钮照旧只是红框）';
        },
        toggle() {
          this.showError = !this.showError;
        },
      },
    });
  </script>
</template>
