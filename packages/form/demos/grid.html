<template component>
  <mc-form on:submit="save($event)">
    <mc-grid cols="2" gap="md">
      <mc-grid-item>
        <mc-form-item label="姓名" name="name">
          <mc-input placeholder="张三"></mc-input>
        </mc-form-item>
      </mc-grid-item>
      <mc-grid-item>
        <mc-form-item label="城市" name="city">
          <mc-select default-value="hz">
            <mc-option value="hz">杭州</mc-option>
            <mc-option value="sh">上海</mc-option>
          </mc-select>
        </mc-form-item>
      </mc-grid-item>
      <mc-grid-item span="2">
        <mc-form-item label="备注" name="note">
          <mc-textarea rows="2" placeholder="跨两列（span=2）"></mc-textarea>
        </mc-form-item>
      </mc-grid-item>
      <mc-grid-item>
        <mc-form-item label="套餐" name="plan">
          <mc-radio-group default-value="b">
            <mc-radio value="a">月付</mc-radio>
            <mc-radio value="b">年付</mc-radio>
          </mc-radio-group>
        </mc-form-item>
      </mc-grid-item>
      <mc-grid-item>
        <mc-form-item label="通知" name="notify">
          <mc-switch checked>接收通知</mc-switch>
        </mc-form-item>
      </mc-grid-item>
      <mc-grid-item>
        <mc-form-item label="订阅" name="digest">
          <mc-checkbox checked>每周摘要</mc-checkbox>
        </mc-form-item>
      </mc-grid-item>
      <mc-grid-item>
        <mc-form-item label="评分" name="rating">
          <mc-rate default-value="4"></mc-rate>
        </mc-form-item>
      </mc-grid-item>
      <mc-grid-item span="2">
        <mc-form-item label="所在地区" name="region">
          <mc-tree-select default-value="hz" placeholder="选择省 / 市"></mc-tree-select>
        </mc-form-item>
      </mc-grid-item>
      <mc-grid-item span="2">
        <mc-form-item label="音量" name="volume">
          <mc-slider default-value="60"></mc-slider>
        </mc-form-item>
      </mc-grid-item>
    </mc-grid>

    <mc-form-item>
      <mc-space block>
        <mc-button type="submit">提交</mc-button>
      </mc-space>
    </mc-form-item>
  </mc-form>

  <p class="mt-3 text-sm text-muted">
    最近一次提交：
    <strong>{{last}}</strong>
  </p>

  <script>
    export default async () => ({
      tag: 'demo-form-grid',

      data: { last: '（还没提交）' },

      ready() {
        /* 树数据用 property 传（属性通道只作 JSON 初始值）；pre-upgrade 赋值会由组件在 ready 时收下 */
        const tree = this.ele.shadowRoot.querySelector('mc-tree-select');
        if (tree) {
          tree.options = [
            {
              value: 'zj',
              label: '浙江',
              children: [
                { value: 'hz', label: '杭州' },
                { value: 'nb', label: '宁波' },
              ],
            },
            { value: 'js', label: '江苏', children: [{ value: 'nj', label: '南京' }] },
          ];
        }
      },

      proto: {
        save(event) {
          this.last = JSON.stringify(event.data.value);
        },
      },
    });
  </script>
</template>
