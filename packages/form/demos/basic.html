<template component>
  <mc-form on:submit="save($event)">
    <mc-form-item label="用户名" name="username">
      <mc-input placeholder="随便写点什么"></mc-input>
    </mc-form-item>
    <mc-form-item label="邮箱" name="email">
      <mc-input type="email" placeholder="you@example.com"></mc-input>
    </mc-form-item>
    <mc-form-item>
      <div class="flex items-center gap-3">
        <mc-button type="submit">提交</mc-button>
      </div>
    </mc-form-item>
  </mc-form>

  <p class="mt-3 text-sm text-muted">
    最近一次提交：
    <strong>{{last}}</strong>
  </p>

  <script>
    export default async () => ({
      tag: 'demo-form-basic',

      data: { last: '（还没提交）' },

      proto: {
        save(event) {
          this.last = JSON.stringify(event.data.value);
        },
      },
    });
  </script>
</template>
