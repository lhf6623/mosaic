<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 普通 HTML 页：引 ofa.js + 用到的组件；input / 反馈文字的样式来自可选的 mosaic.css -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/boot/mosaic.css" />
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.5/dist/ofa.min.mjs"
      type="module"></script>
  </head>
  <body>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/space/space.html"></l-m>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/button/button.html"></l-m>

    <form id="type-form">
      <mc-space direction="vertical" block>
        <input
          class="border border-border rounded-md px-2 py-1 text-sm"
          name="nickname"
          placeholder="昵称"
          value="Mosaic" />
        <mc-space block wrap-items>
          <mc-button id="plain-button">默认（不写 type）</mc-button>
          <mc-button type="submit">提交</mc-button>
          <mc-button type="reset">重置</mc-button>
        </mc-space>
      </mc-space>
    </form>

    <p class="mt-3 text-sm text-muted" id="feedback">（还没点过）</p>

    <script>
      const form = document.getElementById('type-form');
      const feedback = document.getElementById('feedback');

      // 演示页不真的提交：拦下原生提交，把取到的值写进下面那行反馈
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const data = new FormData(form);
        feedback.textContent = `submit：提交了「${data.get('nickname') || '（空）'}」`;
      });
      form.addEventListener('reset', () => {
        feedback.textContent = 'reset：原生表单控件还原成初始值';
      });
      document.getElementById('plain-button').addEventListener('click', () => {
        feedback.textContent = 'type=button（默认）：只发 click，不提交表单';
      });
    </script>
  </body>
</html>
