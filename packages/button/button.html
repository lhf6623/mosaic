<!--
  mc-button — Mosaic 参考组件实现

  写新组件请照抄它的结构与分层，三条主线：
  1. 视觉全部定义在 :host 上 —— 外部 style="…" 优先级最高，能直接覆盖；
  2. color（语义色）× variant（外观样式）是两个正交维度，不是一维枚举；
  3. 交互语义交给内部透明的原生 <button>，宿主只管"长什么样"。
  hover / active 用 state layer（currentColor + 半透明），不引 hover 色令牌。
-->
<template component>
  <style>
    :host {
      /* ---------- 盒模型与尺寸：使用者最想覆盖的部分放最前 ---------- */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      position: relative; /* .mc-layer 和 .mc-native 的包含块（P21） */
      gap: 0.5em;
      height: var(--mc-control-h-md);
      padding-inline: var(--mc-space-4);
      border: 1px solid transparent;
      border-radius: var(--mc-radius-md);
      vertical-align: middle;

      /* ---------- 排版 ---------- */
      font-family: var(--mc-font-sans);
      font-size: var(--mc-text-sm);
      font-weight: var(--mc-weight-medium);
      line-height: 1;
      white-space: nowrap;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;

      /* ---------- 色槽：color 只往这三个槽填值，variant 只管把它们贴到哪儿 ---------- */
      --mc-button-fill: var(--mc-color-primary); /* filled 的底 */
      --mc-button-on-fill: var(--mc-color-primary-fg); /* filled 上的文字 */
      --mc-button-accent: var(--mc-color-primary); /* outline / ghost 的线与文字 */

      /* filled 是默认外观，直接写在 :host 上；写 :host(:not([variant])) 会静默失效（P14） */
      background-color: rgb(var(--mc-button-fill));
      color: rgb(var(--mc-button-on-fill));
    }

    /* ---------- 维度一：color（语义色） ---------- */
    :host([color='info']) {
      --mc-button-fill: var(--mc-color-info);
      --mc-button-on-fill: var(--mc-color-info-fg);
      --mc-button-accent: var(--mc-color-info);
    }
    :host([color='success']) {
      --mc-button-fill: var(--mc-color-success);
      --mc-button-on-fill: var(--mc-color-success-fg);
      --mc-button-accent: var(--mc-color-success);
    }
    :host([color='warning']) {
      --mc-button-fill: var(--mc-color-warning);
      --mc-button-on-fill: var(--mc-color-warning-fg);
      --mc-button-accent: var(--mc-color-warning);
    }
    :host([color='danger']) {
      --mc-button-fill: var(--mc-color-danger);
      --mc-button-on-fill: var(--mc-color-danger-fg);
      --mc-button-accent: var(--mc-color-danger);
    }
    /* 中性是特例：浅底深字 + 深字浅线，同一个值做不到，三个槽分别取令牌 */
    :host([color='neutral']) {
      --mc-button-fill: var(--mc-color-neutral);
      --mc-button-on-fill: var(--mc-color-neutral-fg);
      --mc-button-accent: var(--mc-color-fg-muted);
    }

    /* ---------- 维度二：variant（外观样式） ---------- */
    :host([variant='outline']) {
      background-color: transparent;
      color: rgb(var(--mc-button-accent));
      border-color: rgb(var(--mc-button-accent));
    }
    :host([variant='ghost']) {
      background-color: transparent;
      color: rgb(var(--mc-button-accent));
      border-color: transparent;
    }

    /* ---------- 尺寸 ---------- */
    :host([size='sm']) {
      height: var(--mc-control-h-sm);
      padding-inline: var(--mc-space-3);
      font-size: var(--mc-text-xs);
    }
    :host([size='lg']) {
      height: var(--mc-control-h-lg);
      padding-inline: var(--mc-space-5);
      font-size: var(--mc-text-base);
    }

    /* ---------- 布局模式 ---------- */
    :host([block]) {
      display: flex;
      width: 100%;
    }

    /* ---------- 状态 ---------- */
    :host([disabled]),
    :host([loading]) {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ---------- state layer：currentColor + 半透明，任意配色与主题都自动协调 ---------- */
    .mc-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background-color: currentColor;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--mc-duration-fast) var(--mc-ease-standard);
    }
    :host(:hover) .mc-layer {
      opacity: 0.08;
    }
    :host(:active) .mc-layer {
      opacity: 0.12;
    }
    /* 禁用/加载态不响应 hover：正向选择器覆盖，不用 :not() */
    :host([disabled]) .mc-layer,
    :host([loading]) .mc-layer {
      opacity: 0;
    }

    /* ---------- 内部结构 ---------- */
    /* 透明原生 button 只承载语义；z-index 要高于 .mc-layer，否则点击被叠层拦掉（P21） */
    .mc-native {
      all: unset;
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: inherit;
      border-radius: inherit;
    }
    /* 焦点环用 ring 令牌，不用 currentColor：白圈画在浅色页面上看不见（P16） */
    .mc-native:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring));
      outline-offset: 2px;
    }

    /* loading 指示器常驻 DOM 靠属性显隐；o-if / x-if 不响应运行时属性（P10） */
    .mc-loader {
      display: none;
      width: 1em;
      height: 1em;
      flex-shrink: 0;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-right-color: currentColor;
      border-radius: 50%;
      animation: mc-btn-spin 0.7s linear infinite;
    }
    :host([loading]) .mc-loader {
      display: inline-flex;
    }
    @keyframes mc-btn-spin {
      to {
        transform: rotate(360deg);
      }
    }

    ::slotted([slot='prefix']),
    ::slotted([slot='suffix']) {
      display: inline-flex;
      flex-shrink: 0;
    }
  </style>

  <!-- 交互语义层：透明原生 button，盖满宿主 -->
  <button class="mc-native" :type="type" :disabled="disabled !== null || loading !== null"></button>

  <span class="mc-layer" aria-hidden="true"></span>
  <span class="mc-loader" aria-hidden="true"></span>
  <slot name="prefix"></slot>
  <slot></slot>
  <slot name="suffix"></slot>

  <script>
    export default async () => ({
      tag: 'mc-button',

      attrs: {
        color: 'primary',
        variant: 'filled',
        size: 'md',
        type: 'button',
        // 布尔属性默认值必须是 null（P1）：用 false 会让 <mc-button disabled> 失效
        disabled: null,
        loading: null,
        // 撑满父容器。声明进 attrs 才能让 :block 绑定与 el.block 生效（样式见 :host([block])）
        block: null,
      },

      proto: {
        // 原生 click 自带 composed，会穿透 shadow 冒泡；禁用态由 .mc-native 的 :disabled 兜住
      },
    });
  </script>
</template>
