<!--
  mc-button — Mosaic 参考组件实现

  设计取舍 / 实现约束（为什么这么定、踩过哪些坑）不写在这里 —— 见同目录 README.md 的「设计取舍」。
  这份文件是要经 CDN 发给使用者的产物，注释会一起发出去，所以这里只留一行定位与指针。
-->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <link rel="stylesheet" href="../icon/icons.generated.css" />
  <style>
    :host {
      /* ---------- 盒模型与尺寸：使用者最想覆盖的部分放最前 ---------- */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      position: relative; /* .mc-layer 和 .mc-native 的包含块（P21） */
      gap: 0.5em;
      height: var(--mc-control-h-md, var(--mc-def-control-h-md));
      padding-inline: var(--mc-space-4, var(--mc-def-space-4));
      border: 1px solid transparent;
      border-radius: var(--mc-radius-md, var(--mc-def-radius-md));
      vertical-align: middle;

      /* ---------- 排版 ---------- */
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-text-sm, var(--mc-def-text-sm));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
      line-height: 1;
      white-space: nowrap;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;

      /* ---------- 色槽：color 只往这三个槽填值，variant 只管把它们贴到哪儿 ---------- */
      --mc-button-fill: var(--mc-color-primary, var(--mc-def-color-primary)); /* filled 的底 */
      --mc-button-on-fill: var(
        --mc-color-primary-fg,
        var(--mc-def-color-primary-fg)
      ); /* filled 上的文字 */
      --mc-button-accent: var(
        --mc-color-primary,
        var(--mc-def-color-primary)
      ); /* outline / ghost 的线与文字 */

      /* ---------- 图标特调：按钮里的图标比文字大一档（14px 文字 → 17.5px 图标） ----------
       * 为什么按钮要单独调：图标集统一是「1em = 跟随字号」，在正文里正好；但按钮文字是
       * 14px + font-weight 500，同尺寸的图标看着比文字轻一档（描边型图标 24px 画布 2px 描边，
       * 缩到 14px 只剩 1.17px）。这里是**按钮层**的光学补偿：放大尺寸补重量，
       * 而不是去改图标集本身（改整套描边会波及所有图标）。想再调就覆盖这一个变量。 */
      --mc-button-icon-size: 1.25em;

      /* filled 是默认外观，直接写在 :host 上；写 :host(:not([variant])) 会静默失效（P14） */
      background-color: rgb(var(--mc-button-fill));
      color: rgb(var(--mc-button-on-fill));
    }

    /* ---------- 维度一：color（语义色） ---------- */
    :host([color='info']) {
      --mc-button-fill: var(--mc-color-info, var(--mc-def-color-info));
      --mc-button-on-fill: var(--mc-color-info-fg, var(--mc-def-color-info-fg));
      --mc-button-accent: var(--mc-color-info, var(--mc-def-color-info));
    }
    :host([color='success']) {
      --mc-button-fill: var(--mc-color-success, var(--mc-def-color-success));
      --mc-button-on-fill: var(--mc-color-success-fg, var(--mc-def-color-success-fg));
      --mc-button-accent: var(--mc-color-success, var(--mc-def-color-success));
    }
    :host([color='warning']) {
      --mc-button-fill: var(--mc-color-warning, var(--mc-def-color-warning));
      --mc-button-on-fill: var(--mc-color-warning-fg, var(--mc-def-color-warning-fg));
      --mc-button-accent: var(--mc-color-warning, var(--mc-def-color-warning));
    }
    :host([color='danger']) {
      --mc-button-fill: var(--mc-color-danger, var(--mc-def-color-danger));
      --mc-button-on-fill: var(--mc-color-danger-fg, var(--mc-def-color-danger-fg));
      --mc-button-accent: var(--mc-color-danger, var(--mc-def-color-danger));
    }
    /* 中性是特例：浅底深字 + 深字浅线，同一个值做不到，三个槽分别取令牌 */
    :host([color='neutral']) {
      --mc-button-fill: var(--mc-color-neutral, var(--mc-def-color-neutral));
      --mc-button-on-fill: var(--mc-color-neutral-fg, var(--mc-def-color-neutral-fg));
      --mc-button-accent: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
    }

    /* ---------- 维度二：variant（外观样式） ---------- */
    :host([variant='outline']) {
      background-color: transparent;
      color: rgb(var(--mc-button-accent));
      border-color: rgb(var(--mc-button-accent));
    }
    :host([variant='ghost']) {
      background-color: transparent;
      color: rgb(var(--mc-button-accent));
      border-color: transparent;
    }

    /* ---------- 尺寸 ---------- */
    :host([size='sm']) {
      height: var(--mc-control-h-sm, var(--mc-def-control-h-sm));
      padding-inline: var(--mc-space-3, var(--mc-def-space-3));
      font-size: var(--mc-text-xs, var(--mc-def-text-xs));
    }
    :host([size='lg']) {
      height: var(--mc-control-h-lg, var(--mc-def-control-h-lg));
      padding-inline: var(--mc-space-5, var(--mc-def-space-5));
      font-size: var(--mc-text-base, var(--mc-def-text-base));
    }

    /* ---------- 形态：行内文字按钮（inline） ----------
     * 「形态」是与外观 / 尺寸正交的另一个面（见 packages/README.md §1.2）：盒子交给文字。
     *   · size 在这一形态下**只选文字档位**（font-size + 配对行高），不碰 --mc-control-h-*
     *     那一族控制高度；三档盒子一样高，只有字变大。
     *   · 命中区 = 行高 + 上下透明内边距，凑到 24px（WCAG 2.5.8 最小目标），三档都正好：
     *       sm 16+4×2 · md 20+2×2 · lg 24+0×2。ghost 下这层内边距看不见；
     *       filled / outline 会把底色描边一起撑到 24 高 —— inline 是为 ghost 设计的组合，
     *       另两种按「贴字的胶囊」理解即可。
     *   · 悬停不用 .mc-layer：8% 底色贴着文字看像「文字被高亮」，改成下划线（链接那套反馈）。
     * ⚠️ 这一段必须排在上面三档 size 规则**之后**：:host([inline]) 与 :host([size='sm']) 同为
     *     0-2-0，只能靠源码顺序分胜负（同 P14 那类「写法一换就静默失效」的坑）。 */
    :host([inline]) {
      height: auto;
      padding-inline: 0;
      padding-block: 2px;
      line-height: var(--mc-text-sm-lh, var(--mc-def-text-sm-lh));
      vertical-align: baseline;
    }
    :host([inline][size='sm']) {
      padding-block: 4px;
      line-height: var(--mc-text-xs-lh, var(--mc-def-text-xs-lh));
    }
    :host([inline][size='lg']) {
      padding-block: 0;
      line-height: var(--mc-text-base-lh, var(--mc-def-text-base-lh));
    }
    :host([inline]) .mc-layer {
      display: none;
    }
    :host([inline]:hover) {
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    /* ---------- 布局模式 ---------- */
    :host([block]) {
      display: flex;
      width: 100%;
    }

    /* ---------- 状态 ---------- */
    :host([disabled]),
    :host([loading]) {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ---------- state layer：currentColor + 半透明，任意配色与主题都自动协调 ---------- */
    .mc-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background-color: currentColor;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--mc-duration-fast, var(--mc-def-duration-fast))
        var(--mc-ease-standard, var(--mc-def-ease-standard));
    }
    :host(:hover) .mc-layer {
      opacity: 0.08;
    }
    :host(:active) .mc-layer {
      opacity: 0.12;
    }
    /* 禁用/加载态不响应 hover：正向选择器覆盖，不用 :not() */
    :host([disabled]) .mc-layer,
    :host([loading]) .mc-layer {
      opacity: 0;
    }

    /* ---------- 内部结构 ---------- */
    /* 透明原生 button 只承载语义；z-index 要高于 .mc-layer，否则点击被叠层拦掉（P21） */
    .mc-native {
      all: unset;
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: inherit;
      border-radius: inherit;
    }
    /* 焦点环用 ring 令牌，不用 currentColor：白圈画在浅色页面上看不见（P16） */
    .mc-native:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }

    /* loading 指示器常驻 DOM 靠属性显隐；o-if / x-if 不响应运行时属性（P10）。
       图形就是内置图标集里的 spinner（类名 = 内置图标，见 mc-icon）：
       组件内部的**静态**图标直接吃类，不引 icon.html —— 少一个请求，
       形状也和其余内置图标同一套描边。尺寸/颜色由那条图标规则给（1em + currentColor）。 */
    .mc-loader {
      display: none;
      flex-shrink: 0;
      font-size: var(--mc-button-icon-size);
      animation: mc-btn-spin 0.7s linear infinite;
    }
    :host([loading]) .mc-loader {
      display: inline-flex;
    }
    @keyframes mc-btn-spin {
      to {
        transform: rotate(360deg);
      }
    }

    ::slotted([slot='prefix']),
    ::slotted([slot='suffix']) {
      display: inline-flex;
      flex-shrink: 0;
    }
    /* 槽里的图标：尺寸走上面那个令牌，**颜色必须跟按钮的文字色**（filled = on-fill、
       outline / ghost = accent）。不靠"碰巧继承"：显式 color:inherit 之外，还压掉了
       图标自带的 color 属性 —— 按钮的标签是整体，里面不该出现第二种颜色。 */
    ::slotted(mc-icon) {
      font-size: var(--mc-button-icon-size);
      color: inherit;
    }
  </style>

  <!-- 交互语义层：透明原生 button，盖满宿主。
       ⚠️ aria-labelledby 指向**下面那三个 slot**：按钮的可见文字是插槽内容，与原生 button 是
       **兄弟**而不是父子 —— 不指的话无障碍树里就是个无名按钮（实测 40 个按钮 39 个没名字，
       链接 45 个全有名字）。IDREF 在同一棵 shadow tree 内解析得到，slot 的子树就是分配进来的
       那些节点，所以名字跟着可见文字走（prefix/suffix 里的图标是 SVG，不贡献名字）。 -->
  <button
    class="mc-native"
    :type="type"
    :disabled="disabled !== null || loading !== null"
    aria-labelledby="mc-btn-prefix mc-btn-label mc-btn-suffix"
  ></button>
  <!-- ⚠️ 上面那个 aria-labelledby 由 syncAria() 维护：宿主给了 aria-label 时它会换成 mc-btn-label
       （否则按 accname 的优先级 labelledby 仍然赢，显式的名字会被无视）。 -->

  <span class="mc-layer" aria-hidden="true"></span>
  <span class="mc-loader mc-icon-spinner" aria-hidden="true"></span>
  <slot id="mc-btn-prefix" name="prefix"></slot>
  <slot id="mc-btn-label"></slot>
  <slot id="mc-btn-suffix" name="suffix"></slot>

  <script>
    /* color 也收 hex（`<mc-button color="#fff000">`）：语义名照旧交给 CSS，hex 走这一个接线器。
       语义、边界与三条踩过的坑都在那个文件头里 */
    import { colorAttr } from '../boot/color-attr.js';

    const color = colorAttr({ slots: ['fill', 'on-fill', 'accent'] });

    /** 宿主上这几个 aria 转发给内部那个原生 button（**它才是无障碍节点**，写在宿主上它看不到）。
     *  `aria-label` 单独处理：宿主显式给了就用它，否则回落插槽文字（见 syncAria）。 */
    const ARIA_FORWARD = [
      'aria-haspopup',
      'aria-expanded',
      'aria-controls',
      'aria-pressed',
      'aria-current',
    ];
    const SLOT_LABEL_IDS = 'mc-btn-prefix mc-btn-label mc-btn-suffix';

    export default async () => ({
      tag: 'mc-button',

      attrs: {
        color: 'primary',
        variant: 'filled',
        size: 'md',
        // 形态：行内文字按钮 —— 盒子交给文字，size 只选文字档位（样式见 :host([inline])）
        inline: null,
        type: 'button',
        // 布尔属性默认值必须是 null（P1）：用 false 会让 <mc-button disabled> 失效
        disabled: null,
        loading: null,
        // 撑满父容器。声明进 attrs 才能让 :block 绑定与 el.block 生效（样式见 :host([block])）
        block: null,
      },

      attached() {
        // 宿主 style 等构造期结束再写（P31），首次同步在这里
        color.sync(this.ele, this.color);
        this.syncAria();
        /* 宿主上的 aria-* 是运行时变的（菜单触发框的 aria-expanded 就是），
           属性一变就重新镜像 —— 不做的话「展开/收起」对读屏是静默的 */
        this._ariaObserver = new MutationObserver(() => this.syncAria());
        this._ariaObserver.observe(this.ele, {
          attributes: true,
          attributeFilter: [...ARIA_FORWARD, 'aria-label'],
        });
      },

      detached() {
        this._ariaObserver?.disconnect();
      },

      watch: {
        // 首次触发落在构造期（P5），跳过由 colorAttr 内部处理；这里只关心"值变了"
        color(value) {
          color.change(this.ele, value);
        },
      },

      proto: {
        // 原生 click 自带 composed，会穿透 shadow 冒泡；禁用态由 .mc-native 的 :disabled 兜住

        /**
         * 宿主 → 内部原生 button 的 aria 转发。无障碍节点是那个 button：
         * 写在宿主上的 aria-haspopup / aria-expanded / aria-current 它一个都看不到，
         * 菜单按钮、当前页这类语义就静默丢了（实测无障碍树里 hasPopup=null）。
         * ⚠️ 名字单独走一条：宿主给了 `aria-label` 就用它（**必须摘掉模板上的 aria-labelledby**，
         * 否则按 accname 的优先级 labelledby 仍然赢）；没给就回落插槽文字。
         * `aria-labelledby` 不转发 —— 它是 IDREF，跨 shadow 边界解析不到外层的元素。
         */
        syncAria() {
          const native = this.ele.shadowRoot?.querySelector('.mc-native');
          if (!native) return;
          for (const name of ARIA_FORWARD) {
            const value = this.ele.getAttribute(name);
            if (value === null) native.removeAttribute(name);
            else native.setAttribute(name, value);
          }
          const label = this.ele.getAttribute('aria-label');
          if (label) native.setAttribute('aria-label', label);
          else native.removeAttribute('aria-label');
          native.setAttribute('aria-labelledby', label ? 'mc-btn-label' : SLOT_LABEL_IDS);
        },
      },
    });
  </script>
</template>
