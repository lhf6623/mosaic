<!-- mc-button — Mosaic 参考组件实现；设计取舍见 README.md 的「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <link rel="stylesheet" href="../icon/icons.generated.css" />
  <style>
    :host {
      /* ---------- 盒模型与尺寸（使用者最想覆盖的放最前） ---------- */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      position: relative; /* .mc-layer 和 .mc-native 的包含块（P21） */
      gap: 0.5em;
      height: var(--mc-control-h-md, var(--mc-def-control-h-md));
      padding-inline: var(--mc-space-4, var(--mc-def-space-4));
      border: 1px solid transparent;
      border-radius: var(--mc-radius-md, var(--mc-def-radius-md));
      vertical-align: middle;

      /* ---------- 排版 ---------- */
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-text-sm, var(--mc-def-text-sm));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
      line-height: 1;
      white-space: nowrap;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;

      /* ---------- 色槽：color 只往这三个槽填值，variant 只管把它们贴到哪儿 ---------- */
      --mc-button-fill: var(--mc-color-primary, var(--mc-def-color-primary)); /* filled 的底 */
      --mc-button-on-fill: var(
        --mc-color-primary-fg,
        var(--mc-def-color-primary-fg)
      ); /* filled 上的文字 */
      --mc-button-accent: var(
        --mc-color-primary,
        var(--mc-def-color-primary)
      ); /* outline / ghost 的线与文字 */

      /* ---------- 图标特调 ----------
       * 图标集是 1em 跟随字号，14px/500 的按钮文字旁显得轻一档 —— 这里做光学补偿。 */
      --mc-button-icon-size: 1.25em;

      /* filled 是默认外观，直接写在 :host 上；写 :host(:not([variant])) 会静默失效（P14） */
      background-color: rgb(var(--mc-button-fill));
      color: rgb(var(--mc-button-on-fill));
    }

    /* ---------- 维度一：color（语义色） ---------- */
    :host([color='info']) {
      --mc-button-fill: var(--mc-color-info, var(--mc-def-color-info));
      --mc-button-on-fill: var(--mc-color-info-fg, var(--mc-def-color-info-fg));
      --mc-button-accent: var(--mc-color-info, var(--mc-def-color-info));
    }
    :host([color='success']) {
      --mc-button-fill: var(--mc-color-success, var(--mc-def-color-success));
      --mc-button-on-fill: var(--mc-color-success-fg, var(--mc-def-color-success-fg));
      --mc-button-accent: var(--mc-color-success, var(--mc-def-color-success));
    }
    :host([color='warning']) {
      --mc-button-fill: var(--mc-color-warning, var(--mc-def-color-warning));
      --mc-button-on-fill: var(--mc-color-warning-fg, var(--mc-def-color-warning-fg));
      --mc-button-accent: var(--mc-color-warning, var(--mc-def-color-warning));
    }
    :host([color='danger']) {
      --mc-button-fill: var(--mc-color-danger, var(--mc-def-color-danger));
      --mc-button-on-fill: var(--mc-color-danger-fg, var(--mc-def-color-danger-fg));
      --mc-button-accent: var(--mc-color-danger, var(--mc-def-color-danger));
    }
    /* 中性是特例：浅底深字 + 深字浅线，同一个值做不到，三个槽分别取令牌 */
    :host([color='neutral']) {
      --mc-button-fill: var(--mc-color-neutral, var(--mc-def-color-neutral));
      --mc-button-on-fill: var(--mc-color-neutral-fg, var(--mc-def-color-neutral-fg));
      --mc-button-accent: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
    }

    /* ---------- 维度二：variant（外观样式） ---------- */
    :host([variant='outline']) {
      background-color: transparent;
      color: rgb(var(--mc-button-accent));
      border-color: rgb(var(--mc-button-accent));
    }
    :host([variant='ghost']) {
      background-color: transparent;
      color: rgb(var(--mc-button-accent));
      border-color: transparent;
    }

    /* ---------- 尺寸 ---------- */
    :host([size='sm']) {
      height: var(--mc-control-h-sm, var(--mc-def-control-h-sm));
      padding-inline: var(--mc-space-3, var(--mc-def-space-3));
      font-size: var(--mc-text-xs, var(--mc-def-text-xs));
    }
    :host([size='lg']) {
      height: var(--mc-control-h-lg, var(--mc-def-control-h-lg));
      padding-inline: var(--mc-space-5, var(--mc-def-space-5));
      font-size: var(--mc-text-base, var(--mc-def-text-base));
    }

    /* ---------- 形态：行内文字按钮（inline） ----------
     * 与外观/尺寸正交：盒子交给文字，size 只选文字档位、不碰 --mc-control-h-*；无底无框，variant 不参与；
     * 命中区靠行高 + 上下透明内边距凑到 24px（WCAG 2.5.8）。
     * ⚠️ 必须排在 size 三档之后：:host([inline]) 与 :host([size='sm']) 同为 0-2-0，靠源码顺序分胜负（同 P14）。 */
    :host([inline]) {
      height: auto;
      padding-inline: 0;
      padding-block: 2px;
      line-height: var(--mc-text-sm-lh, var(--mc-def-text-sm-lh));
      vertical-align: baseline;
      background-color: transparent;
      border-color: transparent;
      color: rgb(var(--mc-button-accent));
    }
    :host([inline][size='sm']) {
      padding-block: 4px;
      line-height: var(--mc-text-xs-lh, var(--mc-def-text-xs-lh));
    }
    :host([inline][size='lg']) {
      padding-block: 0;
      line-height: var(--mc-text-base-lh, var(--mc-def-text-base-lh));
    }
    :host([inline]:hover) {
      color: color-mix(in oklab, rgb(var(--mc-button-accent)) 88%, black);
    }

    :host([inline]) .mc-layer {
      display: none;
    }

    /* ---------- 布局模式 ---------- */
    :host([block]) {
      display: flex;
      width: 100%;
    }

    /* ---------- 状态 ---------- */
    :host([disabled]),
    :host([loading]) {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ---------- state layer：currentColor + 半透明，任意配色与主题都自动协调 ---------- */
    .mc-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background-color: currentColor;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--mc-duration-fast, var(--mc-def-duration-fast))
        var(--mc-ease-standard, var(--mc-def-ease-standard));
    }
    :host(:hover) .mc-layer {
      opacity: 0.08;
    }
    :host(:active) .mc-layer {
      opacity: 0.12;
    }
    :host([disabled]) .mc-layer,
    :host([loading]) .mc-layer {
      opacity: 0;
    }

    /* ---------- 内部结构 ---------- */
    /* 透明原生 button 只承载语义；z-index 要高于 .mc-layer，否则点击被叠层拦掉（P21） */
    .mc-native {
      all: unset;
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: inherit;
      border-radius: inherit;
    }
    /* 焦点环用 ring 令牌，不用 currentColor：白圈画在浅色页面上看不见（P16） */
    .mc-native:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }

    /* loading 指示器常驻 DOM 靠属性显隐（P10），图形是内置图标集的 spinner；内部静态图标直接吃类、不引 icon.html */
    .mc-loader {
      display: none;
      flex-shrink: 0;
      font-size: var(--mc-button-icon-size);
      animation: mc-btn-spin 0.7s linear infinite;
    }
    :host([loading]) .mc-loader {
      display: inline-flex;
    }
    /* loading 时 spinner 占 icon 槽的位置：icon 槽先让开，否则两个图标一起出现。
       loader 在 DOM 里就排在图标槽前面，图标一藏，它自然落在原来那一格。 */
    :host([loading]) ::slotted([slot='icon']) {
      display: none;
    }
    @keyframes mc-btn-spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* 默认插槽的盒子：只给行内形态当「文字基线」的落点，其它形态保持原来的居中。
       ⚠️ 不能把 align-self: baseline 写在基础选择器上：固定高度的按钮里只有一个 baseline 项、
       没有基线组可对齐，会回退到 start —— 文字直接被顶到按钮上沿（基本按钮全部遭殃）。 */
    .mc-label {
      min-width: 0;
    }

    /* 行内形态：flex 容器的基线改取**文字**基线。不这么做时容器基线取「第一个 flex 项」，
       icon 槽的图标排在前面就把文字顶高（实测同一行里前缀图标那颗比后缀图标那颗高 4px）；
       icon / icon-right 图标仍按 align-items: center 居中、不参与基线。 */
    :host([inline]) .mc-label {
      align-self: baseline;
    }

    /* 没有文字时（图标按钮）把文字盒折叠掉：icon 单独用、或只在插槽里放图标时，
       空的 .mc-label 会白留一份 gap。判定由 slotchange 驱动（行为层例外，同 mc-alert）。 */
    :host([data-no-label]) .mc-label {
      display: none;
    }

    ::slotted([slot='icon']),
    ::slotted([slot='icon-right']) {
      display: inline-flex;
      flex-shrink: 0;
    }
    /* 槽里的图标：颜色必须跟按钮文字色（filled = on-fill、outline/ghost = accent），显式 color:inherit */
    ::slotted(mc-icon) {
      font-size: var(--mc-button-icon-size);
      color: inherit;
    }

    /* ---------- 内置图标（icon / icon-right） ----------
       渲染成 icon / icon-right 插槽的**回退内容**：走 mc-icon 的 name 语法，使用者往同名槽里写了东西就自动让位。
       没有对应属性时 display:none —— 别让它作为空 flex 项白占一份 gap。
       字号与插槽图标同一档；颜色靠 mc-icon 的 color:inherit 跟按钮文字色。 */
    .mc-leading,
    .mc-trailing {
      display: none;
      flex-shrink: 0;
      font-size: var(--mc-button-icon-size);
    }
    :host([icon]) .mc-leading,
    :host([icon-right]) .mc-trailing {
      display: inline-flex;
      align-items: center;
    }
    /* loading 时 spinner 占 icon 槽的位置：内置图标和插槽图标一起让开 */
    :host([loading]) .mc-leading {
      display: none;
    }
    /* o-if 自带 ofa 的宿主 reset（16px / 前景色），会把图标链从按钮的继承里摘出去 ——
       拉回继承，图标字号 / 颜色才和插槽图标同一档（实测不写这条：字号 20px、颜色变成 fg）。 */
    .mc-leading o-if,
    .mc-trailing o-if {
      font-size: inherit;
      color: inherit;
    }
  </style>

  <!-- 交互层：透明原生 button 盖满宿主 -->
  <!-- 内部原生 button 只承载语义：type / disabled 是 HTML 属性，按 ofa 规范走 attr:（false 时移除属性，不会留下 disabled="false"）；
       click 也在这里绑：单个静态元素 + 单个事件，模板一行就够，不必在 attached 里再 .on / .off 一对（见 packages/README.md §1.9） -->
  <button
    class="mc-native"
    attr:type="type"
    attr:disabled="disabled !== null || loading !== null"
    on:click="forwardFormAction($event)"></button>

  <span class="mc-layer"></span>
  <span class="mc-loader mc-icon-spinner"></span>
  <!-- 内置图标的回退内容：插槽里没写东西才出现（icon / icon-right，见上面 CSS）。
       再包一层 o-if：没有图标名时连 mc-icon 都不创建，不给普通按钮多挂两个空组件。 -->
  <slot name="icon">
    <span class="mc-leading">
      <o-if :value="icon"><mc-icon :name="icon"></mc-icon></o-if>
    </span>
  </slot>
  <span class="mc-label"><slot></slot></span>
  <slot name="icon-right">
    <span class="mc-trailing">
      <o-if :value="iconRight"><mc-icon :name="iconRight"></mc-icon></o-if>
    </span>
  </slot>

  <script>
    /* color 也收 hex（语义名交给 CSS，hex 走这一个接线器）；语义、边界与三条坑见 color-attr.js 文件头。
       hex 是行为层的例外：值不是语义名，CSS 属性选择器表达不了；只写宿主 CSS 变量（原生属性走 .ele），不碰渲染结构。 */
    import { colorAttr } from '../boot/color-attr.js';

    const color = colorAttr({ slots: ['fill', 'on-fill', 'accent'] });

    export default async ({ load }) => {
      /* 内置图标由 mc-icon 渲染（name 语法与它一致：内置零请求、查不到才远程取）。
         只在真用了 icon / icon-right 时才登记 icon.html —— 不用图标的按钮不为它多付一次请求。 */
      let iconsLoaded;
      const ensureIcons = () => (iconsLoaded ??= load('../icon/icon.html'));

      return {
        tag: 'mc-button',

        attrs: {
          color: 'primary',
          variant: 'filled',
          size: 'md',
          inline: null,
          type: 'button',
          // 布尔属性默认值必须是 null（P1）：用 false 会让 <mc-button disabled> 失效
          disabled: null,
          loading: null,
          // 撑满父容器。声明进 attrs 才能让 :block 绑定与 el.block 生效（样式见 :host([block])）
          block: null,
          // 内置图标名（语法同 mc-icon 的 name）。默认必须 null：ofa 会把 '' 反射成宿主属性，
          // 于是 :host([icon]) 恒成立、每颗按钮都白留一份图标位（同 mc-menu-item 踩过的坑）
          icon: null,
          iconRight: null,
        },

        ready() {
          // 这里 shadow 已建好；宿主属性一律留到 attached 才写（P31）
          this._labelSlot = this.shadow.$('slot:not([name])');
        },

        attached() {
          // 宿主 style 等构造期结束再写（P31），首次同步在这里
          color.sync(this.ele, this.color);
          if (this.icon || this.iconRight) ensureIcons();
          /* 默认插槽空不空只能看实际分到的节点（模板 o-if 看不到 slot 分配）：
             文字一没就把 .mc-label 折叠掉，icon 单独用时不留一份空 gap（行为层例外，同 mc-alert）。
             这条订阅留在脚本里：与 alert / input / textarea 等 8 个插槽判定组件同一手法，
             `slotchange` 的引用跨两处（attached 订阅 / detached 退订），模板绑定反而对不上。 */
          this._onSlotChange = () => this.syncLabel();
          this._labelSlot?.on('slotchange', this._onSlotChange);
          this.syncLabel();
        },

        detached() {
          this._labelSlot?.off('slotchange', this._onSlotChange);
        },

        watch: {
          // 首次触发落在构造期（P5），跳过由 colorAttr 内部处理；这里只关心"值变了"
          color(value) {
            color.change(this.ele, value);
          },
          // 运行时才给图标名（不是首屏 HTML 里写好的）：这时再把 icon.html 登记进来
          icon(value) {
            if (value) ensureIcons();
          },
          iconRight(value) {
            if (value) ensureIcons();
          },
        },

        proto: {
          /**
           * 把 type="submit" / "reset" 交给宿主所在的最近一个原生 <form>。
           * 为什么不能靠浏览器：内部那个原生 button 住在 shadow tree 里，form owner 只能在同一棵树里找，
           * 跨不过 shadow 边界（于是它的激活行为永远是"什么都不做"）。
           * 等 click 冒泡完再动手：使用者可能在 on:click 里 preventDefault 表示"别提交"。
           */
          forwardFormAction(event) {
            // type 已在 attrs 里声明（默认 'button'），直接读 ofa 的值，不必再回宿主 getAttribute
            const type = this.type;
            if (type !== 'submit' && type !== 'reset') return;
            const form = this.ele.closest('form');
            if (!form) return;
            queueMicrotask(() => {
              if (event.defaultPrevented) return;
              if (type === 'submit') {
                if (form.requestSubmit) form.requestSubmit();
                else form.submit();
              } else {
                form.reset();
              }
            });
          },

          /** 默认插槽有没有内容：文字 / 图标都算（空内容折叠的唯一输入，见 attached） */
          syncLabel() {
            const nodes = this._labelSlot?.ele?.assignedNodes() ?? [];
            const has = nodes.some(
              (node) =>
                node.nodeType === Node.ELEMENT_NODE || (node.textContent ?? '').trim() !== '',
            );
            this.mirror('data-no-label', !has);
          },

          /** 只改宿主上的布尔属性：CSS 的 :host([…]) 只认属性在不在（P1） */
          mirror(name, on) {
            if (on === this.ele.hasAttribute(name)) return;
            if (on) this.ele.setAttribute(name, '');
            else this.ele.removeAttribute(name);
          },
        },
      };
    };
  </script>
</template>
