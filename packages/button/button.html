<!-- mc-button — Mosaic 参考组件实现；设计取舍见 README.md 的「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <link rel="stylesheet" href="../icon/icons.generated.css" />
  <style>
    :host {
      /* ---------- 盒模型与尺寸（使用者最想覆盖的放最前） ---------- */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      position: relative; /* .mc-layer 和 .mc-native 的包含块（P21） */
      gap: 0.5em;
      height: var(--mc-control-h-md, var(--mc-def-control-h-md));
      padding-inline: var(--mc-space-4, var(--mc-def-space-4));
      border: 1px solid transparent;
      border-radius: var(--mc-radius-md, var(--mc-def-radius-md));
      vertical-align: middle;

      /* ---------- 排版 ---------- */
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-text-sm, var(--mc-def-text-sm));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
      line-height: 1;
      white-space: nowrap;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;

      /* ---------- 色槽：color 只往这三个槽填值，variant 只管把它们贴到哪儿 ---------- */
      --mc-button-fill: var(--mc-color-primary, var(--mc-def-color-primary)); /* filled 的底 */
      --mc-button-on-fill: var(
        --mc-color-primary-fg,
        var(--mc-def-color-primary-fg)
      ); /* filled 上的文字 */
      --mc-button-accent: var(
        --mc-color-primary,
        var(--mc-def-color-primary)
      ); /* outline / ghost 的线与文字 */

      /* ---------- 图标特调 ----------
       * 图标集是 1em 跟随字号，14px/500 的按钮文字旁显得轻一档 —— 这里做光学补偿。 */
      --mc-button-icon-size: 1.25em;

      /* filled 是默认外观，直接写在 :host 上；写 :host(:not([variant])) 会静默失效（P14） */
      background-color: rgb(var(--mc-button-fill));
      color: rgb(var(--mc-button-on-fill));
    }

    /* ---------- 维度一：color（语义色） ---------- */
    :host([color='info']) {
      --mc-button-fill: var(--mc-color-info, var(--mc-def-color-info));
      --mc-button-on-fill: var(--mc-color-info-fg, var(--mc-def-color-info-fg));
      --mc-button-accent: var(--mc-color-info, var(--mc-def-color-info));
    }
    :host([color='success']) {
      --mc-button-fill: var(--mc-color-success, var(--mc-def-color-success));
      --mc-button-on-fill: var(--mc-color-success-fg, var(--mc-def-color-success-fg));
      --mc-button-accent: var(--mc-color-success, var(--mc-def-color-success));
    }
    :host([color='warning']) {
      --mc-button-fill: var(--mc-color-warning, var(--mc-def-color-warning));
      --mc-button-on-fill: var(--mc-color-warning-fg, var(--mc-def-color-warning-fg));
      --mc-button-accent: var(--mc-color-warning, var(--mc-def-color-warning));
    }
    :host([color='danger']) {
      --mc-button-fill: var(--mc-color-danger, var(--mc-def-color-danger));
      --mc-button-on-fill: var(--mc-color-danger-fg, var(--mc-def-color-danger-fg));
      --mc-button-accent: var(--mc-color-danger, var(--mc-def-color-danger));
    }
    /* 中性是特例：浅底深字 + 深字浅线，同一个值做不到，三个槽分别取令牌 */
    :host([color='neutral']) {
      --mc-button-fill: var(--mc-color-neutral, var(--mc-def-color-neutral));
      --mc-button-on-fill: var(--mc-color-neutral-fg, var(--mc-def-color-neutral-fg));
      --mc-button-accent: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
    }

    /* ---------- 维度二：variant（外观样式） ---------- */
    :host([variant='outline']) {
      background-color: transparent;
      color: rgb(var(--mc-button-accent));
      border-color: rgb(var(--mc-button-accent));
    }
    :host([variant='ghost']) {
      background-color: transparent;
      color: rgb(var(--mc-button-accent));
      border-color: transparent;
    }

    /* ---------- 尺寸 ---------- */
    :host([size='sm']) {
      height: var(--mc-control-h-sm, var(--mc-def-control-h-sm));
      padding-inline: var(--mc-space-3, var(--mc-def-space-3));
      font-size: var(--mc-text-xs, var(--mc-def-text-xs));
    }
    :host([size='lg']) {
      height: var(--mc-control-h-lg, var(--mc-def-control-h-lg));
      padding-inline: var(--mc-space-5, var(--mc-def-space-5));
      font-size: var(--mc-text-base, var(--mc-def-text-base));
    }

    /* ---------- 形态：行内文字按钮（inline） ----------
     * 与外观/尺寸正交：盒子交给文字，size 只选文字档位、不碰 --mc-control-h-*；无底无框，variant 不参与；
     * 命中区靠行高 + 上下透明内边距凑到 24px（WCAG 2.5.8）。
     * ⚠️ 必须排在 size 三档之后：:host([inline]) 与 :host([size='sm']) 同为 0-2-0，靠源码顺序分胜负（同 P14）。 */
    :host([inline]) {
      height: auto;
      padding-inline: 0;
      padding-block: 2px;
      line-height: var(--mc-text-sm-lh, var(--mc-def-text-sm-lh));
      vertical-align: baseline;
      background-color: transparent;
      border-color: transparent;
      color: rgb(var(--mc-button-accent));
    }
    :host([inline][size='sm']) {
      padding-block: 4px;
      line-height: var(--mc-text-xs-lh, var(--mc-def-text-xs-lh));
    }
    :host([inline][size='lg']) {
      padding-block: 0;
      line-height: var(--mc-text-base-lh, var(--mc-def-text-base-lh));
    }
    :host([inline]:hover) {
      color: color-mix(in oklab, rgb(var(--mc-button-accent)) 88%, black);
    }

    :host([inline]) .mc-layer {
      display: none;
    }

    /* ---------- 布局模式 ---------- */
    :host([block]) {
      display: flex;
      width: 100%;
    }

    /* ---------- 状态 ---------- */
    :host([disabled]),
    :host([loading]) {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ---------- state layer：currentColor + 半透明，任意配色与主题都自动协调 ---------- */
    .mc-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background-color: currentColor;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--mc-duration-fast, var(--mc-def-duration-fast))
        var(--mc-ease-standard, var(--mc-def-ease-standard));
    }
    :host(:hover) .mc-layer {
      opacity: 0.08;
    }
    :host(:active) .mc-layer {
      opacity: 0.12;
    }
    :host([disabled]) .mc-layer,
    :host([loading]) .mc-layer {
      opacity: 0;
    }

    /* ---------- 内部结构 ---------- */
    /* 透明原生 button 只承载语义；z-index 要高于 .mc-layer，否则点击被叠层拦掉（P21） */
    .mc-native {
      all: unset;
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: inherit;
      border-radius: inherit;
    }
    /* 焦点环用 ring 令牌，不用 currentColor：白圈画在浅色页面上看不见（P16） */
    .mc-native:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }

    /* loading 指示器常驻 DOM 靠属性显隐（P10），图形是内置图标集的 spinner；内部静态图标直接吃类、不引 icon.html */
    .mc-loader {
      display: none;
      flex-shrink: 0;
      font-size: var(--mc-button-icon-size);
      animation: mc-btn-spin 0.7s linear infinite;
    }
    :host([loading]) .mc-loader {
      display: inline-flex;
    }
    @keyframes mc-btn-spin {
      to {
        transform: rotate(360deg);
      }
    }

    ::slotted([slot='prefix']),
    ::slotted([slot='suffix']) {
      display: inline-flex;
      flex-shrink: 0;
    }
    /* 槽里的图标：颜色必须跟按钮文字色（filled = on-fill、outline/ghost = accent），显式 color:inherit */
    ::slotted(mc-icon) {
      font-size: var(--mc-button-icon-size);
      color: inherit;
    }
  </style>

  <!-- 交互层：透明原生 button 盖满宿主 -->
  <button class="mc-native" :type="type" :disabled="disabled !== null || loading !== null"></button>

  <span class="mc-layer"></span>
  <span class="mc-loader mc-icon-spinner"></span>
  <slot name="prefix"></slot>
  <slot></slot>
  <slot name="suffix"></slot>

  <script>
    /* color 也收 hex（语义名交给 CSS，hex 走这一个接线器）；语义、边界与三条坑见 color-attr.js 文件头 */
    import { colorAttr } from '../boot/color-attr.js';

    const color = colorAttr({ slots: ['fill', 'on-fill', 'accent'] });

    export default async () => ({
      tag: 'mc-button',

      attrs: {
        color: 'primary',
        variant: 'filled',
        size: 'md',
        inline: null,
        type: 'button',
        // 布尔属性默认值必须是 null（P1）：用 false 会让 <mc-button disabled> 失效
        disabled: null,
        loading: null,
        // 撑满父容器。声明进 attrs 才能让 :block 绑定与 el.block 生效（样式见 :host([block])）
        block: null,
      },

      attached() {
        // 宿主 style 等构造期结束再写（P31），首次同步在这里
        color.sync(this.ele, this.color);
      },

      watch: {
        // 首次触发落在构造期（P5），跳过由 colorAttr 内部处理；这里只关心"值变了"
        color(value) {
          color.change(this.ele, value);
        },
      },
    });
  </script>
</template>
