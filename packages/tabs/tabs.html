<!-- mc-tabs — 标签页容器（同目录还有 tab.html）；设计取舍见 README.md「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主盒模型 + 尺寸通道 + 色槽（mc-tab 在另一个 shadow root 里，只能靠继承拿到） */
    :host {
      display: block;
      box-sizing: border-box;
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)));

      --mc-tabs-tab-h: var(--mc-control-h-md, var(--mc-def-control-h-md));
      --mc-tabs-pad-x: var(--mc-space-3, var(--mc-def-space-3));
      --mc-tabs-font: var(--mc-text-sm, var(--mc-def-text-sm));
      --mc-tabs-gap: var(--mc-space-1, var(--mc-def-space-1));
      --mc-tabs-panel-pad: var(--mc-space-4, var(--mc-def-space-4));

      --mc-tabs-fg: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
      --mc-tabs-fg-hover: var(--mc-color-fg, var(--mc-def-color-fg));
      --mc-tabs-fg-selected: var(--mc-color-primary, var(--mc-def-color-primary));
      --mc-tabs-bg-hover: var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken));
      --mc-tabs-border: var(--mc-color-border, var(--mc-def-color-border));
      --mc-tabs-indicator: var(--mc-color-primary, var(--mc-def-color-primary));
      --mc-tabs-indicator-h: 2px;

      /* 选中项自己的底色 / 投影 / 圆角（line 档留空，segmented 档换成浮起的那颗） */
      --mc-tabs-bg-selected: 0 0 0 / 0;
      --mc-tabs-shadow-selected: none;
      --mc-tabs-tab-radius: var(--mc-radius-md, var(--mc-def-radius-md))
        var(--mc-radius-md, var(--mc-def-radius-md)) 0 0;
    }

    /* 2. 标签条：指示条是它内部绝对定位的一层，位移 / 宽度由 JS 按激活项写（见 placeIndicator） */
    .mc-list {
      position: relative;
      display: flex;
      align-items: stretch;
      gap: var(--mc-tabs-gap);
      border-bottom: 1px solid rgb(var(--mc-tabs-border));
    }
    .mc-indicator {
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 0;
      height: var(--mc-tabs-indicator-h);
      border-radius: var(--mc-radius-full, var(--mc-def-radius-full));
      background-color: rgb(var(--mc-tabs-indicator));
      transition:
        transform var(--mc-duration-base, var(--mc-def-duration-base))
          var(--mc-ease-standard, var(--mc-def-ease-standard)),
        width var(--mc-duration-base, var(--mc-def-duration-base))
          var(--mc-ease-standard, var(--mc-def-ease-standard));
      pointer-events: none;
    }

    /* 3. 外观档：line 是默认那套下划线；segmented 把标签条收成一排分段切换器 ——
       尺寸 / 色槽全落在上面那组 --mc-tabs-* 上，mc-tab 在自己的 shadow 里不用知道 variant。
       样子照 `docs/components/example.html` 里「ofa.js 例子 / 普通例子」那颗切换器：
       浅底轨道 + 选中项浮起，没有下划线指示条。 */
    :host([variant='segmented']) {
      --mc-tabs-tab-h: var(--mc-control-h-sm, var(--mc-def-control-h-sm));
      --mc-tabs-pad-x: 10px;
      --mc-tabs-gap: 2px;
      --mc-tabs-fg-selected: var(--mc-color-fg, var(--mc-def-color-fg));
      --mc-tabs-bg-hover: 0 0 0 / 0;
      --mc-tabs-bg-selected: var(--mc-color-surface, var(--mc-def-color-surface));
      --mc-tabs-shadow-selected: 0 1px 2px rgb(0 0 0 / 8%);
      --mc-tabs-tab-radius: var(--mc-radius-sm, var(--mc-def-radius-sm));
    }
    :host([variant='segmented']) .mc-list {
      display: inline-flex;
      padding: 2px;
      border-bottom: 0;
      border-radius: var(--mc-radius-md, var(--mc-def-radius-md));
      background-color: rgb(var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken)));
    }
    :host([variant='segmented']) .mc-indicator {
      display: none;
    }

    /* 4. 面板：常驻 DOM，非激活的挂 hidden（不用 o-if，P10） */
    .mc-panel {
      padding-block: var(--mc-tabs-panel-pad);
    }
  </style>

  <div class="mc-list" part="list">
    <slot></slot>
    <span class="mc-indicator" part="indicator"></span>
  </div>
  <!-- 面板区：包装节点由 mc-tab 默认插槽里的内容搬进来；内部投影插槽在 ready() 里挂
       （不写进模板是因为它是容器生成的内部节点，不进 public 插槽表 —— 见 README「设计取舍」） -->
  <div class="mc-panel" part="panel" attr:hidden="noPanel !== null"></div>

  <script>
    import { withEmits } from '../boot/emits.js';

    export default async () =>
      withEmits({
        tag: 'mc-tabs',

        // 本组件对外事件：声明即派发入口（见 boot/emits.js）
        emits: {
          change: { data: ['value'] },
        },

        attrs: {
          // 初始值走 default-value；运行时值走宿主 property value（规范 1.4），value 不是 attrs 键
          defaultValue: '',
          // 外观档：line（默认，下划线标签）/ segmented（分段切换器，见 README 与 api.md）
          variant: 'line',
          // 布尔：存在即真。有些地方只要一颗分段切换器，不要面板区（P1：布尔默认值必须是 null）
          noPanel: null,
        },

        ready() {
          // 元素引用走 this.shadow.$，原生属性靠 .ele
          this._list = this.shadow.$('.mc-list')?.ele ?? null;
          this._indicator = this.shadow.$('.mc-indicator')?.ele ?? null;
          this._panelHost = this.shadow.$('.mc-panel')?.ele ?? null;
          this._panels = new Map(); // mc-tab → 容器生成的 panel 包装节点

          /* 面板内容在 mc-tab 的默认插槽里，要投影进容器 shadow 的面板区 —— 只有 direct child 的 slot
             才能接住，所以面板区这颗内部 slot 运行时挂（它不是 public 插槽，见 README「设计取舍」） */
          const panelSlot = document.createElement('slot');
          panelSlot.name = 'panel';
          this._panelHost?.append(panelSlot);

          /* 运行时值：宿主 DOM property（P18）。这里只挂访问器，不写宿主属性（构造期写宿主会抛，P31） */
          Object.defineProperty(this.ele, 'value', {
            configurable: true,
            get: () => this.activeValue(),
            set: (value) => {
              this._value = value == null ? '' : String(value);
              this.applyState();
            },
          });

          this._mounted = true; // 之后的 watch 才算真变化（P5）
          this.applyState();
        },

        attached() {
          this._panels ??= new Map(); // 重新挂载时沿用已有包装节点，别重复造
          this._onClick = (event) => this.handleClick(event);
          this._onKeydown = (event) => this.handleKeydown(event);
          this.ele.addEventListener('click', this._onClick);
          this.ele.addEventListener('keydown', this._onKeydown);

          this.normalizeBoolAttrs();

          /* 增删标签 / 改 value / 改 disabled 都要重新同步；我们自己写的 selected / hidden 不在过滤表里，不会自激 */
          this._mo = new MutationObserver(() => this.applyState());
          this._mo.observe(this.ele, {
            childList: true,
            subtree: true,
            attributeFilter: ['value', 'disabled', 'slot'],
          });

          /* 标签宽度随文案 / 字体 / 容器变，mc-tab 也可能比我们晚升级 —— 尺寸一变就重摆指示条 */
          this._ro = new ResizeObserver(() => this.placeIndicator());
          this.applyState();
        },

        watch: {
          defaultValue() {
            // 首次触发落在构造期（P5）；property 写过值就不再跟随初始值
            if (this._mounted && this._value === undefined) this.applyState();
          },

          noPanel() {
            if (!this._mounted) return;
            this.normalizeBoolAttrs(); // 归一化会再触发一次 watch，第二次就稳定了
            this.applyState();
          },
        },

        detached() {
          this.ele.removeEventListener('click', this._onClick);
          this.ele.removeEventListener('keydown', this._onKeydown);
          this._mo?.disconnect();
          this._ro?.disconnect();
        },

        proto: {
          /** 标签 = 直接子项里的 mc-tab；只认直接子项，嵌套的 mc-tabs 才不会互相误伤 */
          tabList() {
            return [...this.ele.querySelectorAll(':scope > mc-tab')];
          },

          /** 面板 = 带 slot="panel" 的直接子项，按 value 匹配（由 collectPanels 按 mc-tab 生成） */
          panelList() {
            return [...this.ele.querySelectorAll(':scope > [slot="panel"]')];
          },

          /** no-panel 存在即真：只当分段切换器，面板区不渲染、mc-tab 的内容也不搬 */
          hasNoPanel() {
            return this.ele.hasAttribute('no-panel');
          },

          /** ofa 的布尔绑定会把 false 写成 no-panel="false"：摘掉，hasAttribute / CSS 才判得准（P31） */
          normalizeBoolAttrs() {
            const raw = this.ele.getAttribute('no-panel');
            if (raw === null) return;
            if (raw === 'false' || raw === '0') this.ele.removeAttribute('no-panel');
            else if (raw !== '') this.ele.setAttribute('no-panel', '');
          },

          /**
           * 面板内容写在 mc-tab 的默认插槽里，而面板区在容器的 shadow 里 —— 只有容器的 direct child
           * 才投影得过去，所以这里给每个 mc-tab 生成一个 `<div slot="panel" value="…">`，把它的子节点整段搬进去。
           * 行为层例外（造节点 + 搬节点）：新 API 把面板收进了 mc-tab，模板表达不了这次跨 shadow 的交接；
           * 搬完内容仍是 light DOM，页面样式照常生效。no-panel 时不搬（内容留在 mc-tab 里、也不显示）。
           */
          collectPanels() {
            const map = this._panels;
            if (!map || this.hasNoPanel()) return;

            const tabs = this.tabList();
            for (const tab of tabs) {
              let panel = map.get(tab);
              if (!panel) {
                panel = document.createElement('div');
                panel.setAttribute('slot', 'panel');
                panel.setAttribute('hidden', '');
                this.ele.append(panel);
                map.set(tab, panel);
              }
              const value = tab.getAttribute('value') ?? '';
              if ((panel.getAttribute('value') ?? '') !== value) panel.setAttribute('value', value);
              // 只搬面板内容：标签文案在 name 属性上，不需要占插槽
              while (tab.firstChild) panel.append(tab.firstChild);
            }

            for (const [tab, panel] of map) {
              if (tabs.includes(tab)) continue;
              panel.remove();
              map.delete(tab);
            }
          },

          /**
           * mc-tab 内部那颗原生按钮（part="base"）。
           * 行为层例外（跨 shadow root）：roving tabindex / 焦点 / 指示条量宽都落在这颗按钮上，
           * 而它住在子组件自己的 shadow 里 —— 容器模板与 this.shadow.$ 都够不着，只能读宿主的原生 shadowRoot。
           */
          baseOf(tab) {
            return tab?.shadowRoot?.querySelector('.mc-base') ?? null;
          },

          /** 当前激活值：property > default-value 属性 > 第一个可用项；指向禁用项时同样退到第一个可用项 */
          activeValue() {
            const tabs = this.tabList();
            const usable = (tab) => !tab.hasAttribute('disabled');
            const want =
              this._value !== undefined
                ? this._value
                : (this.ele.getAttribute('default-value') ?? '');
            const hit = tabs.find(
              (tab) => usable(tab) && (tab.getAttribute('value') ?? '') === want,
            );
            if (hit) return hit.getAttribute('value') ?? '';
            const first = tabs.find(usable);
            return first ? (first.getAttribute('value') ?? '') : '';
          },

          /**
           * 把「谁是激活项」落到三处：标签的 selected、button 的 roving tabindex、面板的 hidden；面板用 hidden 常驻 DOM，切回来内容还在。
           * 面板内容先从 mc-tab 的默认插槽搬进包装节点（collectPanels），其余只同步状态属性。
           */
          applyState() {
            this.collectPanels();
            const active = this.activeValue();
            const tabs = this.tabList().map((tab) => ({
              tab,
              value: tab.getAttribute('value') ?? '',
              base: this.baseOf(tab),
            }));
            const panels = this.panelList().map((panel) => ({
              panel,
              value: panel.getAttribute('value') ?? '',
            }));

            for (const info of tabs) {
              const on = info.value === active;
              if (on) info.tab.setAttribute('selected', '');
              else info.tab.removeAttribute('selected');
              if (!info.base) continue; // 还没升级完：等 ResizeObserver 那一拍再补
              info.base.tabIndex = on ? 0 : -1;
            }

            for (const info of panels) {
              const on = info.value === active;
              if (on) info.panel.removeAttribute('hidden');
              else info.panel.setAttribute('hidden', '');
            }

            this.observeSizes();
            this.placeIndicator();
          },

          /** 观察标签条与每个标签的尺寸（重复 observe 同一个元素是空操作） */
          observeSizes() {
            if (!this._ro) return;
            if (this._list) this._ro.observe(this._list);
            for (const tab of this.tabList()) this._ro.observe(tab);
          },

          /** 指示条 = 激活标签内部那个 button 的宽度与左偏移（相对标签条）。没有标签时缩到 0。
            行为层例外（测量）：宽度 / 位移是量出来的像素值，模板的 class / style 绑定表达不了；
            ResizeObserver 在字体、文案、容器尺寸变化时重算，结果写进内联 style。 */
          placeIndicator() {
            const indicator = this._indicator;
            if (!indicator) return;
            const list = this._list;
            const active = this.activeValue();
            const tab = this.tabList().find(
              (item) => (item.getAttribute('value') ?? '') === active,
            );
            const base = this.baseOf(tab) ?? tab;
            const rect = base?.getBoundingClientRect();
            if (!list || !rect || !rect.width) {
              indicator.style.width = '0';
              indicator.style.transform = 'translateX(0)';
              return;
            }
            const listRect = list.getBoundingClientRect();
            indicator.style.width = `${rect.width}px`;
            indicator.style.transform = `translateX(${rect.left - listRect.left}px)`;
          },

          /** 点击标签（原生 click 自带 composed，穿得出 mc-tab 的 shadow） */
          handleClick(event) {
            const path = event.composedPath();
            const tab = this.tabList().find((item) => path.includes(item));
            if (!tab || tab.hasAttribute('disabled')) return;
            this.activate(tab.getAttribute('value') ?? '', tab);
          },

          /** 方向键 / Home / End：在可用标签之间移动**并激活**，焦点跟着走 */
          handleKeydown(event) {
            const path = event.composedPath();
            const tabs = this.tabList();
            const from = tabs.findIndex((tab) => path.includes(tab));
            if (from < 0) return;

            let next = null;
            if (event.key === 'ArrowRight') next = this.step(from, 1);
            else if (event.key === 'ArrowLeft') next = this.step(from, -1);
            else if (event.key === 'Home') next = this.edge(tabs, 1);
            else if (event.key === 'End') next = this.edge(tabs, -1);
            if (!next) return;

            event.preventDefault(); // 别让方向键滚动页面
            this.activate(next.getAttribute('value') ?? '', next);
          },

          /** 从 from 出发按 dir 找下一个可用标签（绕回来），全禁用时返回 null */
          step(from, dir) {
            const tabs = this.tabList();
            for (let i = 1; i <= tabs.length; i += 1) {
              const at = (((from + dir * i) % tabs.length) + tabs.length) % tabs.length;
              const tab = tabs[at];
              if (tab && !tab.hasAttribute('disabled')) return tab;
            }
            return null;
          },

          /** 头 / 尾那个可用标签（dir > 0 从前往后找） */
          edge(tabs, dir) {
            const list = dir > 0 ? tabs : [...tabs].reverse();
            return list.find((tab) => !tab.hasAttribute('disabled')) ?? null;
          },

          /** 选中某个标签：同步四处状态、把焦点交给它内部的 button，值真变了才发 change */
          activate(value, tab) {
            const changed = this.activeValue() !== value;
            this._value = value;
            this.applyState();
            this.baseOf(tab)?.focus();
            if (changed) this.$emit('change', { value });
          },
        },
      });
  </script>
</template>
