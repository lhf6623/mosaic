<!-- mc-tab — 一个标签（配合 mc-tabs 使用）；设计取舍见 README.md「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主盒模型。尺寸 / 色槽由容器通过 --mc-tabs-* 继承下来 —— ⚠️ 这里不能写默认值，否则会盖掉容器继承来的值 */
    :host {
      display: inline-flex;
      box-sizing: border-box;
    }

    /* 2. 标签按钮 = 内部原生 button：点击、焦点、禁用语义都归它 */
    .mc-base {
      box-sizing: border-box;
      height: var(--mc-tabs-tab-h, var(--mc-control-h-md, var(--mc-def-control-h-md)));
      padding-inline: var(--mc-tabs-pad-x, var(--mc-space-3, var(--mc-def-space-3)));
      border-radius: var(--mc-tabs-tab-radius, var(--mc-radius-md, var(--mc-def-radius-md)));
      background-color: transparent;
      color: rgb(var(--mc-tabs-fg, var(--mc-color-fg-muted, var(--mc-def-color-fg-muted))));
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-tabs-font, var(--mc-text-sm, var(--mc-def-text-sm)));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
      white-space: nowrap;
      transition:
        color var(--mc-duration-fast, var(--mc-def-duration-fast))
          var(--mc-ease-standard, var(--mc-def-ease-standard)),
        background-color var(--mc-duration-fast, var(--mc-def-duration-fast))
          var(--mc-ease-standard, var(--mc-def-ease-standard));
    }
    /* 悬停只换文字色（默认主题色），不铺底色 —— 悬停块会跟下划线指示条抢视觉，
       segmented 档的轨道本身已有灰底，再叠一层更脏。想加底色由页面 `::part(base):hover` 覆盖。 */
    .mc-base:hover {
      color: rgb(var(--mc-tabs-fg-hover, var(--mc-color-primary, var(--mc-def-color-primary))));
    }
    .mc-base:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring))); /* 焦点环用 ring 令牌（P16） */
      outline-offset: -2px;
    }

    /* 3. 状态：selected 由容器写（它不进 attrs，只当 CSS 钩子用）。
       文字色走容器继承来的 --mc-tabs-*：line 档是主色，segmented 档换前景色；
       选中项的底色 / 投影不在这里画 —— segmented 档由容器的滑动指示条承担（切换才有滑动动画），
       这两个令牌（--mc-tabs-bg-selected / --mc-tabs-shadow-selected）归容器自己消费。 */
    :host([selected]) .mc-base {
      color: rgb(var(--mc-tabs-fg-selected, var(--mc-color-primary, var(--mc-def-color-primary))));
    }

    /* 4. 关闭按钮：只有 closable 才显示；和 base 是兄弟（button 里不能再套 button） */
    .mc-close {
      display: none;
      flex: none;
      align-items: center;
      justify-content: center;
      width: 1.125rem;
      height: 1.125rem;
      margin-inline: -0.25rem var(--mc-space-1, var(--mc-def-space-1));
      padding: 0;
      border: 0;
      border-radius: var(--mc-radius-sm, var(--mc-def-radius-sm));
      background: transparent;
      color: rgb(var(--mc-tabs-fg, var(--mc-color-fg-muted, var(--mc-def-color-fg-muted))));
      font-size: 0.875rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.55;
    }
    :host([closable]) .mc-close {
      display: inline-flex;
    }
    :host([closable]) .mc-base {
      padding-inline-end: var(--mc-space-2, var(--mc-def-space-2));
    }
    .mc-close:hover {
      background-color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)) / 0.12);
      opacity: 1;
    }
    .mc-close:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }

    /* 5. 禁用：光标留在宿主上（宿主写 pointer-events: none 会连 cursor 一起失效），按钮自己 disabled */
    :host([disabled]) {
      opacity: 0.5;
      cursor: not-allowed;
    }
    :host([disabled]) .mc-base {
      cursor: not-allowed;
    }
  </style>

  <button class="mc-base" part="base" type="button" attr:disabled="disabled !== null">
    {{name}}
  </button>
  <button class="mc-close" part="close" type="button" aria-label="关闭" on:click="onClose($event)">
    <span aria-hidden="true">×</span>
  </button>
  <!-- 面板内容（默认插槽）：面板区在 mc-tabs 的 shadow 里，容器会把它搬过去；
       这里先接着 —— 未升级 / 单独使用时也不会漏到页面上 -->
  <div hidden><slot></slot></div>

  <script>
    import { withOptions } from '../boot/options.js';

    export default async () =>
      withOptions({
        tag: 'mc-tab',

        // 关闭是标签自己的动作，事件冒泡给容器 / 页面，容器不代劳
        emits: {
          close: { data: ['value'] },
        },

        attrs: {
          value: '',
          name: '', // 标签文案；面板内容走默认插槽（由 mc-tabs 搬到面板区）
          disabled: null, // 布尔默认值必须是 null（P1）
          closable: null, // 布尔默认值必须是 null（P1）
        },

        proto: {
          onClose(event) {
            /* 关闭不是「选中」：先截住 click，别让容器把这一下当成切标签 */
            event?.stopPropagation();
            if (this.ele.hasAttribute('disabled')) return;
            this.$emit('close', { value: this.ele.getAttribute('value') ?? '' });
          },
        },
      });
  </script>
</template>
