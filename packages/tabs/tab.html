<!-- mc-tab — 一个标签（配合 mc-tabs 使用）；设计取舍见 README.md「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主盒模型。尺寸 / 色槽由容器通过 --mc-tabs-* 继承下来 —— ⚠️ 这里不能写默认值，否则会盖掉容器继承来的值 */
    :host {
      display: inline-flex;
      box-sizing: border-box;
    }

    /* 2. 标签按钮 = 内部原生 button：点击、焦点、禁用语义都归它 */
    .mc-base {
      box-sizing: border-box;
      height: var(--mc-tabs-tab-h, var(--mc-control-h-md, var(--mc-def-control-h-md)));
      padding-inline: var(--mc-tabs-pad-x, var(--mc-space-3, var(--mc-def-space-3)));
      border-radius: var(--mc-tabs-tab-radius, var(--mc-radius-md, var(--mc-def-radius-md)));
      background-color: transparent;
      color: rgb(var(--mc-tabs-fg, var(--mc-color-fg-muted, var(--mc-def-color-fg-muted))));
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-tabs-font, var(--mc-text-sm, var(--mc-def-text-sm)));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
      white-space: nowrap;
      transition:
        color var(--mc-duration-fast, var(--mc-def-duration-fast))
          var(--mc-ease-standard, var(--mc-def-ease-standard)),
        background-color var(--mc-duration-fast, var(--mc-def-duration-fast))
          var(--mc-ease-standard, var(--mc-def-ease-standard));
    }
    .mc-base:hover {
      background-color: rgb(
        var(--mc-tabs-bg-hover, var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken)))
      );
      color: rgb(var(--mc-tabs-fg-hover, var(--mc-color-fg, var(--mc-def-color-fg))));
    }
    .mc-base:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring))); /* 焦点环用 ring 令牌（P16） */
      outline-offset: -2px;
    }

    /* 3. 状态：selected 由容器写（它不进 attrs，只当 CSS 钩子用）。
       底色 / 投影 / 圆角走容器继承来的 --mc-tabs-*：line 档是透明 + 方角，
       segmented 档换成浮起的那颗（variant 只写在容器上，这里靠令牌读，不认属性） */
    :host([selected]) .mc-base {
      color: rgb(var(--mc-tabs-fg-selected, var(--mc-color-primary, var(--mc-def-color-primary))));
      background-color: rgb(var(--mc-tabs-bg-selected, 0 0 0 / 0));
      box-shadow: var(--mc-tabs-shadow-selected, none);
    }

    /* 4. 禁用：光标留在宿主上（宿主写 pointer-events: none 会连 cursor 一起失效），按钮自己 disabled */
    :host([disabled]) {
      opacity: 0.5;
      cursor: not-allowed;
    }
    :host([disabled]) .mc-base {
      cursor: not-allowed;
    }
  </style>

  <button class="mc-base" part="base" type="button" attr:disabled="disabled !== null">
    {{name}}
  </button>
  <!-- 面板内容（默认插槽）：面板区在 mc-tabs 的 shadow 里，容器会把它搬过去；
       这里先接着 —— 未升级 / 单独使用时也不会漏到页面上 -->
  <div hidden><slot></slot></div>

  <script>
    export default async () => ({
      tag: 'mc-tab',

      attrs: {
        value: '',
        name: '', // 标签文案；面板内容走默认插槽（由 mc-tabs 搬到面板区）
        disabled: null, // 布尔默认值必须是 null（P1）
      },
    });
  </script>
</template>
