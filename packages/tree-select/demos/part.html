<template component>
  <style>
    /* 内部节点封在 shadow 里，只有标了 part 的节点能从外面改：
       base（触发框）、panel（面板）、option（树里每一行）、expand（行首展开 / 收起图标容器）、
       prefix（prefix 插槽的容器）、chevron（触发框右端箭头容器）。 */
    .part-custom::part(base) {
      border-color: rgb(var(--mc-color-primary));
      border-radius: var(--mc-radius-full);
    }
    .part-custom::part(panel) {
      border-radius: 0;
      background-color: rgb(var(--mc-color-primary-subtle));
    }
    .part-custom::part(option) {
      border-radius: var(--mc-radius-full);
      color: rgb(var(--mc-color-primary));
      text-align: center;
    }
    /* expand 是行首那个展开 / 收起图标的容器：内置右箭头、icon 模板克隆进来的内容、
       加载中的转圈都装在它里面。给它颜色，自定义图标就跟着变（展开时整层旋转 90°）。 */
    .part-custom::part(expand) {
      color: rgb(var(--mc-color-info));
      font-size: 1.1em;
    }
    /* 插槽容器：颜色从这里继承给插槽内容（没放内容的插槽不占位） */
    .part-custom::part(prefix) {
      color: rgb(var(--mc-color-info));
    }
    .part-custom::part(chevron) {
      color: rgb(var(--mc-color-danger));
      font-weight: var(--mc-weight-medium, 500);
    }
  </style>

  <mc-space block wrap-items align="start">
    <mc-tree-select
      class="part-custom"
      default-value="hz"
      placeholder="改 ::part(base / panel / option / expand / prefix / chevron)">
      <span slot="prefix">前缀</span>
      <span slot="chevron">▾</span>
      <!-- icon 模板 = 行首展开 / 收起图标；叶子行不渲染，加载中换成转圈 -->
      <template slot="icon">
        <span>▸</span>
      </template>
    </mc-tree-select>
    <mc-tree-select default-value="hz" placeholder="默认对照"></mc-tree-select>
  </mc-space>

  <script>
    const OPTIONS = [
      {
        value: 'zj',
        label: '浙江',
        children: [
          { value: 'hz', label: '杭州' },
          { value: 'nb', label: '宁波' },
          { value: 'wz', label: '温州' },
        ],
      },
      {
        value: 'js',
        label: '江苏',
        children: [
          { value: 'nj', label: '南京' },
          { value: 'sz', label: '苏州' },
        ],
      },
      { value: 'sh', label: '上海' },
    ];

    export default async () => ({
      tag: 'demo-tree-select-part',

      ready() {
        for (const el of this.shadow.all('mc-tree-select').map((item) => item.ele)) {
          el.options = OPTIONS;
        }
      },
    });
  </script>
</template>
