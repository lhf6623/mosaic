<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.5/dist/ofa.min.mjs"
      type="module"></script>
  </head>
  <body>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/space/space.html"></l-m>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/tree-select/tree-select.html"></l-m>

    <mc-space block wrap-items align="start">
      <!-- 只有 placeholder：没有选中值时显示这句 -->
      <mc-tree-select placeholder="选择城市"></mc-tree-select>
      <!-- 非受控初值 + 可清除：有值后右端换成 × -->
      <mc-tree-select clearable default-value="hz" placeholder="选择城市"></mc-tree-select>
      <!-- value 也能写属性：它是绑定通道，挂载时同样当初始值读 -->
      <mc-tree-select value="sz" placeholder="选择城市"></mc-tree-select>
      <!-- 固定窄宽度：长标签被省略号裁掉，hover / focus 弹完整文案 -->
      <mc-tree-select
        style="width: 12rem"
        default-value="long"
        placeholder="长标签（hover 看完整）"></mc-tree-select>
    </mc-space>

    <script>
      /* 树数据用 property 传（同 mc-menu / mc-table）：属性通道只收 JSON 文本。
         数据里不写层级 —— children 就是层级，缩进由容器自己算。 */
      const OPTIONS = [
        {
          value: 'zj',
          label: '浙江',
          children: [
            { value: 'hz', label: '杭州' },
            { value: 'nb', label: '宁波' },
            { value: 'wz', label: '温州' },
          ],
        },
        {
          value: 'js',
          label: '江苏',
          children: [
            { value: 'nj', label: '南京' },
            { value: 'sz', label: '苏州' },
          ],
        },
        { value: 'sh', label: '上海' },
        { value: 'long', label: '杭州市西湖区文三路 90 号（一个很长的节点名称，用来测裁切提示）' },
      ];

      customElements.whenDefined('mc-tree-select').then(() => {
        for (const el of document.querySelectorAll('mc-tree-select')) el.options = OPTIONS;
      });
    </script>

  </body>
</html>
