<template component>
  <mc-space block wrap-items align="start">
    <!-- 点开面板，再点行首的箭头：标了 lazy 的节点点箭头才去 load -->
    <mc-tree-select
      id="async-tree"
      placeholder="点开面板，再点行首箭头加载"
      on:load-error="onLoadError($event)"></mc-tree-select>
  </mc-space>

  <p class="mt-3 text-sm text-muted">
    最近一次 load-error：
    <strong>{{lastError}}</strong>
  </p>

  <script>
    /* 数据里只标 lazy: true —— loader 是**组件级 property**，不写进 options
       （options 是纯 JSON，装不下函数）。load 返回的节点默认是叶子；
       要再往下异步，给返回的节点继续标 lazy: true。 */
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    /* 第二个根节点第一次 reject、第二次成功：用来演示失败态与「再点重试」 */
    let attempt = 0;

    const OPTIONS = [
      { value: 'city', label: '城市（1 秒后加载成功）', lazy: true },
      { value: 'area', label: '区县（第一次失败，再点一次）', lazy: true },
    ];

    /* load(懒节点) 返回 Promise<节点数组>；按 node.value 分支模拟两个请求 */
    const LOADER = (node) => {
      if (node.value === 'city') {
        return wait(1000).then(() => [
          { value: 'hz', label: '杭州' },
          { value: 'nb', label: '宁波' },
        ]);
      }
      attempt += 1;
      if (attempt === 1) return Promise.reject(new Error('模拟：网络开小差'));
      return wait(800).then(() => [
        { value: 'xh', label: '西湖区' },
        { value: 'yh', label: '余杭区' },
      ]);
    };

    export default async () => ({
      tag: 'demo-tree-select-async',

      data: { lastError: '（还没失败）' },

      ready() {
        const el = this.ele.shadowRoot.querySelector('#async-tree');
        el.options = OPTIONS;
        /* load 是组件级 property：换掉它，组件会按新数据重算哪些节点是懒父级 */
        el.load = LOADER;
      },

      proto: {
        /* load-error 载荷：{ value, error } —— 节点 value 与原始错误对象 */
        onLoadError(event) {
          const { value, error } = event.data;
          this.lastError = value + '：' + (error && error.message ? error.message : error);
        },
      },
    });
  </script>
</template>
