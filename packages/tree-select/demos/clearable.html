<template component>
  <mc-space block wrap-items align="start">
    <!-- 有值且 clearable：右端出现 ×，点它清空并回到 placeholder -->
    <mc-tree-select clearable default-value="hz" placeholder="点右端 × 清除"></mc-tree-select>
    <!-- 没有值：× 不出现，也不占位 -->
    <mc-tree-select clearable placeholder="没有值时不出现 ×"></mc-tree-select>
    <!-- 不给 clearable：有值也没有 × -->
    <mc-tree-select default-value="nb" placeholder="没有 clearable"></mc-tree-select>
  </mc-space>

  <script>
    const OPTIONS = [
      {
        value: 'zj',
        label: '浙江',
        children: [
          { value: 'hz', label: '杭州' },
          { value: 'nb', label: '宁波' },
          { value: 'wz', label: '温州' },
        ],
      },
      {
        value: 'js',
        label: '江苏',
        children: [
          { value: 'nj', label: '南京' },
          { value: 'sz', label: '苏州' },
        ],
      },
      { value: 'sh', label: '上海' },
    ];

    export default async () => ({
      tag: 'demo-tree-select-clearable',

      ready() {
        for (const el of this.ele.shadowRoot.querySelectorAll('mc-tree-select')) {
          el.options = OPTIONS;
        }
      },
    });
  </script>
</template>
