<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 普通 HTML 页：引 ofa.js + 用到的组件；排版工具类来自可选的 mosaic.css -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/boot/mosaic.css" />
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.5/dist/ofa.min.mjs"
      type="module"></script>
  </head>
  <body>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/space/space.html"></l-m>
    <l-m
      src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/pagination/pagination.html"></l-m>

    <mc-space direction="vertical" block>
      <!-- 属性通道：JSON 文本，只作初值；顺序 = 数组顺序 -->
      <mc-pagination
        total="85"
        page-size="10"
        default-current="3"
        blocks='["sizer","prev","pages","next","jumper"]'></mc-pagination>

      <!-- 没列出来的块不渲染：这里没有 sizer / jumper / suffix -->
      <mc-pagination
        total="85"
        page-size="10"
        default-current="3"
        blocks='["prefix","pages","prev","next"]'>
        <span slot="prefix">共 85 条</span>
      </mc-pagination>
    </mc-space>
  </body>
</html>
