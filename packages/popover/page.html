    <l-m src="../alert/alert.html"></l-m>

    <doc-crumb></doc-crumb>
    <h1>Popover <code>mc-popover</code></h1>
    <p class="doc-lead">
      通用浮层：面板锚在触发元素上，点空白或按 Esc 关掉。内容由使用者给 —— 菜单、表单、说明都行。
    </p>

    <mc-alert class="doc-notes" color="warning" icon heading="注意事项">
      <ul>
        <li>
          <strong>需要 popover API 与 CSS 锚点定位</strong>（Chrome 125+ / Safari 17+ / Firefox
          125+）：没有这些能力的浏览器上面板不会弹出 —— 不报错，也没有替代路径。
        </li>
        <li><strong>默认插槽只放一个触发元素</strong>：放多个元素时面板会按整块对齐。</li>
        <li>
          <strong>浮层不受宿主页面布局影响</strong>：不会被 <code>transform</code> /
          <code>filter</code> 困住，Esc 与点空白关闭交给浏览器（<code>--mc-z-*</code>
          那一套在这里用不上）。
        </li>
      </ul>
    </mc-alert>

    <h2>例子</h2>

    <section class="doc-demo">
      <h3>方位</h3>
      <p class="doc-hint">
        <code>placement</code> 十二个方向：上下左右，各带 <code>-start</code> /
        <code>-end</code> 后缀（不写后缀 = 居中）。空间不够时浏览器
        <strong>自动翻到另一侧</strong>，不会溢出视口。
      </p>
      <demo-popover-placement></demo-popover-placement>
      <mc-collapse class="doc-demo-code">
        <mc-collapse-item header="查看代码"
          ><mc-code language="html" src="./demos/placement.html"></mc-code
        ></mc-collapse-item>
      </mc-collapse>
    </section>

    <section class="doc-demo">
      <h3>触发方式</h3>
      <p class="doc-hint">
        <code>trigger</code> 三选一：<code>click</code>（默认）/ <code>hover</code> /
        <code>manual</code>（只认 <code>open</code> 属性与 <code>show()</code>，受控开合就走它）。
      </p>
      <demo-popover-trigger></demo-popover-trigger>
      <mc-collapse class="doc-demo-code">
        <mc-collapse-item header="查看代码"
          ><mc-code language="html" src="./demos/trigger.html"></mc-code
        ></mc-collapse-item>
      </mc-collapse>
    </section>

    <section class="doc-demo">
      <h3>受控开合</h3>
      <p class="doc-hint">
        <code>open</code> 是受控属性：写上即开、移除即关。<strong
          >用它就得同时把 <code>trigger</code> 设成 <code>manual</code></strong
        >
        —— 默认的 <code>click</code> 走的是组件自己的 <code>toggle()</code>，
        它会和外面这份状态抢着写同一个属性（点了没反应、面板不弹，多半就是这两条路混用了）。组件在
        <code>show()</code> /
        <code>hide()</code> 里同样会增删它（把浏览器发起的关闭同步回来），所以外部
        只从「改属性」这一头驱动；被 Esc / 点空白关掉时属性已经删了、只发
        <code>close</code>，使用者把 那边的状态收回去 —— 外面那个按钮就是这套写法。
      </p>
      <demo-popover-controlled></demo-popover-controlled>
      <mc-collapse class="doc-demo-code">
        <mc-collapse-item header="查看代码"
          ><mc-code language="html" src="./demos/controlled.html"></mc-code
        ></mc-collapse-item>
      </mc-collapse>
    </section>

    <section class="doc-demo">
      <h3>箭头</h3>
      <p class="doc-hint">
        小三角<strong>默认就有</strong>，跟着 <code>placement</code> 换边；<code>arrow="none"</code>
        关掉。
      </p>
      <demo-popover-arrow></demo-popover-arrow>
      <mc-collapse class="doc-demo-code">
        <mc-collapse-item header="查看代码"
          ><mc-code language="html" src="./demos/arrow.html"></mc-code
        ></mc-collapse-item>
      </mc-collapse>
    </section>

    <section class="doc-demo">
      <h3>贴边翻转</h3>
      <p class="doc-hint">
        下面三个触发元素分别贴着视口的底边、右边、右下角 —— 面板会自己翻到放得下的那一侧。
      </p>
      <demo-popover-flip></demo-popover-flip>
      <mc-collapse class="doc-demo-code">
        <mc-collapse-item header="查看代码"
          ><mc-code language="html" src="./demos/flip.html"></mc-code
        ></mc-collapse-item>
      </mc-collapse>
    </section>

    <section class="doc-demo">
      <h3>面板里放菜单</h3>
      <p class="doc-hint">
        面板内容由使用者给 —— 放项目自己的 <code>mc-menu</code> 就是一个下拉菜单。
      </p>
      <demo-popover-menu></demo-popover-menu>
      <mc-collapse class="doc-demo-code">
        <mc-collapse-item header="查看代码"
          ><mc-code language="html" src="./demos/menu.html"></mc-code
        ></mc-collapse-item>
      </mc-collapse>
    </section>

    <section class="doc-demo">
      <h3>外部样式</h3>
      <p class="doc-hint">
        样式写在宿主上：面板底色、圆角、内边距、离触发元素的距离都是
        <code>--mc-popover-*</code> 令牌。
      </p>
      <demo-popover-customize></demo-popover-customize>
      <mc-collapse class="doc-demo-code">
        <mc-collapse-item header="查看代码"
          ><mc-code language="html" src="./demos/customize.html"></mc-code
        ></mc-collapse-item>
      </mc-collapse>
    </section>

    <section class="doc-demo">
      <h3>内部样式</h3>
      <p class="doc-hint">
        内部结构封在 shadow 里，只有 <code>::part(panel)</code>（面板本体）与
        <code>::part(arrow)</code>（小三角）能从外面改。
      </p>
      <demo-popover-part></demo-popover-part>
      <mc-collapse class="doc-demo-code">
        <mc-collapse-item header="查看代码"
          ><mc-code language="html" src="./demos/part.html"></mc-code
        ></mc-collapse-item>
      </mc-collapse>
    </section>
