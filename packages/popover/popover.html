<!-- mc-popover — 通用浮层（点击/悬停/手动触发，锚在触发元素上）。设计取舍见同目录 README.md 的「设计取舍」；本文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    :host {
      display: inline-block;
      position: relative;

      /* L3 令牌：距离与锚点对应关系都在这里。⚠️ `--mc-popover-panel-border` 只当**轮廓色**用（面板不画 border，描边是 drop-shadow 做的），名字沿用不改 */
      --mc-popover-offset: var(--mc-space-2, var(--mc-def-space-2));
      --mc-popover-anchor: --mc-popover-anchor; /* @internal：给 anchor-name / position-anchor 用的标识，不是使用者覆盖点 */
      --mc-popover-panel-bg: var(--mc-color-surface-raised, var(--mc-def-color-surface-raised));
      --mc-popover-panel-border: var(--mc-color-border-strong, var(--mc-def-color-border-strong));
      --mc-popover-panel-radius: var(--mc-radius-lg, var(--mc-def-radius-lg));
      --mc-popover-panel-pad: var(--mc-space-4, var(--mc-def-space-4));
      /* 最小宽度：菜单类面板太窄会显得挤，也避免贴边翻转后宽度抖动 */
      --mc-popover-panel-min-width: 0;
    }

    /* 锚点：必须是自己 shadow 里的元素。⚠️ 用 inline-flex：inline-block 带行盒基线缝隙，而锚点几何就是定位基准 */
    .mc-anchor {
      display: inline-flex;
      anchor-name: --mc-popover-anchor;
    }

    /* ---------- 面板 ---------- */
    .mc-panel {
      /* ⚠️ inset / margin 必须显式写：UA 给 [popover] 的那对 auto 会吃掉锚点定位 */
      position: fixed;
      inset: auto;
      margin: 0;

      box-sizing: border-box;
      min-width: var(--mc-popover-panel-min-width);
      /* ⚠️ 必须显式 overflow: visible：UA 给 [popover] 的 overflow: auto 会把伸出面板的三角裁掉 */
      overflow: visible;
      /* 贴边时别把面板压出视口：宽度上限跟着视口走，长内容自己折行 */
      max-width: min(24rem, calc(100vw - var(--mc-space-8, var(--mc-def-space-8))));
      padding: var(--mc-popover-panel-pad);
      /* ⚠️ 必须显式 border: 0：UA 给 [popover] 的 `border: solid` 宽度是 medium（3px）、颜色 currentColor */
      border: 0;
      border-radius: var(--mc-popover-panel-radius);
      background-color: rgb(var(--mc-popover-panel-bg));
      color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)));
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-text-sm, var(--mc-def-text-sm));
      line-height: var(--mc-text-sm-lh, var(--mc-def-text-sm-lh));
      /* ⚠️ 面板不要写 border：边框只长在矩形上，轮廓会在三角那条边断掉；改用跟着整体轮廓的 drop-shadow（第一层当描边） */
      filter: drop-shadow(0 0 1px rgb(var(--mc-popover-panel-border)))
        drop-shadow(0 4px 12px rgb(0 0 0 / 0.16));

      /* 锚点与翻转：12 个方向上的贴合 + 空间不足时自动翻 */
      position-anchor: --mc-popover-anchor;
      position-try-fallbacks:
        flip-block,
        flip-inline,
        flip-block flip-inline;
    }

    /* 12 个 placement：只写「面板哪条边贴锚点哪条边」 */
    :host([placement='bottom']) .mc-panel,
    :host(:not([placement])) .mc-panel {
      top: anchor(bottom);
      left: anchor(center);
      translate: -50% 0;
      margin-top: var(--mc-popover-offset);
    }
    :host([placement='bottom-start']) .mc-panel {
      top: anchor(bottom);
      left: anchor(left);
      margin-top: var(--mc-popover-offset);
    }
    :host([placement='bottom-end']) .mc-panel {
      top: anchor(bottom);
      right: anchor(right);
      margin-top: var(--mc-popover-offset);
    }
    :host([placement='top']) .mc-panel {
      bottom: anchor(top);
      left: anchor(center);
      translate: -50% 0;
      margin-bottom: var(--mc-popover-offset);
    }
    :host([placement='top-start']) .mc-panel {
      bottom: anchor(top);
      left: anchor(left);
      margin-bottom: var(--mc-popover-offset);
    }
    :host([placement='top-end']) .mc-panel {
      bottom: anchor(top);
      right: anchor(right);
      margin-bottom: var(--mc-popover-offset);
    }
    /* ⚠️ 居中变体必须单独写：交叉轴要 anchor(center) + -50% 位移，和 -start 合并会贴着顶边 */
    :host([placement='right']) .mc-panel {
      left: anchor(right);
      top: anchor(center);
      translate: 0 -50%;
      margin-left: var(--mc-popover-offset);
    }
    :host([placement='right-start']) .mc-panel {
      left: anchor(right);
      top: anchor(top);
      margin-left: var(--mc-popover-offset);
    }
    :host([placement='right-end']) .mc-panel {
      left: anchor(right);
      bottom: anchor(bottom);
      margin-left: var(--mc-popover-offset);
    }
    :host([placement='left']) .mc-panel {
      right: anchor(left);
      top: anchor(center);
      translate: 0 -50%;
      margin-right: var(--mc-popover-offset);
    }
    :host([placement='left-start']) .mc-panel {
      right: anchor(left);
      top: anchor(top);
      margin-right: var(--mc-popover-offset);
    }
    :host([placement='left-end']) .mc-panel {
      right: anchor(left);
      bottom: anchor(bottom);
      margin-right: var(--mc-popover-offset);
    }

    /* ---------- 小三角 ---------- */
    /* 三角：贴哪条边 + 交叉轴位置（= 面板 50% + `--mc-popover-arrow-shift`，脚本算好）；⚠️ 描边交给面板那层 drop-shadow，别再加 filter / border */
    .mc-arrow {
      /* ⚠️ 默认就是显示：别改成「默认隐藏 + :host(:not([arrow])) 显示」—— ofa 里 `:host()` 嵌 `:not()` 静默失效（P14） */
      display: block;
      position: absolute;
      /* ⚠️ 钻到面板背景之下：否则三角贴面板那侧的底边会在接缝处露出一条错位的线 */
      z-index: -1;
      width: var(--mc-space-3, var(--mc-def-space-3));
      height: var(--mc-space-3, var(--mc-def-space-3));
      background-color: rgb(var(--mc-popover-panel-bg));
    }
    :host([arrow='none']) .mc-arrow {
      display: none;
    }

    .mc-panel[data-side='bottom'] .mc-arrow {
      top: calc(var(--mc-space-3, var(--mc-def-space-3)) / -2);
      left: calc(
        50% + var(--mc-popover-arrow-shift, 0px) - var(--mc-space-3, var(--mc-def-space-3)) / 2
      ); /* @internal：脚本按锚点几何算好写进来 */
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }
    .mc-panel[data-side='top'] .mc-arrow {
      bottom: calc(var(--mc-space-3, var(--mc-def-space-3)) / -2);
      left: calc(
        50% + var(--mc-popover-arrow-shift, 0px) - var(--mc-space-3, var(--mc-def-space-3)) / 2
      ); /* @internal：脚本按锚点几何算好写进来 */
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    .mc-panel[data-side='left'] .mc-arrow {
      right: calc(var(--mc-space-3, var(--mc-def-space-3)) / -2);
      top: calc(
        50% + var(--mc-popover-arrow-shift-y, 0px) - var(--mc-space-3, var(--mc-def-space-3)) / 2
      ); /* @internal：脚本按锚点几何算好写进来 */
      clip-path: polygon(0 0, 100% 50%, 0 100%);
    }
    .mc-panel[data-side='right'] .mc-arrow {
      left: calc(var(--mc-space-3, var(--mc-def-space-3)) / -2);
      top: calc(
        50% + var(--mc-popover-arrow-shift-y, 0px) - var(--mc-space-3, var(--mc-def-space-3)) / 2
      ); /* @internal：脚本按锚点几何算好写进来 */
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
    }

    /* 有意不做进场/退场动画：连续操作时反而拖慢手感，top layer 里 transform 也受限 */
  </style>

  <!-- 触发元素：外面这层 .mc-anchor 是锚点载体，不能删 -->
  <span
    class="mc-anchor"
    on:click="onAnchorClick"
    on:pointerdown="onAnchorPointerDown"
    on:mouseenter="onAnchorEnter"
    on:mouseleave="onAnchorLeave">
    <slot></slot>
  </span>

  <!-- 面板：top layer + light-dismiss + Esc 由 popover="auto" 提供；原生 toggle 把外部关闭同步回 open -->
  <div class="mc-panel" part="panel" popover="auto" on:toggle="onNativeToggle">
    <span class="mc-arrow" part="arrow"></span>
    <slot name="panel"></slot>
  </div>

  <script>
    /* 定住滚动条的小工具：开合原生浮层时浏览器可能顺手滚页面（见该文件头的实测） */
    import { attachFloatingScrollGuard } from '../boot/scroll-pin.js';

    /** 面板贴的是「上下」还是「左右」——决定箭头要横向还是纵向对锚 */
    const AXIS_OF = (placement) =>
      (placement ?? 'bottom').startsWith('top') || (placement ?? 'bottom').startsWith('bottom')
        ? 'y'
        : 'x';

    /** 量一次触发元素的锚点矩形（面板与箭头都以它为基准） */
    const rectOf = (el) => {
      const box = el?.getBoundingClientRect();
      return box && (box.width || box.height) ? box : null;
    };

    export default () => ({
      tag: 'mc-popover',

      attrs: {
        /* 12 个 placement；默认 bottom 由 CSS 的 :not([placement]) 兜 */
        placement: 'bottom',
        /* click（默认）/ hover / manual。manual 只认 open 属性与 show()/hide() */
        trigger: 'click',
        /* 受控开合：open 出现即开、移除即关。布尔属性默认必须是 null（P1） */
        open: null,
        /* 箭头：默认显示，关掉写 `arrow="none"`（属性只表达「非默认」那一档，理由见 P14） */
        arrow: null,
      },

      data: {
        /* 面板是否已经升级好（ready 之后才敢碰宿主与 popover API） */
        mounted: false,
      },

      ready() {
        const panel = this.ele.shadowRoot.querySelector('.mc-panel');
        /* 视口变化会重新解析锚点定位，箭头偏移跟着重算 */
        this._onViewport = () => {
          if (this.ele.hasAttribute('open')) requestAnimationFrame(() => this.syncArrowShift());
        };
        window.addEventListener('resize', this._onViewport, { passive: true });
        /* 滚动守卫：它自己监听面板的 beforetoggle / toggle，模板里不用加绑定（见 boot/scroll-pin.js） */
        this._scrollGuard = attachFloatingScrollGuard(this.ele, panel);
        /* 老浏览器没有 popover API 时不炸：只标记不可用，功能降级由 CSS 兜 */
        this.popoverOk = typeof panel?.showPopover === 'function';
        this.mounted = true;
        this._hoverTimer = null;
        this.syncOpen();
      },

      detached() {
        clearTimeout(this._hoverTimer);
        window.removeEventListener('resize', this._onViewport);
        this._scrollGuard?.dispose();
      },

      watch: {
        /** 受控开合：属性是唯一真相。⚠️ 首次触发要跳过（P5）：watch 空跑在构造期，写属性会抛 NotSupportedError（P31）。 */
        open() {
          if (this._openWatchInit === undefined) {
            this._openWatchInit = true;
            return;
          }
          this.syncOpen();
        },
      },

      proto: {
        get panel() {
          return this.ele.shadowRoot.querySelector('.mc-panel');
        },

        /** 把宿主 open 属性 → 原生 popover 状态。两边的真相都收在这一处。 */
        syncOpen() {
          if (!this.mounted || !this.popoverOk) return;
          const shouldOpen = this.ele.hasAttribute('open');
          const isOpen = this.panel.matches(':popover-open');
          /* 显示 / 收起都是原生动作，而浏览器可能顺手把页面滚一下（见 scroll-pin.js） */
          if (shouldOpen && !isOpen) this._scrollGuard.run(() => this.panel.showPopover());
          else if (!shouldOpen && isOpen) this._scrollGuard.run(() => this.panel.hidePopover());
        },

        /** 打开。可被 before-open 拦掉（返回 false / preventDefault）。 */
        show(reason = 'api') {
          if (!this.popoverOk) return false;
          if (this.panel.matches(':popover-open')) return true;
          const event = new CustomEvent('before-open', {
            detail: { reason },
            bubbles: true,
            composed: true,
            cancelable: true,
          });
          if (!this.ele.dispatchEvent(event)) return false;
          this.ele.setAttribute('open', '');
          /* setAttribute 会走 watch → syncOpen；这里再兜一次，避免 watch 未触发时不同步 */
          this.syncOpen();
          return true;
        },

        hide(reason = 'api') {
          if (!this.popoverOk) return false;
          if (!this.panel.matches(':popover-open')) return true;
          /* ⚠️ 事件不在这里发：hidePopover() 会触发原生 toggle，统一由 onNativeToggle 派发，否则一次关闭发两次 close */
          this._closingReason = reason;
          this.ele.removeAttribute('open');
          this.syncOpen();
          return true;
        },

        toggle(reason = 'api') {
          /* ⚠️ 先看 popoverOk：面板不在时 this.panel 是 null，直接读 .matches 会抛 TypeError（on:click 一点就炸） */
          if (!this.popoverOk) return false;
          return this.panel.matches(':popover-open') ? this.hide(reason) : this.show(reason);
        },

        /* ---------- 触发 ---------- */

        /** 记下 pointerdown 时面板是否已经开着。⚠️ 必须在 pointerdown 记：light dismiss 就发生在这一步，等 click 到达时再 toggle() 会把它重新开回来（「点第二次关不掉」） */
        onAnchorPointerDown() {
          if (!this.popoverOk) return;
          this._openAtPointerDown = this.panel.matches(':popover-open');
          /* 这一下是「关」的意思：先把 close 的 reason 定成 trigger（light dismiss 走 onNativeToggle，取的就是这个值）；按在关着的元素上时清掉 */
          this._closingReason = this._openAtPointerDown ? 'trigger' : null;
        },

        onAnchorClick() {
          /* trigger 没写就是 click（不能读 this.trigger：attrs 的默认值不会写回宿主） */
          if ((this.ele.getAttribute('trigger') ?? 'click') !== 'click') return;
          const wasOpen = this._openAtPointerDown === true;
          this._openAtPointerDown = false;
          /* 按下去时开着 = 这一下是「关」：不能再 toggle 回开；属性清理与 close 事件都归 onNativeToggle，这里补发会变成两条 close */
          if (wasOpen) {
            /* 兜底：万一某版浏览器把 dismiss 推迟到 click 之后，面板这会儿还开着就自己补一次 */
            if (this.panel.matches(':popover-open')) this.hide('trigger');
            return;
          }
          this.toggle('trigger');
        },

        onAnchorEnter() {
          if (this.ele.getAttribute('trigger') !== 'hover') return;
          clearTimeout(this._hoverTimer);
          this._hoverTimer = setTimeout(() => this.show('hover'), this.hoverDelay ?? 120);
        },

        onAnchorLeave() {
          if (this.ele.getAttribute('trigger') !== 'hover') return;
          clearTimeout(this._hoverTimer);
          this._hoverTimer = setTimeout(() => this.hide('hover'), this.hoverDelay ?? 120);
        },

        /** 原生 toggle：Esc / 点空白关掉时只有原生状态变了，这里把宿主属性拉回来 */
        /** 箭头对齐触发元素中心：面板比它宽时，对着面板居中会让箭头飘很远 */
        syncArrowShift() {
          /* 箭头默认就显示，只有显式 arrow="none" 才跳过（省掉一次无关的测量） */
          if (this.ele.getAttribute('arrow') === 'none') return;
          const panel = this.panel;
          const anchorEl = rectOf(this.ele.shadowRoot.querySelector('.mc-anchor'));
          const box = rectOf(panel);
          if (!anchorEl || !box) return;
          const placement = this.ele.getAttribute('placement') ?? 'bottom';
          const axis = AXIS_OF(placement);

          /* 1) 实际落在哪一侧：期望值可能被浏览器翻转，按几何反推（交叠判断最稳） */
          const overlaps =
            axis === 'y'
              ? box.bottom > anchorEl.top && box.top < anchorEl.bottom
              : box.right > anchorEl.left && box.left < anchorEl.right;
          let side;
          if (axis === 'y') {
            side = !overlaps
              ? box.top >= anchorEl.bottom
                ? 'bottom'
                : 'top'
              : box.top >= anchorEl.y
                ? 'bottom'
                : 'top';
          } else {
            side = !overlaps
              ? box.left >= anchorEl.right
                ? 'right'
                : 'left'
              : box.left >= anchorEl.x
                ? 'right'
                : 'left';
          }
          panel.dataset.side = side;

          /* 2) 箭头在交叉轴上对齐触发元素的中心 */
          if (axis === 'y') {
            panel.style.setProperty(
              '--mc-popover-arrow-shift',
              `${anchorEl.x + anchorEl.width / 2 - (box.x + box.width / 2)}px`,
            );
          } else {
            panel.style.setProperty(
              '--mc-popover-arrow-shift-y',
              `${anchorEl.y + anchorEl.height / 2 - (box.y + box.height / 2)}px`,
            );
          }
        },

        onNativeToggle(event) {
          /* 滚动守卫自己监听面板（beforetoggle 记锚点、toggle 钉回位置）；这里只做状态同步与派发 */
          const nowOpen = event.newState === 'open';
          if (nowOpen) {
            /* 箭头对齐触发元素：退一帧，等浏览器把锚点定位解析完再量（这时才是最终坐标） */
            requestAnimationFrame(() => this.syncArrowShift());
            if (!this.ele.hasAttribute('open')) this.ele.setAttribute('open', '');
            this.ele.dispatchEvent(
              new CustomEvent('open', {
                detail: { reason: 'trigger' },
                bubbles: true,
                composed: true,
              }),
            );
            return;
          }
          /* 关闭的唯一出口：Esc / 点空白 / show() / hide() 都收在这里，事件也只发一次 */
          if (this.ele.hasAttribute('open')) this.ele.removeAttribute('open');
          const reason = this._closingReason ?? 'dismiss';
          this._closingReason = null;
          this.ele.dispatchEvent(
            new CustomEvent('close', { detail: { reason }, bubbles: true, composed: true }),
          );
        },
      },
    });
  </script>
</template>
