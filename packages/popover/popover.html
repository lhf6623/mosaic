<!--
  mc-popover — 通用浮层（点击/悬停/手动触发，锚在触发元素上）

  与 mc-dropdown / mc-tooltip 的分工：popover 是**通用容器**（内容由使用者给），
  dropdown / tooltip 将来只是在它上面固定住内容形态的预设；三者共用同一套定位与层级。

  ⚠️ **定位与层叠都用浏览器原生能力，这是本组件最核心的决定**（设计规范第七节要求
  M3 浮层开工前先验图层，下面是实测结论，别再退回 JS 算坐标）：

    1. 面板用 `popover="auto"` → 进 **top layer**：天然在所有 `--mc-z-*` 之上，
       不受宿主页面的 `transform` / `filter` / `contain` 影响（而那正是 shadow root 里
       `position: fixed` 的死穴：实测同一个 fixed 盒子，祖先带 transform 时 y 从 10 变成 1404）。
       顺带白拿 **Esc 关闭** 与 **点空白关闭**（light-dismiss），不用自己写 composedPath。
    2. 位置用 **CSS 锚点定位**（`anchor-name` / `position-anchor` / `anchor()`）：
       不用 JS 读 rect 算坐标、滚动与缩放自动跟随，**贴边自动翻转**（`position-try-fallbacks`）
       也是白拿的 —— 实测下方放不下会翻到上方、右侧放不下会翻到左侧且不溢出。
    3. ⚠️ **锚点必须设在 shadow 内的元素上**：把 `anchor-name` 设在 light DOM 的 slot 元素上
       **无效**（跨 shadow 边界不成立，面板会掉到 UA 默认位置）。所以触发元素外面套一层
       `.mc-anchor`，锚点挂在它身上。
    4. ⚠️ **必须显式清掉 UA 给 popover 的 `inset: 0; margin: auto`**：那两个 auto 外边距会把
       `left: anchor(left)` 挤掉（实测面板水平居中而不是与触发元素左对齐）。
    5. ⚠️ top layer 里 `transform` 受限，进场动画只用 opacity + 轻微位移，别用 scale。

  为什么用原生 popover 而不是挂 document.body：见 (1)。这也回答了 roadmap 里
  「是否改用 popover API」那个问题 —— 答案是**用**。
-->
<template component>
  <style>
    :host {
      display: inline-block;
      position: relative;

      /* L3 令牌：面板到触发元素的距离、面板与锚点的对应关系都由这里给 */
      --mc-popover-offset: var(--mc-space-2);
      --mc-popover-anchor: --mc-popover-anchor;
      --mc-popover-panel-bg: var(--mc-color-surface-raised);
      --mc-popover-panel-border: var(--mc-color-border);
      --mc-popover-panel-radius: var(--mc-radius-lg);
      --mc-popover-panel-pad: var(--mc-space-4);
      /* 最小宽度：菜单类面板太窄会显得挤，也避免贴边翻转后宽度抖动 */
      --mc-popover-panel-min-width: 0;
    }

    /* 锚点：必须是自己 shadow 里的元素（见文件头第 3 条）。
       ⚠️ 用 inline-flex 而不是 inline-block：inline-block 的盒子会带上行盒的基线缝隙
       （实测锚点盒子比触发按钮高 3px），而**锚点的几何就是面板的定位基准** ——
       结果就是 top/right-start/left-start 这几个方向整体偏 3px。inline-flex 让盒高
       严丝合缝地等于触发元素，锚点几何 = 视觉几何。 */
    .mc-anchor {
      display: inline-flex;
      anchor-name: --mc-popover-anchor;
    }

    /* ---------- 面板 ---------- */
    .mc-panel {
      /* ⚠️ inset/margin 必须清成 0/auto 之外的值，否则 UA 那对 auto 会吃掉锚点定位 */
      position: fixed;
      inset: auto;
      margin: 0;

      box-sizing: border-box;
      min-width: var(--mc-popover-panel-min-width);
      /* ⚠️ 必须显式 overflow: visible：UA 给 `[popover]` 的默认样式里带 `overflow: auto`，
         它会把**伸出面板的三角裁掉** —— 实测右侧那种三角完全看不见（而贴着上/下沿的
         那两个因为面板外面是空的，看起来又是好的，所以特别难发现）。 */
      overflow: visible;
      /* 贴边时别把面板压出视口：宽度上限跟着视口走，长内容自己折行 */
      max-width: min(24rem, calc(100vw - var(--mc-space-8)));
      padding: var(--mc-popover-panel-pad);
      border: 1px solid rgb(var(--mc-popover-panel-border));
      border-radius: var(--mc-popover-panel-radius);
      background-color: rgb(var(--mc-popover-panel-bg));
      color: rgb(var(--mc-color-fg));
      font-family: var(--mc-font-sans);
      font-size: var(--mc-text-sm);
      line-height: var(--mc-text-sm-lh);
      /* ⚠️ 用 filter: drop-shadow 而不是 box-shadow：box-shadow 画在**矩形边框盒**上，
         有三角时会在三角那条边画出一条直边 —— 看起来就是「阴影凹进去一个口」，
         而三角自己没有阴影、显平（实测就是这样）。drop-shadow 跟的是**整体轮廓**
         （面板 + 三角），两截阴影才连得上。 */
      filter: drop-shadow(0 3px 10px rgb(0 0 0 / 0.14));

      /* 锚点与翻转：12 个方向上的贴合 + 空间不足时自动翻 */
      position-anchor: --mc-popover-anchor;
      position-try-fallbacks:
        flip-block,
        flip-inline,
        flip-block flip-inline;
    }

    /* 12 个 placement：只写「面板哪条边贴锚点哪条边」 */
    :host([placement='bottom']) .mc-panel,
    :host(:not([placement])) .mc-panel {
      top: anchor(bottom);
      left: anchor(center);
      translate: -50% 0;
      margin-top: var(--mc-popover-offset);
    }
    :host([placement='bottom-start']) .mc-panel {
      top: anchor(bottom);
      left: anchor(left);
      margin-top: var(--mc-popover-offset);
    }
    :host([placement='bottom-end']) .mc-panel {
      top: anchor(bottom);
      right: anchor(right);
      margin-top: var(--mc-popover-offset);
    }
    :host([placement='top']) .mc-panel {
      bottom: anchor(top);
      left: anchor(center);
      translate: -50% 0;
      margin-bottom: var(--mc-popover-offset);
    }
    :host([placement='top-start']) .mc-panel {
      bottom: anchor(top);
      left: anchor(left);
      margin-bottom: var(--mc-popover-offset);
    }
    :host([placement='top-end']) .mc-panel {
      bottom: anchor(top);
      right: anchor(right);
      margin-bottom: var(--mc-popover-offset);
    }
    /* ⚠️ 居中变体必须单独写：交叉轴上 anchor(center) + -50% 位移。
       以前它和 -start 合并在一个选择器里（只设了 top: anchor(top)），
       于是 right/left 两个「居中」的交叉轴是贴着顶边而不是居中（实测差 16.5px）。 */
    :host([placement='right']) .mc-panel {
      left: anchor(right);
      top: anchor(center);
      translate: 0 -50%;
      margin-left: var(--mc-popover-offset);
    }
    :host([placement='right-start']) .mc-panel {
      left: anchor(right);
      top: anchor(top);
      margin-left: var(--mc-popover-offset);
    }
    :host([placement='right-end']) .mc-panel {
      left: anchor(right);
      bottom: anchor(bottom);
      margin-left: var(--mc-popover-offset);
    }
    :host([placement='left']) .mc-panel {
      right: anchor(left);
      top: anchor(center);
      translate: 0 -50%;
      margin-right: var(--mc-popover-offset);
    }
    :host([placement='left-start']) .mc-panel {
      right: anchor(left);
      top: anchor(top);
      margin-right: var(--mc-popover-offset);
    }
    :host([placement='left-end']) .mc-panel {
      right: anchor(left);
      bottom: anchor(bottom);
      margin-right: var(--mc-popover-offset);
    }

    /* ---------- 小三角 ---------- */
    .mc-arrow {
      display: none;
      position: absolute;
      /* ⚠️ 钻到面板背景**之下**：否则三角贴面板那一侧的底边会落在面板边线内侧 1px 上，
         接缝处看得到一条错位的线。放到底下之后，露出来的部分正好是一个干净的三角。 */
      z-index: -1;
      width: var(--mc-space-3);
      height: var(--mc-space-3);
      background-color: rgb(var(--mc-popover-panel-bg));
      /* 只画相邻的两条边，转 45° 就是个三角 */
      border-right: 1px solid rgb(var(--mc-popover-panel-border));
      border-bottom: 1px solid rgb(var(--mc-popover-panel-border));
      rotate: 45deg;
    }
    :host([arrow]) .mc-arrow {
      display: block;
    }
    /* 三角：贴哪条边 + 交叉轴位置。
       交叉轴位置 = 面板的 50% + `--mc-popover-arrow-shift`（脚本算好 = 触发元素中心 − 面板中心）。

       ⚠️ 试过三种写法，只有这个干净（都在浏览器里放大比过）：
         · 旋转 45° 的方块 + 两条边框 → 面板那 1px 边线会横穿方块内部，看着是「套在边线上的方块」
         · 外包一层描边三角（两层三角形）→ 内层缩边之后两个三角形状对不上，斜边会露出来
         · 现在这个：**一个填充三角**（clip-path），描边靠它自己的 drop-shadow 1px ——
           和面板的阴影是同一套机制，形状完全可控
       ⚠️ 面板的阴影用 filter: drop-shadow 而不是 box-shadow：box-shadow 画在矩形边框盒上，
       有三角时会在三角那条边画出一条直边（看着像「阴影凹进去一个口」）。 */
    .mc-arrow {
      display: none;
      position: absolute;
      /* ⚠️ 钻到面板背景**之下**：否则三角贴面板那一侧的底边会落在面板边线内侧 1px 上，
         接缝处看得到一条错位的线。放到底下之后，露出来的部分正好是一个干净的三角。 */
      z-index: -1;
      width: var(--mc-space-3);
      height: var(--mc-space-3);
      background-color: rgb(var(--mc-popover-panel-bg));
      /* 1px 的描边效果：跟面板轮廓一样的 drop-shadow，只是模糊半径写 0 */
      filter: drop-shadow(0 0 0.5px rgb(var(--mc-popover-panel-border)));
    }
    :host([arrow]) .mc-arrow {
      display: block;
    }

    :host([arrow]) .mc-panel[data-side='bottom'] .mc-arrow {
      top: calc(var(--mc-space-3) / -2);
      left: calc(50% + var(--mc-popover-arrow-shift, 0px) - var(--mc-space-3) / 2);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }
    :host([arrow]) .mc-panel[data-side='top'] .mc-arrow {
      bottom: calc(var(--mc-space-3) / -2);
      left: calc(50% + var(--mc-popover-arrow-shift, 0px) - var(--mc-space-3) / 2);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    :host([arrow]) .mc-panel[data-side='left'] .mc-arrow {
      right: calc(var(--mc-space-3) / -2);
      top: calc(50% + var(--mc-popover-arrow-shift-y, 0px) - var(--mc-space-3) / 2);
      clip-path: polygon(0 0, 100% 50%, 0 100%);
    }
    :host([arrow]) .mc-panel[data-side='right'] .mc-arrow {
      left: calc(var(--mc-space-3) / -2);
      top: calc(50% + var(--mc-popover-arrow-shift-y, 0px) - var(--mc-space-3) / 2);
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
    }

    /* **不做进场/退场动画**（有意的）：浮层弹出的动效在连续操作时反而拖慢手感，
       而且 top layer 里 transform 受限、能做出来的效果有限。要动画的使用者自己加。 */
  </style>

  <!-- 触发元素：外面这层 .mc-anchor 是**锚点载体**，不能删（见文件头第 3 条） -->
  <span
    class="mc-anchor"
    on:click="onAnchorClick"
    on:mouseenter="onAnchorEnter"
    on:mouseleave="onAnchorLeave"
  >
    <slot></slot>
  </span>

  <!-- 面板：top layer + light-dismiss + Esc 全由 popover="auto" 提供。
       ⚠️ toggle 事件是**原生**事件，用它把「被 Esc / 点空白关掉」同步回 open 属性 -->
  <div class="mc-panel" part="panel" popover="auto" on:toggle="onNativeToggle">
    <span class="mc-arrow" part="arrow" aria-hidden="true"></span>
    <slot name="panel"></slot>
  </div>

  <script>
    /** 面板贴的是「上下」还是「左右」——决定箭头要横向还是纵向对锚 */
    const AXIS_OF = (placement) =>
      (placement ?? 'bottom').startsWith('top') || (placement ?? 'bottom').startsWith('bottom')
        ? 'y'
        : 'x';

    /** 量一次触发元素的锚点矩形（面板与箭头都以它为基准） */
    const rectOf = (el) => {
      const box = el?.getBoundingClientRect();
      return box && (box.width || box.height) ? box : null;
    };

    export default () => ({
      tag: 'mc-popover',

      attrs: {
        /* 12 个 placement；默认 bottom 由 CSS 的 :not([placement]) 兜 */
        placement: 'bottom',
        /* click（默认）/ hover / manual。manual 只认 open 属性与 show()/hide() */
        trigger: 'click',
        /* 受控开合：open 出现即开、移除即关。布尔属性默认必须是 null（P1） */
        open: null,
        arrow: null,
      },

      data: {
        /* 面板是否已经升级好（ready 之后才敢碰宿主与 popover API） */
        mounted: false,
      },

      ready() {
        const panel = this.ele.shadowRoot.querySelector('.mc-panel');
        /* 视口变化会重新解析锚点定位，箭头偏移跟着重算 */
        this._onViewport = () => {
          if (this.ele.hasAttribute('open')) requestAnimationFrame(() => this.syncArrowShift());
        };
        window.addEventListener('resize', this._onViewport, { passive: true });
        /* 老浏览器没有 popover API 时不炸：整块功能降级为「面板常显」由 CSS 兜，
           这里只标记不可用，交互一律不动 */
        this.popoverOk = typeof panel?.showPopover === 'function';
        this.mounted = true;
        this._hoverTimer = null;
        this.syncOpen();
      },

      detached() {
        clearTimeout(this._hoverTimer);
        window.removeEventListener('resize', this._onViewport);
      },

      watch: {
        /**
         * 受控开合：属性是**唯一真相**，改属性就同步到原生 popover。
         * ⚠️ 首次触发要跳过（P5）：ofa 初始化时会空跑一遍 watch，而那次在**构造期**，
         * 此时写宿主属性会抛 NotSupportedError（P31）。
         */
        open() {
          if (this._openWatchInit === undefined) {
            this._openWatchInit = true;
            return;
          }
          this.syncOpen();
        },
      },

      proto: {
        get panel() {
          return this.ele.shadowRoot.querySelector('.mc-panel');
        },

        /** 把宿主 open 属性 → 原生 popover 状态。两边的真相都收在这一处。 */
        syncOpen() {
          if (!this.mounted || !this.popoverOk) return;
          const shouldOpen = this.ele.hasAttribute('open');
          const isOpen = this.panel.matches(':popover-open');
          if (shouldOpen && !isOpen) this.panel.showPopover();
          else if (!shouldOpen && isOpen) this.panel.hidePopover();
        },

        /** 打开。可被 before-open 拦掉（返回 false / preventDefault）。 */
        show(reason = 'api') {
          if (!this.popoverOk) return false;
          if (this.panel.matches(':popover-open')) return true;
          const event = new CustomEvent('before-open', {
            detail: { reason },
            bubbles: true,
            composed: true,
            cancelable: true,
          });
          if (!this.ele.dispatchEvent(event)) return false;
          this.ele.setAttribute('open', '');
          /* setAttribute 会走 watch → syncOpen；这里再兜一次，避免 watch 未触发时不同步 */
          this.syncOpen();
          return true;
        },

        hide(reason = 'api') {
          if (!this.popoverOk) return false;
          if (!this.panel.matches(':popover-open')) return true;
          /* ⚠️ 事件不在这里发：hidePopover() 会触发原生 toggle，统一由 onNativeToggle 派发。
             两处都发的话一次关闭会发两次 close（实测第一版就是这样）。 */
          this._closingReason = reason;
          this.ele.removeAttribute('open');
          this.syncOpen();
          return true;
        },

        toggle(reason = 'api') {
          return this.panel.matches(':popover-open') ? this.hide(reason) : this.show(reason);
        },

        /* ---------- 触发 ---------- */

        onAnchorClick() {
          /* trigger 没写就是 click（不能读 this.trigger：attrs 的默认值不会写回宿主） */
          if ((this.ele.getAttribute('trigger') ?? 'click') !== 'click') return;
          this.toggle('trigger');
        },

        onAnchorEnter() {
          if (this.ele.getAttribute('trigger') !== 'hover') return;
          clearTimeout(this._hoverTimer);
          this._hoverTimer = setTimeout(() => this.show('hover'), this.hoverDelay ?? 120);
        },

        onAnchorLeave() {
          if (this.ele.getAttribute('trigger') !== 'hover') return;
          clearTimeout(this._hoverTimer);
          this._hoverTimer = setTimeout(() => this.hide('hover'), this.hoverDelay ?? 120);
        },

        /**
         * 原生 toggle：Esc / 点空白（light-dismiss）关掉时**只有原生状态变了**，
         * 这里把宿主属性拉回来，两个方向才都收敛。
         */
        /**
         * 把箭头的交叉轴位置对齐到**触发元素**的中心（而不是面板的中心）。
         * 面板比触发元素宽时（如 bottom-start），对着面板居中会让箭头飘到很远的地方。
         * 偏移用 CSS 变量交给样式算（`left: calc(50% + var(--mc-popover-arrow-shift) - 半宽)`）。
         */
        syncArrowShift() {
          if (!this.ele.hasAttribute('arrow')) return;
          const panel = this.panel;
          const anchorEl = rectOf(this.ele.shadowRoot.querySelector('.mc-anchor'));
          const box = rectOf(panel);
          if (!anchorEl || !box) return;
          const placement = this.ele.getAttribute('placement') ?? 'bottom';
          const axis = AXIS_OF(placement);

          /* 1) 实际落在哪一侧：期望值可能被浏览器翻转，所以按几何反推。
                主轴方向拿"有没有交叠"判断最稳（间距是 8px，交叠就说明还在同一块区域）。 */
          const overlaps =
            axis === 'y'
              ? box.bottom > anchorEl.top && box.top < anchorEl.bottom
              : box.right > anchorEl.left && box.left < anchorEl.right;
          let side;
          if (axis === 'y') {
            side = !overlaps
              ? box.top >= anchorEl.bottom
                ? 'bottom'
                : 'top'
              : box.top >= anchorEl.y
                ? 'bottom'
                : 'top';
          } else {
            side = !overlaps
              ? box.left >= anchorEl.right
                ? 'right'
                : 'left'
              : box.left >= anchorEl.x
                ? 'right'
                : 'left';
          }
          panel.dataset.side = side;

          /* 2) 箭头在交叉轴上对齐触发元素的中心 */
          if (axis === 'y') {
            panel.style.setProperty(
              '--mc-popover-arrow-shift',
              `${anchorEl.x + anchorEl.width / 2 - (box.x + box.width / 2)}px`,
            );
          } else {
            panel.style.setProperty(
              '--mc-popover-arrow-shift-y',
              `${anchorEl.y + anchorEl.height / 2 - (box.y + box.height / 2)}px`,
            );
          }
        },

        onNativeToggle(event) {
          const nowOpen = event.newState === 'open';
          if (nowOpen) {
            /* 箭头对齐触发元素：退一帧，等浏览器把锚点定位解析完再量（这时才是最终坐标） */
            requestAnimationFrame(() => this.syncArrowShift());
            if (!this.ele.hasAttribute('open')) this.ele.setAttribute('open', '');
            this.ele.dispatchEvent(
              new CustomEvent('open', {
                detail: { reason: 'trigger' },
                bubbles: true,
                composed: true,
              }),
            );
            return;
          }
          /* 关闭的**唯一出口**：不管是 Esc / 点空白（dismiss）还是 show()/hide() 那条路，
             状态都收在这里，事件也只在这里发一次。 */
          if (this.ele.hasAttribute('open')) this.ele.removeAttribute('open');
          const reason = this._closingReason ?? 'dismiss';
          this._closingReason = null;
          this.ele.dispatchEvent(
            new CustomEvent('close', { detail: { reason }, bubbles: true, composed: true }),
          );
        },
      },
    });
  </script>
</template>
