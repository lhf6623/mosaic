<template component>
  <mc-textarea
    placeholder="边打边看下面那行"
    on:input="onInput($event)"
    on:change="onChange($event)"
  ></mc-textarea>

  <p class="mt-3 text-sm text-muted">最近一次事件：<strong>{{last}}</strong></p>

  <script>
    export default async () => ({
      tag: 'demo-textarea-events',

      data: {
        last: '（还没交互）',
      },

      proto: {
        /* input 每打一个字都发；change 在失焦 / 回车时发（原生 change 穿不出 shadow，由组件转发） */
        onInput(event) {
          this.last = `input → ${JSON.stringify(event.data.value)}`;
        },
        onChange(event) {
          this.last = `change → ${JSON.stringify(event.data.value)}`;
        },
      },
    });
  </script>
</template>
