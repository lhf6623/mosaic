    <h3>文字怎么传</h3>
    <table class="doc-table">
      <thead>
        <tr>
          <th>传值方式</th>
          <th>优先级</th>
          <th>说明</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><code>src="…"</code></td>
          <td>最高</td>
          <td>
            长片段、或含 <code>&lt;script&gt;</code> / 大量 <code>&lt;</code> 的片段放独立文件
          </td>
        </tr>
        <tr>
          <td><code>code="…"</code></td>
          <td>次之</td>
          <td>单行或多行都行；写入立刻重渲染</td>
        </tr>
        <tr>
          <td><code>:code="变量"</code></td>
          <td>次之</td>
          <td>ofa 模板绑定，从页面 / 组件自己的 <code>data</code> 里取</td>
        </tr>
        <tr>
          <td>标签里直接贴</td>
          <td>最低</td>
          <td>短片段最好读</td>
        </tr>
      </tbody>
    </table>

    <h2>part</h2>

      <thead>
        <tr>
          <th>名称</th>
          <th>说明</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><code>body</code></td>
          <td>滚动容器（<code>max-height</code> 作用在它身上）</td>
        </tr>
        <tr>
          <td><code>pre</code></td>
          <td>等宽排版层（<code>&lt;pre&gt;</code>）</td>
        </tr>
        <tr>
          <td><code>code</code></td>
          <td>高亮产物层（<code>&lt;code&gt;</code>，语法高亮挂在它上面）</td>
        </tr>
        <tr>
          <td><code>line</code></td>
          <td>行号模式下的每一行</td>
        </tr>
      </tbody>
    </table>

    <h2>注意事项</h2>
    <ul>
      <li>
        标签内文本或 <code>code</code> 属性里的 <code>&lt;</code> 要写成 <code>&amp;lt;</code>；
        长片段建议放独立文件（文件是真 HTML/JS，不用转义）。
      </li>
      <li>
        相对路径按<strong>写它的那个文件</strong>解析（和 <code>&lt;link href&gt;</code> 一样）。
      </li>
      <li>
        高亮取不到时（离网 / CSP 拦截 / 语言名写错）退化为纯文本 + 一条控制台警告，
        排版、行号、主题跟随都不受影响。
      </li>
    </ul>
