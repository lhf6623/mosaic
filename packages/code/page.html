              <tbody>
                <tr><td><code>src</code></td><td>URL</td><td>—</td><td><strong>片段文件</strong>：长片段或需要转义的片段放独立文件，优先级最高；缺 <code>language</code> 时按后缀推断</td></tr>

              </tbody>

                <tr><td><code>pre</code> <code>code</code></td><td>等宽排版层 / 高亮产物层</td></tr>
                <tr><td><code>line</code></td><td>行号模式下的每一行</td></tr>
              </tbody>
            </table>

            <h2>代码文本怎么传</h2>
            <p>优先级：<code>src</code> &gt; <code>code</code> 属性 &gt; 标签内文本。<code>el.code</code> 读写当前原文（写入立刻重渲染）。</p>
            <ul>
              <li>标签里直接贴 —— 短片段最好读</li>
              <li><code>code="…"</code> —— 单行或多行都行</li>
              <li><code>:code="变量"</code> —— ofa 模板绑定，从页面/组件数据里取</li>
              <li><code>src="…"</code> —— 长片段、或含 <code>&lt;script&gt;</code> / 大量 <code>&lt;</code> 的片段放独立文件</li>
            </ul>
