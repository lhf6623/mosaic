            <h2>mc-code</h2>
            <p><code>packages/code/code.html</code> · 已实现</p>

            <table class="doc-table">
              <thead><tr><th>属性</th><th>值</th><th>默认</th><th>说明</th></tr></thead>
              <tbody>
                <tr><td><code>src</code></td><td>URL</td><td>—</td><td><strong>片段文件</strong>：长片段或需要转义的片段放独立文件，优先级最高；缺 <code>language</code> 时按后缀推断</td></tr>
                <tr><td><code>code</code></td><td>字符串（可多行）</td><td>—</td><td>代码文本；不写则读<strong>标签里的纯文本</strong>。<code>el.code</code> 是同一份值的运行时入口</td></tr>
                <tr><td><code>language</code></td><td>语言 id 或别名（<code>js</code> <code>ts</code> <code>html</code> <code>css</code> <code>json</code> <code>bash</code>…）</td><td>—</td><td>留空或写 <code>text</code> / <code>none</code> 表示不高亮</td></tr>
                <tr><td><code>line-numbers</code></td><td>布尔</td><td>—</td><td>显示行号（行号不在 DOM 文本里，选中复制不会带上）</td></tr>
                <tr><td><code>max-height</code></td><td>数字（px）或 CSS 长度</td><td>—</td><td>内容超过时内部滚动，如 <code>max-height="200"</code> / <code>"12rem"</code></td></tr>
                <tr><td><code>soft-wrap</code></td><td>布尔</td><td>—</td><td>长行折行，而不是横向滚动</td></tr>
                <tr><td><code>hljs-theme</code></td><td>官方主题名</td><td><code>github</code></td><td>亮色主题，取自 highlight.js 的 <code>styles/</code></td></tr>
                <tr><td><code>hljs-theme-dark</code></td><td>官方主题名</td><td><code>github-dark</code></td><td>暗色主题</td></tr>
                <tr><td><code>hljs-base</code></td><td>URL</td><td>内置固定版本 CDN</td><td>highlight.js 的 <code>build/</code> 目录，换自托管 / 换镜像用</td></tr>
              </tbody>
            </table>

            <table class="doc-table">
              <thead><tr><th>part</th><th>说明</th></tr></thead>
              <tbody>
                <tr><td><code>body</code></td><td>滚动容器（<code>max-height</code> 作用在它身上）</td></tr>
                <tr><td><code>pre</code> <code>code</code></td><td>等宽排版层 / 高亮产物层</td></tr>
                <tr><td><code>line</code></td><td>行号模式下的每一行</td></tr>
              </tbody>
            </table>

            <p>
              <strong>代码文本的四种传法</strong>（优先级：<code>src</code> &gt; <code>code</code> 属性 &gt; 标签内文本）：
            </p>
            <ul>
              <li>标签里直接贴 —— 短片段最好读，不用转义引号</li>
              <li><code>src="…"</code> —— <strong>长片段 / 含 <code>&lt;script&gt;</code> 或大量 <code>&lt;</code> 的片段</strong>放独立文件，页面里一行引用；文件是真 HTML，不用写 <code>&amp;lt;</code></li>
              <li><code>code</code> 属性 —— 单行或多行都行（<code>&lt;</code> 仍需写 <code>&amp;lt;</code>）</li>
              <li><code>:code="变量"</code> —— ofa 模板绑定，从页面数据里取（<code>:prop</code> 只对 <code>attrs</code> 里声明过的键生效）</li>
            </ul>
            <p>
              <strong>运行时：</strong><code>el.code</code> 读回当前原文（已去掉公共缩进）；
              写入走 <code>setAttribute</code>，所以 <code>el.code = …</code> 与
              <code>el.setAttribute('code', …)</code> 等价，改完立刻重渲染 + 重新高亮。
            </p>

            <section class="doc-demo">
              <h3>基本用法</h3>
              <mc-code language="javascript">
                // 内容就是标签里的纯文本，直接粘贴即可
                const greet = (name) => `Hello, ${name}!`;
                console.log(greet('Mosaic')); // → Hello, Mosaic!
              </mc-code>
              <p class="doc-hint">
                首屏先用纯文本同步渲染，高亮到位后原地升级 —— 不会出现"先空白后出字"。
                点右上角主题按钮：配色会跟着换成另一份官方主题。
              </p>
            </section>

            <section class="doc-demo">

                两块都<strong>没有子节点</strong>，所以内容完全由属性决定。

            </section>

            <h2>高亮从哪来</h2>
            <ul>
              <li><strong>代码着色</strong>：highlight.js 11.11.1 —— 先取 <code>es/core.min.js</code>，
                再按 <code>language</code> 取 <code>es/languages/&lt;id&gt;.min.js</code>。
                只加载真正用到的那几种语言，多实例共享，每种只取一次。</li>
              <li><strong>配色</strong>：取官方主题 <code>styles/&lt;theme&gt;.min.css</code>，
                原样 <code>adopt</code> 进组件自己的 shadow root，组件不写一条覆盖它的规则。
                只消费主题里的 token 颜色，<strong>刻意不给节点加 <code>hljs</code> 类</strong>：
                主题里 <code>.hljs</code> 的底色与 <code>pre code.hljs</code> 的内边距那套
                "整块代码块"外观不该接管组件的盒模型。</li>
              <li><strong>主题跟随</strong>：亮暗判定读 <code>color-scheme</code> —— 令牌层切主题就是切它，
                而且它是继承属性，能穿进 shadow root；文档切主题时自动换成暗色那份主题表。</li>
              <li><strong>自托管 / 换镜像</strong>：<code>hljs-base="https://fastly.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/"</code>。</li>
            </ul>
