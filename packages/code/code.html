<!--
  mc-code — 代码展示组件

  和 mc-button 一样，这个文件也遵循 agent/components.md 的分层：
  视觉（底色 / 边框 / 圆角 / 字号）写在 :host 与 L3 组件令牌上，使用者用原生
  `style="…"` 或 `--mc-code-*` 就能按实例覆盖。

  三条主线，先记住再读代码：

  1. 代码文本有三个来源：`src`（片段文件）> `code` 属性 / `el.code` property >
     **标签里的纯文本**（读 textContent、去掉公共缩进）。
     标签内文本是贴代码最顺手的写法；`code` 属性则给 ofa 模板绑定留了口子
     （`<mc-code :code="snippet">`，`:prop` 只对 attrs 里声明过的键生效）。

  2. 语法配色**来自 highlight.js 自己的主题样式表**，组件不写一条覆盖它的规则
     官方主题（默认 `github` / `github-dark`）是从 CDN 取回来**原样 adopt** 进
     shadow root 的，token 颜色就是主题里声明的值。
     所以这里**刻意不给渲染出来的节点加 `hljs` 类**：主题里的
     `.hljs{background:…}` 与 `pre code.hljs{padding:1em}` 会盖掉组件的底色和内边距
     （adopted 表优先级高于组件自己的 <style>），那是主题的"整块代码块"外观，
     不是我们要接管的两个 token 颜色。

  3. 高亮本身是**可选的运行时增量**，不是必需品
     highlight.js 从 CDN 按需懒加载（只加载用到的语言）。它挂了、被 CSP 挡了、
     或者语言名写错了，组件**保持纯文本**继续工作，只是没有颜色 —— 和
     mosaic.js 失效时"有颜色无排布"是同一套降级思路。
     首屏渲染是同步的纯文本，高亮到位后再原地升级，不会出现空白代码块。

  行号建立在「行」这个模型上：高亮产物里的 `<span>` 可以跨行（多行字符串、
  块注释），直接按 \n 切会把标签切坏。所以 splitLines() 做的是**标签配平**的
  切分：行边界处闭合已开标签，下一行再重新打开。
-->
<template component>
  <style>
    /* ---------- 1. 宿主盒模型 + 色槽默认值 ----------
       尺寸与圆角直接写在这里（不绕一层变量），使用者 `style="border-radius:0"`
       才压得住：外部内联样式优先级高于 shadow root 里的任何规则。 */
    :host {
      display: block;
      box-sizing: border-box;
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgb(var(--mc-code-border));
      border-radius: var(--mc-radius-lg);
      background-color: rgb(var(--mc-code-fill));
      color: rgb(var(--mc-code-fg));

      font-family: var(--mc-font-mono);
      font-size: var(--mc-code-font-size);
      line-height: var(--mc-code-line-height);
      tab-size: 2;

      /* ---------- 色槽：L3 组件令牌，默认引用 L2 语义令牌 ----------
         语法色不在这里 —— 那是 highlight.js 主题的事（见文件头第 2 条）。 */
      --mc-code-fill: var(--mc-color-surface-sunken);
      --mc-code-border: var(--mc-color-border);
      --mc-code-fg: var(--mc-color-fg);
      --mc-code-dim: var(--mc-color-fg-subtle);
      --mc-code-font-size: var(--mc-text-sm);
      --mc-code-line-height: 1.7;

      /* 高度上限由 JS 按 max-height 属性写进内部容器；none 表示不设上限 */
      --mc-code-max-h: none;
    }

    /* ---------- 2. 代码区 ---------- */
    .mc-body {
      max-height: var(--mc-code-max-h);
      overflow: auto;
      /*
       * ⚠️ 这里**不要**写 `overscroll-behavior: contain`。
       *
       * `overflow: auto` 让这个元素在规范上就是个滚动容器，contain 会把滚动链
       * 直接掐断 —— 连"内容根本不超高、没得滚"的情况也拦。实测表现就是用户说的
       * "鼠标在 code 里面滚动会锁住"：指针停在代码块上时页面完全不动
       * （无 max-height 的块 Δ0，max-height 的块滚到底之后也 Δ0）。
       * 用默认的 `auto`，块内滚不动时自然继续滚页面，这才是文档里该有的行为。
       */
    }
    .mc-body:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring));
      outline-offset: -2px;
    }
    .mc-pre {
      margin: 0;
      padding: var(--mc-space-3) var(--mc-space-4);
      font: inherit;
      white-space: pre;
    }
    .mc-block {
      display: block;
      /* 让 `<code>` 自己就有长行的宽度：横向溢出由它贡献给 .mc-body 的滚动区域，
         行号 sticky 也才有可滚动的空间。min-width:100% 保证短行也有整行底色/选区。 */
      width: max-content;
      min-width: 100%;
      font: inherit;
      color: inherit;
    }

    /* ---------- 3. 行号：`position: sticky` 的独立列 ----------
       横向滚动时它停在滚动容器左缘，所以行号不会跟着代码跑掉；
       底色用代码底色盖住从下面滑过的代码。 */
    .mc-line {
      display: flex;
      align-items: flex-start;
    }
    .mc-ln {
      position: sticky;
      left: 0;
      z-index: 1;
      flex: none;
      /* 列宽由 JS 按总行数写进 --mc-code-ln-w，三位数行号也不会挤 */
      width: var(--mc-code-ln-w, 2.5em);
      padding-right: var(--mc-space-3);
      background-color: rgb(var(--mc-code-fill));
      color: rgb(var(--mc-code-dim));
      text-align: right;
      user-select: none;
      -webkit-user-select: none;
    }
    .mc-lc {
      flex: 0 0 auto;
      white-space: pre;
    }

    /* ---------- 4. soft-wrap：长行折行而不是横向滚动 ---------- */
    :host([soft-wrap]) .mc-pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    :host([soft-wrap]) .mc-block {
      width: auto;
      min-width: 0;
    }
    :host([soft-wrap]) .mc-lc {
      flex: 1 1 auto;
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>

  <div class="mc-body" part="body" tabindex="0">
    <pre class="mc-pre" part="pre"><code class="mc-block" part="code"></code></pre>
  </div>

  <script>
    /* @unocss-skip-start */
    /*
     * 这一整段 JS 不是样式，但 UnoCSS 的默认提取器是按「候选字符串」扫整个文件的，
     * 于是 indent / px / py / m-0 这些 JS 标识符和模板字符串片段会被当成类名，
     * 白产出四条工具类规则（写着 class="indent" 的使用者还会莫名拿到 text-indent）。
     * 官方 skip 标记把这段排除在提取之外（注释必须是完整闭合的块注释形式）；
     * <style> 与模板本身照常扫描。标记之间不要再出现这套标记字符串。
     */

    /**
     * highlight.js 的来源，结尾是它分发结构里的 `build/` 目录：
     *
     *   es/core.min.js · es/languages/<id>.min.js · styles/<theme>.min.css
     *
     * 锁精确版本（jsDelivr 的版本别名有 7 天缓存，见 PLAN D1）。
     * 换自托管 / 换镜像：`hljs-base="https://fastly.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/"`
     */
    const HLJS_BASE = 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/';

    /** 默认主题，两份都取自 highlight.js 官方 styles/：亮色 / 暗色各一 */
    const THEME_LIGHT = 'github';
    const THEME_DARK = 'github-dark';

    /** 别名 → highlight.js 的语言 id。空字符串表示"不高亮"，但文字照常显示 */
    const ALIASES = {
      js: 'javascript',
      mjs: 'javascript',
      cjs: 'javascript',
      jsx: 'javascript',
      ts: 'typescript',
      tsx: 'typescript',
      html: 'xml',
      htm: 'xml',
      vue: 'xml',
      svg: 'xml',
      xhtml: 'xml',
      sh: 'bash',
      shell: 'bash',
      zsh: 'bash',
      console: 'bash',
      py: 'python',
      md: 'markdown',
      yml: 'yaml',
      txt: '',
      text: '',
      plain: '',
      plaintext: '',
      none: '',
    };

    /** 每个 base 一份 core、每种语言一份加载 promise、每个主题一份样式表。
        所有实例共享，加载只发生一次。失败不缓存，否则一次网络抖动就永久退化。 */
    const coreByBase = new Map();
    const langByKey = new Map();
    const sheetByUrl = new Map();
    let hljsWarned = false;
    let themeWarned = false;
    let srcWarned = false;

    function loadCore(base) {
      if (!coreByBase.has(base)) {
        const p = import(`${base}es/core.min.js`).then((m) => m.default);
        coreByBase.set(base, p);
        p.catch(() => coreByBase.delete(base));
      }
      return coreByBase.get(base);
    }

    async function loadHighlighted(base, id) {
      const key = `${base}|${id}`;
      if (!langByKey.has(key)) {
        const p = (async () => {
          const hljs = await loadCore(base);
          if (!hljs.getLanguage(id)) {
            const mod = await import(`${base}es/languages/${id}.min.js`);
            hljs.registerLanguage(id, mod.default);
          }
          return hljs;
        })();
        langByKey.set(key, p);
        p.catch(() => langByKey.delete(key));
      }
      return langByKey.get(key);
    }

    /** 片段文件（src）按 URL 缓存：同一份片段多处引用只取一次 */
    const textByUrl = new Map();

    function loadText(url) {
      if (!textByUrl.has(url)) {
        const p = (async () => {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.text();
        })();
        textByUrl.set(url, p);
        p.catch(() => textByUrl.delete(url));
      }
      return textByUrl.get(url);
    }

    /** 取一份 CSS 文本编成可复用的 CSSStyleSheet（highlight.js 的主题就是这么用的） */
    function loadSheet(url) {
      if (!sheetByUrl.has(url)) {
        const p = (async () => {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const sheet = new CSSStyleSheet();
          await sheet.replace(await res.text());
          return sheet;
        })();
        sheetByUrl.set(url, p);
        p.catch(() => sheetByUrl.delete(url));
      }
      return sheetByUrl.get(url);
    }

    /** base 统一带尾斜杠，`hljs-base` 写不写都不会拼出坏 URL */
    const normalizeBase = (base) => String(base || HLJS_BASE).replace(/\/?$/, '/');

    /**
     * 往上找最近一个「纵向真的能滚」的祖先。
     *
     * 必须跨 shadow 边界：组件自己的 shadow root 是 `.mc-body` 的父节点，
     * 而宿主的滚动容器（文档页是 `.doc-body` / `.doc-main`）在页面那层的 shadow 树里。
     * 找不到就退回文档滚动元素。
     */
    function scrollableAncestor(node) {
      let el = node.parentNode;
      while (el) {
        if (el instanceof ShadowRoot) {
          el = el.host;
          continue;
        }
        if (el instanceof Element) {
          const cs = getComputedStyle(el);
          const scrolls = cs.overflowY === 'auto' || cs.overflowY === 'scroll';
          if (scrolls && el.scrollHeight > el.clientHeight + 1) return el;
        }
        el = el.parentNode;
      }
      return document.scrollingElement;
    }

    /** 一次滚轮的位移统一换算成像素（deltaMode: 0=px / 1=行 / 2=页） */
    function wheelPixels(event, lineHeight) {
      if (event.deltaMode === 1) return event.deltaY * lineHeight;
      if (event.deltaMode === 2) return event.deltaY * window.innerHeight;
      return event.deltaY;
    }

    /**
     * 亮暗判定。优先看 `color-scheme`：令牌层切主题就是切它，而且它是继承属性，
     * 所以能穿进 shadow root（不用去猜 `<html>` 上有没有 data-theme）。
     * 宿主没引令牌时退到系统偏好。
     */
    function prefersDark(el) {
      const scheme = (getComputedStyle(el).colorScheme || '').toLowerCase();
      if (scheme.includes('dark')) return true;
      if (scheme.includes('light')) return false;
      return window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
    }

    /** 去掉首尾空行 + 公共缩进（照抄模板字面量的 dedent 语义） */
    function dedent(text) {
      const lines = String(text ?? '')
        .replace(/\r\n?/g, '\n')
        .replace(/\t/g, '  ')
        .split('\n');
      while (lines.length && !lines[0].trim()) lines.shift();
      while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
      let indent = Infinity;
      for (const line of lines) {
        if (!line.trim()) continue;
        indent = Math.min(indent, line.length - line.trimStart().length);
      }
      if (Number.isFinite(indent) && indent > 0) {
        return lines.map((l) => l.slice(indent)).join('\n');
      }
      return lines.join('\n');
    }

    /**
     * 把高亮 HTML 按换行切成行，并**配平跨行的标签**。
     *
     * highlight.js 的产物只有 `<span class="…">` 和转义后的文本，所以一个正则
     * 扫标签就够了；遇到换行时先闭合当前所有未闭合的 span，下一行重新打开。
     * 不这么做的话，多行字符串 / 块注释会把标签切断，后面的代码整段串色。
     */
    function splitLines(html) {
      const lines = [];
      const stack = [];
      let cur = '';
      const re = /<span\b[^>]*>|<\/span>|[^<]+/g;
      let m;
      while ((m = re.exec(html)) !== null) {
        const token = m[0];
        if (token.startsWith('</')) {
          stack.pop();
          cur += token;
          continue;
        }
        if (token.startsWith('<')) {
          stack.push(token);
          cur += token;
          continue;
        }
        const parts = token.split('\n');
        for (let i = 0; i < parts.length; i++) {
          if (i > 0) {
            cur += '</span>'.repeat(stack.length);
            lines.push(cur);
            cur = stack.join('');
          }
          cur += parts[i];
        }
      }
      lines.push(cur);
      return lines;
    }

    /** 没写 language 时按 src 文件的后缀猜 */
    const EXT_LANG = {
      html: 'xml',
      htm: 'xml',
      xhtml: 'xml',
      vue: 'xml',
      svg: 'xml',
      js: 'javascript',
      mjs: 'javascript',
      cjs: 'javascript',
      jsx: 'javascript',
      ts: 'typescript',
      tsx: 'typescript',
      css: 'css',
      json: 'json',
      sh: 'bash',
      bash: 'bash',
      zsh: 'bash',
      py: 'python',
      md: 'markdown',
      yml: 'yaml',
      yaml: 'yaml',
      xml: 'xml',
      txt: '',
    };

    /** language 属性（缺省时看 src 后缀）→ highlight.js 语言 id；'' 表示纯文本 */
    function resolveLanguage(language, src) {
      let id = String(language ?? '')
        .trim()
        .toLowerCase();
      if (!id && src) {
        const file = String(src).split(/[?#]/)[0];
        const ext = file.slice(file.lastIndexOf('.') + 1).toLowerCase();
        id = Object.prototype.hasOwnProperty.call(EXT_LANG, ext) ? EXT_LANG[ext] : '';
      }
      if (Object.prototype.hasOwnProperty.call(ALIASES, id)) id = ALIASES[id];
      // 只接受安全的语言 id：它会拼进 CDN URL，不能让属性值跑出 base
      if (!/^[a-z0-9][a-z0-9_+-]*$/.test(id)) return '';
      return id;
    }

    export default async () => ({
      tag: 'mc-code',

      attrs: {
        /*
         * 代码文本。三种传法都支持，取值优先级：
         *   code 属性 / property  >  标签里的纯文本
         *
         * 声明在 attrs 里是必须的：ofa 的 `:code="expr"` 只对**已声明**的键生效（P6），
         * 所以页面模块里 `<mc-code :code="snippet">` 能直接绑一段数据。
         * 标签内文本那条路保留，是因为它不用转义引号、多行也好读 —— 就是
         * 普通 HTML 里贴代码的样子。注意两条路的 `<` 都得写 `&lt;`。
         */
        code: '',
        /*
         * 片段文件：给长片段 / 需要转义的片段用。
         * `<mc-code language="html" src="./docs/snippets/quick-start.html">` ——
         * 文件就是真 HTML/JS/CSS，不用写 `&lt;`，编辑器也能正常高亮。
         * 路径按**文档地址**（document.baseURI）解析，写站点根或页面相对路径都行。
         * 优先级：src > code 属性 > 标签内文本。
         */
        src: '',
        language: '',
        // 换自托管 / 换镜像：指向 highlight.js 的 build/ 目录
        hljsBase: '',
        // 换成官方其它主题（styles/ 下的名字）：atom-one-light / atom-one-dark / vs / vs2015 …
        hljsTheme: '',
        hljsThemeDark: '',
        // 数字按 px 解释，其余当作 CSS 长度（20rem）
        maxHeight: '',
        // 布尔属性默认值必须是 null，不能是 false（P1）
        lineNumbers: null,
        softWrap: null,
      },

      // 注意：ofa.js 初始化时会把 watch 都用默认值触发一遍（P5），
      // 所以统一走 onAttrChange 的 `_mounted` 守卫。
      watch: {
        code() {
          this.onAttrChange();
        },
        src() {
          this.onAttrChange();
        },
        language() {
          this.onAttrChange();
        },
        hljsBase() {
          this.onAttrChange();
        },
        hljsTheme() {
          this.themeChanged();
        },
        hljsThemeDark() {
          this.themeChanged();
        },
        maxHeight() {
          this.onAttrChange();
        },
        lineNumbers() {
          this.onAttrChange();
        },
        softWrap() {
          this.onAttrChange();
        },
      },

      proto: {
        /**
         * watch 的入口：挂载前的那些触发（ofa.js 初始化时会把每个 watch 用默认值
         * 触发一遍，P5）直接丢掉 —— 那时 this._bodyEl 还没查出来。
         *
         * 名字避开 `$.fn` 上的保留字（P7）：第一版叫 `refresh()` + `sync()`，
         * 两个都被 ofa.js 拒收（只在控制台留一条 warning），watch 里调到的是框架
         * 自己的 `refresh` —— 它会把模板重渲染一遍，于是 this._bodyEl 这些缓存
         * 全部指向被替换掉的旧节点。
         */
        onAttrChange() {
          if (!this._mounted) return;
          this.applyAttrs();
        },

        /** 只换了主题名：重新 adopt 一份，不用重新渲染代码 */
        themeChanged() {
          if (!this._mounted) return;
          this._themeName = '';
          this.applyTheme();
        },

        /** 属性 → 高度上限 / 语言 id → 渲染代码 → 升级高亮 */
        applyAttrs() {
          const mh = String(this.maxHeight ?? '').trim();
          const mhCss = /^\d+(\.\d+)?$/.test(mh) ? `${mh}px` : mh;

          // 高度变量写在**内部容器**上，绝不写宿主元素 ——
          // 自定义元素构造期往宿主加属性，浏览器会抛
          // `NotSupportedError: The result must not have attributes`，
          // 于是 document.createElement('mc-code') 直接出不来（见 P31）。
          // 内部容器是 innerHTML 的产物，写它不受这条限制。
          this._bodyEl.style.removeProperty('--mc-code-max-h');
          if (mhCss) this._bodyEl.style.setProperty('--mc-code-max-h', mhCss);

          const src = String(this.src ?? '').trim();
          this._language = resolveLanguage(this.language, src);
          // src 未就绪时先用 code / 标签内文本兜底，片段到了再替换
          this.applySource();

          this.renderCode();
          if (src) this.loadSource(src);
          return this.highlight();
        },

        /**
         * 拉取片段文件并渲染。
         *
         * 同一份片段多处引用只发一次请求（按 URL 缓存）；等待期间 src 又变了、
         * 或组件已卸载，就丢弃这次结果。
         */
        async loadSource(src) {
          let url;
          try {
            url = new URL(src, document.baseURI).href;
          } catch {
            return;
          }
          this._srcUrl = url;
          try {
            const text = await loadText(url);
            if (this._srcUrl !== url || !this.ele.isConnected) return;
            const next = dedent(text);
            if (next !== this._raw) {
              this._raw = next;
              this._hlHtml = null;
            }
            this.renderCode();
            this.highlight();
          } catch (err) {
            if (!srcWarned) {
              srcWarned = true;
              console.warn(
                '[mosaic] mc-code 片段文件加载失败，保留 code / 标签内文本作为兜底：\n' +
                  `         src=${src} → ${url}`,
                err,
              );
            }
          }
        },

        /**
         * 把「挂载前赋的 el.code」反射成属性。
         *
         * 不能直接在 ready() 里写：ofa 的 ready() 是构造期跑的，那时往宿主加属性会抛
         * `NotSupportedError: The result must not have attributes`（P31）。
         * 推到微任务里，构造已经结束，写属性就安全了（内容此前已经渲染过）。
         */
        reflectPreset() {
          if (!this._presetCode) return;
          const text = this._presetCode;
          this._presetCode = undefined;
          this.ele.code = text;
        },

        /**
         * 决定这次渲染用哪份文本，并同步到内部状态。
         *
         * 优先级：`code` 属性（非空）> 标签里的纯文本。
         * 内容真的变了才清掉高亮产物 —— 否则属性变一下会把已经渲染好的高亮丢掉。
         */
        applySource() {
          // `_pendingCode`：property 写入时先记下来，这次渲染就用它 ——
          // ofa 把 setAttribute 同步到 data 是异步的（P4），不等它才不会闪一下旧内容。
          const attr =
            this._pendingCode != null
              ? this._pendingCode
              : this._presetCode != null
                ? this._presetCode
                : typeof this.code === 'string'
                  ? this.code
                  : '';
          this._pendingCode = undefined;
          const source = attr.trim() ? dedent(attr) : dedent(this.ele.textContent);
          if (source !== this._raw) {
            this._raw = source;
            this._hlHtml = null;
          }
        },

        /**
         * 渲染代码。同步、无依赖：先出纯文本，高亮是之后的增量升级。
         * 未开行号时整段塞进 `<code>`；开了行号就按行产出 span 结构。
         */
        renderCode() {
          const code = this._codeEl;
          const html = this._hlHtml;
          const numbered = this.lineNumbers !== null;
          const lines = html ? splitLines(html) : this._raw.split('\n');

          if (!numbered) {
            code.textContent = '';
            if (html) code.innerHTML = html;
            else code.textContent = this._raw;
            return;
          }

          // 行号列宽按最大行号的位数算，三位数行号不会把数字挤到代码上
          const digits = String(lines.length).length;
          code.style.setProperty('--mc-code-ln-w', `calc(${digits}ch + 0.75rem)`);

          const frag = document.createDocumentFragment();
          for (let i = 0; i < lines.length; i++) {
            const line = document.createElement('span');
            line.className = 'mc-line';
            line.setAttribute('part', 'line');

            const no = document.createElement('span');
            no.className = 'mc-ln';
            no.setAttribute('aria-hidden', 'true'); // 行号不该被读屏念出来
            no.textContent = String(i + 1);

            const body = document.createElement('span');
            body.className = 'mc-lc';
            // 有高亮产物走 innerHTML（hljs 已经转义过原文），否则用 textContent
            if (html) body.innerHTML = lines[i];
            else body.textContent = lines[i];

            line.append(no, body);
            frag.append(line);
          }
          code.textContent = '';
          code.append(frag);
        },

        /**
         * 块内滚到边界时，把这次滚轮**手动**交给外层滚动容器。
         *
         * 为什么需要它：`.mc-body` 在 `max-height` 下是个纵向滚动容器，浏览器会把
         * 一次滚轮手势锁在它身上（scroll latching）。实测：块内滚到底后，同一手势里
         * **后面几次滚轮全被吞掉**（第 3 次不动、第 4 次才开始滚页面），用户手感就是
         * "鼠标停在代码上页面就锁住了"。这里只在边界那一下接管，块内还能滚时一律
         * 不干预（不 preventDefault）。
         */
        handleWheel(event) {
          const body = this._bodyEl;
          // 没有内部滚动（绝大多数块）→ 完全不插手，交给浏览器链到页面
          if (body.scrollHeight <= body.clientHeight + 1) return;
          // 缩放 / 横向滚轮不碰
          if (!event.deltaY || event.ctrlKey || event.metaKey) return;

          const down = event.deltaY > 0;
          const atTop = body.scrollTop <= 0;
          const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 1;
          if ((down && !atBottom) || (!down && !atTop)) return;

          const target = scrollableAncestor(body);
          if (!target) return;
          const lineHeight = parseFloat(getComputedStyle(body).lineHeight) || 16;
          event.preventDefault(); // 拦掉"被吞掉的那一次"，改由我们转发
          target.scrollTop += wheelPixels(event, lineHeight);
        },

        /**
         * 懒加载 highlight.js 并把渲染结果升级。
         * 任何一步失败都只是"没有颜色"：保持纯文本，不抛错、不阻塞别的实例。
         */
        async highlight() {
          const raw = this._raw;
          const lang = this._language;
          this._hlHtml = null;
          if (!lang) {
            this.renderCode();
            return;
          }
          const base = normalizeBase(this.hljsBase);
          this.applyTheme(base); // 与语言模块并行取，互不阻塞
          try {
            const hljs = await loadHighlighted(base, lang);
            // 等待期间内容或语言可能已经变了，丢弃过期结果
            if (this._raw !== raw || this._language !== lang) return;
            this._hlHtml = hljs.highlight(raw, { language: lang, ignoreIllegals: true }).value;
            this.renderCode();
          } catch (err) {
            if (!hljsWarned) {
              hljsWarned = true;
              console.warn(
                '[mosaic] mc-code 代码高亮加载失败，已退化为纯文本：\n' +
                  `         语言=${lang} 来源=${base}\n` +
                  '         离网 / CDN 不可达 / CSP 拦截时都会走到这里，代码本身照常显示。',
                err,
              );
            }
          }
        },

        /**
         * 把 highlight.js 的官方主题**原样** adopt 进来：只加一张表，
         * 不写任何覆盖它规则的东西 —— 所以 token 颜色就是主题里声明的值。
         *
         * 只在 shadow root 内生效，不会影响宿主页面上别人用同一份主题的地方。
         */
        async applyTheme(base = normalizeBase(this.hljsBase)) {
          const dark = prefersDark(this.ele);
          const name =
            (dark ? this.hljsThemeDark : this.hljsTheme) || (dark ? THEME_DARK : THEME_LIGHT);
          // 主题名会拼进 URL，只接受安全字符
          if (!/^[a-z0-9][a-z0-9_-]*$/.test(name)) return;
          if (this._themeName === name) return;
          this._themeName = name;

          try {
            const sheet = await loadSheet(`${base}styles/${name}.min.css`);
            // 等待期间又切了主题 / 组件已经卸载，丢弃这次结果
            if (this._themeName !== name || !this.ele.isConnected) return;
            const root = this.ele.shadowRoot;
            // 只换掉自己上次 adopt 的那张，mosaic.js 注入的共享表原样保留
            root.adoptedStyleSheets = [
              ...root.adoptedStyleSheets.filter((s) => s !== this._themeSheet),
              sheet,
            ];
            this._themeSheet = sheet;
          } catch (err) {
            this._themeName = ''; // 允许下次重试
            if (!themeWarned) {
              themeWarned = true;
              console.warn(
                '[mosaic] mc-code 高亮主题加载失败，代码仍会高亮，只是没有官方配色：\n' +
                  `         主题=${name} 来源=${base}styles/`,
                err,
              );
            }
          }
        },
      },

      ready() {
        const root = this.ele.shadowRoot;
        this._codeEl = root.querySelector('.mc-block');
        this._bodyEl = root.querySelector('.mc-body');

        this._hlHtml = null;
        this._themeName = '';
        this._raw = '';
        this._language = '';

        this.applyAttrs();

        /*
         * 宿主 DOM property `code`。
         *
         * 写入走 setAttribute：ofa 只观察属性，直接改 property 不触发更新（P3）。
         * 同时立刻用新值渲染一次，不等 ofa 那一拍（P4），所以 el.code = … 是即时生效的；
         * watch 里那次重复调用会被 applySource 的"内容没变就不动"挡掉。
         *
         * 读取返回当前渲染用的原文（去掉了公共缩进）。
         */
        const preset = Object.prototype.hasOwnProperty.call(this.ele, 'code')
          ? this.ele.code
          : undefined;
        if (typeof preset === 'string' && preset.trim()) this._presetCode = preset;
        Object.defineProperty(this.ele, 'code', {
          configurable: true,
          get: () => this._raw,
          set: (value) => {
            const text = value == null ? '' : String(value);
            this.ele.setAttribute('code', text);
            this._pendingCode = text;
            this.applySource();
            this.renderCode();
            this.highlight();
          },
        });
        // createElement 之后、挂载之前就赋过值：内容已经渲染（走 `_presetCode`），
        // 属性反射推到微任务（构造期写宿主属性会抛 NotSupportedError，见 P31）。
        if (this._presetCode) queueMicrotask(() => this.reflectPreset());

        /*
         * 主题信号有两个，都听：
         *   · 文档根上的 data-theme（令牌用它换色，同时也换了 color-scheme）
         *   · 系统偏好变化（没显式设主题时的兜底）
         * 换主题就等于换一张官方主题表，不做逐条颜色覆盖。
         */
        this._onThemeChange = () => this.applyTheme();
        const mq = window.matchMedia?.('(prefers-color-scheme: dark)');
        mq?.addEventListener?.('change', this._onThemeChange);
        this._mq = mq;
        this._mo = new MutationObserver(this._onThemeChange);
        this._mo.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['data-theme', 'class', 'style'],
        });

        // 块内滚到边界时手动把滚动交给外层（见 handleWheel 的注释）。
        // 必须 passive: false —— 边界那一下要 preventDefault。
        this._onWheel = (event) => this.handleWheel(event);
        this._bodyEl.addEventListener('wheel', this._onWheel, { passive: false });

        this._mounted = true;

        // 极端情况下（自定义元素在 HTML 解析中途就被升级）ready() 可能读到空内容，
        // 补几拍再读一次，自限；定时器句柄留着给 detached() 清。
        if (!this._raw && !String(this.code || '').trim()) {
          let tries = 0;
          const settle = () => {
            this._settleTimer = undefined;
            if (!this._mounted || this._raw || !this.ele.isConnected) return;
            const text = dedent(this.ele.textContent);
            if (text) {
              this._raw = text;
              this.applyAttrs();
            } else if (++tries < 10) {
              this._settleTimer = setTimeout(settle, 30);
            }
          };
          this._settleTimer = setTimeout(settle, 30);
        }
      },

      // 定时器、观察器与全局监听必须在这里清掉（checklist）
      detached() {
        this._mounted = false;
        clearTimeout(this._settleTimer);
        this._bodyEl?.removeEventListener('wheel', this._onWheel);
        this._mo?.disconnect();
        this._mq?.removeEventListener?.('change', this._onThemeChange);
      },
    });
    /* @unocss-skip-end */
  </script>
</template>
