<template component>
  <mc-code language="javascript" :code="boundSnippet"></mc-code>

  <script>
    export default async () => ({
      tag: 'demo-code-binding',

      data: {
        /*

         */
        boundSnippet: `// 由例子组件自己的 data 绑定进来

console.log(bind('mc-code :code'));`,
      },
    });
  </script>
</template>
