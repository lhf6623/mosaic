<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 普通 HTML 页：引 ofa.js + 用到的组件；排版工具类来自可选的 mosaic.css -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/boot/mosaic.css" />
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.5/dist/ofa.min.mjs"
      type="module"></script>
  </head>
  <body>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/space/space.html"></l-m>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/button/button.html"></l-m>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/code/code.html"></l-m>

    <mc-space direction="vertical" block>
      <!-- 实心那颗 = 当前内容是从哪条通道写进来的；普通 HTML 没有 data 绑定，只有这两条 -->
      <mc-space block wrap-items>
        <mc-button size="sm" variant="outline" data-channel="property">
          写 JS 属性（el.code）
        </mc-button>
        <mc-button size="sm" data-channel="attribute">写 HTML 属性（setAttribute）</mc-button>
      </mc-space>

      <!-- 初值不写在标签上：等组件注册完再写进去，文本只留脚本里的常量一份 -->
      <mc-code id="runtime-target" language="javascript"></mc-code>

      <div class="text-sm">
        读回 <code>el.code</code>：<strong id="shown"></strong>
      </div>
    </mc-space>

    <script>
      const target = document.getElementById('runtime-target');
      const shown = document.getElementById('shown');

      /* 每条通道两份文案：同一个按钮连点也能看到内容真的换了 */
      const MESSAGES = {
        property: [
          'const byProperty = "el.code 写进来的";',
          'const byProperty = "再点一次，又换了一份";',
        ],
        attribute: [
          "const byAttribute = 'setAttribute 写进来的';",
          "const byAttribute = '再点一次，又换了一份';",
        ],
      };
      const turns = { property: 0, attribute: 1 }; // attribute 的 0 号已经当初值用过了

      /* 初值只存在常量里（就是属性通道的第一份文案），不再和标签属性各写一份 */
      const INITIAL = MESSAGES.attribute[0];

      /* 选中态只改按钮自己的 variant，不碰代码块 */
      const markActive = (how) => {
        for (const btn of document.querySelectorAll('[data-channel]')) {
          btn.setAttribute('variant', btn.dataset.channel === how ? 'filled' : 'outline');
        }
      };

      /* 两条通道都会重渲染 + 重新高亮，区别在时序：property 那条是同步的，
         属性那条走 ofa 的属性观察、微任务里才读得到新值 —— 读回统一放在微任务里 */
      const write = (how) => {
        const list = MESSAGES[how];
        const code = list[turns[how]++ % list.length];
        if (how === 'property') target.code = code;
        else target.setAttribute('code', code);
        markActive(how);
        queueMicrotask(() => {
          shown.textContent = target.code;
        });
      };

      for (const btn of document.querySelectorAll('[data-channel]')) {
        btn.addEventListener('click', () => write(btn.dataset.channel));
      }

      /* 普通 HTML 里拿不到组件自己的生命周期回调（ofa 的 ready / loaded 写在组件定义内部，
         宿主用不上）；等 mc-code 被 <l-m> 注册完再写初值 —— 这就是宿主侧的「组件加载完毕」。 */
      customElements.whenDefined('mc-code').then(() => {
        target.setAttribute('code', INITIAL);
        markActive('attribute');
        /* 注册完只是元素能用了，新属性还要等一个微任务才落到元素上，读回放到下一帧 */
        requestAnimationFrame(() => {
          shown.textContent = target.code;
        });
      });
    </script>
  </body>
</html>
