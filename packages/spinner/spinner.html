<!-- mc-spinner — 加载中指示器；设计取舍见 README.md「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主盒模型 + 色槽默认值。图形恒为 1em，font-size 是唯一的尺寸入口 */
    :host {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      font-size: 1em;
      line-height: 0;
      vertical-align: middle;
      /* ⚠️ 必须显式 inherit：shadow-base 的 reset 里 `:host { color: … }` 会掐断颜色继承，color="current" 就跟不住周围文字色；本 <style> 未分层、赢过 reset 所在的 @layer */
      color: inherit;

      /* L3 组件令牌：时长必须走 --mc-duration-*（reduced-motion 下会被压到 1ms，动画自动变静态） */
      --mc-spinner-duration: calc(var(--mc-duration-slow, var(--mc-def-duration-slow)) * 3);
      --mc-spinner-thickness: 0.125em;
    }

    /* 2. 维度一 color：只往 currentColor 里填值。current（默认）不写规则，直接继承 */
    :host([color='primary']) {
      color: rgb(var(--mc-color-primary, var(--mc-def-color-primary)));
    }
    :host([color='info']) {
      color: rgb(var(--mc-color-info, var(--mc-def-color-info)));
    }
    :host([color='success']) {
      color: rgb(var(--mc-color-success, var(--mc-def-color-success)));
    }
    :host([color='warning']) {
      color: rgb(var(--mc-color-warning, var(--mc-def-color-warning)));
    }
    :host([color='danger']) {
      color: rgb(var(--mc-color-danger, var(--mc-def-color-danger)));
    }
    /* 中性 = 次要文字色：和 mc-icon 一个口径，落在卡片 / 页面上才对得上 */
    :host([color='neutral']) {
      color: rgb(var(--mc-color-fg-muted, var(--mc-def-color-fg-muted)));
    }

    /* 3. 维度二 size：1em / 1.5em / 2em，随继承来的字号缩放（内联 style 优先级更高，能直接覆盖） */
    :host([size='sm']) {
      font-size: 1em;
    }
    :host([size='md']) {
      font-size: 1.5em;
    }
    :host([size='lg']) {
      font-size: 2em;
    }

    /* 4. 内部元素：开口的环。缺口由 border-right-color 给，转起来就是「在转」的信号 */
    .mc-spinner {
      display: block;
      width: 1em;
      height: 1em;
      border: var(--mc-spinner-thickness) solid currentColor;
      border-right-color: transparent;
      border-radius: var(--mc-radius-full, var(--mc-def-radius-full));
      animation: mc-spinner-rotate var(--mc-spinner-duration) linear infinite;
    }
    @keyframes mc-spinner-rotate {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <span class="mc-spinner"></span>

  <script>
    /* color 也收 hex：旋转图形没有色槽，color 直接就是前景色，所以用 fg 模式；'current' 交给 CSS */
    import { colorAttr, FG_NAMES } from '../boot/color-attr.js';

    const color = colorAttr({ mode: 'fg', names: FG_NAMES });

    export default async () => ({
      tag: 'mc-spinner',

      attrs: {
        size: 'md',
        /* 默认 current：spinner 几乎总是嵌在按钮 / 文字里，强制默认语义色会让它跟周围脱节 */
        color: 'current',
      },

      attached() {
        // 宿主 style 等构造期结束再写（P31），color 的首次同步在这里
        color.sync(this.ele, this.color);
      },

      watch: {
        // color 收 hex：首次触发落在构造期，跳过由 colorAttr 内部处理
        color(value) {
          color.change(this.ele, value);
        },
      },
    });
  </script>
</template>
