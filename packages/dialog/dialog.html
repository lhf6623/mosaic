<!-- mc-dialog — 模态对话框（遮罩 + 居中面板 + 焦点陷阱）；设计取舍见 README.md「设计取舍」。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <link rel="stylesheet" href="../icon/icons.generated.css" />
  <style>
    /* 1. 宿主盒模型 + 令牌默认值。视觉全在 top layer 的面板里，宿主用 display: contents 不占 flex gap */
    :host {
      display: contents;

      /* L3 令牌：面板尺寸 / 底色 / 圆角 / 内边距与遮罩都由这里给，按实例覆盖写在宿主 style 上 */
      --mc-dialog-panel-width: 32rem;
      --mc-dialog-panel-bg: var(--mc-color-surface-raised, var(--mc-def-color-surface-raised));
      --mc-dialog-panel-border: var(--mc-color-border-strong, var(--mc-def-color-border-strong));
      --mc-dialog-panel-radius: var(--mc-radius-xl, var(--mc-def-radius-xl));
      --mc-dialog-panel-pad: var(--mc-space-6, var(--mc-def-space-6));
      --mc-dialog-overlay-bg: var(--mc-color-overlay, var(--mc-def-color-overlay));
      --mc-dialog-overlay-alpha: var(--mc-color-overlay-alpha, var(--mc-def-color-overlay-alpha));
      --mc-dialog-gap: var(--mc-space-4, var(--mc-def-space-4));
      --mc-dialog-space: var(--mc-space-6, var(--mc-def-space-6));
    }

    /* 2. 尺寸：三档只改面板宽度这一个槽（默认 md 写在 1 区） */
    :host([size='sm']) {
      --mc-dialog-panel-width: 22rem;
    }
    :host([size='lg']) {
      --mc-dialog-panel-width: 44rem;
    }

    /* 3. 浮层本体（popover）：整块是**一个** popover 才进 top layer。⚠️ display 不能写在基类上（作者样式压得过 UA 的 `[popover]:not(:popover-open){display:none}`）；⚠️ width/height 必须显式 auto，否则 `inset:0` 也铺不满视口。 */
    .mc-root {
      display: none;
      position: fixed;
      inset: 0;
      width: auto;
      height: auto;
      box-sizing: border-box;
      margin: 0;
      border: 0;
      padding: var(--mc-dialog-space);
      overflow: auto;
      /* ⚠️ 必须显式透明：UA 给 `[popover]` 的默认背景是 `canvas`（不透明白），留着遮罩就成了一张白纸，灰度只该由 .mc-overlay 给 */
      background-color: transparent;
    }
    .mc-root:popover-open {
      display: flex;
    }

    .mc-overlay {
      position: absolute;
      inset: 0;
      background-color: rgb(var(--mc-dialog-overlay-bg) / var(--mc-dialog-overlay-alpha));
    }

    /* 4. 面板：margin:auto 两轴居中，比 align-items:center 更耐「内容比视口高」 */
    .mc-panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      width: min(var(--mc-dialog-panel-width), 100%);
      max-height: 100%;
      margin: auto;
      overflow: hidden;
      border: 1px solid rgb(var(--mc-dialog-panel-border));
      border-radius: var(--mc-dialog-panel-radius);
      background-color: rgb(var(--mc-dialog-panel-bg));
      color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)));
      box-shadow: var(--mc-shadow-overlay, var(--mc-def-shadow-overlay));
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-text-sm, var(--mc-def-text-sm));
      line-height: var(--mc-text-sm-lh, var(--mc-def-text-sm-lh));
    }
    /* 焦点环用 ring 令牌，不用 currentColor（P16）：面板只在没有可聚焦元素时才自己拿焦点 */
    .mc-panel:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }

    /* 5. 内部元素：空头部 / 空底部不占内边距，显隐靠宿主上的 data-has-*（常驻 DOM，P10） */
    .mc-header {
      display: none;
      align-items: center;
      gap: var(--mc-dialog-gap);
      padding: var(--mc-dialog-panel-pad);
      padding-bottom: var(--mc-space-3, var(--mc-def-space-3));
      font-size: var(--mc-text-lg, var(--mc-def-text-lg));
      line-height: var(--mc-text-lg-lh, var(--mc-def-text-lg-lh));
      font-weight: var(--mc-weight-semibold, var(--mc-def-weight-semibold));
    }
    :host([data-has-header]) .mc-header {
      display: flex;
    }
    .mc-heading {
      flex: 1 1 auto;
      min-width: 0;
    }

    .mc-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: var(--mc-dialog-panel-pad);
      overflow-wrap: anywhere;
    }
    :host([data-has-header]) .mc-body {
      padding-top: var(--mc-space-3, var(--mc-def-space-3));
    }
    :host([data-has-footer]) .mc-body {
      padding-bottom: var(--mc-space-3, var(--mc-def-space-3));
    }

    .mc-footer {
      display: none;
      flex: none;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: var(--mc-dialog-gap);
      padding: var(--mc-dialog-panel-pad);
      padding-top: var(--mc-space-3, var(--mc-def-space-3));
    }
    :host([data-has-footer]) .mc-footer {
      display: flex;
    }

    /* 关闭按钮：32×32 命中区 */
    .mc-close {
      display: none;
      flex: none;
      box-sizing: border-box;
      width: var(--mc-space-8, var(--mc-def-space-8));
      height: var(--mc-space-8, var(--mc-def-space-8));
      margin-inline-start: auto;
      padding: 0;
      border: 0;
      border-radius: var(--mc-radius-full, var(--mc-def-radius-full));
      background-color: transparent;
      color: rgb(var(--mc-color-fg-muted, var(--mc-def-color-fg-muted)));
      font-size: var(--mc-text-base, var(--mc-def-text-base));
      line-height: 1;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    :host([closable]) .mc-close {
      /* flex item 会被块级化：computed display 是 flex，不是这里写的 inline-flex */
      display: inline-flex;
    }
    .mc-close:hover {
      background-color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)) / 0.08);
    }
    .mc-close:active {
      background-color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)) / 0.12);
    }
    .mc-close:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }
  </style>

  <!-- 遮罩 + 面板 = 一个 popover（进 top layer）。⚠️ popover="manual" 是刻意的：manual 不被 light dismiss 关掉，Esc / 点遮罩 / × 三条关闭路径都由脚本自己接。 -->
  <div class="mc-root" popover="manual" on:click="onRootClick">
    <div class="mc-overlay" part="overlay"></div>

    <div class="mc-panel" part="panel" tabindex="-1">
      <div class="mc-header" part="header">
        <div class="mc-heading"><slot name="header">{{heading}}</slot></div>
        <button class="mc-close" type="button" on:click="closeDialog()">
          <span class="mc-icon-close"></span>
        </button>
      </div>
      <div class="mc-body" part="body"><slot></slot></div>
      <div class="mc-footer" part="footer"><slot name="footer"></slot></div>
    </div>
  </div>

  <script>
    import { attachFloatingScrollGuard } from '../boot/scroll-pin.js';

    /** 面板里可聚焦的原生元素；`:disabled` 认 property，够得到真正可聚焦的那些 */
    const FOCUSABLE =
      'a[href],button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])';

    /**
     * 扁平树（渲染树）顺序上的可聚焦元素。⚠️ 不能直接 `panel.querySelectorAll(...)`：正文 / 底部是**使用者写在插槽里的
     * light DOM**，不在 shadow 树里，选择器够不到；嵌套 custom element 还要钻进它的 shadow root。
     */
    const flatFocusables = (root) => {
      const out = [];
      const visit = (el) => {
        if (el.localName === 'slot') {
          for (const node of el.assignedElements({ flatten: true })) visit(node);
          return;
        }
        if (el.matches(FOCUSABLE) && el.getClientRects().length > 0) out.push(el);
        if (el.shadowRoot) {
          for (const node of el.shadowRoot.children) visit(node);
          return;
        }
        for (const node of el.children) visit(node);
      };
      for (const node of root.children) visit(node);
      return out;
    };

    /** 一路钻进 shadow root 的当前焦点：焦点在别人的 shadow 里时 document.activeElement 只到那个宿主 */
    const deepActive = () => {
      let el = document.activeElement;
      while (el?.shadowRoot?.activeElement) el = el.shadowRoot.activeElement;
      return el;
    };

    export default () => ({
      tag: 'mc-dialog',

      attrs: {
        // 布尔属性默认值必须是 null（P1）：open 既是初始值也是运行时状态
        open: null,
        // 标题纯文本，富标题走 header 插槽。叫 heading 不叫 title —— title 会弹原生 tooltip（P32）
        heading: '',
        closable: null,
        maskClosable: null,
        size: 'md',
      },

      data: {
        mounted: false,
      },

      ready() {
        this._slots = [...this.ele.shadowRoot.querySelectorAll('slot')];

        // 运行时状态走 property（规范 1.4）：setter 立刻同步原生 popover，不等 ofa 那一拍（P4）
        Object.defineProperty(this.ele, 'open', {
          configurable: true,
          get: () => this.ele.hasAttribute('open'),
          set: (value) => {
            if (value) this.ele.setAttribute('open', '');
            else this.ele.removeAttribute('open');
            this.syncOpen();
          },
        });

        // Esc / Tab 都在 document 上收：焦点万一跑到面板外也要能拉回来
        this._onKeydown = (event) => this.onKeydown(event);
        document.addEventListener('keydown', this._onKeydown, true);

        // 滚动守卫：一行接线，它自己监听面板的 beforetoggle / toggle（见 scroll-pin.js）
        this._scrollGuard = attachFloatingScrollGuard(this.ele, this.root);
        // 老浏览器没有 popover API 时不炸：面板由 CSS 兜在 display:none，交互一律不动
        this.popoverOk = typeof this.root?.showPopover === 'function';
        this.mounted = true;
        if (this.ele.isConnected) this.syncOpen();
      },

      attached() {
        /* data-has-* 是 CSS 唯一的输入：宿主属性 + 插槽内容一起判定（P32：不能只看属性在不在）；头部还要算上 closable */
        this._onSlotChange = () => this.applyState();
        for (const slot of this._slots) slot.addEventListener('slotchange', this._onSlotChange);
        this.applyState();
        // 构造期宿主可能还没连上（那时 showPopover 会抛），这里补一次
        this.syncOpen();
      },

      detached() {
        document.removeEventListener('keydown', this._onKeydown, true);
        for (const slot of this._slots) slot.removeEventListener('slotchange', this._onSlotChange);
        this._scrollGuard?.dispose();
      },

      watch: {
        // open 变了就同步原生状态；首次触发在构造期（P5），跳过
        open() {
          if (this._openWatchInit === undefined) {
            this._openWatchInit = true;
            return;
          }
          this.syncOpen();
        },
        // 标题文案决定头部要不要占位，同样跳过首次（P5）
        heading() {
          if (this._headingWatchInit === undefined) {
            this._headingWatchInit = true;
            return;
          }
          this.applyState();
        },
        closable() {
          if (this._closableWatchInit === undefined) {
            this._closableWatchInit = true;
            return;
          }
          this.applyState();
        },
      },

      proto: {
        get root() {
          return this.ele.shadowRoot.querySelector('.mc-root');
        },

        get panelEl() {
          return this.ele.shadowRoot.querySelector('.mc-panel');
        },

        /** 宿主 open 属性 → 原生 popover 状态；两个方向的真相都收在这一处 */
        syncOpen() {
          if (!this.mounted || !this.popoverOk || !this.ele.isConnected) return;
          const shouldOpen = this.ele.hasAttribute('open');
          const isOpen = this.root.matches(':popover-open');
          if (shouldOpen && !isOpen) {
            // 焦点归还的目标：打开前那一处（可能要钻进别人的 shadow root）
            this._returnFocus = deepActive();
            /* 显示那一行要包一层：toggle 事件晚一拍，挡不住同步动作里的滚动（见 scroll-pin.js） */
            this._scrollGuard.run(() => this.root.showPopover());
            this.focusIntoPanel();
            this.emit('open', { bubbles: true, composed: true });
          } else if (!shouldOpen && isOpen) {
            this._scrollGuard.run(() => this.root.hidePopover());
            this.restoreFocus();
            this.emit('close', { bubbles: true, composed: true });
          }
        },

        focusIntoPanel() {
          (this.focusables()[0] ?? this.panelEl).focus({ preventScroll: true });
        },

        focusables() {
          return flatFocusables(this.panelEl);
        },

        restoreFocus() {
          const target = this._returnFocus;
          this._returnFocus = null;
          if (target?.isConnected) target.focus({ preventScroll: true });
        },

        /** Esc 关闭 + Tab / Shift+Tab 在面板内循环；焦点被外面抢走时也拉回来 */
        onKeydown(event) {
          if (!this.popoverOk || !this.root.matches(':popover-open')) return;
          if (event.key === 'Escape') {
            event.preventDefault();
            this.closeDialog();
            return;
          }
          if (event.key !== 'Tab') return;
          const items = this.focusables();
          const index = items.indexOf(deepActive());
          if (index < 0) {
            event.preventDefault();
            (items[0] ?? this.panelEl).focus({ preventScroll: true });
            return;
          }
          const step = event.shiftKey ? -1 : 1;
          event.preventDefault();
          items[(index + step + items.length) % items.length].focus({ preventScroll: true });
        },

        /** 点遮罩关闭。⚠️ P20：跨 shadow 判「点在哪」必须走 composedPath —— contains(e.target)
         * 拿到的是沿途重定向后的宿主，必然误判成外部。 */
        onRootClick(event) {
          const path = event.composedPath();
          if (!path.includes(this.ele)) return;
          if (path.includes(this.panelEl)) return;
          if (this.ele.hasAttribute('mask-closable')) this.closeDialog();
        },

        openDialog() {
          if (!this.ele.hasAttribute('open')) this.ele.setAttribute('open', '');
          this.syncOpen();
        },

        closeDialog() {
          if (this.ele.hasAttribute('open')) this.ele.removeAttribute('open');
          this.syncOpen();
        },

        applyState() {
          this.mirror(
            'data-has-header',
            this.slotHasContent('header') ||
              this.headingText() !== '' ||
              this.ele.hasAttribute('closable'),
          );
          this.mirror('data-has-footer', this.slotHasContent('footer'));
        },

        /** 标题文案。attach 那一刻宿主上还没有 heading 属性（P32），先落成空串再看 */
        headingText() {
          return (this.ele.getAttribute('heading') ?? '').trim();
        },

        /** 具名插槽有没有分到东西：**元素即内容**；纯文本 / 注释节点要非空白才算 */
        slotHasContent(name) {
          const selector = name ? `slot[name="${name}"]` : 'slot:not([name])';
          const slot = this.ele.shadowRoot.querySelector(selector);
          return (slot?.assignedNodes() ?? []).some(
            (node) => node.nodeType === Node.ELEMENT_NODE || (node.textContent ?? '').trim() !== '',
          );
        },

        /** 只在真的变了的时候写宿主 —— 否则每次属性变动都白触发一轮样式重算 */
        mirror(name, on) {
          if (on === this.ele.hasAttribute(name)) return;
          if (on) this.ele.setAttribute(name, '');
          else this.ele.removeAttribute(name);
        },
      },
    });
  </script>
</template>
