<template component>
  <div class="flex flex-wrap items-center gap-3">
    <mc-button on:click="toggle()">{{open ? '收起' : '展开'}}</mc-button>

    <mc-dropdown
      placement="bottom-start"
      attr:open="open ? '' : null"
      on:open="markOpen()"
      on:close="markClose()">
      <mc-button slot="trigger" variant="outline">受控触发的元素</mc-button>
      <mc-menu-item><a href="../page.html" olink>打开时发 open</a></mc-menu-item>
      <mc-menu-item>
        <a href="../page.html" olink>Esc / 点空白 / 再点触发元素都发 close</a>
      </mc-menu-item>
    </mc-dropdown>
  </div>

  <p class="mt-3 text-sm text-muted">
    最近一次事件：
    <strong>{{last}}</strong>
  </p>

  <script>
    export default async () => ({
      tag: 'demo-dropdown-events',

      data: { open: false, last: '（还没交互）' },

      proto: {
        toggle() {
          this.open = !this.open;
        },
        markOpen() {
          this.last = 'open';
        },
        markClose() {
          this.open = false;
          this.last = 'close';
        },
      },
    });
  </script>
</template>
