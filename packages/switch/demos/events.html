<template component>
  <mc-switch checked on:change="markChange($event)">开启通知</mc-switch>

  <p class="mt-3 text-sm text-muted">最近一次 change：<strong>{{last}}</strong></p>

  <script>
    export default async () => ({
      tag: 'demo-switch-events',

      data: { last: '（还没动过）' },

      proto: {
        /* 载荷是 { checked }：开关只有状态位，没有 value */
        markChange(event) {
          this.last = event.data.checked ? '打开' : '关闭';
        },
      },
    });
  </script>
</template>
