    <section class="doc-demo">

      <p class="doc-hint">

        <code>on:change</code>
        的载荷是
        <code>$event.data</code>
        （
        <code>{ checked, value }</code>
        ）。它不是复选框（要勾多项或半选就用
        <code>mc-checkbox</code>
        ）；
        <code>checked</code>
        是受控 / 运行时状态，只想给**非受控初值**就写
        <code>default-checked</code>
        （挂载读一次，之后不再参与）；要交
        <code>"1"</code>

        <code>"0"</code>

    </section>

      <h3>自定义值</h3>
      <p class="doc-hint">
        给
        <code>checked-value</code>
        与
        <code>unchecked-value</code>
        ：表单收集时开着给前者、关着给后者（不写就是布尔
        <code>true</code>
        /
        <code>false</code>
        ）。这一对专管「这个控件交出什么值」，
        <code>on:change</code>
        的载荷仍是
        <code>{ checked }</code>
        。

        <code>change</code>
        ，载荷
        <code>$event.data.checked</code>

        <code>value</code>

        <code>focus</code>
        /
        <code>blur</code>
        /
        <code>keydown</code>
        这些
        <code>composed</code>
        事件本来就会穿到宿主上（不用组件转发），
        <code>on:focus</code>
        直接写就行 —— 这里演的是组件自己发的那几条。
