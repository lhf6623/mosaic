<!-- mc-card — 内容承载面；设计取舍见 README.md 的「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主盒模型 + 色槽默认值（写在这里，使用者 style="…" 才压得住） */
    :host {
      display: block;
      position: relative; /* 使用者自己铺「整卡可点」那条 ::after 的包含块 —— 对外契约，别删 */
      box-sizing: border-box;
      border: var(--mc-card-border-w) solid rgb(var(--mc-card-border));
      border-radius: var(--mc-radius-lg, var(--mc-def-radius-lg));
      background-color: rgb(var(--mc-card-bg));
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-text-base, var(--mc-def-text-base));
      line-height: var(--mc-text-base-lh, var(--mc-def-text-base-lh));
      color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)));

      --mc-card-bg: var(--mc-color-surface, var(--mc-def-color-surface));
      --mc-card-border: var(--mc-color-border, var(--mc-def-color-border));
      --mc-card-pad: var(--mc-space-4, var(--mc-def-space-4));
      /* 边框宽度单独成变量：使用者的「铺满」伪元素要按它算进去（绝对定位的包含块是内边距盒，inset:0 漏边框） */
      --mc-card-border-w: 1px;
    }

    /* 2. 维度 variant：surface 是默认外观，写在 1 区（:host(:not([variant])) 会静默失效，P14） */
    :host([variant='outline']) {
      background-color: transparent;
    }

    /* 3. 维度 padding：内边距只有一条通道（none / sm / md / lg → 0 / 12 / 16 / 24） */
    :host([padding='none']) {
      --mc-card-pad: 0px;
    }
    :host([padding='sm']) {
      --mc-card-pad: var(--mc-space-3, var(--mc-def-space-3));
    }
    :host([padding='lg']) {
      --mc-card-pad: var(--mc-space-6, var(--mc-def-space-6));
    }

    /* 4. 状态：一个都没有 —— 可点 / 悬停 / 光标都由使用者写在页面 CSS 里，组件接管就成了行为不是面 */

    /* 5. 内部结构。内边距只在 .mc-base 上声明一次：头尾用负外边距贴到边缘、各自带内边距，分隔线因此通长 */
    .mc-base {
      display: block;
      padding: var(--mc-card-pad);
      border-radius: inherit;
    }
    .mc-header,
    .mc-footer {
      display: none; /* 常驻 DOM，有没有内容由宿主属性说话（P10） */
      padding: var(--mc-card-pad);
      margin-inline: calc(var(--mc-card-pad) * -1);
      /* 头尾是通长整条，底色铺到卡片边缘 —— 圆角必须跟着宿主走，否则直角会从圆角里露出来；
         inherit 拿的是 .mc-base 的圆角（它又 inherit 宿主），使用者覆盖宿主时自动跟随 */
      border-radius: inherit;
    }
    :host([data-has-header]) .mc-header {
      display: flex;
      align-items: center;
      gap: var(--mc-space-2, var(--mc-def-space-2));
      margin-block: calc(var(--mc-card-pad) * -1) var(--mc-card-pad);
      border-bottom: 1px solid rgb(var(--mc-card-border));
      border-end-start-radius: 0;
      border-end-end-radius: 0;
    }
    :host([data-has-footer]) .mc-footer {
      display: block;
      margin-block: var(--mc-card-pad) calc(var(--mc-card-pad) * -1);
      border-top: 1px solid rgb(var(--mc-card-border));
      border-start-start-radius: 0;
      border-start-end-radius: 0;
    }
    :host([divider='none']) .mc-header {
      border-bottom-color: transparent;
    }
    :host([divider='none']) .mc-footer {
      border-top-color: transparent;
    }
    .mc-header-main {
      display: block;
      flex: 1 1 auto;
      min-width: 0;
    }
    .mc-header-suffix {
      display: block;
      flex: none;
    }
  </style>

  <div class="mc-base" part="base">
    <div class="mc-header" part="header">
      <span class="mc-header-main"><slot name="header"></slot></span>
      <span class="mc-header-suffix"><slot name="suffix"></slot></span>
    </div>
    <div class="mc-body" part="body"><slot></slot></div>
    <div class="mc-footer" part="footer"><slot name="footer"></slot></div>
  </div>

  <script>
    export default async () => ({
      tag: 'mc-card',

      attrs: {
        variant: 'surface',
        padding: 'md',
        // 头尾分隔线：枚举而不是布尔 —— 默认是「有线」，而 :host(:not([divider])) 会静默失效（P14）
        divider: 'line',
      },

      ready() {
        // 这时 shadow 已建好（同 mc-collapse-item）；宿主属性留到 attached 才写（P31）
        this._slots = [...this.ele.shadowRoot.querySelectorAll('slot')];
      },

      attached() {
        /* 头尾有没有内容只靠 slotchange 判定：分到节点一变就响（往头尾元素内部加东西不算「有内容」，不用盯子树） */
        this._onSlotChange = () => this.applyState();
        for (const slot of this._slots) slot.addEventListener('slotchange', this._onSlotChange);
        this.applyState();
      },

      detached() {
        for (const slot of this._slots) slot.removeEventListener('slotchange', this._onSlotChange);
      },

      proto: {
        applyState() {
          this.mirror(
            'data-has-header',
            this.slotHasContent('header') || this.slotHasContent('suffix'),
          );
          this.mirror('data-has-footer', this.slotHasContent('footer'));
        },

        slotHasContent(name) {
          const slot = this.ele.shadowRoot.querySelector(`slot[name="${name}"]`);
          return (slot?.assignedNodes() ?? []).some(
            (node) => node.nodeType === Node.ELEMENT_NODE || (node.textContent ?? '').trim() !== '',
          );
        },

        mirror(name, on) {
          if (on === this.ele.hasAttribute(name)) return;
          if (on) this.ele.setAttribute(name, '');
          else this.ele.removeAttribute(name);
        },
      },
    });
  </script>
</template>
