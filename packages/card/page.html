      <section class="doc-demo">
        <h3>基本用法</h3>
        <p class="doc-hint">
          头尾写
          <code>slot="header"</code>
          /
          <code>slot="footer"</code>
          ，其余进默认插槽； 头尾各带一条通长分隔线。 整卡可点自己写：给卡内那个元素铺一条伪元素，
          <code>inset</code>
          按
          <code>--mc-card-border-w</code>
          取负值盖住边框那圈，
          <code>cursor</code>
          要显式写。
        </p>
        <doc-playground src="./demos/basic.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>边线</h3>
        <doc-playground src="./demos/sections.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>外观</h3>
        <p class="doc-hint">
          <code>outline</code>
          适合放在已经有底色的容器里（侧栏、弹层内部）。
        </p>
        <doc-playground src="./demos/variants.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>浮动</h3>
        <p class="doc-hint">
          <code>float</code>
          是鼠标移入时的浮起反馈：加一层阴影、移出复原。只改阴影，不改尺寸、不改光标，也不让卡片变成可点击元素。
          阴影走
          <code>--mc-card-shadow</code>
          令牌、暗色下自动换一档；要更轻 / 更重就覆盖它。
        </p>
        <doc-playground src="./demos/float.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>内边距</h3>
        <p class="doc-hint">
          <code>none</code>

          <code>padding="none"</code>
          的整块内容跟着圆角裁，在宿主
          <code>style</code>
          上加
          <code>overflow: hidden</code>
          。
        </p>
