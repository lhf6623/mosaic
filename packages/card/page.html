    <h2>API</h2>

    <p>
      没有 <code>color</code>（容器不是强调元素，要强调覆盖 L3 令牌）、没有

      <code>&lt;a&gt;</code> /
      <code>&lt;button&gt;</code>）由你写在插槽里，想整卡可点见「注意事项」里的配方。
    </p>

    <h2>插槽 / part</h2>
    <table class="doc-table">
      <thead>
        <tr>
          <th>插槽 / part</th>
          <th>说明</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>插槽（默认）</td>
          <td>主体内容</td>
        </tr>
        <tr>
          <td>插槽 <code>header</code> / <code>footer</code></td>
          <td>头尾，各带一条通长分隔线（<code>divider="none"</code> 可关）；没内容时不占地方</td>
        </tr>
        <tr>
          <td>插槽 <code>suffix</code></td>
          <td>头部那一行<strong>贴右边</strong>的附加物（徽标 / 状态 / 小按钮）；有它就等于有头</td>
        </tr>
        <tr>
          <td><code>part="base"</code></td>
          <td>内层盒子：内边距就声明在它上面</td>
        </tr>
        <tr>
          <td><code>part="header"</code> / <code>"body"</code> / <code>"footer"</code></td>
          <td>头 / 正文 / 尾三块，头尾是贴到卡片边缘的一整条（可以换底色）</td>
        </tr>
      </tbody>
    </table>

    <h2>定制：L3 令牌 + <code>::part()</code></h2>
    <table class="doc-table">
      <thead>
        <tr>
          <th>令牌</th>
          <th>默认</th>
          <th>作用</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><code>--mc-card-bg</code></td>
          <td><code>--mc-color-surface</code></td>
          <td>卡片底色（<code>outline</code> 下不生效，那是透明）</td>
        </tr>
        <tr>
          <td><code>--mc-card-border</code></td>
          <td><code>--mc-color-border</code></td>
          <td>外框与头尾分隔线的颜色</td>
        </tr>
        <tr>
          <td><code>--mc-card-pad</code></td>
          <td><code>--mc-space-4</code></td>
          <td>内边距（<code>padding</code> 属性改的就是它）</td>
        </tr>
        <tr>
          <td><code>--mc-card-border-w</code></td>
          <td><code>1px</code></td>
          <td>边框宽度（自己铺「整卡可点」时按它算 <code>inset</code>）</td>
        </tr>
      </tbody>
    </table>

    <h2>注意事项</h2>
    <ul>
      <li>
        <strong>卡内要放操作就写原生元素</strong>：<code>&lt;a href&gt;</code> /
        <code>&lt;button&gt;</code> 直接写在插槽里（一般放 <code>slot="footer"</code> 或
        <code>slot="suffix"</code>）；站内链接照旧写 <code>olink</code>。
      </li>
      <li>
        <strong>整卡可点自己写</strong>（组件不接管）。宿主是 <code>position: relative</code>，
        给卡内那个元素铺一条伪元素就行：
        <code
          >a::after { content: ''; position: absolute; inset: calc(var(--mc-card-border-w) * -1);
          cursor: pointer; }</code
        >
        —— <code>inset</code> 取<strong>负的边框宽度</strong>，否则卡片最外那 1px 点不动；
        <code>cursor</code> 要显式写，否则 WebKit 上光标不变手型；悬停<strong
          >不要给卡片加位移</strong
        >
        （指针会在边缘来回进出，表现为抖）。
      </li>
      <li><strong>卡片不留页面 reset</strong>：卡内元素的默认外边距照旧，要归零自己写。</li>
      <li>
        <strong>头尾是通长的整条</strong>：底色 / 边框色写在
        <code>::part(header)</code> 上都是整条生效； 想给头尾单独加内边距也用
        part（插槽元素被包在内边距里）。头尾外侧的圆角跟着宿主走， 卡片改成大圆角也不会露出直角。
      </li>
      <li>
        <strong>圆角不裁内容</strong>：卡里故意溢出的东西（浮层、贴边徽标）不会被切掉；要让图片或
        <code>padding="none"</code> 的整块内容跟着圆角裁，在宿主 <code>style</code> 上加
        <code>overflow: hidden</code>。
      </li>
      <li>
        卡片不投影，层级靠底色明度差（见设计令牌一节）；要更「浮」就在宿主 <code>style</code> 上加
        <code>box-shadow</code>。
      </li>
      <li>
        <code>padding="none"</code> 时它就是个纯盒子，内边距自己给；需要结构化的内边距用
        <code>::part(base)</code>。
      </li>
    </ul>
