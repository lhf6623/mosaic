    <h2>注意事项</h2>
    <ul>
      <li>
        <strong>卡内要放操作就写原生元素</strong>：<code>&lt;a href&gt;</code> /
        <code>&lt;button&gt;</code> 直接写在插槽里（一般放 <code>slot="footer"</code> 或
        <code>slot="suffix"</code>）；站内链接照旧写 <code>olink</code>。
      </li>
      <li>
        <strong>整卡可点自己写</strong>（组件不接管）。宿主是 <code>position: relative</code>，
        给卡内那个元素铺一条伪元素就行：
        <code
          >a::after { content: ''; position: absolute; inset: calc(var(--mc-card-border-w) * -1);
          cursor: pointer; }</code
        >
        —— <code>inset</code> 取<strong>负的边框宽度</strong>，否则卡片最外那 1px 点不动；
        <code>cursor</code> 要显式写，否则 WebKit 上光标不变手型；悬停<strong
          >不要给卡片加位移</strong
        >
        （指针会在边缘来回进出，表现为抖）。
      </li>
      <li><strong>卡片不留页面 reset</strong>：卡内元素的默认外边距照旧，要归零自己写。</li>
      <li>
        <strong>头尾是通长的整条</strong>：底色 / 边框色写在
        <code>::part(header)</code> 上都是整条生效； 想给头尾单独加内边距也用
        part（插槽元素被包在内边距里）。头尾外侧的圆角跟着宿主走， 卡片改成大圆角也不会露出直角。
      </li>
      <li>
        <strong>圆角不裁内容</strong>：卡里故意溢出的东西（浮层、贴边徽标）不会被切掉；要让图片或
        <code>padding="none"</code> 的整块内容跟着圆角裁，在宿主 <code>style</code> 上加
        <code>overflow: hidden</code>。
      </li>
      <li>
        卡片不投影，层级靠底色明度差（见设计令牌一节）；要更「浮」就在宿主 <code>style</code> 上加
        <code>box-shadow</code>。
      </li>
      <li>
        <code>padding="none"</code> 时它就是个纯盒子，内边距自己给；需要结构化的内边距用
        <code>::part(base)</code>。
      </li>
    </ul>
