<!-- mc-icon — 图标；图形槽由模板渲染；本地命中用一次性探针节点量 CSS、远程 SVG 是行为层例外（见 probe / load 注释）；设计取舍见 README.md「设计取舍」。 -->

<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <link rel="stylesheet" href="../icon/icons.generated.css" />
  <style>
    :host {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      /* 图标盒子恒为 1em，于是 font-size 是唯一的尺寸入口（令牌供数字 size 写 px） */
      font-size: var(--mc-icon-size);
      --mc-icon-size: 1em;
      line-height: 0;
      vertical-align: middle;
      /* ⚠️ 必须显式 inherit：shadow-base.css 的 reset 把宿主色钉成 --mc-color-fg，会掐断颜色继承 —— 图标进别的 shadow root 就拿到 fg 而非周围文字色；本 style 未分层、赢过 reset 的 @layer，所以这一行能拿回继承（font-size 同理） */
      color: inherit;
    }

    /* ---------- 尺寸：只改 font-size ---------- */
    :host([size='sm']) {
      --mc-icon-size: 0.875em;
    }
    :host([size='md']) {
      --mc-icon-size: 1em;
    }
    :host([size='lg']) {
      --mc-icon-size: 1.25em;
    }

    /* ---------- 语义色：只往 currentColor 里填值 ---------- */
    :host([color='primary']) {
      color: rgb(var(--mc-color-primary, var(--mc-def-color-primary)));
    }
    :host([color='info']) {
      color: rgb(var(--mc-color-info, var(--mc-def-color-info)));
    }
    :host([color='success']) {
      color: rgb(var(--mc-color-success, var(--mc-def-color-success)));
    }
    :host([color='warning']) {
      color: rgb(var(--mc-color-warning, var(--mc-def-color-warning)));
    }
    :host([color='danger']) {
      color: rgb(var(--mc-color-danger, var(--mc-def-color-danger)));
    }
    /* 中性 = 次要文字色：落在卡片 / 页面上用 muted 前景才对得上 */
    :host([color='neutral']) {
      color: rgb(var(--mc-color-fg-muted, var(--mc-def-color-fg-muted)));
    }

    /* 图形槽。min-* 让「取不到图标」时也占住 1em，不留空洞、不跳版；background-color 刻意不写在这儿 —— 那是内置图标类（.mc-icon-*）的职责，写这儿会给远程品牌多色图标加一个纯色底。 */
    .mc-glyph {
      display: inline-flex;
      min-width: 1em;
      min-height: 1em;
      line-height: 0;
    }
    .mc-glyph > svg {
      display: block;
    }
  </style>

  <!-- 图形槽：内置图标的类名（.mc-icon-* mask 规则）与取回的远程 SVG 都走模板绑定；
       脚本只负责取内容 / 探测本地命中（探针是隐藏的一次性节点，见 probe；远程 SVG 的例外见 load）。 -->
  <span attr:class="glyphClass" :html="glyphHtml" part="glyph"></span>
  <slot></slot>

  <script>
    /* color 也收 hex：图标没有色槽，color 直接是前景色，所以用 fg 模式；'current' 是语义取值，交给 CSS */
    import { colorAttr, FG_NAMES } from '../boot/color-attr.js';

    const color = colorAttr({ mode: 'fg', names: FG_NAMES });

    /* 与 tools/icon-manifest.mjs 的 ICON_SOURCE 保持一致：裸名远程回退时用它当集名 */
    const DEFAULT_SET = 'lucide';
    const DEFAULT_BASE = 'https://api.iconify.design/';

    /** url → Promise<string|null>：同一个图标全页只取一次；失败也记着（不重试、不刷屏） */
    const SOURCES = new Map();
    /** `${集}|${名字}` → 类名 | false：本地命中判定，每个名字只探一次 */
    const LOCAL = new Map();
    /** 探测时样式表还没到的哨兵值 —— 这种结论不确定，不写进缓存 */
    const UNKNOWN = Symbol('unknown');
    const warned = new Set();

    function warn(message) {
      if (warned.has(message)) return;
      warned.add(message);
      console.warn(`[mosaic] ${message}`);
    }

    /** 拆名字：'mdi:home' → ['mdi','home']；'search' → ['','search']；多段只取后两段 */
    function splitName(value) {
      const parts = value.split(':');
      const icon = parts.pop() ?? '';
      const set = parts.pop() ?? '';
      return [set, icon];
    }

    /** 归一化取回来的 svg：高度钉 1em、宽度按 viewBox 比例。不能无脑 width=height=1em —— Iconify 对非方形图标会给出 width="1.16em" height="1em"，强行拉成正方形会把品牌图拉变形。 */
    function normalize(svg) {
      const box = (svg.getAttribute('viewBox') ?? '')
        .trim()
        .split(/[\s,]+/)
        .map(Number);
      const width = box[2];
      const height = box[3];
      if (box.length === 4 && width > 0 && height > 0) {
        svg.setAttribute('height', '1em');
        svg.setAttribute('width', `${(width / height).toFixed(4)}em`);
      } else {
        svg.setAttribute('width', '1em');
        svg.setAttribute('height', '1em');
      }
      svg.removeAttribute('style');
      return svg;
    }

    export default async () => ({
      tag: 'mc-icon',

      attrs: {
        name: '',
        /** 直接给一个 SVG 地址（相对路径按页面解析）；给了它就不再查本地 */
        src: '',
        size: 'md',
        /* 默认 current：图标 95% 是装饰，强制默认语义色会让所有内联图标变色 */
        color: 'current',
        iconBase: '',
        iconSet: '',
      },

      /* 图形槽的渲染输入（模板 <span attr:class="glyphClass" :html="glyphHtml">）：
         内置图标 = 一条 .mc-icon-* mask 规则的类名；远程 / src = 取回并正规化后的 SVG 文本。
         脚本不造节点，只改这两个字段（例外：probe 用一次性探针节点量 CSS，见那里） */
      data: {
        glyphClass: 'mc-glyph',
        glyphHtml: '',
      },

      ready() {
        /* 行为层只拿元素引用（ofa 包装对象用 .ele 取原生）；图形槽内容由上面的模板字段渲染 */
        this._glyph = this.shadow.$('.mc-glyph')?.ele ?? null;
        this._slot = this.shadow.$('slot:not([name])') ?? null;
        this._sequence = 0;
      },

      attached() {
        // 宿主 style 等构造期结束再写（P31），color 的首次同步在这里
        color.sync(this.ele, this.color);
        this._live = true;
        this.applySize();
        this._onSlotChange = () => this.paint();
        this._slot?.on('slotchange', this._onSlotChange);
        this.paint();
      },

      detached() {
        this._live = false;
        this._slot?.off('slotchange', this._onSlotChange);
      },

      watch: {
        // watch 在构造期也会触发一次，那时 ready 还没跑 —— paint 自己守卫
        name() {
          this.paint();
        },
        // color 收 hex：首次触发落在构造期（P5），跳过由 colorAttr 内部处理
        color(value) {
          color.change(this.ele, value);
        },
        src() {
          this.paint();
        },
        // size 收纯数字：按 px 写 --mc-icon-size，sm / md / lg 仍交给 CSS
        size() {
          this.applySize();
        },
      },

      proto: {
        /**
         * 数字 size 按 px 写宿主上的 --mc-icon-size（三档仍是 em，交给 CSS）。
         * 只删自己写过的那一次 —— 使用者手写的同名令牌不能被 size="md" 抹掉（同 mc-avatar）。
         */
        applySize() {
          if (!this._live) return;
          const raw = String(this.ele.getAttribute('size') ?? '').trim();
          const px = /^(?:[0-9]+(?:\.[0-9]+)?|\.[0-9]+)$/.test(raw) ? raw + 'px' : '';
          if (px) {
            this.ele.style.setProperty('--mc-icon-size', px);
            this._sizePx = true;
          } else if (this._sizePx) {
            this.ele.style.removeProperty('--mc-icon-size');
            this._sizePx = false;
          }
        },

        setName() {
          return (this.iconSet || '').trim() || DEFAULT_SET;
        },

        base() {
          return ((this.iconBase || '').trim() || DEFAULT_BASE).replace(/\/?$/, '/');
        },

        slotHasContent() {
          return (this._slot?.ele?.assignedNodes() ?? []).some(
            (node) => node.nodeType === Node.ELEMENT_NODE || (node.textContent ?? '').trim() !== '',
          );
        },

        /** 唯一入口：插槽 > src > name（先本地、再远程）；属性一变就走这里，用序号作废过期的那一轮 */
        async paint() {
          if (!this._glyph || !this._live) return;
          const sequence = ++this._sequence;

          /* 每次重画先把图形槽清回空位：模板 :html 落空串、类名回 .mc-glyph */
          this.glyphClass = 'mc-glyph';
          this.glyphHtml = '';

          if (this.slotHasContent()) return;

          const src = (this.src || '').trim();
          if (src) {
            await this.load(src, sequence);
            return;
          }

          const name = (this.name || '').trim().toLowerCase();
          if (!name) return; // 名字为空：留一个 1em 空位，不跳版

          const local = await this.localClass(name);
          if (sequence !== this._sequence) return;
          if (local) {
            this.glyphClass = `mc-glyph ${local}`;
            return;
          }

          const [set, icon] = splitName(name);
          await this.load(`${this.base()}${set || this.setName()}/${icon}.svg`, sequence);
        },

        async localClass(name) {
          const key = `${this.setName()}|${name}`;
          const cached = LOCAL.get(key);
          if (cached !== undefined) return cached === false ? null : cached;
          const result = await this.probe(name);
          if (result !== UNKNOWN) LOCAL.set(key, result === null ? false : result);
          return result === UNKNOWN ? null : result;
        },

        /** 挂上类名 → 问 CSS。⚠️ 图标样式表是组件自己 <link> 进 shadow root 的、**异步**到达，没到位时 maskImage 同样是 none，必须等可读才能下结论；集名等于内置来源集时退化成裸名再探一次。 */
        async probe(name) {
          const root = this.ele.shadowRoot;
          const [prefix, icon] = splitName(name);
          const candidates = [`mc-icon-${prefix ? `${prefix}-${icon}` : icon}`];
          if (prefix && prefix === this.setName()) candidates.push(`mc-icon-${icon}`);

          /* 行为层例外（量 CSS）：用**一次性探针节点**问 getComputedStyle，而不是给模板里的图形槽挂类名——
             图形槽的类名是模板绑定（attr:class），运行时改名的同一拍 ofa 会异步重渲染，探针类名会被
             `glyphClass` 盖回去，本地图标偶发误判成「没有」、白跑一次远程（静态首屏正常，运行时改名必现）。
             探针只量 mask、立即移除，不进可见结构。 */
          const probeEl = document.createElement('span');
          probeEl.className = 'mc-glyph';
          probeEl.style.cssText =
            'position:absolute;width:0;height:0;visibility:hidden;pointer-events:none';
          root.appendChild(probeEl);
          try {
            if (!(await this.sheetsReady(root))) return UNKNOWN;
            for (const cls of candidates) {
              probeEl.className = `mc-glyph ${cls}`;
              const style = getComputedStyle(probeEl);
              const mask = style.maskImage || style.webkitMaskImage || 'none';
              if (mask !== 'none') return cls;
            }
            return null;
          } finally {
            probeEl.remove();
          }
        },

        /** 就绪门：等那几张样式表真的可读再探，**走 link 的 load / error 事件**，不用 rAF 轮询 —— 后台页面里 rAF 会被节流甚至不触发，实测在录制模式下因此误判过一次。 */
        async sheetsReady(root) {
          const links = [...root.querySelectorAll('link[rel="stylesheet"]')];
          /* 兜底：没有 <link>（被别处 adopt 的场合）仍旧看 adoptedStyleSheets */
          if (!links.length) return root.adoptedStyleSheets.length > 0;
          const ready = (link) => {
            try {
              return !!link.sheet && link.sheet.cssRules.length > 0;
            } catch {
              return false;
            }
          };
          if (links.every(ready)) return true;
          await Promise.all(
            links.map(
              (link) =>
                new Promise((resolve) => {
                  if (ready(link)) return resolve();
                  link.addEventListener('load', resolve, { once: true });
                  link.addEventListener('error', resolve, { once: true });
                  setTimeout(resolve, 2000); // 事件已错过 / 网络卡住时的兜底
                }),
            ),
          );
          return links.every(ready);
        },

        /** 取回来内联成 <svg>。失败只留空位 + 一条警告，不影响排版（与 mc-code 的高亮降级同级） */
        async load(url, sequence) {
          let href;
          try {
            href = new URL(url, document.baseURI).href;
          } catch {
            warn(`图标地址不合法：${url}`);
            return;
          }

          if (!SOURCES.has(href)) {
            SOURCES.set(
              href,
              fetch(href)
                .then((res) =>
                  res.ok ? res.text() : Promise.reject(new Error(`HTTP ${res.status}`)),
                )
                .catch((err) => {
                  warn(`图标取不到：${href}（${err?.message ?? err}）`);
                  return null;
                }),
            );
          }

          const text = await SOURCES.get(href);
          if (sequence !== this._sequence || !text) return;

          /* 行为层例外（第三方内容）：远程 / src 图标是运行时取回的 SVG，源码里不写内联 SVG 标记
             （README「设计取舍」）；正规化后只把字符串交给模板的 :html 落 DOM，脚本不 append 节点。 */
          const parsed = new DOMParser().parseFromString(text, 'image/svg+xml');
          const svg = parsed?.documentElement;
          if (!svg || svg.nodeName !== 'svg') {
            warn(`图标不是合法的 SVG：${href}`);
            return;
          }
          this.glyphHtml = normalize(svg).outerHTML;
        },
      },
    });
  </script>
</template>
