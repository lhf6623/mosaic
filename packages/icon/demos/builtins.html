        <button type="button" class="inline-flex items-center gap-2 rounded-md px-2 py-1 text-sm cursor-pointer border-0 bg-transparent text-muted hover:bg-surface-sunken text-left" data-name="youtube" on:click="copy">
          <mc-icon name="youtube" class="text-lg"></mc-icon>youtube
        </button>
        <button type="button" class="inline-flex items-center gap-2 rounded-md px-2 py-1 text-sm cursor-pointer border-0 bg-transparent text-muted hover:bg-surface-sunken text-left" data-name="x" on:click="copy">
          <mc-icon name="x" class="text-lg"></mc-icon>x
        </button>
      </div>
    </div>
  </div>

  <script>
    /* 复制成功与否用 message 报一次 —— 顺带是 message 的真实用法示例：
       导入 → 直接调用，容器由它自己懒挂到 body 上，页面不用写任何标签。 */
    import message from '../../message/message.js';

    export default async () => ({
      tag: 'demo-icon-builtins',

      proto: {
        /* 复制 name 并提示。name 由按钮的 data-name 带过来，不读按钮文字 ——
           以后按钮里加装饰也不会跟着漂。
           ⚠️ on:click 只能写「无参」的方法名：ofa 的 on: 解析器不吃带逗号 / 引号的表达式，
           写 copy('x', $event) 会直接「模板语法'on'报错」、整块渲染失败。 */
        async copy(event) {
          const name = event.target.closest('button')?.dataset.name;
          if (!name) return;

          let done = false;
          try {
            await navigator.clipboard.writeText(name);
            done = true;
          } catch {
            // 非安全上下文 / 没授权：退回 execCommand
            const ta = document.createElement('textarea');
            ta.value = name;
            document.body.append(ta);
            ta.select();
            done = document.execCommand('copy');
            ta.remove();
          }

          /* 提示里带上名字：读者不用回头看按钮就知道复制了什么（名字是代码值，用全角冒号隔开） */
          if (done) message.success(`已复制：${name}`);
          else message.error(`复制失败（当前环境不允许）：${name}`);
        },
      },
    });
  </script>
</template>
