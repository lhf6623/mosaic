<template component>
  <div class="flex flex-col gap-3">
    <mc-checkbox value="terms" on:change="onChange($event)">同意用户协议</mc-checkbox>
    <mc-checkbox value="email" on:change="onChange($event)">接收邮件通知</mc-checkbox>
  </div>

  <p class="mt-3 text-sm text-muted">最近一次 change：<strong>{{last}}</strong></p>

  <script>
    export default async () => ({
      tag: 'demo-checkbox-events',

      data: {
        last: '（还没交互）',
      },

      proto: {
        /* 钩子与文案点一下都会发：点文案算切换选中，点里面的链接则只跳转 */
        onChange(event) {
          this.last = `${event.data.value} → ${event.data.checked ? '选中' : '取消'}`;
        },
      },
    });
  </script>
</template>
