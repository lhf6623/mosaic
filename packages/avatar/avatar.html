<!-- mc-avatar — 头像；设计取舍见 README.md「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主 = 头像盒子：圆形 / 圆角方块，尺寸走自己的 --mc-avatar-size（头像不是控件，不借控件高） */
    :host {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      flex: none; /* 在 flex 行里不能被同桌的贪婪兄弟挤扁 */
      vertical-align: middle;
      overflow: hidden; /* 图片裁到圆角里 */
      user-select: none;
      width: var(--mc-avatar-size);
      height: var(--mc-avatar-size);
      border-radius: var(--mc-avatar-radius);
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
      /* 兜底色槽：默认中性（浅沉底 + 次要文字色），语义色只改这两个槽 */
      background-color: rgb(var(--mc-avatar-subtle-fill));
      color: rgb(var(--mc-avatar-accent));

      /* L3 组件令牌 */
      --mc-avatar-size: 2rem;
      --mc-avatar-radius: var(--mc-radius-full, var(--mc-def-radius-full));
      --mc-avatar-font: calc(var(--mc-avatar-size) * 0.4);
      --mc-avatar-subtle-fill: var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken));
      --mc-avatar-accent: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
    }

    /* 2. 尺寸三档：24 / 32 / 40px；更大的尺寸覆盖 --mc-avatar-size 即可 */
    :host([size='sm']) {
      --mc-avatar-size: 1.5rem;
    }
    :host([size='lg']) {
      --mc-avatar-size: 2.5rem;
    }

    /* 3. 形状：默认正圆；square 只换圆角 */
    :host([shape='square']) {
      --mc-avatar-radius: var(--mc-radius-md, var(--mc-def-radius-md));
    }

    /* 4. 语义色：只往兜底的两个色槽里填值（neutral 是默认，写在上面） */
    :host([color='primary']) {
      --mc-avatar-subtle-fill: var(--mc-color-primary-subtle, var(--mc-def-color-primary-subtle));
      --mc-avatar-accent: var(--mc-color-primary, var(--mc-def-color-primary));
    }
    :host([color='info']) {
      --mc-avatar-subtle-fill: var(--mc-color-info-subtle, var(--mc-def-color-info-subtle));
      --mc-avatar-accent: var(--mc-color-info, var(--mc-def-color-info));
    }
    :host([color='success']) {
      --mc-avatar-subtle-fill: var(--mc-color-success-subtle, var(--mc-def-color-success-subtle));
      --mc-avatar-accent: var(--mc-color-success, var(--mc-def-color-success));
    }
    :host([color='warning']) {
      --mc-avatar-subtle-fill: var(--mc-color-warning-subtle, var(--mc-def-color-warning-subtle));
      --mc-avatar-accent: var(--mc-color-warning, var(--mc-def-color-warning));
    }
    :host([color='danger']) {
      --mc-avatar-subtle-fill: var(--mc-color-danger-subtle, var(--mc-def-color-danger-subtle));
      --mc-avatar-accent: var(--mc-color-danger, var(--mc-def-color-danger));
    }

    /* 5. 图片与兜底叠在同一格里：图片没就绪 / 失败时兜底顶上，就绪后整块换成图片 */
    .mc-image {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    :host([data-has-image]) .mc-image {
      display: block;
    }

    .mc-fallback {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      font-size: var(--mc-avatar-font);
      line-height: 1;
      white-space: nowrap;
    }
    :host([data-has-image]) .mc-fallback {
      display: none;
    }

    /* 首字母只在「默认插槽没给自定义兜底内容」时出现（data-has-fallback 由脚本镜像，P32） */
    .mc-initials {
      display: inline;
    }
    :host([data-has-fallback]) .mc-initials {
      display: none;
    }
    ::slotted(*) {
      max-width: 100%;
      max-height: 100%;
    }
  </style>

  <img class="mc-image" alt="" />
  <span class="mc-fallback">
    <span class="mc-initials"></span>
    <slot></slot>
  </span>

  <script>
    /* color 也收 hex：只影响兜底的浅底与文字色（图片会盖住，不参与） */
    import { colorAttr } from '../boot/color-attr.js';

    const color = colorAttr({ slots: ['subtle-fill', 'accent'] });

    export default async () => ({
      tag: 'mc-avatar',

      attrs: {
        src: '',
        alt: '',
        name: '',
        // 三档 sm / md / lg；纯数字按 px（如 size="48"），由 applySize 写宿主变量
        size: 'md',
        shape: 'circle',
        // 兜底色：neutral 是默认（中性底 + 次要文字色）
        color: 'neutral',
      },

      ready() {
        // 这里 shadow 已建好；行为层只拿引用（ofa 包装对象，原生属性 / 方法走 .ele），结构全在模板里
        this._image = this.shadow.$('.mc-image');
        this._initials = this.shadow.$('.mc-initials');
        this._slot = this.shadow.$('slot');
      },

      attached() {
        this._live = true;
        // 宿主 style 等构造期结束再写（P31），color 的首次同步在这里
        color.sync(this.ele, this.color);
        this.applySize();

        this._onLoad = () => this.mirror('data-has-image', true);
        this._onError = () => this.mirror('data-has-image', false);
        this._image?.on('load', this._onLoad);
        this._image?.on('error', this._onError);

        this._onSlotChange = () => this.applyFallback();
        this._slot?.on('slotchange', this._onSlotChange);

        this.applyImage();
        this.applyFallback();
      },

      detached() {
        this._image?.off('load', this._onLoad);
        this._image?.off('error', this._onError);
        this._slot?.off('slotchange', this._onSlotChange);
      },

      watch: {
        // 首次触发落在构造期（P5），跳过由 colorAttr 内部处理
        color(value) {
          color.change(this.ele, value);
        },
        src() {
          this.applyImage();
        },
        alt() {
          this.applyImage();
        },
        name() {
          this.applyFallback();
          this.applyImage(); // alt 没写时跟 name 走
        },
        size() {
          this.applySize();
        },
      },

      proto: {
        /**
         * 三档交给 CSS；纯数字按 px 写宿主变量（同 mc-space / mc-grid 的 gap 通道）。
         * 只删自己写过的那一次 —— 使用者手写的 --mc-avatar-size 不能被 size="md" 抹掉。
         */
        applySize() {
          if (!this._live) return;
          const raw = String(this.ele.getAttribute('size') ?? '').trim();
          const px = /^(?:[0-9]+(?:\.[0-9]+)?|\.[0-9]+)$/.test(raw) ? raw + 'px' : '';
          if (px) {
            this.ele.style.setProperty('--mc-avatar-size', px);
            this._sizePx = true;
          } else if (this._sizePx) {
            this.ele.style.removeProperty('--mc-avatar-size');
            this._sizePx = false;
          }
        },

        /** src / alt → <img>；换地址时先撤掉 data-has-image，让兜底顶到加载完成（或失败） */
        applyImage() {
          if (!this._live || !this._image) return;
          const el = this.ele;
          const src = (el.getAttribute('src') ?? '').trim();
          const alt =
            (el.getAttribute('alt') ?? '').trim() || (el.getAttribute('name') ?? '').trim();
          const img = this._image.ele;
          img.alt = alt;

          const previous = img.getAttribute('src') ?? '';
          if (src === previous) return;

          this.mirror('data-has-image', false);
          if (!src) {
            img.removeAttribute('src');
            return;
          }
          img.setAttribute('src', src);
        },

        /** name → 首字母 / 首字；默认插槽有没有内容是另一条状态（data-has-fallback） */
        applyFallback() {
          if (!this._live || !this._initials) return;
          this._initials.text = this.initials(this.ele.getAttribute('name') ?? '');
          const has = (this._slot?.ele?.assignedNodes() ?? []).some(
            (node) => node.nodeType === Node.ELEMENT_NODE || (node.textContent ?? '').trim() !== '',
          );
          this.mirror('data-has-fallback', has);
        },

        /** 中文等非拉丁名取第一个字；拉丁名取前两个词的首字母（最多两个，大写） */
        initials(rawName) {
          const name = String(rawName ?? '').trim();
          if (!name) return '';
          const chars = Array.from(name);
          const first = chars[0] ?? '';
          if (!/^[A-Za-z]$/.test(first)) return first;
          const words = name.split(' ').filter((word) => word.trim() !== '');
          return words
            .slice(0, 2)
            .map((word) => Array.from(word)[0] ?? '')
            .join('')
            .toUpperCase();
        },

        /** 宿主属性即状态：值没变就不写（P31：只有挂载后才会调到这里） */
        mirror(name, on) {
          if (!this._live) return;
          if (on === this.ele.hasAttribute(name)) return;
          if (on) this.ele.setAttribute(name, '');
          else this.ele.removeAttribute(name);
        },
      },
    });
  </script>
</template>
