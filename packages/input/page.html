    </p>
    <mc-alert class="doc-notes" color="warning" icon heading="注意事项">
      <ul>
        <li>

          <code>value="…"</code> 不生效 —— 初始值用 <code>default-value</code>，运行时改值写
          <code>el.value = '…'</code>。
        </li>
        <li>
          <strong>事件里读 <code>$event.data.value</code></strong
          >：<code>input</code> 与 <code>change</code> 都带 <code>data</code>，原生那条不带头 载荷的
          <code>input</code> 已被组件拦掉，不会收到两次。
        </li>
        <li>
          <strong>不参与原生 <code>&lt;form&gt;</code> 提交</strong>：shadow 里的原生控件不在表单的
          提交范围内，<code>name</code> 只是转发给内部控件 —— 提交时自己取 <code>el.value</code>。
        </li>
      </ul>
    </mc-alert>
