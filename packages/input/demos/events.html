<template component>
  <mc-input
    clearable
    default-value="改改我"
    placeholder="打字 / 失焦 / 点 ×"
    on:input="markInput($event)"
    on:change="markChange($event)"
    on:clear="markClear()"
  ></mc-input>

  <p class="mt-3 text-sm text-muted">最近一次事件：<strong>{{last}}</strong></p>

  <script>
    export default async () => ({
      tag: 'demo-input-events',

      data: { last: '（还没动过）' },

      proto: {
        /* input 每打一个字都发；change 在失焦 / 回车时发；clear 之后还会补发这两个 */
        markInput(event) {
          this.last = `input → ${event.data.value}`;
        },
        markChange(event) {
          this.last = `change → ${event.data.value}`;
        },
        markClear() {
          this.last = 'clear（值已清空，随后补发 input 与 change）';
        },
      },
    });
  </script>
</template>
