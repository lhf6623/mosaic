<template component>
  <div class="flex flex-col gap-3">
    <!-- 双向：打字会写回 data 里的 form.name -->
    <mc-input sync:value="form.name" clearable></mc-input>
    <!-- 单向：只跟随数据，打字不回写 -->
    <mc-input :value="form.name" placeholder="单向绑定（打字不回写）"></mc-input>
    <mc-button size="sm" variant="outline" on:click="rename()">把数据改成「李四」</mc-button>
  </div>

  <p class="mt-3 text-sm text-muted">
    data 里的 form.name：
    <strong>{{form.name}}</strong>
  </p>

  <script>
    export default async () => ({
      tag: 'demo-input-binding',

      data: { form: { name: '张三' } },

      proto: {
        rename() {
          this.form.name = '李四';
        },
      },
    });
  </script>
</template>
