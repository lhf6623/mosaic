<!-- mc-loading-bar — 加载条。设计取舍见同目录 README.md 的「设计取舍」；本文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主 = 一条轨道。状态只有一个入口：`state` 属性，视觉全由它派生。 */
    :host {
      position: fixed;
      inset-inline: 0;
      top: 0;
      z-index: var(--mc-loading-bar-z, var(--mc-def-z-toast));
      display: block;
      box-sizing: border-box;
      height: 4px;
      background-color: var(--mc-loading-bar-track, transparent);
      /* ⚠️ 必须 none：默认那种横跨视口顶部，不写会挡住顶栏 / 弹层 / 按钮的点击 */
      pointer-events: none;
      /* 不出现是默认姿态：收尾靠 fade 走到 opacity 0 并停住 */
      visibility: hidden;
      opacity: 0;

      /* L3 色槽：默认取主题色，要换就覆盖这个令牌 */
      --mc-loading-bar-fill: var(--mc-color-primary, var(--mc-def-color-primary));
      /* 出错那一下的色：主题的 danger */
      --mc-loading-bar-error: var(--mc-color-danger, var(--mc-def-color-danger));
      /* 时长走 --mc-duration-*：写死秒数会让「减弱动效」静默失效 */
      --mc-loading-bar-creep: calc(var(--mc-duration-slow, var(--mc-def-duration-slow)) * 24);
      --mc-loading-bar-finish: calc(var(--mc-duration-base, var(--mc-def-duration-base)) * 1.2);
      --mc-loading-bar-fade: calc(var(--mc-duration-slow, var(--mc-def-duration-slow)) * 1.2);
      /* 爬升的终点：到不了 100% 才像「还在跑」 */
      --mc-loading-bar-reach: 90%;
    }

    /* 2. 维度一 state（idle 不用写规则，默认就是 :host 那副样子） */
    :host([state='loading']),
    :host([state='done']),
    :host([state='error']) {
      visibility: visible;
      opacity: 1;
    }

    /* 3. 出错：只换色槽 —— 没有 color 维度，改颜色走令牌 */
    :host([state='error']) {
      --mc-loading-bar-fill: var(--mc-loading-bar-error);
    }

    /* 4. 维度二 size：它不是控件，不借 --mc-control-h-*（同 mc-progress） */
    :host([size='sm']) {
      height: 2px;
    }

    /* 5. 维度三 position：static = 就在所在容器里占自己那 2~4px */
    :host([position='static']) {
      position: static;
    }

    /* 6. 填充条：宽度就是进度 */
    .mc-bar {
      height: 100%;
      width: 0;
      background-color: rgb(var(--mc-loading-bar-fill));
    }

    /* 7. 在跑：一条长缓出从 0 爬向 reach。⚠️ 用 transition 而不是 animation：中途被打断时下一条会从当前值接着走，收尾天然不闪回 0 */
    :host([state='loading']) .mc-bar {
      width: var(--mc-loading-bar-reach);
      transition: width var(--mc-loading-bar-creep) cubic-bezier(0.1, 0.6, 0.2, 1);
    }

    /* 8. 收尾：成功与出错走同一条路，只有色槽不同；淡出必须延迟同样时长，同时开始会在半路就淡没 */
    :host([state='done']) .mc-bar,
    :host([state='error']) .mc-bar {
      width: 100%;
      transition: width var(--mc-loading-bar-finish) ease-out;
    }
    :host([state='done']),
    :host([state='error']) {
      animation: mc-loading-bar-fade var(--mc-loading-bar-fade) linear var(--mc-loading-bar-finish)
        forwards;
    }

    @keyframes mc-loading-bar-fade {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }
  </style>

  <div class="mc-bar" part="bar"></div>

  <script>
    const RUNNING = 'loading';

    export default async () => ({
      tag: 'mc-loading-bar',

      attrs: {
        /* 状态：唯一入口。idle 不出现；loading 爬升；done / error 收尾，只差填充色 */
        state: 'idle',
        size: 'md',
        /** 钉在哪儿：fixed = 视口顶部（全局在忙）；static = 就在所在容器里 */
        position: 'fixed',
      },

      attached() {
        this._live = true;
        this.syncState();
      },

      watch: {
        // watch 在构造期也会触发（P5），_live 守卫把它挡在挂载前
        state() {
          if (this._live) this.syncState();
        },
      },

      proto: {
        /**
         * 样式全由 `[state]` 驱动，脚本只补一件 CSS 做不到的事：进 loading 时把上一轮留下的宽度
         * 瞬间归零再重新爬（不归零会从 100% 往回滑）。
         */
        syncState() {
          const bar = this.bar();
          if (!bar) return;
          if (this.state === RUNNING) this.restartCreep(bar);
        },

        /** 让爬升从 0 开始：先关掉 transition 把宽度按到 0，再交回 CSS（目标 = reach） */
        restartCreep(bar) {
          bar.style.transition = 'none';
          bar.style.width = '0';
          void bar.offsetWidth; // 强制回流：让「归零」这件事先落下去
          bar.style.transition = '';
          bar.style.width = '';
        },

        /** 内部那条填充 */
        bar() {
          return this.ele.shadowRoot?.querySelector('.mc-bar') ?? null;
        },
      },
    });
  </script>
</template>
