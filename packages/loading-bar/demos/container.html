<template component>
  <div class="flex flex-wrap items-center gap-3">
    <mc-button on:click="start()">开始</mc-button>
    <mc-button variant="outline" on:click="finish()">完成</mc-button>
  </div>

  <div class="flex flex-col gap-3">
    <!-- 放进卡片：它只占自己那 4px，表达「这一块在刷新」 -->
    <div
      style="border: 1px solid rgb(var(--mc-color-border)); border-radius: var(--mc-radius-md); overflow: hidden"
    >
      <mc-loading-bar attr:state="phase" position="static"></mc-loading-bar>
      <div class="flex flex-col gap-1 p-3">
        <span>成员列表</span>
        <span class="text-xs text-muted">这一条只说这一块（收尾的样子见「出错」那一节）</span>
      </div>
    </div>

    <!-- 盖在容器上沿：static 只是把定位交回文档流，想盖上去自己写内联样式 -->
    <div
      style="position: relative; overflow: hidden; border: 1px solid rgb(var(--mc-color-border)); border-radius: var(--mc-radius-md)"
    >
      <mc-loading-bar
        attr:state="phase"
        position="static"
        style="position: absolute; inset-inline: 0; top: 0"
      ></mc-loading-bar>
      <div class="flex flex-col gap-1 p-3">
        <span>详情面板</span>
        <span class="text-xs text-muted">条子盖在面板上沿，不占布局</span>
      </div>
    </div>
  </div>

  <script>
    export default async () => ({
      tag: 'demo-loading-bar-container',

      /* data 的字段别叫 `on`：那是 ofa 自己的名字（见 basic 演示的注释） */
      data: { phase: 'idle' },

      proto: {
        start() {
          this.phase = 'loading';
        },
        finish() {
          this.phase = 'done';
        },
      },
    });
  </script>
</template>
