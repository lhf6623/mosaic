<template component>
  <div class="flex flex-wrap items-center gap-3">
    <mc-button on:click="start()">开始</mc-button>
    <mc-button variant="outline" on:click="done()">完成</mc-button>
  </div>

  <div class="flex flex-col gap-3">
    <!-- 放进卡片：它只占自己那 4px，表达「这一块在刷新」（出错的样子见上一节「出错」） -->
    <div
      style="border: 1px solid rgb(var(--mc-color-border)); border-radius: var(--mc-radius-md); overflow: hidden"
    >
      <mc-loading-bar
        attr:active="busy ? '' : null"
        position="static"
        label="正在刷新列表"
      ></mc-loading-bar>
      <div class="flex flex-col gap-1 p-3">
        <span>成员列表</span>
        <span class="text-xs text-muted">这一条只说这一块</span>
      </div>
    </div>

    <!-- 盖在容器上沿：static 只是把定位交回文档流，想盖上去自己写内联样式 -->
    <div
      style="position: relative; overflow: hidden; border: 1px solid rgb(var(--mc-color-border)); border-radius: var(--mc-radius-md)"
    >
      <mc-loading-bar
        attr:active="busy ? '' : null"
        position="static"
        label="正在保存"
        style="position: absolute; inset-inline: 0; top: 0"
      ></mc-loading-bar>
      <div class="flex flex-col gap-1 p-3">
        <span>详情面板</span>
        <span class="text-xs text-muted">条子盖在面板上沿，不占布局</span>
      </div>
    </div>
  </div>

  <script>
    export default async () => ({
      tag: 'demo-loading-bar-container',

      /* ⚠️ 字段别叫 `on`：ofa 把 `on` 留给了自己，数据里出现同名键会让模块注册失败，
         外层只报「错误的模块地址」（实测 data: { on: false } 单独就能复现，改名即好） */
      data: { busy: false },

      proto: {
        start() {
          this.failed = false;
          this.busy = true;
        },
        done() {
          this.busy = false;
        },
      },
    });
  </script>
</template>
