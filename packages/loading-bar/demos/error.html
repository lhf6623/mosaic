<template component>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3">
      <mc-button on:click="start()">开始</mc-button>
      <mc-button variant="outline" on:click="finish()">成功</mc-button>
      <mc-button variant="outline" on:click="fail()">出错</mc-button>
    </div>

    <!-- 成功与出错是**同一个收尾**（先滑到 100% 再淡出），只差填充色。
         ⚠️ 这条必须 position="static"：默认那种钉在**视口顶部**，而一个文档页会把所有演示
         一起渲染出来 —— 留一条 fixed 的就会永远压在整页顶上（别的演示的条子都被它盖住）。 -->
    <mc-loading-bar attr:state="phase" position="static"></mc-loading-bar>

    <!-- 演示专用：把淡出拉到 60s 才看得住那一下的颜色。state="error" 用的是主题的 danger；
         第二条把这个色槽覆盖成 warning。 -->
    <mc-loading-bar
      state="error"
      position="static"
      style="--mc-loading-bar-fade: 60s"
    ></mc-loading-bar>
    <mc-loading-bar
      state="error"
      position="static"
      style="--mc-loading-bar-fade: 60s; --mc-loading-bar-error: var(--mc-color-warning)"
    ></mc-loading-bar>
  </div>

  <script>
    export default async () => ({
      tag: 'demo-loading-bar-error',

      /* data 的字段别叫 `on`：那是 ofa 自己的名字（见 basic 演示的注释） */
      data: { phase: 'idle' },

      proto: {
        start() {
          this.phase = 'loading';
        },
        finish() {
          this.phase = 'done';
        },
        fail() {
          this.phase = 'error';
        },
      },
    });
  </script>
</template>
