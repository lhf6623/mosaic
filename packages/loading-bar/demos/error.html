<template component>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3">
      <mc-button on:click="start()">开始</mc-button>
      <mc-button variant="outline" on:click="finish()">成功</mc-button>
      <mc-button variant="outline" on:click="fail()">出错</mc-button>
    </div>

    <!-- 成功与出错是**同一个收尾**（先滑到 100% 再淡出），只差填充色 -->
    <mc-loading-bar attr:state="phase" label="正在加载"></mc-loading-bar>

    <!-- 演示专用：把淡出拉到 60s 才看得住那一下的颜色。state="error" 时
         color="auto" 会走 --mc-loading-bar-error（默认 danger）；写死 color 则一律听它的。 -->
    <mc-loading-bar
      state="error"
      style="position: static; --mc-loading-bar-fade: 60s"
      label="加载失败"
    ></mc-loading-bar>
    <mc-loading-bar
      state="error"
      color="warning"
      style="position: static; --mc-loading-bar-fade: 60s"
      label="校验未通过"
    ></mc-loading-bar>
  </div>

  <script>
    export default async () => ({
      tag: 'demo-loading-bar-error',

      /* data 的字段别叫 `on`：那是 ofa 自己的名字（见 basic 演示的注释） */
      data: { phase: 'loading' },

      proto: {
        start() {
          this.phase = 'loading';
        },
        finish() {
          this.phase = 'done';
        },
        fail() {
          this.phase = 'error';
        },
      },
    });
  </script>
</template>
