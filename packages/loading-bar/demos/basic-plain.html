<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.5/dist/ofa.min.mjs"
      type="module"></script>
  </head>
  <body>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/space/space.html"></l-m>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/button/button.html"></l-m>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/loading-bar/loading-bar.html"></l-m>

    <mc-space block wrap-items>
      <mc-button id="start">开始加载</mc-button>
      <mc-button id="finish" variant="outline">完成</mc-button>
    </mc-space>

    <!-- 全局一条：真实用法是页面顶层放一个，由路由切换或一次全局请求驱动 state -->
    <mc-loading-bar id="bar"></mc-loading-bar>

    <script>
      /* state 是属性通道：idle / loading / done */
      document.getElementById('start').addEventListener('click', () => {
        document.getElementById('bar').setAttribute('state', 'loading');
      });
      document.getElementById('finish').addEventListener('click', () => {
        document.getElementById('bar').setAttribute('state', 'done');
      });
    </script>

  </body>
</html>
