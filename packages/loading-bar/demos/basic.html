<template component>
  <div class="flex flex-wrap items-center gap-3">
    <mc-button on:click="start()">开始加载</mc-button>
    <mc-button variant="outline" on:click="finish()">完成</mc-button>
  </div>

  <!-- 全局一条：真实用法是页面顶层放一个，由路由切换或一次全局请求驱动 state -->
  <mc-loading-bar attr:state="phase" label="正在加载页面"></mc-loading-bar>

  <script>
    export default async () => ({
      tag: 'demo-loading-bar-basic',

      /* ⚠️ 字段别叫 `on`：ofa 把 `on` 留给了自己，数据里出现同名键会让模块注册失败，
         外层只报「错误的模块地址」（实测 data: { on: false } 单独就能复现，改名即好） */
      data: { phase: 'idle' },

      proto: {
        start() {
          this.phase = 'loading';
        },
        finish() {
          this.phase = 'done';
        },
      },
    });
  </script>
</template>
