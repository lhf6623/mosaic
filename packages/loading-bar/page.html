    <h1>Loading Bar <code>mc-loading-bar</code></h1>
    <p class="doc-lead">
      全局加载条：钉在视口顶部的一条细线，在跑就缓慢爬升（永远到不了 100%），跑完滑满淡出。
    </p>
    <mc-alert class="doc-notes" color="warning" icon heading="注意事项">
      <ul>
        <li>
          <strong>默认那种（<code>position="fixed"</code>）一页只该有一条</strong>：它铺满视口宽度、
          浮在所有东西之上，是「整体在忙」的信号。只表达<strong>某一小块</strong>在忙，就用
          <code>position="static"</code> 放进那个容器里；要表达「跑到哪了」还是用
          <code>mc-progress</code>。
        </li>
        <li>
          <strong>它不吃指针</strong>（宿主写死 <code>pointer-events: none</code>）：钉在顶部 2~4px
          上，能接收点击的话会把顶栏那一整条吞掉，而且视觉上看不出来。
        </li>
        <li>
          <strong>出错是「一闪而过」的</strong>：<code>error</code> 一开就换成出错色、滑到满格、
          淡出消失 —— 和正常收尾同一条路。所以真正的失败提示要由页面自己的 <code>mc-message</code> /
          <code>mc-alert</code> 留在屏幕上，这条子只负责那一下。
        </li>
        <li>
          <strong>收尾不是即时的</strong>：<code>active</code> 关掉后先滑满再淡出（时长走
          <code>--mc-loading-bar-fade</code>，减弱动效偏好下会自动压到 1ms），
          所以别用它当「进度」——它只表示开始与结束。
        </li>
      </ul>
    </mc-alert>
