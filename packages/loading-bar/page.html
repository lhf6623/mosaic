    <h1>

    <p class="doc-lead">
      加载条：默认钉在视口顶部（整页在忙），也可以放进容器里（那一块在忙）。在跑就缓慢爬升
      （永远到不了 100%），收尾先滑到 100% 再淡出 —— 成功与出错走同一条路，只差一个填充色。
      整页那一种还可以由函数驱动：
      <code>loadingBar.start()</code>
      /
      <code>done()</code>
      。
    </p>

      <p class="doc-hint">

        ，然后
        <code>start()</code>
        /
        <code>done()</code>
        /
        <code>error()</code>
        ——
        <strong>
          函数与
          <code>state</code>
          一一对应
        </strong>

        <code>start()</code>

        <code>target</code>

        <strong>最上沿</strong>

        函数入口不做计数：两件事同时在忙时，先结束的那一次
        <code>done()</code>
        就把条子收掉 ——「还有几件事没完」得由调用方自己记账。
