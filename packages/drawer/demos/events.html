<template component>
  <mc-space block wrap-items>
    <mc-button on:click="open = true">打开</mc-button>
    <mc-drawer
      heading="事件回调"
      closable
      mask-closable
      attr:open="open ? '' : null"
      on:open="mark('open')"
      on:close="mark('close')">
      <p>
        打开时发
        <code>open</code>
        ；点 × / 按 <kbd>Esc</kbd> / 点遮罩三条关闭路径都发
        <code>close</code>
        。
      </p>
    </mc-drawer>
  </mc-space>

  <p class="mt-3 text-sm text-muted">
    最近一次事件：<strong>{{last}}</strong>
  </p>

  <script>
    export default async () => ({
      tag: 'demo-drawer-events',

      data: { open: false, last: '（还没交互）' },

      proto: {
        mark(type) {
          this.last = type;
          if (type === 'close') this.open = false;
        },
      },
    });
  </script>
</template>
