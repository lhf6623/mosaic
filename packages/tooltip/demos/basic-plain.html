<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.5/dist/ofa.min.mjs"
      type="module"></script>
  </head>
  <body>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/space/space.html"></l-m>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/button/button.html"></l-m>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/tooltip/tooltip.html"></l-m>

    <mc-space block wrap-items>
      <mc-tooltip content="删除后无法恢复">
        <mc-button variant="outline">悬停看提示</mc-button>
      </mc-tooltip>
      <mc-tooltip content="键盘聚焦也会显示">
        <mc-button variant="ghost">聚焦看提示</mc-button>
      </mc-tooltip>
    </mc-space>

  </body>
</html>
