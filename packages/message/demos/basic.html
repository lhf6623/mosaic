<template component>
  <div class="flex flex-wrap items-center gap-2">
    <mc-icon name="info"></mc-icon>
    <mc-button on:click="say('neutral')">普通提示</mc-button>
    <mc-button color="info" variant="outline" on:click="say('info')">信息</mc-button>
    <mc-button color="success" variant="outline" on:click="say('success')">成功</mc-button>
    <mc-button color="warning" variant="outline" on:click="say('warning')">警告</mc-button>
    <mc-button color="danger" variant="outline" on:click="say('error')">错误</mc-button>
  </div>

  <script>
    import message from '../../message/message.js';

    export default async () => ({
      tag: 'demo-message-basic',

      proto: {
        say(type) {
          const text = {
            neutral: '默认是中性：只有文案，没有图标',
            info: '信息：告知，不需要做什么',
            success: '成功：操作已经完成',
            warning: '警告：需要注意，但还没出错',
            error: '错误：出错了，需要处理',
          }[type];
          /* 演示 type 这一个维度：其余都走默认（duration 3000 → 自己走；closable true → 带 ×） */
          message(text, { type });
        },
      },
    });
  </script>
</template>
