<!-- mc-message — 命令式消息条（容器）。设计取舍见同目录 README.md 的「设计取舍」；本文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* ---------- 容器：固定顶栏居中，一列消息 ---------- */
    :host {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--mc-space-2, var(--mc-def-space-2));
      pointer-events: none; /* 只有消息条本身可点，空白处不吃点击 */
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
    }

    /* ---------- 一条消息 ---------- */
    .mc-item {
      display: flex;
      align-items: center;
      gap: var(--mc-space-2, var(--mc-def-space-2));
      max-width: min(36rem, calc(100vw - var(--mc-space-8, var(--mc-def-space-8))));
      padding: var(--mc-space-2, var(--mc-def-space-2)) var(--mc-space-4, var(--mc-def-space-4));
      /* 圆角用 full：消息条是浮起的一条胶囊，不是卡片 */
      border-radius: var(--mc-radius-full, var(--mc-def-radius-full));
      border: 1px solid rgb(var(--mc-color-border, var(--mc-def-color-border)));
      background-color: rgb(var(--mc-color-surface, var(--mc-def-color-surface)));
      /* 浮层唯一的视觉依据：全仓没有 --mc-shadow-* 令牌，这里给浮层专用阴影 */
      box-shadow: 0 4px 16px rgb(0 0 0 / 0.12);
      color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)));
      font-size: var(--mc-text-sm, var(--mc-def-text-sm));
      line-height: var(--mc-text-sm-lh, var(--mc-def-text-sm-lh));
      pointer-events: auto;
      /* ⚠️ 必须 !important：reset 在 mosaic.base 层、工具类在 utilities 层，层序 base < utilities，text-sm 赢不了 */
      font-size: var(--mc-text-sm, var(--mc-def-text-sm)) !important;
    }

    /* ---------- 关闭按钮：右侧 32×32 命中区（同 mc-alert）；整条不再可点，要关就点这个 ×。 ---------- */
    .mc-close {
      display: none;
      flex: none;
      box-sizing: border-box;
      width: var(--mc-space-8, var(--mc-def-space-8));
      height: var(--mc-space-8, var(--mc-def-space-8));
      /* 负外边距吃掉超出胶囊的部分：单行消息加不加 × 都一样高 */
      margin-block: calc(
        (
            var(--mc-text-sm-lh, var(--mc-def-text-sm-lh)) -
              var(--mc-space-8, var(--mc-def-space-8))
          ) /
          2
      );
      padding: 0;
      border: 0;
      border-radius: var(--mc-radius-full, var(--mc-def-radius-full));
      background-color: transparent;
      color: inherit;
      font: inherit;
      font-size: var(--mc-text-lg, var(--mc-def-text-lg));
      line-height: 1;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    :host([data-has-closable]) .mc-close,
    .mc-item[data-closable] .mc-close {
      display: inline-flex;
    }
    .mc-close:hover {
      background-color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)) / 0.08);
    }
    .mc-close:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }

    /* ⚠️ .mc-list 是纵向 flex，条目在交叉轴默认 stretch —— 不写 align-items: center 就会被最长那条一起撑宽 */
    .mc-list {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mc-text {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    /* ---------- 图标：跟着 type 换色 ---------- */
    .mc-glyph {
      flex: none;
      display: inline-flex;
      font-size: var(--mc-text-lg, var(--mc-def-text-lg));
      color: rgb(var(--mc-color-fg-muted, var(--mc-def-color-fg-muted)));
    }
    .mc-glyph[data-type='success'] {
      color: rgb(var(--mc-color-success, var(--mc-def-color-success)));
    }
    .mc-glyph[data-type='warning'] {
      color: rgb(var(--mc-color-warning, var(--mc-def-color-warning)));
    }
    .mc-glyph[data-type='error'] {
      color: rgb(var(--mc-color-danger, var(--mc-def-color-danger)));
    }

    /* ---------- 进场：从上方落下来一点 + 淡入；退场不在这里（节点直接被移除） ---------- */
    @keyframes mc-message-in {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
    .mc-item {
      animation: mc-message-in var(--mc-duration-slow, var(--mc-def-duration-slow))
        var(--mc-ease-emphasized, var(--mc-def-ease-emphasized)) both;
    }

    /* 令牌归零后 animation 已经是瞬时，这里再兜一层，避免「动画名还在」 */
    @media (prefers-reduced-motion: reduce) {
      .mc-item {
        animation: none;
      }
    }
  </style>

  <!-- 根子元素（P42）：o-fill 宿主挂在它身上 -->
  <div class="mc-list">
    <o-fill :value="rows" fill-key="id">
      <div style="display: contents">
        <div
          class="mc-item"
          attr:data-type="$data.type"
          attr:data-closable="$data.closable ? '' : null"
          attr:data-index="$index">
          <o-if :value="$data.icon">
            <span class="mc-glyph" attr:data-type="$data.type">
              <mc-icon attr:name="$data.iconName"></mc-icon>
            </span>
          </o-if>
          <span class="mc-text">{{$data.text}}</span>
          <button class="mc-close" type="button" attr:data-index="$index">
            <mc-icon name="close"></mc-icon>
          </button>
        </div>
      </div>
    </o-fill>
  </div>

  <script>
    export default async ({ load }) => {
      /* 图标是独立组件：注册 mc-message 之前先就位（同 mc-alert），代价是多取一次 icon.html */
      await load('../icon/icon.html');

      return {
        tag: 'mc-message',

        data: {
          rows: [],
        },

        ready() {
          /* ⚠️ o-fill 模板里绑不到 proto 方法（条目作用域只有 $data / $index / $host），监听只能挂**容器**做委托 —— 这正是 P12 推荐的形态。
             ⚠️ proto / 生命周期里的 `this` 是 ofa 实例，元素 API 要走 `this.ele`（P5 一族）。 */
          const list = this.ele.shadowRoot.querySelector('.mc-list');
          list.addEventListener('click', (event) => this._onActivate(event));
          list.addEventListener('keydown', (event) => this._onActivate(event));
        },

        detached() {
          const list = this.ele.shadowRoot?.querySelector('.mc-list');
          if (!list) return;
          list.replaceWith(list.cloneNode(true)); // 一次性摘掉委托监听（箭头函数没法逐个 remove）
        },

        proto: {
          /** 委托入口：只有点/敲 × 才关；用委托的原因见 ready()（o-fill 里绑不到 proto 方法）。 */
          _onActivate(event) {
            const btn = event.composedPath().find((el) => el?.classList?.contains('mc-close'));
            if (!btn) return;

            if (event.type === 'keydown') {
              if (event.key !== 'Enter' && event.key !== ' ') return;
              event.preventDefault(); // 空格默认会滚页面
              this._kb = btn; // 键盘处理过 → 随后那次合成 click 要忽略，否则会关两次
              this.activate(Number(btn.getAttribute('data-index')));
              return;
            }
            if (this._kb === btn) {
              this._kb = null;
              return;
            }
            /* 走 keydown 而不是 click：按钮上的 Space 只在 keyup 才合成 click，这里要「按下去就关」 */
            this.activate(Number(btn.getAttribute('data-index')));
          },

          /** 推一条消息。⚠️ 必须原地 push：实测整体替换 rows 之后 o-fill 完全不更新（且不报错）。 */
          push(item) {
            this.rows.push(item);
          },

          /** 按位置移除（DOM → 数据只能靠位置）。 */
          removeAt(index) {
            const [removed] = this.rows.splice(index, 1);
            return removed ?? null;
          },

          /** 全部收起，返回被收起的条目（message.js 用它清定时器）。 */
          clear() {
            const removed = [...this.rows];
            this.rows.length = 0;
            return removed;
          },

          /** 收掉第 index 条，并把事件抛给外部（message.js 用它清定时器）。 */
          activate(index) {
            const item = this.rows[index];
            if (!item) return;
            this.removeAt(index);
            this.ele.dispatchEvent(
              new CustomEvent('close', { detail: item, bubbles: true, composed: true }),
            );
          },
        },
      };
    };
  </script>
</template>
