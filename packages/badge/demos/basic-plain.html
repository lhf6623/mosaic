<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.5/dist/ofa.min.mjs"
      type="module"></script>
  </head>
  <body>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/space/space.html"></l-m>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/badge/badge.html"></l-m>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/button/button.html"></l-m>

    <mc-space direction="vertical" gap="16">
      <!-- 第一行：独立徽标 —— 内容走 content，色走 color（不写就是 primary） -->
      <mc-space block wrap-items>
        <mc-badge content="新"></mc-badge>
        <mc-badge color="info" content="信息"></mc-badge>
        <mc-badge color="success" content="成功"></mc-badge>
        <mc-badge color="warning" content="警告"></mc-badge>
        <mc-badge color="danger" content="危险"></mc-badge>
      </mc-space>

      <!-- 第二行：挂在容器上 —— 容器写进默认插槽，徽标块自动贴右上角 -->
      <mc-space block wrap-items gap="24">
        <mc-badge content="5"><mc-button>消息</mc-button></mc-badge>
        <mc-badge content="120" max="99" color="danger" variant="solid">
          <mc-button>消息</mc-button>
        </mc-badge>
        <mc-badge dot color="success"><mc-button>在线</mc-button></mc-badge>
        <mc-badge content="9" color="info"><mc-button variant="outline">通知</mc-button></mc-badge>
      </mc-space>
    </mc-space>

  </body>
</html>
