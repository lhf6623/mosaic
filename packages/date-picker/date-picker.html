<!-- mc-date-picker — 日期选择（表单控件 + 月历浮层；面板网格由 o-fill 模板渲染）；设计取舍见 README.md「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <link rel="stylesheet" href="../icon/icons.generated.css" />
  <style>
    /* 1. 宿主盒模型 + 色槽默认值。高度 / 宽度写在宿主上，style="height:…" / "width:…" 直接压得住 */
    :host {
      display: inline-flex;
      position: relative; /* .mc-clear 的包含块（P21） */
      box-sizing: border-box;
      height: var(--mc-control-h-md, var(--mc-def-control-h-md));
      /* 固定宽度：占位文案 / 选中值 / 格式化后的长度都不应该把盒子撑大或缩回去 */
      width: var(--mc-date-picker-control-width);
      max-width: 100%;
      vertical-align: middle;
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-text-sm, var(--mc-def-text-sm));
      line-height: var(--mc-text-sm-lh, var(--mc-def-text-sm-lh));
      color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)));

      /* L3 组件令牌：默认引用 L2 语义令牌，按实例覆盖写在宿主 style 上 */
      --mc-date-picker-control-bg: var(--mc-color-surface, var(--mc-def-color-surface));
      --mc-date-picker-control-border: var(--mc-color-border, var(--mc-def-color-border));
      --mc-date-picker-control-radius: var(--mc-radius-md, var(--mc-def-radius-md));
      --mc-date-picker-control-pad-x: var(--mc-space-4, var(--mc-def-space-4));
      --mc-date-picker-control-width: 12rem;
      --mc-date-picker-offset: var(--mc-space-2, var(--mc-def-space-2));
      --mc-date-picker-panel-bg: var(--mc-color-surface-raised, var(--mc-def-color-surface-raised));
      --mc-date-picker-panel-border: var(
        --mc-color-border-strong,
        var(--mc-def-color-border-strong)
      );
      --mc-date-picker-panel-radius: var(--mc-radius-lg, var(--mc-def-radius-lg));
      --mc-date-picker-panel-pad: var(--mc-space-3, var(--mc-def-space-3));
      --mc-date-picker-panel-width: 18rem;
      --mc-date-picker-nav-color: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
      --mc-date-picker-nav-bg-hover: var(
        --mc-color-surface-sunken,
        var(--mc-def-color-surface-sunken)
      );
      --mc-date-picker-weekday-color: var(--mc-color-fg-subtle, var(--mc-def-color-fg-subtle));
      --mc-date-picker-day-color: var(--mc-color-fg, var(--mc-def-color-fg));
      --mc-date-picker-day-color-outside: var(--mc-color-fg-subtle, var(--mc-def-color-fg-subtle));
      --mc-date-picker-day-color-selected: var(
        --mc-color-primary-fg,
        var(--mc-def-color-primary-fg)
      );
      --mc-date-picker-day-bg-hover: var(
        --mc-color-surface-sunken,
        var(--mc-def-color-surface-sunken)
      );
      --mc-date-picker-day-bg-selected: var(--mc-color-primary, var(--mc-def-color-primary));
      --mc-date-picker-today-border: var(--mc-color-primary, var(--mc-def-color-primary));
      --mc-date-picker-placeholder-color: var(--mc-color-fg-subtle, var(--mc-def-color-fg-subtle));
      --mc-date-picker-icon-color: var(--mc-color-fg-subtle, var(--mc-def-color-fg-subtle));
      --mc-date-picker-clear-color: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
      --mc-date-picker-clear-bg-hover: var(
        --mc-color-surface-sunken,
        var(--mc-def-color-surface-sunken)
      );
    }

    /* 2. 尺寸：三档只动宿主高度与字号，内部控件靠继承 / 100% 跟上 */
    :host([size='sm']) {
      height: var(--mc-control-h-sm, var(--mc-def-control-h-sm));
      font-size: var(--mc-text-xs, var(--mc-def-text-xs));
    }
    :host([size='lg']) {
      height: var(--mc-control-h-lg, var(--mc-def-control-h-lg));
      font-size: var(--mc-text-base, var(--mc-def-text-base));
    }

    /* 3. 状态：禁用压暗、只读不改外观、invalid 只换边框色槽 */
    :host([disabled]) {
      opacity: 0.5;
      cursor: not-allowed;
    }
    :host([invalid]) {
      --mc-date-picker-control-border: var(--mc-color-danger, var(--mc-def-color-danger));
    }

    /* 4. 触发框（part="base"）：视觉全在这里，使用者 style="…" 压得住宿主 */
    .mc-control {
      flex: 1 1 auto;
      min-width: 0;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      gap: var(--mc-space-2, var(--mc-def-space-2));
      padding-inline: var(--mc-date-picker-control-pad-x);
      border: 1px solid rgb(var(--mc-date-picker-control-border));
      border-radius: var(--mc-date-picker-control-radius);
      background-color: rgb(var(--mc-date-picker-control-bg));
      color: inherit;
      font: inherit;
      text-align: start;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      /* 锚点挂在这里（必须是自己 shadow 里的元素）：面板靠它做 CSS 锚点定位 */
      anchor-name: --mc-date-picker-anchor; /* @internal：锚点标识，给 anchor-name / position-anchor 用 */
    }
    .mc-control:focus-visible {
      /* 焦点环用 ring 令牌，不用 currentColor（P16） */
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }
    :host([disabled]) .mc-control {
      cursor: not-allowed;
    }
    :host([readonly]) .mc-control {
      cursor: default;
    }

    .mc-value {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    :host([data-empty]) .mc-value {
      color: rgb(var(--mc-date-picker-placeholder-color));
    }
    .mc-calendar {
      flex: none;
      color: rgb(var(--mc-date-picker-icon-color));
    }

    /* 清除按钮：控制框的兄弟（不能嵌进 <button> 里），绝对定位压在右端 */
    .mc-clear {
      display: none;
      position: absolute;
      z-index: 1;
      right: var(--mc-space-2, var(--mc-def-space-2));
      top: 50%;
      translate: 0 -50%;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      width: var(--mc-space-5, var(--mc-def-space-5));
      height: var(--mc-space-5, var(--mc-def-space-5));
      padding: 0;
      border: 0;
      border-radius: var(--mc-radius-full, var(--mc-def-radius-full));
      background-color: transparent;
      color: rgb(var(--mc-date-picker-clear-color));
      font-size: 1em;
      line-height: 1;
      cursor: pointer;
    }
    .mc-clear:hover {
      background-color: rgb(var(--mc-date-picker-clear-bg-hover));
    }
    .mc-clear:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }
    :host([clearable][data-filled]) .mc-clear {
      display: inline-flex;
    }
    :host([clearable][data-filled]) .mc-calendar {
      display: none;
    }
    :host([clearable][data-filled]) .mc-control {
      padding-inline-end: var(--mc-space-8, var(--mc-def-space-8));
    }

    /* 5. 月历面板 */
    .mc-panel {
      /* ⚠️ UA 给 `[popover]` 的 inset / margin / border / padding / 底色都要显式接管，否则那对 auto 会吃掉锚点定位 */
      position: fixed;
      inset: auto;
      margin: 0;
      box-sizing: border-box;
      width: var(--mc-date-picker-panel-width);
      max-width: calc(100vw - var(--mc-space-8, var(--mc-def-space-8)));
      max-height: calc(100vh - var(--mc-space-8, var(--mc-def-space-8)));
      padding: var(--mc-date-picker-panel-pad);
      border: 0;
      overflow-y: auto;
      border-radius: var(--mc-date-picker-panel-radius);
      background-color: rgb(var(--mc-date-picker-panel-bg));
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: inherit;
      line-height: inherit;
      /* 描边跟「面板 + 内容」的整体轮廓做：1px 模糊当描边，第二层才是投影 */
      filter: drop-shadow(0 0 1px rgb(var(--mc-date-picker-panel-border)))
        drop-shadow(var(--mc-shadow-panel, var(--mc-def-shadow-panel)));

      /* 锚点定位：锚是 shadow 内的 .mc-control。默认 bottom-start 写基类 */
      position-anchor: --mc-date-picker-anchor; /* @internal：锚点标识，给 anchor-name / position-anchor 用 */
      position-try-fallbacks: flip-block;
      top: anchor(bottom);
      left: anchor(left);
      margin-top: var(--mc-date-picker-offset);
    }

    .mc-header {
      display: flex;
      align-items: center;
      gap: var(--mc-space-2, var(--mc-def-space-2));
      margin-bottom: var(--mc-space-1, var(--mc-def-space-1));
    }
    .mc-title {
      flex: 1 1 auto;
      text-align: center;
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
    }
    .mc-nav {
      display: inline-flex;
      flex: none;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      width: var(--mc-space-8, var(--mc-def-space-8));
      height: var(--mc-space-8, var(--mc-def-space-8));
      padding: 0;
      border: 0;
      border-radius: var(--mc-radius-sm, var(--mc-def-radius-sm));
      background-color: transparent;
      color: rgb(var(--mc-date-picker-nav-color));
      font-size: 1em;
      line-height: 1;
      cursor: pointer;
    }
    .mc-nav:hover {
      background-color: rgb(var(--mc-date-picker-nav-bg-hover));
    }
    .mc-nav:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 1px;
    }

    .mc-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      padding: var(--mc-space-1, var(--mc-def-space-1)) 0 var(--mc-space-2, var(--mc-def-space-2));
      color: rgb(var(--mc-date-picker-weekday-color));
      font-size: var(--mc-text-xs, var(--mc-def-text-xs));
      text-align: center;
    }
    .mc-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    /* 月 / 年选择是 3 列 × 4 行 */
    .mc-grid--coarse {
      grid-template-columns: repeat(3, 1fr);
      gap: var(--mc-space-1, var(--mc-def-space-1));
    }
    /* 模板渲染：o-fill 不生成盒子，格子直接参与 .mc-grid 的 grid 布局（同 mc-menu 的 o-fill / o-if） */
    o-fill {
      display: contents;
    }

    .mc-day,
    .mc-cell {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: var(--mc-space-8, var(--mc-def-space-8));
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: var(--mc-radius-sm, var(--mc-def-radius-sm));
      background-color: transparent;
      color: rgb(var(--mc-date-picker-day-color));
      font: inherit;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }
    .mc-cell {
      height: var(--mc-space-10, var(--mc-def-space-10));
      font-size: var(--mc-text-sm, var(--mc-def-text-sm));
    }
    .mc-day:hover,
    .mc-day[data-active],
    .mc-cell:hover,
    .mc-cell[data-active] {
      background-color: rgb(var(--mc-date-picker-day-bg-hover));
    }
    .mc-day[data-outside] {
      color: rgb(var(--mc-date-picker-day-color-outside));
    }
    .mc-day[data-today] {
      box-shadow: inset 0 0 0 1px rgb(var(--mc-date-picker-today-border));
    }
    /* 范围中间的格子只铺一层浅底；两端仍是 data-selected 的实心色 */
    .mc-day[data-in-range],
    .mc-cell[data-in-range] {
      background-color: rgb(var(--mc-date-picker-day-bg-selected) / 0.18);
      color: rgb(var(--mc-date-picker-day-color));
    }
    .mc-day[data-selected],
    .mc-cell[data-selected] {
      background-color: rgb(var(--mc-date-picker-day-bg-selected));
      color: rgb(var(--mc-date-picker-day-color-selected));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
    }
    .mc-day[data-selected]:hover,
    .mc-day[data-selected][data-active],
    .mc-cell[data-selected]:hover,
    .mc-cell[data-selected][data-active] {
      background-color: rgb(var(--mc-date-picker-day-bg-selected));
    }
    .mc-day[data-disabled],
    .mc-cell[data-disabled] {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .mc-day[data-disabled]:hover,
    .mc-day[data-disabled][data-active],
    .mc-cell[data-disabled]:hover,
    .mc-cell[data-disabled][data-active] {
      background-color: transparent;
    }
    .mc-day[data-selected][data-disabled]:hover,
    .mc-day[data-selected][data-disabled][data-active],
    .mc-cell[data-selected][data-disabled]:hover,
    .mc-cell[data-selected][data-disabled][data-active] {
      background-color: rgb(var(--mc-date-picker-day-bg-selected));
    }
  </style>

  <button
    class="mc-control"
    part="base"
    type="button"
    attr:disabled="disabled !== null"
    on:click="onControlClick"
    on:keydown="onKeyDown">
    <!-- 触发框文案：模板渲染（占位 / 值 / 多选拼接 / 范围文案都由 data.displayText 给） -->
    <span class="mc-value">{{displayText}}</span>
    <span class="mc-calendar mc-icon-calendar"></span>
  </button>

  <button class="mc-clear" type="button" attr:disabled="disabled !== null" on:click="onClear">
    <span class="mc-icon-close"></span>
  </button>

  <!-- 面板：原生 popover 进 top layer，位置交给 CSS 锚点定位；⚠️ 刻意用 popover="manual"，开合自己管（同 mc-select） -->
  <div
    class="mc-panel"
    part="panel"
    popover="manual"
    on:toggle="onNativeToggle"
    on:mousedown="onPanelMouseDown"
    on:keydown="onPanelKeyDown">
    <div class="mc-header" part="header">
      <button
        class="mc-nav"
        type="button"
        tabindex="-1"
        attr:title="prevTitle"
        on:click="onPrevMonth">
        <span class="mc-icon-chevron-left"></span>
      </button>
      <span class="mc-title">{{panelTitle}}</span>
      <button
        class="mc-nav"
        type="button"
        tabindex="-1"
        attr:title="nextTitle"
        on:click="onNextMonth">
        <span class="mc-icon-chevron-right"></span>
      </button>
    </div>
    <div class="mc-weekdays" attr:hidden="coarse ? '' : null">
      <span>一</span>
      <span>二</span>
      <span>三</span>
      <span>四</span>
      <span>五</span>
      <span>六</span>
      <span>日</span>
    </div>
    <!-- 网格是模板渲染的唯一源：日 / 周与月 / 年各一条 o-fill（空数组 = 0 格），状态全走 attr: 绑定 -->
    <div class="mc-grid" part="grid" class:mc-grid--coarse="coarse">
      <o-fill :value="days" fill-key="id">
        <button
          class="mc-day"
          part="day"
          type="button"
          tabindex="-1"
          attr:data-date="$data.date"
          attr:data-key="$data.key"
          attr:data-week="$data.week"
          attr:data-outside="$data.outside ? '' : null"
          attr:data-today="$data.today ? '' : null"
          attr:data-selected="$data.selected ? '' : null"
          attr:data-in-range="$data.inRange ? '' : null"
          attr:data-active="$data.active ? '' : null"
          attr:data-disabled="$data.disabled ? 'true' : null"
          on:click="$host.selectKey($data.key)">
          {{$data.label}}
        </button>
      </o-fill>
      <o-fill :value="cells" fill-key="id">
        <button
          class="mc-cell"
          part="cell"
          type="button"
          tabindex="-1"
          attr:data-key="$data.key"
          attr:data-value="$data.key"
          attr:data-selected="$data.selected ? '' : null"
          attr:data-in-range="$data.inRange ? '' : null"
          attr:data-active="$data.active ? '' : null"
          attr:data-disabled="$data.disabled ? 'true' : null"
          on:click="$host.selectKey($data.key)">
          {{$data.label}}
        </button>
      </o-fill>
    </div>
  </div>

  <script>
    /* 定住滚动条的小工具：开合原生浮层时浏览器可能顺手滚页面（火狐实测，见那个文件头） */
    import { attachFloatingScrollGuard } from '../boot/scroll-pin.js';
    /* 触发框内容被 ellipsis 裁掉时，hover / focus 弹完整文案 */
    import { attachOverflowTip } from '../boot/overflow-tip.js';

    /* 日期算法 / canonical key / 格式串：通用部分抽在 boot/date.js（以后的日期类组件共用） */
    import {
      addDays,
      addMonths,
      addYears,
      formatKey,
      isoOf,
      keyOfDate,
      pad2,
      parseKey,
      periodOfKey,
      todayDate,
      TYPE_DEFAULTS,
      weekdayIndex,
    } from '../boot/date.js';
    import { withEmits } from '../boot/emits.js';

    const DEFAULT_TYPE = 'day';
    const TYPE_PLACEHOLDERS = {
      day: '请选择日期',
      week: '请选择周',
      month: '请选择月份',
      year: '请选择年份',
    };

    export default async () =>
      withEmits({
        tag: 'mc-date-picker',

        // 本组件对外事件：声明即派发入口（见 boot/emits.js）
        emits: {
          change: { data: ['value'] },
          clear: {},
          open: {},
          close: {},
        },

        attrs: {
          /* 绑定通道：ofa 原生的 :value（单向）/ sync:value（双向）落在这个属性上（同 mc-input）。
           默认 null：ofa 不会凭空写一个空属性，"属性在不在"才可靠（P32）；不给就是非受控。 */
          value: null,
          /* 初始值在 HTML 属性 default-value（非受控）；运行时值走宿主 DOM property value */
          defaultValue: '',
          /* 选择粒度与选择模式：type = day / week / month / year；multiple / range 互斥（range 优先） */
          type: 'day',
          multiple: null,
          range: null,
          /* 格式化三段：进（解析外部字符串）→ 组件中（触发框显示）→ 出（事件 / property / 回写属性） */
          inputFormat: '',
          format: '',
          outputFormat: '',
          /* 可选范围：按 input-format 解析，两端都含；空 = 不限 */
          min: '',
          max: '',
          /* 空 = 按 type 取默认文案 */
          placeholder: '',
          /* 布尔属性默认值必须是 null（P1）：写 false 会让裸属性 <mc-date-picker clearable> 失效 */
          clearable: null,
          disabled: null,
          readonly: null,
          invalid: null,
          size: 'md',
        },

        /* 可见内容全走模板，这些字段就是渲染数据：displayText = 触发框文案；
           panelTitle / prevTitle / nextTitle = 标题与翻页按钮；coarse = 月 / 年视图；
           days / cells = 两种网格的格模型（o-fill 按 id 复用节点） */
        data: {
          displayText: '',
          panelTitle: '',
          prevTitle: '上个月',
          nextTitle: '下个月',
          coarse: false,
          days: [],
          cells: [],
        },

        ready() {
          const root = this.ele.shadowRoot;
          this._control = root.querySelector('.mc-control');
          this._valueEl = root.querySelector('.mc-value');
          this._panel = root.querySelector('.mc-panel');

          this._selected = [];
          this._pending = null;
          this._committed = [];
          this._active = todayDate();
          this._view = { y: this._active.y, m: this._active.m };
          this._openState = false;
          this._live = false;
          this._defaultApplied = false;
          this._touched = false;
          this._pendingReflect = false;
          this._reflected = null;
          this._returnFocus = false;
          this._seen = new Set();

          /* 运行时值走宿主 DOM property（规范 1.4 / P18）：读 = 当前值，写 = 直接改选中态 */
          Object.defineProperty(this.ele, 'value', {
            configurable: true,
            get: () => this.readValue(),
            set: (next) => this.writeValue(next),
          });

          /* 滚动守卫：一行接线，它自己监听面板的 beforetoggle / toggle；显式显示 / 收起那两行再包一层 run() */
          this._scrollGuard = attachFloatingScrollGuard(this.ele, this._panel);
          this._popoverOk = typeof this._panel?.showPopover === 'function';
        },

        attached() {
          this._live = true;
          /* 多选 / 范围的拼接会被固定宽度裁掉；提示本身住在 shadow 里的 top layer */
          this._overflowTip = attachOverflowTip(this.ele, this._valueEl);

          /* 点外部关闭必须用 composedPath（P20）：contains(e.target) 在 shadow 边界上拿到的是宿主，必然误判 */
          this._onDocPointerDown = (event) => {
            if (!this.isOpen()) return;
            if (event.composedPath().includes(this.ele)) return;
            this.closePanel();
          };
          document.addEventListener('pointerdown', this._onDocPointerDown, true);

          /* 焦点离开整个宿主（含触发框 / ×）就收起面板；面板里的按钮不进 Tab 序列，所以这是 Tab 退出的唯一出口 */
          this._onHostFocusOut = (event) => this.onFocusOut(event);
          this.ele.addEventListener('focusout', this._onHostFocusOut);

          this.applyDefaultValue();
          this.syncDisplay();
          if (this._pendingReflect) {
            this._pendingReflect = false;
            this.reflectBoundValue();
          }
        },

        detached() {
          document.removeEventListener('pointerdown', this._onDocPointerDown, true);
          this.ele.removeEventListener('focusout', this._onHostFocusOut);
          this._overflowTip?.dispose();
          this._overflowTip = null;
          this._scrollGuard?.dispose();
          if (this.isOpen()) this._panel.hidePopover();
          this._live = false;
        },

        watch: {
          /* ⚠️ ofa 初始化会把每条 watch 空跑一遍（P5），那次不碰宿主属性（P31） */
          value() {
            if (this.skipInit('value')) return;
            const raw = this.ele.getAttribute('value');
            if (raw === null) return;
            if (this._reflected !== null && raw === this._reflected) {
              this._reflected = null;
              return;
            }
            this._reflected = null;
            this._touched = true;
            this.applyValue(raw);
          },
          defaultValue() {
            if (this.skipInit('defaultValue')) return;
            if (this._touched) return;
            this.applyValue(this.ele.getAttribute('default-value') ?? '');
          },
          type() {
            if (this.skipInit('type')) return;
            this._touched = false;
            this._defaultApplied = false;
            this._selected = [];
            this._pending = null;
            this._committed = [];
            this.applyDefaultValue();
            this.syncDisplay();
            if (this.isOpen()) {
              this.syncActiveFromSelection();
              this.refreshPanel();
            }
          },
          multiple() {
            if (this.skipInit('multiple')) return;
            this.applyModeChange();
          },
          range() {
            if (this.skipInit('range')) return;
            this.applyModeChange();
          },
          inputFormat() {
            if (this.skipInit('inputFormat')) return;
            /* 解读方式变了：把当前 value 属性按新格式再读一次（属性本身没变，变的是格式） */
            const raw = this.ele.getAttribute('value');
            if (raw !== null && raw !== '') {
              this._touched = true;
              this.applyValue(raw);
            }
          },
          format() {
            if (this.skipInit('format')) return;
            this.syncDisplay();
          },
          outputFormat() {
            if (this.skipInit('outputFormat')) return;
            if (this._selected.length) this.reflectBoundValue();
          },
          min() {
            if (this.skipInit('min')) return;
            if (this.isOpen()) this.refreshPanel();
          },
          max() {
            if (this.skipInit('max')) return;
            if (this.isOpen()) this.refreshPanel();
          },
          placeholder() {
            if (this.skipInit('placeholder')) return;
            this.syncDisplay();
          },
          clearable() {
            if (this.skipInit('clearable')) return;
            this.syncDisplay();
          },
          disabled() {
            if (this.skipInit('disabled')) return;
            this.syncDisplay();
            if (this.ele.hasAttribute('disabled') && this.isOpen()) this.closePanel();
          },
          readonly() {
            if (this.skipInit('readonly')) return;
            this.syncDisplay();
            if (this.ele.hasAttribute('readonly') && this.isOpen()) this.closePanel();
          },
          invalid() {
            if (this.skipInit('invalid')) return;
            this.syncDisplay();
          },
        },

        proto: {
          /** 每条 watch 的首次（构造期）触发都要跳过，但每条各跳一次（P5） */
          skipInit(key) {
            if (this._seen.has(key)) return false;
            this._seen.add(key);
            return true;
          },

          currentType() {
            const raw = this.ele.getAttribute('type') || DEFAULT_TYPE;
            return Object.prototype.hasOwnProperty.call(TYPE_DEFAULTS, raw) ? raw : DEFAULT_TYPE;
          },

          currentMode() {
            if (this.ele.hasAttribute('range')) return 'range';
            if (this.ele.hasAttribute('multiple')) return 'multiple';
            return 'single';
          },

          patternFor(name) {
            return this.ele.getAttribute(name) || TYPE_DEFAULTS[this.currentType()];
          },

          /* ---------- 值读写 ---------- */

          readValue() {
            const type = this.currentType();
            const pattern = this.patternFor('output-format');
            const list = this._selected.map((key) => formatKey(key, pattern, type)).filter(Boolean);
            return this.currentMode() === 'single' ? (list[0] ?? '') : list;
          },

          readAttributeValue() {
            const value = this.readValue();
            return Array.isArray(value) ? value.join(',') : value;
          },

          writeValue(next) {
            this._touched = true;
            const text = Array.isArray(next)
              ? next.map((item) => String(item ?? '')).join(',')
              : String(next ?? '');
            this.applyValue(text);
            if (this._live) this.reflectBoundValue();
            else this._pendingReflect = true;
          },

          /** 进组件：按 input → output → 该 type 的 canonical 格式依次尝试，先命中的赢 */
          parseIncoming(raw) {
            const text = String(raw ?? '').trim();
            if (text === '') return null;
            const type = this.currentType();
            const seen = {};
            for (const pattern of [
              this.patternFor('input-format'),
              this.patternFor('output-format'),
              TYPE_DEFAULTS[type],
            ]) {
              if (seen[pattern]) continue;
              seen[pattern] = true;
              const key = parseKey(text, pattern, type);
              if (key) return key;
            }
            return null;
          },

          parseValueList(raw) {
            const text = String(raw ?? '').trim();
            if (text === '') return [];
            const mode = this.currentMode();
            const parts = mode === 'single' ? [text] : text.split(',');
            const keys = parts.map((part) => this.parseIncoming(part)).filter(Boolean);
            if (mode === 'single') return keys.slice(0, 1);
            if (mode === 'range') return keys.slice(0, 2);
            return keys;
          },

          /** 初值 / 绑定值 / property 写值都走这里：只接受合法 key，非法一律当空 */
          applyValue(raw) {
            const keys = this.parseValueList(raw);
            const mode = this.currentMode();
            this._selected = keys;
            if (mode === 'range' && keys.length === 1) {
              this._pending = keys[0];
              this._committed = [];
            } else {
              this._pending = null;
              this._committed = keys.slice();
            }
            this.syncActiveFromSelection();
            this.syncDisplay();
            if (this.isOpen()) this.refreshPanel();
          },

          applyDefaultValue() {
            if (this._defaultApplied || !this._live) return;
            this._defaultApplied = true;
            const bound = this.ele.getAttribute('value');
            if (bound !== null) {
              this._touched = true;
              this.applyValue(bound);
              return;
            }
            if (this._touched) return;
            const initial = this.ele.getAttribute('default-value');
            if (initial !== null && initial !== '') this.applyValue(initial);
          },

          applyModeChange() {
            const mode = this.currentMode();
            this._pending = null;
            if (mode === 'single') this._selected = this._selected.slice(0, 1);
            else if (mode === 'range') this._selected = this._selected.slice(0, 2);
            if (mode === 'range' && this._selected.length === 1) {
              this._pending = this._selected[0];
              this._committed = [];
            } else {
              this._committed = this._selected.slice();
            }
            this.syncDisplay();
            this.reflectBoundValue();
            if (this.isOpen()) this.refreshPanel();
          },

          /** 当前选择 → 键盘高亮与视图；没有选择就看今天 */
          syncActiveFromSelection() {
            const type = this.currentType();
            const key = this._pending || this._selected[0] || '';
            const period = key ? periodOfKey(key, type) : null;
            const base = period ? period.start : todayDate();
            if (type === 'day' || type === 'week') {
              this._active = { y: base.y, m: base.m, d: base.d };
              this._view = { y: base.y, m: base.m };
            } else if (type === 'month') {
              this._active = { y: base.y, m: base.m, d: 1 };
              this._view = { y: base.y, m: 1 };
            } else {
              this._active = { y: base.y, m: 1, d: 1 };
              this._view = { y: base.y, m: 1 };
            }
          },

          /** 把当前选择写回 value 属性，让 ofa 的 sync:value 观察得到 */
          reflectBoundValue() {
            if (!this._live) return;
            const text = this.readAttributeValue();
            if (this.ele.getAttribute('value') === text) return;
            this._reflected = text;
            this.ele.setAttribute('value', text);
          },

          /* ---------- 显示 ---------- */

          placeholderText() {
            const own = this.ele.getAttribute('placeholder');
            if (own) return own;
            return TYPE_PLACEHOLDERS[this.currentType()] || TYPE_PLACEHOLDERS.day;
          },

          normalizeBoolAttrs() {
            if (!this._live) return;
            for (const name of ['clearable', 'disabled', 'readonly', 'invalid']) {
              const raw = this.ele.getAttribute(name);
              if (raw === null || raw === '') continue;
              if (raw === 'false') this.ele.removeAttribute(name);
              else this.ele.setAttribute(name, '');
            }
          },

          syncDisplay() {
            if (!this._live) return;
            this.normalizeBoolAttrs();
            const filled = this._selected.length > 0;
            this.mirror('data-filled', filled);
            this.mirror('data-empty', !filled);
            const type = this.currentType();
            const mode = this.currentMode();
            const pattern = this.patternFor('format');
            const list = this._selected.map((key) => formatKey(key, pattern, type));
            let text = '';
            if (mode === 'range') {
              if (list.length > 1) text = list[0] + ' ~ ' + list[1];
              else if (list.length === 1) text = list[0] + ' ~ …';
            } else {
              text = list.join(', ');
            }
            /* 文案进模板后要等微任务那一拍才落到 DOM，所以溢出提示晚一拍再量 */
            this.displayText = filled ? text : this.placeholderText();
            queueMicrotask(() => this._overflowTip?.check());
          },

          mirror(name, on) {
            if (!this._live) return;
            if (on === this.ele.hasAttribute(name)) return;
            if (on) this.ele.setAttribute(name, '');
            else this.ele.removeAttribute(name);
          },

          /* ---------- 范围 / 禁用 ---------- */

          rangeKey(name) {
            const key = this.parseIncoming(this.ele.getAttribute(name));
            return key || '';
          },

          isKeyDisabled(key) {
            const min = this.rangeKey('min');
            const max = this.rangeKey('max');
            return (min !== '' && key < min) || (max !== '' && key > max);
          },

          rangeBounds() {
            if (this.currentMode() !== 'range') return null;
            if (this._selected.length === 2) return [this._selected[0], this._selected[1]];
            if (this._pending) return [this._pending, null];
            return null;
          },

          keyOfActive() {
            const type = this.currentType();
            if (type === 'week') return keyOfDate(this._active, 'week');
            if (type === 'month') return this._active.y + '-' + pad2(this._active.m);
            if (type === 'year') return String(this._active.y);
            return isoOf(this._active);
          },

          /* ---------- 面板渲染 ----------
             可见结构在模板里：这里只算「这一帧有哪些格、每格什么状态」，写进 data.days / cells。 */

          refreshPanel() {
            const type = this.currentType();
            if (type === 'day' || type === 'week') this.buildMonthGrid(type);
            else this.buildCoarseGrid(type === 'month' ? 'month' : 'year');
          },

          cellState(key) {
            const selected = this._selected.indexOf(key) >= 0;
            const bounds = this.rangeBounds();
            const inRange = !!(bounds && bounds[1] && key > bounds[0] && key < bounds[1]);
            return { selected, inRange, active: key === this.keyOfActive() };
          },

          /** 日 / 周视图：固定 42 格（前后补相邻月份）；周视图里 7 天共用同一个选择 key */
          buildMonthGrid(type) {
            const view = this._view;
            const min = this.rangeKey('min');
            const max = this.rangeKey('max');
            const today = isoOf(todayDate());
            const first = { y: view.y, m: view.m, d: 1 };
            const start = addDays(first, -weekdayIndex(first));
            const days = [];
            this.coarse = false;
            this.panelTitle = view.y + ' 年 ' + view.m + ' 月';
            this.prevTitle = '上个月';
            this.nextTitle = '下个月';
            for (let index = 0; index < 42; index += 1) {
              const date = addDays(start, index);
              const iso = isoOf(date);
              const key = type === 'week' ? keyOfDate(date, 'week') : iso;
              const state = this.cellState(key);
              days.push({
                /* o-fill 的 fill-key 必须逐格唯一（周视图里 7 天的 key 相同），所以用日期当 id */
                id: iso,
                key,
                date: iso,
                week: type === 'week' ? key : null,
                label: String(date.d),
                outside: date.m !== view.m,
                today: iso === today,
                selected: state.selected,
                inRange: state.inRange,
                active: state.active,
                disabled: (min !== '' && key < min) || (max !== '' && key > max),
              });
            }
            this.days = days;
            this.cells = [];
          },

          /** 月 / 年视图：一页 12 格（月 1–12 / 年按十年分段） */
          buildCoarseGrid(level) {
            const view = this._view;
            const min = this.rangeKey('min');
            const max = this.rangeKey('max');
            const items = [];
            this.coarse = true;
            if (level === 'month') {
              this.panelTitle = view.y + ' 年';
              this.prevTitle = '上一年';
              this.nextTitle = '下一年';
              for (let month = 1; month <= 12; month += 1) {
                items.push({ key: view.y + '-' + pad2(month), label: month + ' 月' });
              }
            } else {
              const start = Math.floor(view.y / 10) * 10;
              this.panelTitle = start + ' – ' + (start + 11) + ' 年';
              this.prevTitle = '上一页';
              this.nextTitle = '下一页';
              for (let year = start; year < start + 12; year += 1) {
                items.push({ key: String(year), label: String(year) });
              }
            }
            this.cells = items.map((item) => {
              const state = this.cellState(item.key);
              return {
                id: item.key,
                key: item.key,
                label: item.label,
                selected: state.selected,
                inRange: state.inRange,
                active: state.active,
                disabled: (min !== '' && item.key < min) || (max !== '' && item.key > max),
              };
            });
            this.days = [];
          },

          setActive(date) {
            const type = this.currentType();
            if (type === 'day' || type === 'week') {
              this._active = { y: date.y, m: date.m, d: date.d };
              this._view = { y: date.y, m: date.m };
            } else if (type === 'month') {
              this._active = { y: date.y, m: date.m, d: 1 };
              this._view = { y: date.y, m: 1 };
            } else {
              this._active = { y: date.y, m: 1, d: 1 };
              this._view = { y: date.y, m: 1 };
            }
            this.refreshPanel();
          },

          moveActive(delta) {
            const type = this.currentType();
            if (type === 'day' || type === 'week') this.setActive(addDays(this._active, delta));
            else if (type === 'month') this.setActive(addMonths(this._active, delta));
            else this.setActive(addYears(this._active, delta));
          },

          movePage(direction, large) {
            const type = this.currentType();
            if (type === 'day' || type === 'week') {
              this.setActive(addMonths(this._active, direction * (large ? 12 : 1)));
            } else if (type === 'month') {
              this.setActive(addMonths(this._active, direction * (large ? 120 : 12)));
            } else {
              this.setActive(addYears(this._active, direction * (large ? 120 : 12)));
            }
          },

          moveEdge(edge) {
            const type = this.currentType();
            if (type === 'day' || type === 'week') {
              const offset = weekdayIndex(this._active);
              this.setActive(addDays(this._active, edge === 'start' ? -offset : 6 - offset));
              return;
            }
            if (type === 'month') {
              this.setActive({ y: this._active.y, m: edge === 'start' ? 1 : 12, d: 1 });
              return;
            }
            const start = Math.floor(this._active.y / 10) * 10;
            this.setActive({ y: edge === 'start' ? start : start + 11, m: 1, d: 1 });
          },

          navigate(direction) {
            const type = this.currentType();
            if (type === 'day' || type === 'week')
              this.setActive(addMonths(this._active, direction));
            else if (type === 'month') this.setActive(addMonths(this._active, direction * 12));
            else this.setActive(addYears(this._active, direction * 12));
          },

          /* ---------- 开合 ---------- */

          isOpen() {
            return this._panel?.matches(':popover-open') ?? false;
          },

          openPanel() {
            if (!this._popoverOk || this.isOpen()) return;
            if (this.ele.hasAttribute('disabled') || this.ele.hasAttribute('readonly')) return;
            this._overflowTip?.hide();
            this.syncActiveFromSelection();
            if (this.currentMode() === 'range' && this._selected.length === 1) {
              this._pending = this._selected[0];
              this._committed = [];
            } else {
              this._pending = null;
              this._committed = this._selected.slice();
            }
            this.refreshPanel();
            /* 显示 / 收起是原生动作，浏览器可能顺手把页面滚一下 */
            this._scrollGuard.run(() => this._panel.showPopover());
            this._control.focus({ preventScroll: true });
            this.syncOpenUI(true);
          },

          closePanel() {
            if (!this.isOpen()) return;
            this._scrollGuard.run(() => this._panel.hidePopover());
            if (this._pending !== null) {
              this._selected = this._committed.slice();
              this._pending = null;
              this.syncDisplay();
            }
            this.syncOpenUI(false);
          },

          syncOpenUI(open) {
            const changed = this._openState !== open;
            this._openState = open;
            this.mirror('data-open', open);
            if (!changed) return;
            if (open) {
              this.$emit('open');
              return;
            }
            if (this._returnFocus) {
              this._returnFocus = false;
              this._control?.focus({ preventScroll: true });
            }
            this.$emit('close');
          },

          onNativeToggle(event) {
            const nowOpen = event.newState === 'open';
            if (nowOpen && !this._active) {
              this.syncActiveFromSelection();
              this.refreshPanel();
            }
            this.syncOpenUI(nowOpen);
          },

          /* ---------- 选择 ---------- */

          selectKey(key) {
            if (!key || this.isKeyDisabled(key)) return;
            const mode = this.currentMode();
            this._touched = true;

            if (mode === 'single') {
              const changed = !(this._selected.length === 1 && this._selected[0] === key);
              this._selected = [key];
              this._pending = null;
              this._committed = [key];
              this.syncDisplay();
              this.reflectBoundValue();
              if (changed) this.emitChange();
              this._returnFocus = true;
              this.closePanel();
              return;
            }

            if (mode === 'multiple') {
              const index = this._selected.indexOf(key);
              if (index >= 0) this._selected.splice(index, 1);
              else this._selected.push(key);
              this._committed = this._selected.slice();
              this.syncDisplay();
              this.reflectBoundValue();
              this.refreshPanel();
              this.emitChange();
              return;
            }

            if (!this._pending) {
              this._pending = key;
              this._selected = [key];
              this.syncDisplay();
              this.refreshPanel();
              return;
            }

            const start = this._pending <= key ? this._pending : key;
            const end = this._pending <= key ? key : this._pending;
            this._selected = [start, end];
            this._pending = null;
            this._committed = [start, end];
            this.syncDisplay();
            this.reflectBoundValue();
            this.emitChange();
            this._returnFocus = true;
            this.closePanel();
          },

          emitChange() {
            this.$emit('change', { value: this.readValue() });
          },

          /* ---------- 交互 ---------- */

          onControlClick() {
            if (this.ele.hasAttribute('disabled') || this.ele.hasAttribute('readonly')) return;
            if (this.isOpen()) this.closePanel();
            else this.openPanel();
          },

          onKeyDown(event) {
            const key = event.key;
            if (key === 'Escape') {
              if (this.isOpen()) {
                event.preventDefault();
                this._returnFocus = true;
                this.closePanel();
              }
              return;
            }
            if (this.ele.hasAttribute('disabled') || this.ele.hasAttribute('readonly')) return;

            if (!this.isOpen()) {
              if (
                key === 'ArrowDown' ||
                key === 'ArrowUp' ||
                key === 'ArrowLeft' ||
                key === 'ArrowRight' ||
                key === 'PageUp' ||
                key === 'PageDown' ||
                key === 'Home' ||
                key === 'End'
              ) {
                event.preventDefault();
                this.openPanel();
                if (key === 'PageUp') this.movePage(-1, event.shiftKey);
                else if (key === 'PageDown') this.movePage(1, event.shiftKey);
                else if (key === 'Home') this.moveEdge('start');
                else if (key === 'End') this.moveEdge('end');
              }
              return;
            }

            const type = this.currentType();
            const isDay = type === 'day' || type === 'week';
            switch (key) {
              case 'ArrowLeft':
                event.preventDefault();
                this.moveActive(-1);
                break;
              case 'ArrowRight':
                event.preventDefault();
                this.moveActive(1);
                break;
              case 'ArrowUp':
                event.preventDefault();
                this.moveActive(isDay ? -7 : -3);
                break;
              case 'ArrowDown':
                event.preventDefault();
                this.moveActive(isDay ? 7 : 3);
                break;
              case 'PageUp':
                event.preventDefault();
                this.movePage(-1, event.shiftKey);
                break;
              case 'PageDown':
                event.preventDefault();
                this.movePage(1, event.shiftKey);
                break;
              case 'Home':
                event.preventDefault();
                this.moveEdge('start');
                break;
              case 'End':
                event.preventDefault();
                this.moveEdge('end');
                break;
              case 'Enter':
              case ' ':
              case 'Spacebar':
                event.preventDefault();
                this.selectKey(this.keyOfActive());
                break;
              default:
                break;
            }
          },

          /* 指针在面板里不抢焦点：焦点始终留在触发框上（网格由触发框的方向键驱动，面板不进 Tab 序列） */
          onPanelMouseDown(event) {
            event.preventDefault();
          },

          onFocusOut(event) {
            if (!this.isOpen()) return;
            const next = event.relatedTarget;
            if (!next || this.ele.contains(next)) return;
            this.closePanel();
          },

          onPanelKeyDown(event) {
            if (event.key !== 'Escape' || !this.isOpen()) return;
            event.preventDefault();
            this._returnFocus = true;
            this.closePanel();
          },

          onPrevMonth() {
            this.navigate(-1);
          },

          onNextMonth() {
            this.navigate(1);
          },

          onClear() {
            if (this.ele.hasAttribute('disabled') || this.ele.hasAttribute('readonly')) return;
            if (this._selected.length === 0) return;
            this._touched = true;
            this._selected = [];
            this._pending = null;
            this._committed = [];
            this.syncDisplay();
            this.reflectBoundValue();
            this.$emit('clear');
            this.emitChange();
            this._control.focus({ preventScroll: true });
            if (this.isOpen()) this.refreshPanel();
          },
        },
      });
  </script>
</template>
