<!-- mc-collapse — 折叠面板容器；设计取舍见 README.md「设计取舍」。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主 = 外框 */
    :host {
      display: block;
      box-sizing: border-box;
      border: 1px solid rgb(var(--mc-color-border, var(--mc-def-color-border)));
      border-radius: var(--mc-radius-lg, var(--mc-def-radius-lg));
      background-color: rgb(var(--mc-color-surface, var(--mc-def-color-surface)));
      overflow: hidden; /* 首尾子项跟着圆角裁掉 */
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));

      /* 尺寸通道：子项在另一个 shadow root 里，容器选择器够不到，只能靠继承 */
      --mc-collapse-header-h: var(--mc-control-h-md, var(--mc-def-control-h-md));
      --mc-collapse-pad-x: var(--mc-space-4, var(--mc-def-space-4));
      --mc-collapse-body-pad: var(--mc-space-4, var(--mc-def-space-4));
      --mc-collapse-font: var(--mc-text-sm, var(--mc-def-text-sm));
    }

    /* 2. 尺寸：三档（规范 1.3） */
    :host([size='sm']) {
      --mc-collapse-header-h: var(--mc-control-h-sm, var(--mc-def-control-h-sm));
      --mc-collapse-pad-x: var(--mc-space-3, var(--mc-def-space-3));
      --mc-collapse-body-pad: var(--mc-space-3, var(--mc-def-space-3));
      --mc-collapse-font: var(--mc-text-xs, var(--mc-def-text-xs));
    }
    :host([size='lg']) {
      --mc-collapse-header-h: var(--mc-control-h-lg, var(--mc-def-control-h-lg));
      --mc-collapse-pad-x: var(--mc-space-5, var(--mc-def-space-5));
      --mc-collapse-body-pad: var(--mc-space-5, var(--mc-def-space-5));
      --mc-collapse-font: var(--mc-text-base, var(--mc-def-text-base));
    }

    /* 3. 子项：框属于容器，子项自己不带边框 */
    ::slotted(mc-collapse-item) {
      display: block;
      border-top: 1px solid rgb(var(--mc-color-border, var(--mc-def-color-border)));
    }
    ::slotted(mc-collapse-item:first-of-type) {
      border-top: 0;
    }
  </style>

  <slot></slot>

  <script>
    export default async () => ({
      tag: 'mc-collapse',

      attrs: {
        accordion: null, // 手风琴：同一时刻只允许一个子项展开
        size: 'md',
      },

      attached() {
        this._onOpen = (event) => this.onItemOpen(event);
        this.ele.addEventListener('open', this._onOpen);
      },

      detached() {
        this.ele.removeEventListener('open', this._onOpen);
      },

      proto: {
        /** 子项展开 → 收起同容器里其它开着的。只认直接子项，嵌套手风琴才不会互相误伤。 */
        onItemOpen(event) {
          if (this.accordion === null) return;
          const opened = event.target;
          if (opened.parentElement !== this.ele) return;
          for (const item of this.ele.querySelectorAll(':scope > mc-collapse-item')) {
            if (item !== opened && item.open) item.open = false;
          }
        },
      },
    });
  </script>
</template>
