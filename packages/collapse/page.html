      <table class="doc-table">
        <thead>

            <th>值</th>
            <th>默认</th>
            <th>说明</th>

        </thead>

          </tr>
          <tr>
            <td><code>name</code></td>
            <td>字符串</td>

          </tr>
          <tr>
            <td><code>open</code></td>
            <td>布尔</td>
            <td>—</td>
            <td>展开状态。既是初始值也是运行时状态（JS 里读写 <code>item.open</code>）</td>
          </tr>
          <tr>
            <td><code>disabled</code></td>
            <td>布尔</td>
            <td>—</td>
            <td>禁用：点不动、<kbd>Tab</kbd> 跳过、读屏可感知</td>
          </tr>
        </tbody>
      </table>

          </tr>

          </tr>
        </tbody>

        </li>
        <li>组件不做高度过渡；要动画自己加在 <code>::part(body)</code> 上。</li>
      </ul>
