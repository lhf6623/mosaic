<!-- mc-collapse-item — 折叠面板的子项（配合 mc-collapse 使用）；设计取舍见 README.md「设计取舍」。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <link rel="stylesheet" href="../icon/icons.generated.css" />
  <style>
    /* 1. 宿主盒模型。⚠️ 尺寸变量不能在这里写默认值，否则会盖掉容器继承来的值，size 永远不生效。 */
    :host {
      display: block;
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)));
    }

    /* 2. 头部 = 原生 <summary> */
    .mc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--mc-space-3, var(--mc-def-space-3));
      box-sizing: border-box;
      height: var(--mc-collapse-header-h, var(--mc-control-h-md, var(--mc-def-control-h-md)));
      padding-inline: var(--mc-collapse-pad-x, var(--mc-space-4, var(--mc-def-space-4)));
      font-size: var(--mc-collapse-font, var(--mc-text-sm, var(--mc-def-text-sm)));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
      cursor: pointer;
      user-select: none;
      list-style: none; /* 用自己的 chevron；下面那条给老 Safari */
    }
    .mc-header-text {
      min-width: 0;
      flex: 1 1 0%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mc-header::-webkit-details-marker {
      display: none;
    }
    .mc-header:hover {
      background-color: rgb(var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken)));
    }
    .mc-header:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring))); /* ring 令牌，不用 currentColor（P16） */
      outline-offset: -2px;
    }

    /* 3. 内容 */
    .mc-body {
      padding: 0 var(--mc-collapse-pad-x, var(--mc-space-4, var(--mc-def-space-4)))
        var(--mc-collapse-body-pad, var(--mc-space-4, var(--mc-def-space-4)));
      font-size: var(--mc-collapse-font, var(--mc-text-sm, var(--mc-def-text-sm)));
      color: rgb(var(--mc-color-fg-muted, var(--mc-def-color-fg-muted)));
    }

    /* 4. 状态（光标留宿主上） */
    :host([disabled]) {
      opacity: 0.5;
      cursor: not-allowed;
    }
    :host([disabled]) .mc-header {
      pointer-events: none; /* 鼠标堵死；键盘由 tabindex / click 拦截兜住 */
    }

    /* 5. chevron */
    .mc-chevron {
      flex: none;
      color: rgb(var(--mc-color-fg-subtle, var(--mc-def-color-fg-subtle)));
      transition: transform var(--mc-duration-base, var(--mc-def-duration-base))
        var(--mc-ease-standard, var(--mc-def-ease-standard));
    }
    :host([open]) .mc-chevron {
      transform: rotate(90deg);
    }
  </style>

  <details class="mc-details" :open="open !== null">
    <summary class="mc-header" part="header">
      <span class="mc-header-text"><slot name="header">{{header}}</slot></span>
      <span class="mc-chevron mc-icon-chevron-right" aria-hidden="true"></span>
    </summary>
    <div class="mc-body" part="body"><slot></slot></div>
  </details>

  <script>
    export default async () => ({
      tag: 'mc-collapse-item',

      attrs: {
        // 头部文案，富内容走同名插槽。叫 header 不叫 title —— title 会弹原生 tooltip（P32）
        header: '',
        name: '',
        // 布尔默认值必须是 null（P1）；open 既是初始值也是运行时状态
        open: null,
        disabled: null,
      },

      ready() {
        this._details = this.ele.shadowRoot.querySelector('.mc-details');
        this._header = this.ele.shadowRoot.querySelector('.mc-header');

        // 运行时状态走 property（规范 1.4）；setter 立刻同步 details，不等 ofa 那一拍（P4）
        Object.defineProperty(this.ele, 'open', {
          configurable: true,
          get: () => this.ele.hasAttribute('open'),
          set: (value) => {
            if (value) this.ele.setAttribute('open', '');
            else this.ele.removeAttribute('open');
            this.applyOpen();
          },
        });

        this.applyOpen();
        this.applyDisabled();
      },

      attached() {
        this._onToggle = () => this.onToggle();
        this._onHeaderClick = (event) => this.onHeaderClick(event);
        this._details.addEventListener('toggle', this._onToggle);
        // 捕获阶段：键盘激活（Enter / Space）也是一次可取消 click
        this._header.addEventListener('click', this._onHeaderClick, true);

        this._lastOpen = this._details.open; // 初始那次 toggle 不算事件（P5）
      },

      watch: {
        open() {
          this.applyOpen();
        },
        disabled() {
          this.applyDisabled();
        },
      },

      detached() {
        this._details?.removeEventListener('toggle', this._onToggle);
        this._header?.removeEventListener('click', this._onHeaderClick, true);
      },

      proto: {
        /** 宿主属性是唯一真相；setAttribute 那条路是异步的（P4），所以读属性本身 */
        applyOpen() {
          if (!this._details) return;
          const want = this.ele.hasAttribute('open');
          if (this._details.open !== want) this._details.open = want;
        },

        applyDisabled() {
          const off = this.ele.hasAttribute('disabled');
          if (off) {
            this._header.tabIndex = -1;
            this._header.setAttribute('aria-disabled', 'true');
          } else {
            this._header.removeAttribute('tabindex');
            this._header.removeAttribute('aria-disabled');
          }
        },

        /** 头部点击：禁用时拦掉；否则 preventDefault 后自切 details.open —— 浏览器 summary
         * 激活晚一拍，点完立刻读是旧值；原生 toggle 照旧会来，容器互斥不受影响。 */
        onHeaderClick(event) {
          if (this.ele.hasAttribute('disabled')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return;
          }

          // 头部里的控件（链接 / 按钮）自己处理，不抢
          const inside = event.target?.closest?.('a, button, input, select, textarea, [tabindex]');
          if (inside && inside !== this._header) return;

          event.preventDefault();
          this._details.open = !this._details.open;
          this.reflectOpen();
        },

        onToggle() {
          this.reflectOpen();

          const isOpen = this._details.open;
          if (this._lastOpen === undefined) {
            this._lastOpen = isOpen;
            return;
          }
          if (this._lastOpen === isOpen) return;
          this._lastOpen = isOpen;

          // 冒到容器要 composed（P22）；事件名不加 mc- 前缀（规范 1.5）
          this.emit(isOpen ? 'open' : 'close', {
            data: { name: this.name },
            bubbles: true,
            composed: true,
          });
        },

        reflectOpen() {
          if (this._details.open) this.ele.setAttribute('open', '');
          else this.ele.removeAttribute('open');
        },
      },
    });
  </script>
</template>
