<!-- mc-option — 下拉选项（配合 mc-select 使用）；设计取舍见 README.md「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 选项只是数据：文案由 mc-select 读默认插槽的 textContent，能点的行也由它画进面板，所以这里不占版面。 */
    :host {
      display: none;
    }
  </style>

  <slot></slot>

  <script>
    export default async () => ({
      tag: 'mc-option',

      attrs: {
        // 选项值：mc-select 的 value 用的就是它
        value: '',
        // 布尔属性默认值必须是 null（P1）
        disabled: null,
      },
    });
  </script>
</template>
