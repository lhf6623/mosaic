<template component>
  <style>
    /* 内部结构封在 shadow 里，只有标了 part 的节点能从外面改：
       base（触发框）、panel（面板）、option（面板里每一行）。 */
    #part-demo mc-select::part(base) {
      border-color: rgb(var(--mc-color-primary));
      border-radius: var(--mc-radius-full);
    }
    #part-demo mc-select::part(panel) {
      border-radius: 0;
      background-color: rgb(var(--mc-color-primary-subtle));
    }
    #part-demo mc-select::part(option) {
      border-radius: var(--mc-radius-full);
      color: rgb(var(--mc-color-primary));
      text-align: center;
    }
    /* 宿主钩子也能配 ::part()：面板展开时给触发框一圈高亮 */
    #part-demo mc-select[data-open]::part(base) {
      box-shadow: 0 0 0 3px rgb(var(--mc-color-primary-subtle));
    }
  </style>

  <mc-space block wrap-items id="part-demo">
    <mc-select placeholder="改 ::part(base) / ::part(panel) / ::part(option)">
      <mc-option value="bj">北京</mc-option>
      <mc-option value="sh">上海</mc-option>
      <mc-option value="gz">广州</mc-option>
    </mc-select>
  </mc-space>

  <script>
    export default async () => ({ tag: 'demo-select-part' });
  </script>
</template>
