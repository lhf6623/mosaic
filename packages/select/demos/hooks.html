<template component>
  <style>
    /* 外层 CSS 直接勾宿主上的状态钩子 —— 不用钻进 shadow，也不用 ::part */
    .field {
      display: inline-flex;
      align-items: center;
      gap: var(--mc-space-3);
    }

    .tip {
      color: rgb(var(--mc-color-fg-muted));
      font-size: 0.8125rem;
      opacity: 0;
      transition: opacity var(--mc-duration-fast, 0.15s) var(--mc-ease-standard, ease);

    /* 一项没选 → 「还没选」；选了 → 「已选好」；面板开着 → 「展开中」 */

    mc-select[data-filled] ~ .tip-filled,
    mc-select[data-open] ~ .tip-open {
