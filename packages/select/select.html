<!-- mc-select — 下拉选择（表单控件 + 浮层；选项行由 o-fill 模板渲染）；设计取舍与坑见 README.md「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <link rel="stylesheet" href="../icon/icons.generated.css" />
  <style>
    /* 1. 宿主盒模型 + 色槽默认值。高度 / 宽度写在宿主上，style="height:…" / "width:…" 直接压得住 */
    :host {
      display: inline-flex;
      position: relative; /* .mc-clear 的包含块（P21） */
      box-sizing: border-box;
      height: var(--mc-control-h-md, var(--mc-def-control-h-md));
      /* 固定宽度：占位 / 选中文案 / 多选拼接 / clearable 的 × 都不应该把盒子撑大或缩回去 */
      width: var(--mc-select-control-width);
      max-width: 100%;
      vertical-align: middle;
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-text-sm, var(--mc-def-text-sm));
      line-height: var(--mc-text-sm-lh, var(--mc-def-text-sm-lh));
      color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)));

      /* L3 组件令牌：默认引用 L2 语义令牌，按实例覆盖写在宿主 style 上 */
      --mc-select-control-bg: var(--mc-color-surface, var(--mc-def-color-surface));
      --mc-select-control-border: var(--mc-color-border, var(--mc-def-color-border));
      --mc-select-control-radius: var(--mc-radius-md, var(--mc-def-radius-md));
      --mc-select-control-pad-x: var(--mc-space-4, var(--mc-def-space-4));
      --mc-select-control-width: 12rem;
      --mc-select-offset: var(--mc-space-2, var(--mc-def-space-2));
      --mc-select-panel-bg: var(--mc-color-surface-raised, var(--mc-def-color-surface-raised));
      --mc-select-panel-border: var(--mc-color-border-strong, var(--mc-def-color-border-strong));
      --mc-select-panel-radius: var(--mc-radius-lg, var(--mc-def-radius-lg));
      --mc-select-panel-pad: var(--mc-space-2, var(--mc-def-space-2));
      --mc-select-option-color: var(--mc-color-fg, var(--mc-def-color-fg));
      --mc-select-option-bg-highlight: var(
        --mc-color-surface-sunken,
        var(--mc-def-color-surface-sunken)
      );
      --mc-select-option-bg-selected: var(
        --mc-color-primary-subtle,
        var(--mc-def-color-primary-subtle)
      );
      --mc-select-option-color-selected: var(--mc-color-primary, var(--mc-def-color-primary));
      --mc-select-placeholder-color: var(--mc-color-fg-subtle, var(--mc-def-color-fg-subtle));
      --mc-select-icon-color: var(--mc-color-fg-subtle, var(--mc-def-color-fg-subtle));
      --mc-select-clear-color: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
      --mc-select-clear-bg-hover: var(
        --mc-color-surface-sunken,
        var(--mc-def-color-surface-sunken)
      );
    }

    /* 2. 尺寸：三档只动宿主高度与字号，内部控件靠继承 / 100% 跟上 */
    :host([size='sm']) {
      height: var(--mc-control-h-sm, var(--mc-def-control-h-sm));
      font-size: var(--mc-text-xs, var(--mc-def-text-xs));
    }
    :host([size='lg']) {
      height: var(--mc-control-h-lg, var(--mc-def-control-h-lg));
      font-size: var(--mc-text-base, var(--mc-def-text-base));
    }

    /* 3. 状态：禁用压暗、只读不改外观、invalid 只换边框色槽 */
    :host([disabled]) {
      opacity: 0.5;
      cursor: not-allowed;
    }
    :host([invalid]) {
      --mc-select-control-border: var(--mc-color-danger, var(--mc-def-color-danger));
    }

    /* 4. 触发框（part="base"）：视觉全在这里，使用者 style="…" 压得住宿主 */
    .mc-control {
      flex: 1 1 auto;
      min-width: 0;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      gap: var(--mc-space-2, var(--mc-def-space-2));
      padding-inline: var(--mc-select-control-pad-x);
      border: 1px solid rgb(var(--mc-select-control-border));
      border-radius: var(--mc-select-control-radius);
      background-color: rgb(var(--mc-select-control-bg));
      color: inherit;
      font: inherit;
      text-align: start;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      /* 锚点挂在这里（必须是自己 shadow 里的元素）：面板靠它做 CSS 锚点定位 */
      anchor-name: --mc-select-anchor; /* @internal：锚点标识，给 anchor-name / position-anchor 用 */
    }
    .mc-control:focus-visible {
      /* 焦点环用 ring 令牌，不用 currentColor（P16） */
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }
    :host([disabled]) .mc-control {
      cursor: not-allowed;
    }
    :host([readonly]) .mc-control {
      cursor: default;
    }

    .mc-value {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    :host([data-empty]) .mc-value {
      color: rgb(var(--mc-select-placeholder-color));
    }
    .mc-chevron {
      flex: none;
      color: rgb(var(--mc-select-icon-color));
      transition: transform var(--mc-duration-fast, var(--mc-def-duration-fast))
        var(--mc-ease-standard, var(--mc-def-ease-standard));
    }
    :host([data-open]) .mc-chevron {
      transform: rotate(180deg);
    }

    /* 清除按钮：控制框的兄弟（不能嵌进 <button> 里），绝对定位压在右端 */
    .mc-clear {
      display: none;
      position: absolute;
      z-index: 1;
      right: var(--mc-space-2, var(--mc-def-space-2));
      top: 50%;
      translate: 0 -50%;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      width: var(--mc-space-5, var(--mc-def-space-5));
      height: var(--mc-space-5, var(--mc-def-space-5));
      padding: 0;
      border: 0;
      border-radius: var(--mc-radius-full, var(--mc-def-radius-full));
      background-color: transparent;
      color: rgb(var(--mc-select-clear-color));
      font-size: 1em;
      line-height: 1;
      cursor: pointer;
    }
    .mc-clear:hover {
      background-color: rgb(var(--mc-select-clear-bg-hover));
    }
    .mc-clear:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }
    :host([clearable][data-filled]) .mc-clear {
      display: inline-flex;
    }
    :host([clearable][data-filled]) .mc-chevron {
      display: none;
    }
    :host([clearable][data-filled]) .mc-control {
      padding-inline-end: var(--mc-space-8, var(--mc-def-space-8));
    }

    /* 5. 面板与选项 */
    .mc-panel {
      /* ⚠️ UA 给 `[popover]` 的 inset / margin / border / padding / 底色都要显式接管，否则那对 auto 会吃掉锚点定位 */
      position: fixed;
      inset: auto;
      margin: 0;
      box-sizing: border-box;
      min-width: anchor-size(width);
      max-width: min(24rem, calc(100vw - var(--mc-space-8, var(--mc-def-space-8))));
      max-height: min(16rem, calc(100vh - var(--mc-space-8, var(--mc-def-space-8))));
      padding: var(--mc-select-panel-pad);
      border: 0;
      overflow-y: auto;
      border-radius: var(--mc-select-panel-radius);
      background-color: rgb(var(--mc-select-panel-bg));
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: inherit;
      line-height: inherit;
      /* 描边跟「面板 + 内容」的整体轮廓做：1px 模糊当描边，第二层才是投影 */
      filter: drop-shadow(0 0 1px rgb(var(--mc-select-panel-border)))
        drop-shadow(var(--mc-shadow-panel, var(--mc-def-shadow-panel)));

      /* 锚点定位：锚是 shadow 内的 .mc-control。默认 bottom-start 写基类 —— ofa 里 `:host()` 嵌 `:not()` 会静默失效（P14） */
      position-anchor: --mc-select-anchor; /* @internal：锚点标识，给 anchor-name / position-anchor 用 */
      position-try-fallbacks: flip-block;
      top: anchor(bottom);
      left: anchor(left);
      margin-top: var(--mc-select-offset);
    }

    .mc-list {
      display: flex;
      flex-direction: column;
      gap: var(--mc-space-1, var(--mc-def-space-1));
    }

    /* 行是原生 <button>（键盘基线：可交互元素用原生元素），UA 的边框 / 底色 / 字体要显式接管 */
    .mc-option {
      box-sizing: border-box;
      display: block;
      width: 100%;
      border: 0;
      background-color: transparent;
      font: inherit;
      text-align: start;
      min-height: var(--mc-control-h-md, var(--mc-def-control-h-md));
      padding-inline: var(--mc-space-3, var(--mc-def-space-3));
      border-radius: var(--mc-radius-md, var(--mc-def-radius-md));
      color: rgb(var(--mc-select-option-color));
      line-height: var(--mc-control-h-md, var(--mc-def-control-h-md));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      user-select: none;
    }
    :host([size='sm']) .mc-option {
      min-height: var(--mc-control-h-sm, var(--mc-def-control-h-sm));
      line-height: var(--mc-control-h-sm, var(--mc-def-control-h-sm));
    }
    :host([size='lg']) .mc-option {
      min-height: var(--mc-control-h-lg, var(--mc-def-control-h-lg));
      line-height: var(--mc-control-h-lg, var(--mc-def-control-h-lg));
    }
    .mc-option:hover,
    .mc-option[data-active] {
      background-color: rgb(var(--mc-select-option-bg-highlight));
    }
    .mc-option[data-selected='true'] {
      background-color: rgb(var(--mc-select-option-bg-selected));
      color: rgb(var(--mc-select-option-color-selected));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
    }
    .mc-option[data-disabled='true'] {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* 正向覆盖，不用 :host(:not(...))（P14） */
    .mc-option[data-disabled='true']:hover,
    .mc-option[data-disabled='true'][data-active] {
      background-color: transparent;
    }

    /* mc-option 只是数据：行由组件渲染进面板（part="option"），这一槽只用来接住它们 */
    slot.mc-options {
      display: none;
    }
  </style>

  <button
    class="mc-control"
    part="base"
    type="button"
    attr:disabled="disabled !== null"
    on:click="onControlClick"
    on:keydown="onKeyDown">
    <span class="mc-value">{{displayText}}</span>
    <span class="mc-chevron mc-icon-chevron-down"></span>
  </button>

  <button class="mc-clear" type="button" attr:disabled="disabled !== null" on:click="onClear">
    <span class="mc-icon-close"></span>
  </button>

  <!-- 面板：原生 popover 进 top layer，位置交给 CSS 锚点定位；⚠️ 刻意用 popover="manual"：auto 的 light dismiss 会「点第二次关不掉」（P20） -->
  <div
    class="mc-panel"
    part="panel"
    popover="manual"
    on:toggle="onNativeToggle"
    on:mousedown="onPanelMouseDown">
    <!-- 选项行由模板渲染（唯一渲染源）：一行一个原生 <button>，状态全走 attr: 绑定 -->
    <div class="mc-list">
      <o-fill :value="rows" fill-key="id">
        <button
          class="mc-option"
          part="option"
          type="button"
          tabindex="-1"
          attr:data-selected="$data.selected ? 'true' : 'false'"
          attr:data-disabled="$data.disabled ? 'true' : null"
          attr:data-active="$data.active ? '' : null"
          on:click="$host.selectIndex($data.id)">
          {{$data.label}}
        </button>
      </o-fill>
    </div>
  </div>

  <slot class="mc-options"></slot>

  <script>
    /* 定住滚动条的小工具：开合原生浮层时浏览器可能顺手滚页面（火狐实测，见那个文件头） */
    import { attachFloatingScrollGuard } from '../boot/scroll-pin.js';
    /* 触发框内容被 ellipsis 裁掉时，hover / focus 弹完整文案 */
    import { attachOverflowTip } from '../boot/overflow-tip.js';
    import { withEmits } from '../boot/emits.js';

    export default async ({ load }) => {
      /* mc-option 是这个单元的另一半：先注册它，attached() 收选项时它们才已升级好（路径相对本文件） */
      await load('./option.html');

      return withEmits({
        tag: 'mc-select',

        // 本组件对外事件：声明即派发入口（见 boot/emits.js）
        emits: {
          change: { data: ['value'] },
          clear: {},
          open: {},
          close: {},
        },

        attrs: {
          /* 绑定通道：ofa 原生的 `:value="form.city"`（单向）/ `sync:value="form.city"`（双向）落在这个属性上（同 mc-input）。
             默认 null：ofa 不会凭空写一个空属性，"属性在不在"才可靠（P32）；不给就是非受控，初值走 default-value。 */
          value: null,
          /* 初始值在 HTML 属性 default-value（非受控）；运行时值走宿主 DOM property `value`（见 ready） */
          defaultValue: '',
          placeholder: '请选择',
          /* 布尔属性默认值必须是 null（P1）：写 false 会让裸属性 <mc-select multiple> 失效 */
          multiple: null,
          clearable: null,
          disabled: null,
          readonly: null,
          invalid: null,
          size: 'md',
        },

        /* 可见内容全走模板，这些字段就是渲染数据：displayText = 触发框文案；
           rows = 选项行模型（id 就是它在 _items 里的下标，o-fill 按它复用行） */
        data: {
          displayText: '',
          rows: [],
        },

        ready() {
          const root = this.ele.shadowRoot;
          this._control = root.querySelector('.mc-control');
          this._valueEl = root.querySelector('.mc-value');
          this._clearEl = root.querySelector('.mc-clear');
          this._panel = root.querySelector('.mc-panel');
          this._slot = root.querySelector('slot.mc-options');

          this._items = [];
          this._active = -1;
          this._openState = false;
          this._live = false;
          this._initialized = false;
          this._touched = false;
          this._returnFocus = false;
          this._seen = new Set();

          /* 运行时值走宿主 DOM property（规范 1.4 / P18）：读 = 选中项的值，写 = 直接改选中态，
             并回写成 value 属性（ofa 的 sync:value 观察的就是它） */
          Object.defineProperty(this.ele, 'value', {
            configurable: true,
            get: () => this.readValue(),
            set: (value) => this.writeValue(value),
          });

          /* 滚动守卫：一行接线，它自己监听面板的 beforetoggle / toggle；显式显示 / 收起那两行再包一层 run() */
          this._scrollGuard = attachFloatingScrollGuard(this.ele, this._panel);
          this._popoverOk = typeof this._panel?.showPopover === 'function';
        },

        attached() {
          this._onSlotChange = () => this.collectOptions();
          this._slot.addEventListener('slotchange', this._onSlotChange);

          /* 点外部关闭必须用 composedPath（P20）：contains(e.target) 在 shadow 边界上拿到的是宿主，必然误判 */
          this._onDocPointerDown = (event) => {
            if (!this.isOpen()) return;
            if (event.composedPath().includes(this.ele)) return;
            this.closePanel();
          };
          document.addEventListener('pointerdown', this._onDocPointerDown, true);

          /* 到这里构造期已结束，才允许往宿主写属性（P31） */
          this._live = true;
          /* 长选项 / 多选拼接会把 .mc-value 裁掉；提示本身住在 shadow 里的 top layer */
          this._overflowTip = attachOverflowTip(this.ele, this._valueEl);
          this.collectOptions();
        },

        detached() {
          document.removeEventListener('pointerdown', this._onDocPointerDown, true);
          this._slot?.removeEventListener('slotchange', this._onSlotChange);
          this._overflowTip?.dispose();
          this._overflowTip = null;
          this._scrollGuard?.dispose();
        },

        watch: {
          /* ⚠️ ofa 初始化会把每条 watch 空跑一遍（P5），那次在构造期写宿主属性会抛 NotSupportedError（P31） */
          multiple() {
            if (this.skipInit('multiple')) return;
            this.collectOptions();
          },
          placeholder() {
            if (this.skipInit('placeholder')) return;
            this.syncDisplay();
          },
          defaultValue() {
            if (this.skipInit('defaultValue')) return;
            /* 使用者显式写过 value（或绑了 value 属性）之后，default-value 不再改写运行时值 */
            if (this._touched) return;
            this.applySelection(this.parseValues(this.ele.getAttribute('default-value') ?? ''));
            this.syncDisplay();
          },
          /* ofa 的绑定写的就是这个属性：数据一变就重选（受控模式下它比 default-value 优先） */
          value() {
            if (this.skipInit('value')) return;
            const raw = this.ele.getAttribute('value');
            if (raw === null) return;
            this._touched = true;
            this.applySelection(this.parseValues(raw));
            this.syncDisplay();
          },
          /* 这几个只走 CSS / 点击时的判断：绑定的 "false" 要收一下（normalizeBoolAttrs） */
          disabled() {
            if (this.skipInit('disabled')) return;
            this.syncDisplay();
          },
          readonly() {
            if (this.skipInit('readonly')) return;
            this.syncDisplay();
          },
          invalid() {
            if (this.skipInit('invalid')) return;
            this.syncDisplay();
          },
          clearable() {
            if (this.skipInit('clearable')) return;
            this.syncDisplay();
          },
        },

        proto: {
          /** 每条 watch 的首次（构造期）触发都要跳过，但每条各跳一次（P5） */
          skipInit(key) {
            if (this._seen.has(key)) return false;
            this._seen.add(key);
            return true;
          },

          isMultiple() {
            return this.ele.hasAttribute('multiple');
          },

          isOpen() {
            return this._panel?.matches(':popover-open') ?? false;
          },

          /** placeholder 是声明过的字符串属性：ofa 可能把没写的它也反射成空串（P32），「空 = 用默认文案」由这里兜 */
          placeholderText() {
            const own = this.ele.getAttribute('placeholder');
            if (own) return own;
            return this.placeholder || '请选择';
          },

          /* ---------- 选项收集与渲染 ----------
             行由模板渲染（o-fill）：这里只把 mc-option 收成行模型，状态写进 data.rows，
             模板据此落 part="option" / data-selected / data-disabled / data-active。 */

          /** 用 querySelectorAll 而不是 slot.assignedElements：`o-fill` 渲染的条目住它自己 light DOM 里，后者只给到容器（P12） */
          collectOptions() {
            /* 绑了 value 属性（受控）就以它为准；否则：已初始化 → 沿用当前选中项，首次挂载 → default-value */
            const bound = this.ele.getAttribute('value');
            const previous =
              bound !== null
                ? this.parseValues(bound)
                : this._initialized
                  ? new Set(this.readValueArray())
                  : this.parseValues(this.ele.getAttribute('default-value') ?? '');
            this._initialized = true;

            this._items = [...this.ele.querySelectorAll('mc-option')].map((el) => ({
              value: (el.getAttribute('value') ?? '').trim(),
              label: (el.textContent ?? '').replace(/\s+/g, ' ').trim(),
              disabled: el.hasAttribute('disabled'),
            }));
            if (this._active >= this._items.length) this._active = -1;

            this.rows = this.buildRows(previous);
            this.syncDisplay();
          },

          /** 行模型：选中 / 键盘高亮都是模型里的布尔字段（行由模板渲染，不再持有 DOM 引用） */
          buildRows(values) {
            let taken = false;
            return this._items.map((item, index) => {
              const on = values.has(item.value) && (this.isMultiple() || !taken);
              if (on) taken = true;
              return {
                id: index,
                label: item.label,
                value: item.value,
                disabled: item.disabled,
                selected: on,
                active: index === this._active,
              };
            });
          },

          /* ---------- 值读写 ---------- */

          /** 属性 / property 收到的一律规范化成「值集合」：`default-value` 是逗号分隔串，property 是数组 */
          parseValues(raw) {
            const list = Array.isArray(raw) ? raw : String(raw ?? '').split(',');
            const out = new Set();
            for (const value of list) {
              const text = String(value ?? '').trim();
              if (text === '') continue;
              out.add(text);
              if (!this.isMultiple()) break; /* 单选只认第一个 */
            }
            return out;
          },

          applySelection(values) {
            this.rows = this.buildRows(values);
          },

          readValueArray() {
            return this.rows.filter((row) => row.selected).map((row) => row.value);
          },

          /** 运行时值的唯一出口：multiple 给数组、单选给字符串 */
          readValue() {
            const values = this.readValueArray();
            return this.isMultiple() ? values : (values[0] ?? '');
          },

          writeValue(next) {
            this._touched = true;
            this.applySelection(this.parseValues(next));
            this.syncDisplay();
            this.reflectBoundValue();
          },

          /** 把当前选中项写回 value 属性，让 ofa 的 sync:value 观察得到（multiple 用逗号串，与 default-value 同一口径） */
          reflectBoundValue() {
            const now = this.readValue();
            const text = Array.isArray(now) ? now.join(',') : String(now ?? '');
            if (this.ele.getAttribute('value') === text) return;
            this.ele.setAttribute('value', text);
          },

          /* ---------- 显示 ---------- */

          /** 把绑定写法 `disabled="false"` 规范化掉（有就是空串、没有就没有）：CSS 的 :host([disabled]) 才判得准。
              宿主属性要 attached 之后才能写（P31），_live 就是那个门槛（同 mc-input 的 _mounted）。 */
          normalizeBoolAttrs() {
            if (!this._live) return;
            for (const name of ['disabled', 'readonly', 'invalid', 'clearable']) {
              const raw = this.ele.getAttribute(name);
              if (raw === null || raw === '') continue;
              if (raw === 'false') this.ele.removeAttribute(name);
              else this.ele.setAttribute(name, '');
            }
          },

          syncDisplay() {
            this.normalizeBoolAttrs();
            const selected = this.rows.filter((row) => row.selected);
            const empty = selected.length === 0;
            this.mirror('data-empty', empty);
            this.mirror('data-filled', !empty);
            /* 文案进模板后要等微任务那一拍才落到 DOM，所以溢出提示晚一拍再量 */
            this.displayText = empty
              ? this.placeholderText()
              : selected.map((row) => row.label).join(', ');
            queueMicrotask(() => this._overflowTip?.check());
          },

          /** 只在真的变了的时候写宿主 —— 否则每次属性变动都白触发一轮样式重算 */
          mirror(name, on) {
            /* 构造期不许往宿主写属性（P31）：watch 的首触发已经跳过了，这里再兜一层 */
            if (!this._live) return;
            if (on === this.ele.hasAttribute(name)) return;
            if (on) this.ele.setAttribute(name, '');
            else this.ele.removeAttribute(name);
          },

          /* ---------- 高亮 ---------- */

          enabledIndexes() {
            return this._items
              .map((item, index) => (item.disabled ? -1 : index))
              .filter((index) => index >= 0);
          },

          firstEnabledIndex() {
            return this.enabledIndexes()[0] ?? -1;
          },

          lastEnabledIndex() {
            const all = this.enabledIndexes();
            return all[all.length - 1] ?? -1;
          },

          initialActiveIndex() {
            const selected = this.rows.findIndex((row) => row.selected && !row.disabled);
            return selected >= 0 ? selected : this.firstEnabledIndex();
          },

          setActive(index) {
            this._active = index;
            this.rows = this.rows.map((row, i) =>
              row.active === (i === index) ? row : { ...row, active: i === index },
            );
            if (index < 0) return;
            /* 滚动是行为层（模板表达不了）：等模板把行更新完再滚 */
            queueMicrotask(() => {
              const row = this.ele.shadowRoot?.querySelectorAll('.mc-option')[index];
              row?.scrollIntoView({ block: 'nearest' });
            });
          },

          clearActive() {
            this.setActive(-1);
          },

          moveActive(delta) {
            const all = this.enabledIndexes();
            if (!all.length) return;
            const current = all.indexOf(this._active);
            const next =
              current < 0
                ? all[delta > 0 ? 0 : all.length - 1]
                : all[(current + delta + all.length) % all.length];
            this.setActive(next);
          },

          /* ---------- 开合 ---------- */

          openPanel() {
            if (!this._popoverOk || this.isOpen()) return;
            if (this.ele.hasAttribute('disabled') || this.ele.hasAttribute('readonly')) return;
            this._overflowTip?.hide();
            /* 显示 / 收起是原生动作，浏览器可能顺手把页面滚一下 */
            this._scrollGuard.run(() => this._panel.showPopover());
            this._control.focus({ preventScroll: true });
            this.setActive(this.initialActiveIndex());
            this.syncOpenUI(true);
          },

          closePanel() {
            if (!this.isOpen()) return;
            this._scrollGuard.run(() => this._panel.hidePopover());
            this.clearActive();
            this.syncOpenUI(false);
          },

          syncOpenUI(open) {
            const changed = this._openState !== open;
            this._openState = open;
            this.mirror('data-open', open);
            if (!changed) return;
            if (open) {
              this.$emit('open');
              return;
            }
            this.clearActive();
            if (this._returnFocus) {
              this._returnFocus = false;
              this._control?.focus({ preventScroll: true });
            }
            this.$emit('close');
          },

          /** 原生 toggle 只当兜底同步：状态与事件不靠它（排队发的 toggle 在「刚关就又开」的连招里会丢），浏览器自己把面板收掉时状态也收敛回来 */
          onNativeToggle(event) {
            const nowOpen = event.newState === 'open';
            if (nowOpen && this._active < 0) this.setActive(this.initialActiveIndex());
            this.syncOpenUI(nowOpen);
          },

          /* ---------- 交互 ---------- */

          onControlClick() {
            if (this.ele.hasAttribute('disabled') || this.ele.hasAttribute('readonly')) return;
            if (this.isOpen()) this.closePanel();
            else this.openPanel();
          },

          onKeyDown(event) {
            const key = event.key;
            if (key === 'Escape') {
              if (this.isOpen()) {
                event.preventDefault();
                this._returnFocus = true;
                this.closePanel();
              }
              return;
            }
            if (this.ele.hasAttribute('disabled') || this.ele.hasAttribute('readonly')) return;

            if (!this.isOpen()) {
              if (key === 'ArrowDown' || key === 'ArrowUp' || key === 'Home' || key === 'End') {
                event.preventDefault();
                this.openPanel();
                if (key === 'ArrowUp' || key === 'End') this.setActive(this.lastEnabledIndex());
                else this.setActive(this.initialActiveIndex());
              }
              /* Enter / 空格不在这里管：原生 <button> 自己会发 click，走 onControlClick 那条路 */
              return;
            }

            switch (key) {
              case 'ArrowDown':
                event.preventDefault();
                this.moveActive(1);
                break;
              case 'ArrowUp':
                event.preventDefault();
                this.moveActive(-1);
                break;
              case 'Home':
                event.preventDefault();
                this.setActive(this.firstEnabledIndex());
                break;
              case 'End':
                event.preventDefault();
                this.setActive(this.lastEnabledIndex());
                break;
              case 'Enter':
              case ' ':
              case 'Spacebar':
                /* 不 preventDefault 的话，开着的面板会被这次 click 又关掉 */
                event.preventDefault();
                if (this._active >= 0) this.selectIndex(this._active);
                break;
              default:
                break;
            }
          },

          /** 选中：单选选完就收面板；多选只切这一项，面板留着继续选 */
          selectIndex(index) {
            const item = this.rows[index];
            if (!item || item.disabled) return;
            if (this.ele.hasAttribute('disabled') || this.ele.hasAttribute('readonly')) return;

            const multiple = this.isMultiple();
            this.rows = this.rows.map((row, i) =>
              multiple
                ? i === index
                  ? { ...row, selected: !row.selected }
                  : row
                : { ...row, selected: i === index },
            );
            this.syncDisplay();
            this.reflectBoundValue();
            this.emitChange();
            /* 单选：值先落定、change 先发，再收面板（事件顺序 change → close） */
            if (!multiple) {
              this._returnFocus = true;
              this.closePanel();
            }
          },

          /** 面板里没有可聚焦元素：压掉 mousedown 的默认聚焦，焦点留在触发框上，键盘才继续管用 */
          onPanelMouseDown(event) {
            event.preventDefault();
          },

          onClear() {
            if (this.ele.hasAttribute('disabled') || this.ele.hasAttribute('readonly')) return;
            if (this.readValueArray().length === 0) return;
            this._touched = true;
            this.applySelection(new Set());
            this.syncDisplay();
            this.reflectBoundValue();
            this.$emit('clear');
            this.emitChange();
            this._control.focus({ preventScroll: true });
          },

          emitChange() {
            /* 内部原生 change 穿不出 shadow（P19），所以由组件自己转发成一个 composed 的 change */
            this.$emit('change', { value: this.readValue() });
          },
        },
      });
    };
  </script>
</template>
