    <h1>Scroll Area <code>mc-scroll-area</code></h1>
    <p class="doc-lead">
      滚动容器：内容自己给高度，滚动条由组件画（覆盖式、跟着主题走），滚动本身仍是原生的 ——
      键盘、触屏惯性、锚点、页内查找全都照旧。
    </p>
    <mc-alert class="doc-notes" color="warning" icon heading="注意事项">
      <ul>
        <li>
          <strong>高度（或宽度）由使用者给</strong>：组件只管滚与画条子，不猜你要多高。
          不给高度时宿主跟着内容长，永远不溢出，也就永远不滚。
        </li>
        <li>
          <strong>条子是覆盖式的</strong>：贴在内沿、不占内容宽度（所以溢出与否都不会让内容横跳），
          代价是盖住最边上那 <code>--mc-scroll-area-w</code> 宽的一条 ——
          长代码块这类内容记得给自己的 <code>part="viewport"</code> 加右内边距。
        </li>
        <li>
          <strong>一次只滚一条轴</strong>：两条轴同时要的场合用普通 <code>overflow</code> 容器，
          两个滑块互相影响、角落交叉，不值得为它把接口撑大一倍。
        </li>
      </ul>
    </mc-alert>
