<!--
  mc-table — 数据表格。columns / data 是对象，运行时一律走 property（P6）。

  设计取舍 / 实现约束（为什么这么定、踩过哪些坑）不写在这里 —— 见同目录 README.md 的「设计取舍」。
  这份文件是要经 CDN 发给使用者的产物，注释会一起发出去，所以这里只留一行定位与指针。
-->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主盒模型 + 色槽默认值 */
    :host {
      display: block;
      box-sizing: border-box;
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-table-font);
      color: rgb(var(--mc-table-fg));

      /* 色槽：L3 组件令牌，默认引用 L2 语义令牌。按实例覆盖：
         <mc-table style="--mc-table-head-bg: var(--mc-color-primary-subtle, var(--mc-def-color-primary-subtle))"> */
      --mc-table-font: var(--mc-text-sm, var(--mc-def-text-sm));
      --mc-table-fg: var(--mc-color-fg, var(--mc-def-color-fg));
      --mc-table-border: var(--mc-color-border, var(--mc-def-color-border));
      --mc-table-head-bg: var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken));
      --mc-table-head-fg: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
      --mc-table-stripe-bg: var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken));
      --mc-table-row-hover-bg: var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken));
      --mc-table-cell-pad-x: var(--mc-space-4, var(--mc-def-space-4));
      --mc-table-cell-pad-y: var(--mc-space-2, var(--mc-def-space-2));
      --mc-table-state-fg: var(--mc-color-fg-subtle, var(--mc-def-color-fg-subtle));
      --mc-table-state-pad: var(--mc-space-8, var(--mc-def-space-8));
    }

    /* 2. 表格本体。分隔边框用初始值（separate）就够，只把间距归零 ——
           "把相邻边框合成一条"那条声明本来也不需要 */
    .mc-table {
      width: 100%;
      border-spacing: 0;
      text-align: left;
    }
    .mc-table th,
    .mc-table td {
      padding: var(--mc-table-cell-pad-y) var(--mc-table-cell-pad-x);
      border-bottom: 1px solid rgb(var(--mc-table-border));
      text-align: left;
    }
    .mc-table th {
      background-color: rgb(var(--mc-table-head-bg));
      color: rgb(var(--mc-table-head-fg));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
      white-space: nowrap;
    }
    .mc-table tbody tr:last-child td {
      border-bottom: 0;
    }

    /* 3. 状态：条纹与悬停都由属性驱动（变体一律 :host([attr])） */
    :host([striped]) .mc-table tbody tr:nth-child(even) {
      background-color: rgb(var(--mc-table-stripe-bg));
    }
    :host([hoverable]) .mc-table tbody tr:hover {
      background-color: rgb(var(--mc-table-row-hover-bg));
    }

    /* 4. 空态 / 加载态：常驻 DOM，靠内部 data-empty 与宿主 [loading] 切显隐（不用 o-if，P10） */
    .mc-state {
      padding: var(--mc-table-state-pad);
      color: rgb(var(--mc-table-state-fg));
      text-align: center;
    }
    .mc-empty,
    .mc-loading {
      display: none;
    }
    .mc-wrap[data-empty] .mc-empty {
      display: block;
    }
    :host([loading]) .mc-loading {
      display: block;
    }
  </style>

  <div class="mc-wrap">
    <table class="mc-table" part="table" attr:aria-busy="loading !== null ? 'true' : null">
      <thead>
        <tr>
          <!-- 写在 <table> 里的自定义元素会被 HTML 解析器搬到表格外面（foster parenting），
               所以这两个 o-fill 在 attached() 里被挪回 thead / tbody —— 见同目录 README -->
          <o-fill id="mc-table-head" name="mc-table-head" :value="cols"></o-fill>
        </tr>
      </thead>
      <tbody>
        <o-fill id="mc-table-rows" name="mc-table-row" :value="rows" fill-key="rowKey"></o-fill>
      </tbody>
    </table>
    <div class="mc-state mc-empty"><slot name="empty">{{emptyText}}</slot></div>
    <div class="mc-state mc-loading"><slot name="loading">加载中…</slot></div>
  </div>

  <!-- 行 / 表头的模板住在具名 <template> 里：表格里放不了自定义元素，模板只能从外面取 -->
  <template name="mc-table-head">
    <th scope="col" part="cell" :style.width="$data.width">{{$data.title}}</th>
  </template>
  <template name="mc-table-row">
    <tr part="row" :html="$host.cellsHtml($data)"></tr>
  </template>

  <script>
    /** 单元格走 :html 通道，文本要自己转义（含 < 的值不能破结构） */
    const escapeHtml = (value) =>
      String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    export default async () => ({
      tag: 'mc-table',

      attrs: {
        /* 对象数组。属性写法只作 JSON 兼容（P6：走属性通道会被 JSON 序列化），
           运行时一律用 property：el.columns = [{ key, title }] */
        columns: null,
        /* ⚠️ 行数据**不能**像 columns 那样声明进 attrs：`data` 是 ofa 元素代理上的保留名
           （$.fn.data），声明它会让每次属性同步都往代理写一次 `data` → TypeError，
           整个组件渲染不出来（同 P7 / P31 那一族）。所以 data 只做宿主 property +
           自己听的属性观察（见 attached 的 MutationObserver）。 */
        striped: null,
        hoverable: null,
        loading: null,
        emptyText: '暂无数据',
      },

      data: {
        /* 渲染源：columns / data 规范化后的「非 attrs 键」字段。
           ⚠️ 规范化结果绝不能写回 attrs 声明的键 —— 会被 ofa 再次 JSON 序列化（P6） */
        cols: [],
        rows: [],
      },

      ready() {
        const root = this.ele.shadowRoot;
        this._headFill = root.querySelector('#mc-table-head');
        this._rowFill = root.querySelector('#mc-table-rows');
        this._wrap = root.querySelector('.mc-wrap');

        /* 挂载前就赋的 property（createElement 之后马上 el.data = …）落在宿主上只是普通属性，
           这里先收下来；构造期不能往宿主写属性（P31），所以访问器只装在 this.ele 的 JS 属性上 */
        const hasOwn = (key) => Object.prototype.hasOwnProperty.call(this.ele, key);
        this._presetColumns = hasOwn('columns') ? this.ele.columns : undefined;
        this._presetData = hasOwn('data') ? this.ele.data : undefined;

        Object.defineProperty(this.ele, 'columns', {
          configurable: true,
          get: () => this.cols,
          set: (value) => {
            this._propColumns = true;
            this.applyColumns(value);
          },
        });
        Object.defineProperty(this.ele, 'data', {
          configurable: true,
          get: () => this.rows,
          set: (value) => {
            this._propData = true;
            this.applyData(value);
          },
        });

        this._mounted = true; // 之后的 watch 才算真变化（P5）
      },

      attached() {
        /* 把被解析器搬出表格的 o-fill 挪回去。移动 DOM 节点不重新解析，所以行就是真 <tr>。
           append 同一个节点是幂等的，反复挂载也安全 */
        this._headFill && this.ele.shadowRoot.querySelector('thead tr')?.append(this._headFill);
        this._rowFill && this.ele.shadowRoot.querySelector('tbody')?.append(this._rowFill);

        /* 初始值放在这里而不是 ready()：ofa 会把 data 的初值铺在实例上，
           构造期写进去的值会被它盖掉（实测 rows 恒为空）。顺序 = 属性（JSON 兼容）→
           挂载前赋的 property（property 赢） */
        if (!this._applied) {
          this._applied = true;
          if (this.ele.hasAttribute('columns')) this.applyColumns(this.ele.getAttribute('columns'));
          if (this.ele.hasAttribute('data')) this.applyData(this.ele.getAttribute('data'));
          if (this._presetColumns !== undefined) {
            this._propColumns = true;
            this.applyColumns(this._presetColumns);
            this._presetColumns = undefined;
          }
          if (this._presetData !== undefined) {
            this._propData = true;
            this.applyData(this._presetData);
            this._presetData = undefined;
          }
        }

        /* data 没进 attrs（保留名），属性通道自己听。我们从不写这个属性，所以不会自激 */
        this._attrMo = new MutationObserver(() => {
          const raw = this.ele.getAttribute('data');
          const blank = raw == null || raw.trim() === '';
          if (blank && this._propData) return; // property 写的值不被空属性覆盖
          this.applyData(raw);
        });
        this._attrMo.observe(this.ele, { attributes: true, attributeFilter: ['data'] });
      },

      detached() {
        this._attrMo?.disconnect();
      },

      watch: {
        columns(value) {
          if (!this._mounted) return; // 首次触发落在构造期（P5）
          this.applyColumnsIfPresent(value);
        },
        loading() {
          this.applyEmpty();
        },
      },

      proto: {
        /** columns 回到空值时别把 property 写过的值擦掉（watch 与属性观察都走这里） */
        applyColumnsIfPresent(value) {
          const blank = value == null || String(value).trim() === '';
          if (blank && this._propColumns) return;
          this.applyColumns(value);
        },

        /** JSON 字符串 / 数组 / null → 数组（P6 的解析就这一处） */
        toArray(value) {
          if (value == null) return [];
          if (typeof value === 'string') {
            const text = value.trim();
            if (!text) return [];
            try {
              const parsed = JSON.parse(text);
              return Array.isArray(parsed) ? parsed : [];
            } catch {
              return [];
            }
          }
          return Array.isArray(value) ? value : [];
        },

        /** 列定义 → 内部 cols；title 缺省退回 key，width 统一成字符串（模板用 :style.width） */
        applyColumns(value) {
          this.cols = this.toArray(value)
            .filter((col) => col && typeof col === 'object')
            .map((col) => ({
              key: String(col.key ?? ''),
              title: col.title == null ? String(col.key ?? '') : String(col.title),
              width: col.width == null ? '' : String(col.width),
            }));
        },

        /** 行数据 → 内部 rows，并补一个稳定的 fill-key（优先 rowKey / id） */
        applyData(value) {
          this.rows = this.toArray(value).map((row, index) => {
            if (!row || typeof row !== 'object') return { rowKey: String(index) };
            return { ...row, rowKey: String(row.rowKey ?? row.id ?? index) };
          });
          this.applyEmpty();
        },

        /** 一行 → 一串 `<td part="cell">`（单元格数量由 columns 决定） */
        cellsHtml(row) {
          let html = '';
          for (const col of this.cols) {
            html += `<td part="cell">${escapeHtml(row?.[col.key])}</td>`;
          }
          return html;
        },

        /** 空态：没有行、也不在加载中。写在内部容器上，绝不写宿主属性（P31） */
        applyEmpty() {
          if (!this._wrap) return;
          const empty = this.rows.length === 0 && this.loading === null;
          if (empty) this._wrap.setAttribute('data-empty', '');
          else this._wrap.removeAttribute('data-empty');
        },
      },
    });
  </script>
</template>
