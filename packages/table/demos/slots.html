<template component>
  <div class="flex flex-col gap-4">
    <mc-table id="empty">
      <div slot="empty" class="flex items-center gap-2 p-4">没有匹配的记录，换个关键词试试</div>
    </mc-table>

    <mc-table id="loading" loading>
      <div slot="loading" class="flex items-center gap-2 p-4">正在同步…</div>
    </mc-table>
  </div>

  <script>
    export default async () => ({
      tag: 'demo-table-slots',

      /* 两个命名插槽都给了内容：空态 / 加载态显示的就是这段，而不是 empty-text 与内置的「加载中…」 */
      ready() {
        const columns = [{ key: 'name', title: '姓名' }];

        const empty = this.ele.shadowRoot.querySelector('#empty');
        empty.columns = columns;
        empty.data = [];

        const loading = this.ele.shadowRoot.querySelector('#loading');
        loading.columns = columns;
        loading.data = [{ name: '张三' }];
      },
    });
  </script>
</template>
