<template component>
  <mc-space direction="vertical" block>
    <mc-table id="empty">
      <mc-space block class="p-4" slot="empty">没有匹配的记录，换个关键词试试</mc-space>
    </mc-table>

    <mc-table id="loading" loading>
      <mc-space block class="p-4" slot="loading">正在同步…</mc-space>
    </mc-table>
  </mc-space>

  <script>
    export default async () => ({
      tag: 'demo-table-slots',

      /* 两个命名插槽都给了内容：空态 / 加载态显示的就是这段，而不是兜底的 mc-empty 与内置的「加载中…」 */
      ready() {
        const columns = [{ key: 'name', title: '姓名' }];

        const empty = this.ele.shadowRoot.querySelector('#empty');
        empty.columns = columns;
        empty.data = [];

        const loading = this.ele.shadowRoot.querySelector('#loading');
        loading.columns = columns;
        loading.data = [{ name: '张三' }];
      },
    });
  </script>
</template>
