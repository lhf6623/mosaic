<template page>
  <link rel="stylesheet" href="../../docs/content.css" />
  <!-- 三栏与左栏菜单在 docs/doc-layout.html（本页只写正文）；面包屑/翻页由导航数据派生 -->
  <div class="doc-body">
    <!-- ⚠️ 外壳只注册 code / icon / collapse / menu / breadcrumb / card：演示里的 mc-button 要本页注册，漏了会被 `*:not(:defined){display:none}` 整块藏掉（P44）。 -->
    <l-m src="../button/button.html"></l-m>

    <!-- 例子 = demos/*.html（ofa 组件，可单独打开、单独测）；页面用 <doc-playground src> 读同一份源 -->
    <l-m src="./table.html"></l-m>
    <h1>
      Table
      <code>mc-table</code>
    </h1>
    <p class="doc-lead">
      数据表格。真
      <code>&lt;table&gt;</code>
      结构；列定义与行数据是对象数组，运行时用 property 传进去，改完立刻重渲染。
    </p>

    <h2>例子</h2>

    <!-- 演示区三段：标题 → 说明（可选，是导语不是脚注）→ 可编辑示例（doc-playground）；取词规则见 packages/README.md「演示区三段」。 -->
    <doc-demos>
      <section class="doc-demo">
        <h3>基本用法</h3>
        <p class="doc-hint">
          演示里在它自己的
          <code>ready()</code>
          里把
          <code>columns</code>
          /
          <code>data</code>
          赋给这个
          <code>mc-table</code>
          ；页面里就是
          <code>document.querySelector('#t').data = […]</code>
          。 单元格文本按纯文本渲染（组件自己转义），要富内容就把整列的值当字符串拼好再传。
        </p>
        <doc-playground src="./demos/basic.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>运行时换数据</h3>
        <p class="doc-hint">
          赋值就是入口：整体换一个数组也行（组件会重新规范化），空数组就是空态 ——
          三个按钮改的都是同一个
          <code>data</code>
          property。
        </p>
        <doc-playground src="./demos/runtime.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>条纹</h3>
        <p class="doc-hint">偶数行换底色，长表格里更好找行。</p>
        <doc-playground src="./demos/striped.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>悬停</h3>
        <p class="doc-hint">鼠标停在哪一行，哪一行亮起来。</p>
        <doc-playground src="./demos/hoverable.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>密度</h3>
        <p class="doc-hint">
          三档只动字号与单元格内边距，行高不动；要更极端的尺寸就按
          <code>--mc-table-font</code>
          /
          <code>--mc-table-cell-pad-x</code>
          /
          <code>--mc-table-cell-pad-y</code>
          自己写。
        </p>
        <doc-playground src="./demos/size.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>外边框</h3>
        <p class="doc-hint">
          <code>bordered</code>
          给整块加一圈描边（单元格横线不变）；圆角大小走
          <code>--mc-table-radius</code>
          ，不想要圆角就把它设成
          <code>0</code>
          。
        </p>
        <doc-playground src="./demos/border.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>加载中</h3>
        <p class="doc-hint">
          <code>loading</code>
          期间盖在表格上一层的
          <code>loading</code>
          插槽（不给就是
          <code>mc-spinner</code>
          + 一行「加载中…」）：表格留在原位不跳版，层里的内容居中。
        </p>
        <doc-playground src="./demos/loading.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>空态</h3>
        <p class="doc-hint">
          一行数据都没有时显示
          <code>empty</code>
          插槽；不给内容就用内置的
          <code>mc-empty</code>
          兜底（图形 + 一行文案），文案默认「暂无数据」，可以用
          <code>empty-text</code>
          换掉。
        </p>
        <doc-playground src="./demos/empty.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>空态与加载插槽</h3>
        <p class="doc-hint">
          两个槽都有兜底内容（内置的
          <code>mc-empty</code>
          与一行「加载中…」），给了
          <code>slot="empty"</code>
          /
          <code>slot="loading"</code>
          就整块换成你的。
        </p>
        <doc-playground src="./demos/slots.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>内部样式</h3>
        <p class="doc-hint">
          组件内部默认改不动：只有标了
          <code>part</code>
          的节点，才能从外面用
          <code>::part(名字)</code>
          改样式（这里开了
          <code>table</code>
          /
          <code>row</code>
          /
          <code>cell</code>
          ）。
        </p>
        <doc-playground src="./demos/part.html"></doc-playground>
      </section>
    </doc-demos>

    <!-- 参考区（属性/方法/事件/配置/插槽/part）由 api.md 渲染，不在这里手抄 -->
    <doc-spec src="./api.md"></doc-spec>
  </div>

    export default () => ({ data: {} });
  </script>
</template>
