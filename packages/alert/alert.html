<!-- mc-alert — 页内提示条；设计取舍见 README.md 的「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主盒模型 + 色槽默认值（写在这里，使用者 style="…" 才压得住） */
    :host {
      display: block;
      position: relative; /* 内部绝对定位元素的包含块（P21） */
      box-sizing: border-box;
      /* 三档外观都保留 1px 透明的线：切 variant / 切 color 时高度不抖 */
      border: 1px solid transparent;
      border-radius: var(--mc-alert-radius);
      padding: var(--mc-alert-pad-y) var(--mc-alert-pad-x);
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-text-sm, var(--mc-def-text-sm));
      line-height: var(--mc-text-sm-lh, var(--mc-def-text-sm-lh));
      transition:
        background-color var(--mc-duration-fast, var(--mc-def-duration-fast))
          var(--mc-ease-standard, var(--mc-def-ease-standard)),
        color var(--mc-duration-fast, var(--mc-def-duration-fast))
          var(--mc-ease-standard, var(--mc-def-ease-standard)),
        border-color var(--mc-duration-fast, var(--mc-def-duration-fast))
          var(--mc-ease-standard, var(--mc-def-ease-standard));

      /* L3 组件令牌，默认引 L2；按实例覆盖写在宿主 style 上 */
      --mc-alert-pad-x: var(--mc-space-4, var(--mc-def-space-4));
      --mc-alert-pad-y: var(--mc-space-3, var(--mc-def-space-3));
      --mc-alert-gap: var(--mc-space-3, var(--mc-def-space-3));
      --mc-alert-radius: var(--mc-radius-md, var(--mc-def-radius-md));
      --mc-alert-body-color: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
      --mc-alert-layer-color: var(--mc-color-fg, var(--mc-def-color-fg));
      --mc-alert-layer: 0.08;

      --mc-alert-fill: var(--mc-color-primary, var(--mc-def-color-primary));
      --mc-alert-on-fill: var(--mc-color-primary-fg, var(--mc-def-color-primary-fg));
      --mc-alert-accent: var(--mc-color-primary, var(--mc-def-color-primary));
      --mc-alert-subtle-fill: var(--mc-color-primary-subtle, var(--mc-def-color-primary-subtle));

      /* subtle 是默认外观，直接写在 1 区（写 :host(:not([variant])) 会静默失效，P14） */
      background-color: rgb(var(--mc-alert-subtle-fill));
      color: rgb(var(--mc-alert-accent));
    }

    /* 2. 维度一 color：只往色槽里填值（primary 已在上面） */
    :host([color='info']) {
      --mc-alert-fill: var(--mc-color-info, var(--mc-def-color-info));
      --mc-alert-on-fill: var(--mc-color-info-fg, var(--mc-def-color-info-fg));
      --mc-alert-accent: var(--mc-color-info, var(--mc-def-color-info));
      --mc-alert-subtle-fill: var(--mc-color-info-subtle, var(--mc-def-color-info-subtle));
    }
    :host([color='success']) {
      --mc-alert-fill: var(--mc-color-success, var(--mc-def-color-success));
      --mc-alert-on-fill: var(--mc-color-success-fg, var(--mc-def-color-success-fg));
      --mc-alert-accent: var(--mc-color-success, var(--mc-def-color-success));
      --mc-alert-subtle-fill: var(--mc-color-success-subtle, var(--mc-def-color-success-subtle));
    }
    :host([color='warning']) {
      --mc-alert-fill: var(--mc-color-warning, var(--mc-def-color-warning));
      --mc-alert-on-fill: var(--mc-color-warning-fg, var(--mc-def-color-warning-fg));
      --mc-alert-accent: var(--mc-color-warning, var(--mc-def-color-warning));
      --mc-alert-subtle-fill: var(--mc-color-warning-subtle, var(--mc-def-color-warning-subtle));
    }
    :host([color='danger']) {
      --mc-alert-fill: var(--mc-color-danger, var(--mc-def-color-danger));
      --mc-alert-on-fill: var(--mc-color-danger-fg, var(--mc-def-color-danger-fg));
      --mc-alert-accent: var(--mc-color-danger, var(--mc-def-color-danger));
      --mc-alert-subtle-fill: var(--mc-color-danger-subtle, var(--mc-def-color-danger-subtle));
    }
    :host([color='neutral']) {
      --mc-alert-fill: var(--mc-color-neutral, var(--mc-def-color-neutral));
      --mc-alert-on-fill: var(--mc-color-neutral-fg, var(--mc-def-color-neutral-fg));
      --mc-alert-accent: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
      --mc-alert-subtle-fill: var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken));
    }

    /* 3. 维度二 variant：只决定色槽贴到哪儿 */
    :host([variant='solid']) {
      background-color: rgb(var(--mc-alert-fill));
      color: rgb(var(--mc-alert-on-fill));
      --mc-alert-body-color: var(--mc-alert-on-fill);
      /* 实心上的叠加要用 on-fill，fg 会在饱和底色上糊成一块 */
      --mc-alert-layer-color: var(--mc-alert-on-fill);
    }
    :host([variant='outline']) {
      background-color: transparent;
      border-color: rgb(var(--mc-alert-accent));
    }

    /* 4. 状态：图标显隐、正文/标题块的空内容折叠、× 的显形 */
    .mc-icon {
      display: none;
      flex: none;
      width: 1.25em;
      height: var(
        --mc-text-sm-lh,
        var(--mc-def-text-sm-lh)
      ); /* 与标题行等高，图标视觉上贴在第一行 */
      align-items: center;
    }
    :host([icon]) .mc-icon {
      display: flex;
    }
    :host([data-has-icon]) .mc-icon {
      display: flex;
    }
    :host([data-has-icon]) .mc-glyphs {
      display: none;
    }

    .mc-title {
      display: none;
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
    }
    :host([data-has-title]) .mc-title {
      display: block;
    }

    .mc-body {
      display: none;
      color: rgb(var(--mc-alert-body-color));
    }
    :host([data-has-body]) .mc-body {
      display: block;
    }

    /* 5. 内部元素 */
    .mc-base {
      display: flex;
      align-items: flex-start;
      gap: var(--mc-alert-gap);
    }
    .mc-content {
      flex: 1 1 0%;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    /* 内置图标：一个 mc-icon 实例，图形名跟着 color 走（见 GLYPH_NAMES）；size="lg" = 1.25em */
    .mc-glyphs {
      display: flex;
      align-items: center;
    }

    /* 关闭按钮：32×32 命中区；负外边距抵消超出行高的 6px，单行提示条不被撑高 */
    .mc-close {
      display: none;
      position: relative;
      flex: none;
      box-sizing: border-box;
      width: var(--mc-space-8, var(--mc-def-space-8));
      height: var(--mc-space-8, var(--mc-def-space-8));
      margin-block: calc(
        (
            var(--mc-text-sm-lh, var(--mc-def-text-sm-lh)) -
              var(--mc-space-8, var(--mc-def-space-8))
          ) /
          2
      );
      padding: 0;
      border: 0;
      border-radius: var(--mc-radius-full, var(--mc-def-radius-full));
      background-color: transparent;
      color: inherit;
      font: inherit;
      font-size: 1.25em;
      line-height: 1;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    :host([closable]) .mc-close {
      /* flex item 会被块级化：computed display 是 flex，不是这里写的 inline-flex */
      display: inline-flex;
    }
    .mc-close:hover {
      background-color: rgb(var(--mc-alert-layer-color) / var(--mc-alert-layer));
    }
    .mc-close:active {
      background-color: rgb(var(--mc-alert-layer-color) / calc(var(--mc-alert-layer) * 1.5));
    }
    .mc-close:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }
  </style>

  <div part="base" class="mc-base">
    <!-- 图标：内置图形来自 mc-icon；slot="icon" 是使用者的内容 -->
    <span class="mc-icon" part="icon">
      <mc-icon class="mc-glyphs" size="lg" :name="glyphName"></mc-icon>
      <slot name="icon"></slot>
    </span>

    <div class="mc-content">
      <div class="mc-title" part="title"><slot name="title">{{heading}}</slot></div>
      <div class="mc-body" part="body"><slot></slot></div>
    </div>

    <!-- 关闭：右侧的 × 按钮，命中区 32×32 -->
    <button class="mc-close" part="close" type="button" on:click="onClose()">
      <mc-icon name="close"></mc-icon>
    </button>
  </div>

  <script>
    /* color 也收 hex（语义名交给 CSS，hex 走共享接线器）；提示条是浅底外观，所以接 subtle-fill */
    import { colorAttr } from '../boot/color-attr.js';

    const color = colorAttr({ slots: ['fill', 'on-fill', 'accent', 'subtle-fill'] });

    /** 语义色 → 内置图标名。图形本体住在 packages/icon/icons.generated.css，构建期由 icons.generated.js 编译而来（零请求） */
    const GLYPH_NAMES = {
      primary: 'info',
      info: 'info',
      neutral: 'info',
      success: 'success',
      warning: 'warning',
      danger: 'error',
    };

    export default async ({ load }) => {
      /* 图标是独立组件：注册前先就位（路径相对本文件 URL）；代价是只引 mc-alert 也会取一次 icon.html */
      await load('../icon/icon.html');

      return {
        tag: 'mc-alert',

        attrs: {
          color: 'primary',
          variant: 'subtle',
          // 标题文案，富内容走 title 插槽。叫 heading 不叫 title —— title 会弹原生 tooltip
          heading: '',
          // 布尔属性默认值必须是 null（P1）。icon 是「存在即显示内置图形」
          icon: null,
          closable: null,
        },

        ready() {
          // 这里 shadow 已建好；宿主属性一律留到 attached 才写（P31）
          this._slots = [...this.ele.shadowRoot.querySelectorAll('slot')];
        },

        attached() {
          // 宿主 style 等构造期结束再写（P31），color 的首次同步在这里
          color.sync(this.ele, this.color);

          /* 空内容折叠靠 slotchange 判定：分到节点一变就响；icon 插槽同理 —— 有自定义图标时内置图形让位 */
          this._onSlotChange = () => this.applyState();
          for (const slot of this._slots) slot.addEventListener('slotchange', this._onSlotChange);
          this.applyState();
        },

        detached() {
          for (const slot of this._slots)
            slot.removeEventListener('slotchange', this._onSlotChange);
        },

        watch: {
          // color 收 hex：首次触发落在构造期（P5），跳过由 colorAttr 内部处理
          color(value) {
            color.change(this.ele, value);
          },

          /** heading 变了要有标题块；首次触发在构造期，那时写宿主属性会抛 NotSupportedError（P5 + P31） */
          heading() {
            if (this._headingWatchInit === undefined) {
              this._headingWatchInit = true;
              return;
            }
            this.applyState();
          },
        },

        proto: {
          get glyphName() {
            return GLYPH_NAMES[this.color] ?? 'info';
          },

          /** 三个 data-has-* 是 CSS 唯一的输入：宿主属性 + 插槽内容一起判定（P32：不能只看属性在不在） */
          applyState() {
            this.mirror(
              'data-has-title',
              this.slotHasContent('title') || this.headingText() !== '',
            );
            this.mirror('data-has-body', this.slotHasContent(null));
            this.mirror('data-has-icon', this.slotHasContent('icon'));
          },

          /** 标题文案。⚠️ attach 时宿主还没有 heading 属性（ofa 稍后写空值，P32），必须先落成空串 */
          headingText() {
            return (this.ele.getAttribute('heading') ?? '').trim();
          },

          slotHasContent(name) {
            const selector = name ? `slot[name="${name}"]` : 'slot:not([name])';
            const slot = this.ele.shadowRoot.querySelector(selector);
            return (slot?.assignedNodes() ?? []).some(
              (node) =>
                node.nodeType === Node.ELEMENT_NODE || (node.textContent ?? '').trim() !== '',
            );
          },

          mirror(name, on) {
            if (on === this.ele.hasAttribute(name)) return;
            if (on) this.ele.setAttribute(name, '');
            else this.ele.removeAttribute(name);
          },

          onClose() {
            this.emit('close', { bubbles: true, composed: true });
          },
        },
      };
    };
  </script>
</template>
