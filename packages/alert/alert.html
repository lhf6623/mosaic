<!--
  mc-alert — 页内提示条

  和 toast 的分工：alert 是**页内静态**的一块面（跟着内容流排版、不抢焦点、不会自己消失）；
  toast 是命令式浮层（自己进场、自己走，不占版面）。两者都要「把状态告诉使用者」，但
  一个在文档流里、一个在层级最上面，所以不是一个组件。

  两个正交维度 + 两个状态布尔，和 mc-tag / mc-button 同一套分工：
  · color   只往四个色槽里填值（subtle 要单独的浅底槽）；
  · variant 只决定色槽贴到哪儿（subtle 默认 / solid / outline）；
  · 状态：icon（左侧内置图形）、closable（右侧 ×）。
  **没有 size** —— 提示条不是控件，高度由内容撑；要改就 style="padding:…" 或 --mc-alert-pad-*。
  于是 6 色 + 3 外观 = 9 条规则，而不是 18 条组合规则。

  标题属性叫 heading 不叫 title：title 是原生属性，挂上去浏览器会弹自己的 tooltip，而且
  ofa 会把声明过的字符串属性以空值写到宿主上（P32），"有没有给标题"只能看值、不能看属性在不在。
  插槽名照旧叫 title（插槽名不产生属性）—— 和 mc-collapse-item 的 header 属性 + header 插槽同构。

  标题/正文的显隐只从宿主上的 data-has-title / data-has-body 选（同 mc-card 的 data-has-header）：
  空的标题块会白占一行、正文空了 gap 也还在。宿主属性只能在 attached() 之后写（P31），
  所以 ready() 里只做查询，判定统一走 applyState()。

  图标是**内置的 4 个语义图形**（primary / info / neutral 共用信息圆），装饰性、带 aria-hidden；
  要给自己的图标（将来有 mc-icon）就写 slot="icon"，有内容时内置图形让位。
  图形靠 :host([color='…']) 切换显隐 —— 常驻 DOM，不用 o-if（P10）。

  ⚠️ **图形用 DOM API 建，文件里不写内联 svg 标记**：Live Server 会往 HTML 里注入热重载 script，
  注入点是「body / svg / head 的结束标签」里的第一个，而它是**纯文本替换、不看上下文** ——
  内联 svg 一旦出现在组件模块 script 之前，注入的 script 就变成 ofa 眼里的「第一个 script」，
  组件直接报「加载组件模块出错」（实测：VS Code Live Server 5500 端口）。仓库自带
  tools/serve.mjs --inject 复现同一规则，tests/site/07 守这条不变量：组件文件里任何一个注入点
  都必须排在模块 script 之后（现在的做法是让它们根本不存在）。
  另外 path 只写**大写绝对指令**：UnoCSS 会扫仓库里的所有文件（注释也算），小写指令后面跟着的
  坐标就是「margin 工具类」的形状，会被真的写进 mosaic.css，`pnpm check:drift` 立刻红。

  **不预设 role**：静态提示条不该在被渲染出来时就让屏幕阅读器播报。需要播报的用法（动态插入的
  报错）由使用者在宿主上加 role="alert" / role="status"，组件不去覆盖它（同 mc-card 不做整卡可点）。

  closable 只发 close，**不自己删 DOM** —— 组件不改使用者的 DOM：使用者自己在事件里 remove() 或改数据。
  × 是 32×32 命中区的原生按钮（Mosaic 对小控件的下限），用负外边距抵消掉超出行高的那 6px，
  所以单行提示条不会因为它变高；焦点环用 --mc-color-ring（不用 currentColor，P16）。
-->
<template component>
  <style>
    /* 1. 宿主盒模型 + 色槽默认值。尺寸/圆角/内边距都写在这里，使用者 style="…" 才压得住 */
    :host {
      display: block;
      position: relative; /* 内部绝对定位元素的包含块（P21） */
      box-sizing: border-box;
      /* 三档外观都保留 1px 透明的线：切 variant / 切 color 时高度不抖 */
      border: 1px solid transparent;
      border-radius: var(--mc-alert-radius);
      padding: var(--mc-alert-pad-y) var(--mc-alert-pad-x);
      font-family: var(--mc-font-sans);
      font-size: var(--mc-text-sm);
      line-height: var(--mc-text-sm-lh);
      transition:
        background-color var(--mc-duration-fast) var(--mc-ease-standard),
        color var(--mc-duration-fast) var(--mc-ease-standard),
        border-color var(--mc-duration-fast) var(--mc-ease-standard);

      /* L3 组件令牌：默认引用 L2 语义令牌。按实例覆盖写在宿主 style 上 */
      --mc-alert-pad-x: var(--mc-space-4);
      --mc-alert-pad-y: var(--mc-space-3);
      --mc-alert-gap: var(--mc-space-3);
      --mc-alert-radius: var(--mc-radius-md);
      /* 正文色，以及 × 的 state layer：都是「相对当前配色」的叠加，不引新色。
         layer 是一个 0–1 的数（hover 用，active 乘 1.5），色随 variant 换。 */
      --mc-alert-body-color: var(--mc-color-fg-muted);
      --mc-alert-layer-color: var(--mc-color-fg);
      --mc-alert-layer: 0.08;

      /* 色槽：primary 是默认色（API 规范 1.2 的全局默认），已经填好 */
      --mc-alert-fill: var(--mc-color-primary);
      --mc-alert-on-fill: var(--mc-color-primary-fg);
      --mc-alert-accent: var(--mc-color-primary);
      --mc-alert-subtle-fill: var(--mc-color-primary-subtle);

      /* subtle 是默认外观，直接写在 1 区（写 :host(:not([variant])) 会静默失效，P14） */
      background-color: rgb(var(--mc-alert-subtle-fill));
      color: rgb(var(--mc-alert-accent));
    }

    /* 2. 维度一 color：只往色槽里填值。primary（默认）已经在上面 */
    :host([color='info']) {
      --mc-alert-fill: var(--mc-color-info);
      --mc-alert-on-fill: var(--mc-color-info-fg);
      --mc-alert-accent: var(--mc-color-info);
      --mc-alert-subtle-fill: var(--mc-color-info-subtle);
    }
    :host([color='success']) {
      --mc-alert-fill: var(--mc-color-success);
      --mc-alert-on-fill: var(--mc-color-success-fg);
      --mc-alert-accent: var(--mc-color-success);
      --mc-alert-subtle-fill: var(--mc-color-success-subtle);
    }
    :host([color='warning']) {
      --mc-alert-fill: var(--mc-color-warning);
      --mc-alert-on-fill: var(--mc-color-warning-fg);
      --mc-alert-accent: var(--mc-color-warning);
      --mc-alert-subtle-fill: var(--mc-color-warning-subtle);
    }
    :host([color='danger']) {
      --mc-alert-fill: var(--mc-color-danger);
      --mc-alert-on-fill: var(--mc-color-danger-fg);
      --mc-alert-accent: var(--mc-color-danger);
      --mc-alert-subtle-fill: var(--mc-color-danger-subtle);
    }
    :host([color='neutral']) {
      --mc-alert-fill: var(--mc-color-neutral);
      --mc-alert-on-fill: var(--mc-color-neutral-fg);
      --mc-alert-accent: var(--mc-color-fg-muted);
      --mc-alert-subtle-fill: var(--mc-color-surface-sunken);
    }

    /* 3. 维度二 variant：只决定色槽贴到哪儿 */
    :host([variant='solid']) {
      background-color: rgb(var(--mc-alert-fill));
      color: rgb(var(--mc-alert-on-fill));
      --mc-alert-body-color: var(--mc-alert-on-fill);
      /* 实心上的叠加要用 on-fill，用 fg 会在饱和底色上糊成一块 */
      --mc-alert-layer-color: var(--mc-alert-on-fill);
    }
    :host([variant='outline']) {
      background-color: transparent;
      border-color: rgb(var(--mc-alert-accent));
    }

    /* 4. 状态：图标显隐、正文/标题块的空内容折叠、× 的显形 */
    .mc-icon {
      display: none;
      flex: none;
      width: 1.25em;
      height: var(--mc-text-sm-lh); /* 与标题行等高，图标视觉上贴在第一行 */
      align-items: center;
    }
    :host([icon]) .mc-icon {
      display: flex;
    }
    /* 自定义图标插槽优先：有内容就内置图形让位（数据由 applyState 判定，见脚本） */
    :host([data-has-icon]) .mc-icon {
      display: flex;
    }
    :host([data-has-icon]) .mc-glyphs {
      display: none;
    }

    .mc-title {
      display: none;
      font-weight: var(--mc-weight-medium);
    }
    :host([data-has-title]) .mc-title {
      display: block;
    }

    .mc-body {
      display: none;
      color: rgb(var(--mc-alert-body-color));
    }
    :host([data-has-body]) .mc-body {
      display: block;
    }

    /* 5. 内部元素：只放工具类表达不了的 */
    .mc-base {
      gap: var(--mc-alert-gap);
    }
    /* 长文本在窄容器里折行，不撑破宿主 */
    .mc-content {
      overflow-wrap: anywhere;
    }
    .mc-glyphs {
      display: flex;
      align-items: center;
    }
    .mc-glyph {
      display: none;
      width: 1.25em;
      height: 1.25em;
    }
    /* primary / info / neutral 共用信息图形；其余三色各自换图形 */
    .mc-glyph-info {
      display: block;
    }
    :host([color='success']) .mc-glyph-info,
    :host([color='warning']) .mc-glyph-info,
    :host([color='danger']) .mc-glyph-info {
      display: none;
    }
    :host([color='success']) .mc-glyph-success,
    :host([color='warning']) .mc-glyph-warning,
    :host([color='danger']) .mc-glyph-danger {
      display: block;
    }

    /* ×：32×32 命中区的原生按钮；负外边距抵消掉超出行高的那 6px，单行提示条不被撑高 */
    .mc-close {
      display: none;
      position: relative;
      flex: none;
      box-sizing: border-box;
      width: var(--mc-space-8);
      height: var(--mc-space-8);
      margin-block: calc((var(--mc-text-sm-lh) - var(--mc-space-8)) / 2);
      padding: 0;
      border: 0;
      border-radius: var(--mc-radius-full);
      background-color: transparent;
      color: inherit;
      font: inherit;
      font-size: 1.25em;
      line-height: 1;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    :host([closable]) .mc-close {
      /* flex item 会被块级化：computed display 是 flex，不是这里写的 inline-flex */
      display: inline-flex;
    }
    .mc-close:hover {
      background-color: rgb(var(--mc-alert-layer-color) / var(--mc-alert-layer));
    }
    .mc-close:active {
      background-color: rgb(var(--mc-alert-layer-color) / calc(var(--mc-alert-layer) * 1.5));
    }
    .mc-close:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring));
      outline-offset: 2px;
    }
  </style>

  <div part="base" class="mc-base flex items-start">
    <!-- 图标：内置图形是装饰性的（aria-hidden）；slot="icon" 是使用者的内容，不替它决定是否被朗读。
         图形由 ready() 里的 buildGlyphs() 灌进来 —— 文件里不写内联 svg 标记，原因见文件头 -->
    <span class="mc-icon" part="icon">
      <span class="mc-glyphs" aria-hidden="true"></span>
      <slot name="icon"></slot>
    </span>

    <div class="mc-content flex-1 min-w-0">
      <div class="mc-title" part="title"><slot name="title">{{heading}}</slot></div>
      <div class="mc-body" part="body"><slot></slot></div>
    </div>

    <!-- × 是字符不是图标字体；无障碍名由 aria-label 给 -->
    <button class="mc-close" part="close" type="button" aria-label="关闭" on:click="onClose()">
      ×
    </button>
  </div>

  <script>
    const SVG_NS = 'http://www.w3.org/2000/svg';

    /**
     * 四个语义图形（24×24，1.75 描边，round 端点）。
     * ⚠️ 用 DOM API 建、不写成内联标记：Live Server 的注入点是「body / svg / head 的结束标签」中
     * 第一个出现的位置，纯文本替换、不看上下文 —— 内联 svg 落在模块 script 之前，注入的 script
     * 就会抢走 ofa 的「第一个 script」，组件报「加载组件模块出错」（文件头有完整推演，07 号套件守着）。
     */
    const GLYPHS = {
      info: [
        ['circle', { cx: '12', cy: '12', r: '9' }],
        ['path', { d: 'M12 11L12 16.5', 'stroke-linecap': 'round' }],
        ['circle', { cx: '12', cy: '7.5', r: '1.1', fill: 'currentColor', stroke: 'none' }],
      ],
      success: [
        ['circle', { cx: '12', cy: '12', r: '9' }],
        [
          'path',
          {
            d: 'M8 12.3L10.8 15.1L16 9.4',
            'stroke-linecap': 'round',
            'stroke-linejoin': 'round',
          },
        ],
      ],
      warning: [
        ['path', { d: 'M12 3.8 21.4 20H2.6L12 3.8Z', 'stroke-linejoin': 'round' }],
        ['path', { d: 'M12 10L12 14.4', 'stroke-linecap': 'round' }],
        ['circle', { cx: '12', cy: '17.2', r: '1.1', fill: 'currentColor', stroke: 'none' }],
      ],
      danger: [
        ['circle', { cx: '12', cy: '12', r: '9' }],
        ['path', { d: 'M9 9L15 15M15 9L9 15', 'stroke-linecap': 'round' }],
      ],
    };

    /** 属性表 → DOM 节点。所有图形共用 svg 根上的 viewBox / fill / stroke / stroke-width */
    const makeNode = (tag, attrs) => {
      const node = document.createElementNS(SVG_NS, tag);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      return node;
    };

    export default async () => ({
      tag: 'mc-alert',

      attrs: {
        color: 'primary',
        variant: 'subtle',
        // 标题文案，富内容走 title 插槽。叫 heading 不叫 title —— title 会弹原生 tooltip（见文件头）
        heading: '',
        // 布尔属性默认值必须是 null（P1）。icon 是「存在即显示内置图形」
        icon: null,
        closable: null,
      },

      ready() {
        // 这里 shadow 已建好；宿主属性一律留到 attached 才写（P31）
        this._slots = [...this.ele.shadowRoot.querySelectorAll('slot')];
        this.buildGlyphs();
      },

      attached() {
        /* 标题/正文的空内容折叠只靠 slotchange 判定：分到节点一变就会响（同 mc-card）。
           icon 插槽也一样 —— 有自定义图标时内置图形让位。 */
        this._onSlotChange = () => this.applyState();
        for (const slot of this._slots) slot.addEventListener('slotchange', this._onSlotChange);
        this.applyState();
      },

      detached() {
        for (const slot of this._slots) slot.removeEventListener('slotchange', this._onSlotChange);
      },

      watch: {
        /**
         * heading 变了要有标题块 —— 但首次触发落在构造期，那时往宿主写属性会抛
         * NotSupportedError（P5 + P31，实测踩过一回）。守卫之后这里就是纯粹的「文案变了」。
         */
        heading() {
          if (this._headingWatchInit === undefined) {
            this._headingWatchInit = true;
            return;
          }
          this.applyState();
        },
      },

      proto: {
        /** 内置图形灌进 .mc-glyphs（在 shadow root 里，不是宿主上，P17）。四个都常驻，靠 :host([color]) 显隐 */
        buildGlyphs() {
          const box = this.ele.shadowRoot.querySelector('.mc-glyphs');
          if (!box) return;
          for (const [name, parts] of Object.entries(GLYPHS)) {
            const svg = makeNode('svg', {
              viewBox: '0 0 24 24',
              fill: 'none',
              stroke: 'currentColor',
              'stroke-width': '1.75',
              class: `mc-glyph mc-glyph-${name}`,
            });
            for (const [tag, attrs] of parts) svg.appendChild(makeNode(tag, attrs));
            box.appendChild(svg);
          }
        },

        /** 三个 data-has-* 是 CSS 唯一的输入：宿主属性 + 插槽内容一起判定（P32：不能只看属性在不在） */
        applyState() {
          this.mirror('data-has-title', this.slotHasContent('title') || this.headingText() !== '');
          this.mirror('data-has-body', this.slotHasContent(null));
          this.mirror('data-has-icon', this.slotHasContent('icon'));
        },

        /**
         * 标题文案。⚠️ attach 那一刻宿主上还没有 heading 属性（ofa 稍后才写空值，P32），
         * getAttribute 会给 null —— 直接 `?.trim() !== ''` 会得到 `undefined !== ''` = true，
         * 于是空标题也判成「有标题」，白占一行。必须先落成空串。
         */
        headingText() {
          return (this.ele.getAttribute('heading') ?? '').trim();
        },

        /** 具名插槽有没有分到东西：**元素即内容**；纯文本/注释节点要非空白才算 */
        slotHasContent(name) {
          const selector = name ? `slot[name="${name}"]` : 'slot:not([name])';
          const slot = this.ele.shadowRoot.querySelector(selector);
          return (slot?.assignedNodes() ?? []).some(
            (node) => node.nodeType === Node.ELEMENT_NODE || (node.textContent ?? '').trim() !== '',
          );
        },

        /** 只在真的变了的时候写宿主 —— 否则每次属性变动都白触发一轮样式重算 */
        mirror(name, on) {
          if (on === this.ele.hasAttribute(name)) return;
          if (on) this.ele.setAttribute(name, '');
          else this.ele.removeAttribute(name);
        },

        /** 只发事件，不删 DOM —— 删不删由使用者决定 */
        onClose() {
          this.emit('close', { bubbles: true, composed: true });
        },
      },
    });
  </script>
</template>
