<!--
  mc-alert — 页内提示条

  设计取舍 / 实现约束（为什么这么定、踩过哪些坑）不写在这里 —— 见同目录 README.md 的「设计取舍」。
  这份文件是要经 CDN 发给使用者的产物，注释会一起发出去，所以这里只留一行定位与指针。
-->
<template component>
  <style>
    /* 1. 宿主盒模型 + 色槽默认值。尺寸/圆角/内边距都写在这里，使用者 style="…" 才压得住 */
    :host {
      display: block;
      position: relative; /* 内部绝对定位元素的包含块（P21） */
      box-sizing: border-box;
      /* 三档外观都保留 1px 透明的线：切 variant / 切 color 时高度不抖 */
      border: 1px solid transparent;
      border-radius: var(--mc-alert-radius);
      padding: var(--mc-alert-pad-y) var(--mc-alert-pad-x);
      font-family: var(--mc-font-sans);
      font-size: var(--mc-text-sm);
      line-height: var(--mc-text-sm-lh);
      transition:
        background-color var(--mc-duration-fast) var(--mc-ease-standard),
        color var(--mc-duration-fast) var(--mc-ease-standard),
        border-color var(--mc-duration-fast) var(--mc-ease-standard);

      /* L3 组件令牌：默认引用 L2 语义令牌。按实例覆盖写在宿主 style 上 */
      --mc-alert-pad-x: var(--mc-space-4);
      --mc-alert-pad-y: var(--mc-space-3);
      --mc-alert-gap: var(--mc-space-3);
      --mc-alert-radius: var(--mc-radius-md);
      /* 正文色，以及 × 的 state layer：都是「相对当前配色」的叠加，不引新色。
         layer 是一个 0–1 的数（hover 用，active 乘 1.5），色随 variant 换。 */
      --mc-alert-body-color: var(--mc-color-fg-muted);
      --mc-alert-layer-color: var(--mc-color-fg);
      --mc-alert-layer: 0.08;

      /* 色槽：primary 是默认色（API 规范 1.2 的全局默认），已经填好 */
      --mc-alert-fill: var(--mc-color-primary);
      --mc-alert-on-fill: var(--mc-color-primary-fg);
      --mc-alert-accent: var(--mc-color-primary);
      --mc-alert-subtle-fill: var(--mc-color-primary-subtle);

      /* subtle 是默认外观，直接写在 1 区（写 :host(:not([variant])) 会静默失效，P14） */
      background-color: rgb(var(--mc-alert-subtle-fill));
      color: rgb(var(--mc-alert-accent));
    }

    /* 2. 维度一 color：只往色槽里填值。primary（默认）已经在上面 */
    :host([color='info']) {
      --mc-alert-fill: var(--mc-color-info);
      --mc-alert-on-fill: var(--mc-color-info-fg);
      --mc-alert-accent: var(--mc-color-info);
      --mc-alert-subtle-fill: var(--mc-color-info-subtle);
    }
    :host([color='success']) {
      --mc-alert-fill: var(--mc-color-success);
      --mc-alert-on-fill: var(--mc-color-success-fg);
      --mc-alert-accent: var(--mc-color-success);
      --mc-alert-subtle-fill: var(--mc-color-success-subtle);
    }
    :host([color='warning']) {
      --mc-alert-fill: var(--mc-color-warning);
      --mc-alert-on-fill: var(--mc-color-warning-fg);
      --mc-alert-accent: var(--mc-color-warning);
      --mc-alert-subtle-fill: var(--mc-color-warning-subtle);
    }
    :host([color='danger']) {
      --mc-alert-fill: var(--mc-color-danger);
      --mc-alert-on-fill: var(--mc-color-danger-fg);
      --mc-alert-accent: var(--mc-color-danger);
      --mc-alert-subtle-fill: var(--mc-color-danger-subtle);
    }
    :host([color='neutral']) {
      --mc-alert-fill: var(--mc-color-neutral);
      --mc-alert-on-fill: var(--mc-color-neutral-fg);
      --mc-alert-accent: var(--mc-color-fg-muted);
      --mc-alert-subtle-fill: var(--mc-color-surface-sunken);
    }

    /* 3. 维度二 variant：只决定色槽贴到哪儿 */
    :host([variant='solid']) {
      background-color: rgb(var(--mc-alert-fill));
      color: rgb(var(--mc-alert-on-fill));
      --mc-alert-body-color: var(--mc-alert-on-fill);
      /* 实心上的叠加要用 on-fill，用 fg 会在饱和底色上糊成一块 */
      --mc-alert-layer-color: var(--mc-alert-on-fill);
    }
    :host([variant='outline']) {
      background-color: transparent;
      border-color: rgb(var(--mc-alert-accent));
    }

    /* 4. 状态：图标显隐、正文/标题块的空内容折叠、× 的显形 */
    .mc-icon {
      display: none;
      flex: none;
      width: 1.25em;
      height: var(--mc-text-sm-lh); /* 与标题行等高，图标视觉上贴在第一行 */
      align-items: center;
    }
    :host([icon]) .mc-icon {
      display: flex;
    }
    /* 自定义图标插槽优先：有内容就内置图形让位（数据由 applyState 判定，见脚本） */
    :host([data-has-icon]) .mc-icon {
      display: flex;
    }
    :host([data-has-icon]) .mc-glyphs {
      display: none;
    }

    .mc-title {
      display: none;
      font-weight: var(--mc-weight-medium);
    }
    :host([data-has-title]) .mc-title {
      display: block;
    }

    .mc-body {
      display: none;
      color: rgb(var(--mc-alert-body-color));
    }
    :host([data-has-body]) .mc-body {
      display: block;
    }

    /* 5. 内部元素：只放工具类表达不了的 */
    .mc-base {
      gap: var(--mc-alert-gap);
    }
    /* 长文本在窄容器里折行，不撑破宿主 */
    .mc-content {
      overflow-wrap: anywhere;
    }
    /* 内置图标：一个 mc-icon 实例，图形名跟着 color 走（见脚本的 GLYPH_NAMES）。
       size="lg" = 1.25em，和改造前手绘图形的尺寸一致 */
    .mc-glyphs {
      display: flex;
      align-items: center;
    }

    /* 关闭按钮：32×32 命中区的原生按钮；负外边距抵消掉超出行高的那 6px，单行提示条不被撑高 */
    .mc-close {
      display: none;
      position: relative;
      flex: none;
      box-sizing: border-box;
      width: var(--mc-space-8);
      height: var(--mc-space-8);
      margin-block: calc((var(--mc-text-sm-lh) - var(--mc-space-8)) / 2);
      padding: 0;
      border: 0;
      border-radius: var(--mc-radius-full);
      background-color: transparent;
      color: inherit;
      font: inherit;
      font-size: 1.25em;
      line-height: 1;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    :host([closable]) .mc-close {
      /* flex item 会被块级化：computed display 是 flex，不是这里写的 inline-flex */
      display: inline-flex;
    }
    .mc-close:hover {
      background-color: rgb(var(--mc-alert-layer-color) / var(--mc-alert-layer));
    }
    .mc-close:active {
      background-color: rgb(var(--mc-alert-layer-color) / calc(var(--mc-alert-layer) * 1.5));
    }
    .mc-close:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring));
      outline-offset: 2px;
    }
  </style>

  <div part="base" class="mc-base flex items-start">
    <!-- 图标：内置图形来自 mc-icon（不给 label，所以它自己就是 aria-hidden 的装饰）；
         slot="icon" 是使用者的内容，不替它决定是否被朗读 -->
    <span class="mc-icon" part="icon">
      <mc-icon class="mc-glyphs" size="lg" aria-hidden="true" :name="glyphName"></mc-icon>
      <slot name="icon"></slot>
    </span>

    <div class="mc-content flex-1 min-w-0">
      <div class="mc-title" part="title"><slot name="title">{{heading}}</slot></div>
      <div class="mc-body" part="body"><slot></slot></div>
    </div>

    <!-- 关闭：用内置的 close 图标；无障碍名由按钮自己的 aria-label 给 -->
    <button class="mc-close" part="close" type="button" aria-label="关闭" on:click="onClose()">
      <mc-icon name="close"></mc-icon>
    </button>
  </div>

  <script>
    /**
     * 语义色 → 内置图标名（primary / info / neutral 共用信息圆）。
     * 图形本体住在 packages/icon/icons.generated.ts，构建期被编译成 CSS（零请求）；
     * 这里只留一张映射表，形状一个字节都不进本文件。
     */
    const GLYPH_NAMES = {
      primary: 'info',
      info: 'info',
      neutral: 'info',
      success: 'success',
      warning: 'warning',
      danger: 'error',
    };

    export default async ({ load }) => {
      /* 图标是独立组件：注册 mc-alert 之前先把它就位（路径相对本文件 URL 解析）。
         只引 mc-alert 的使用者会连带取一次 icon.html —— 这是「不给每个组件各画一套图标」的代价。 */
      await load('../icon/icon.html');

      return {
        tag: 'mc-alert',

        attrs: {
          color: 'primary',
          variant: 'subtle',
          // 标题文案，富内容走 title 插槽。叫 heading 不叫 title —— title 会弹原生 tooltip（见文件头）
          heading: '',
          // 布尔属性默认值必须是 null（P1）。icon 是「存在即显示内置图形」
          icon: null,
          closable: null,
        },

        ready() {
          // 这里 shadow 已建好；宿主属性一律留到 attached 才写（P31）
          this._slots = [...this.ele.shadowRoot.querySelectorAll('slot')];
        },

        attached() {
          /* 标题/正文的空内容折叠只靠 slotchange 判定：分到节点一变就会响（同 mc-card）。
           icon 插槽也一样 —— 有自定义图标时内置图形让位。 */
          this._onSlotChange = () => this.applyState();
          for (const slot of this._slots) slot.addEventListener('slotchange', this._onSlotChange);
          this.applyState();
        },

        detached() {
          for (const slot of this._slots)
            slot.removeEventListener('slotchange', this._onSlotChange);
        },

        watch: {
          /**
           * heading 变了要有标题块 —— 但首次触发落在构造期，那时往宿主写属性会抛
           * NotSupportedError（P5 + P31，实测踩过一回）。守卫之后这里就是纯粹的「文案变了」。
           */
          heading() {
            if (this._headingWatchInit === undefined) {
              this._headingWatchInit = true;
              return;
            }
            this.applyState();
          },
        },

        proto: {
          /** 图标名跟着 color 走：4 个语义图形现在住在内置图标集里，靠 mc-icon 的 :name 绑定 */
          get glyphName() {
            return GLYPH_NAMES[this.color] ?? 'info';
          },

          /** 三个 data-has-* 是 CSS 唯一的输入：宿主属性 + 插槽内容一起判定（P32：不能只看属性在不在） */
          applyState() {
            this.mirror(
              'data-has-title',
              this.slotHasContent('title') || this.headingText() !== '',
            );
            this.mirror('data-has-body', this.slotHasContent(null));
            this.mirror('data-has-icon', this.slotHasContent('icon'));
          },

          /**
           * 标题文案。⚠️ attach 那一刻宿主上还没有 heading 属性（ofa 稍后才写空值，P32），
           * getAttribute 会给 null —— 直接 `?.trim() !== ''` 会得到 `undefined !== ''` = true，
           * 于是空标题也判成「有标题」，白占一行。必须先落成空串。
           */
          headingText() {
            return (this.ele.getAttribute('heading') ?? '').trim();
          },

          /** 具名插槽有没有分到东西：**元素即内容**；纯文本/注释节点要非空白才算 */
          slotHasContent(name) {
            const selector = name ? `slot[name="${name}"]` : 'slot:not([name])';
            const slot = this.ele.shadowRoot.querySelector(selector);
            return (slot?.assignedNodes() ?? []).some(
              (node) =>
                node.nodeType === Node.ELEMENT_NODE || (node.textContent ?? '').trim() !== '',
            );
          },

          /** 只在真的变了的时候写宿主 —— 否则每次属性变动都白触发一轮样式重算 */
          mirror(name, on) {
            if (on === this.ele.hasAttribute(name)) return;
            if (on) this.ele.setAttribute(name, '');
            else this.ele.removeAttribute(name);
          },

          /** 只发事件，不删 DOM —— 删不删由使用者决定 */
          onClose() {
            this.emit('close', { bubbles: true, composed: true });
          },
        },
      };
    };
  </script>
</template>
