<!-- mc-data-grid — ERP 列表页数据网格 v0（列 / 行 / 复选 / 三态排序 / 行内动作）；设计取舍见 README.md。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <style>
    /* 1. 宿主 + 色槽默认值（L3 组件令牌默认引用 L2 语义令牌，按实例 style 覆盖） */
    :host {
      display: flex;
      flex-direction: column;
      position: relative;
      box-sizing: border-box;
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-data-grid-font, var(--mc-text-sm, var(--mc-def-text-sm)));
      color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)));
      --mc-data-grid-font: var(--mc-text-sm, var(--mc-def-text-sm));
      --mc-data-grid-border: var(--mc-color-border, var(--mc-def-color-border));
      --mc-data-grid-head-bg: var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken));
      --mc-data-grid-head-fg: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
      --mc-data-grid-stripe-bg: var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken));
      --mc-data-grid-hover-bg: var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken));
      /* 冻结列「浮起一层」的软阴影：只有横向可滚、且该侧还有被卷走的内容时才出现 */
      --mc-data-grid-fixed-shadow: rgb(var(--mc-color-fg, var(--mc-def-color-fg)) / 0.26);
      /* 合计行底色：和普通行区分开，又不抢状态色 */
      --mc-data-grid-summary-bg: var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken));
    }

    /* 2. 尺寸三档：只动字号与内边距（默认 md 写在上面） */
    :host([size='sm']) {
      --mc-data-grid-font: var(--mc-text-xs, var(--mc-def-text-xs));
      --mc-data-grid-pad-x: var(--mc-space-3, var(--mc-def-space-3));
      --mc-data-grid-pad-y: var(--mc-space-1, var(--mc-def-space-1));
    }
    :host([size='lg']) {
      --mc-data-grid-font: var(--mc-text-base, var(--mc-def-text-base));
      --mc-data-grid-pad-x: var(--mc-space-5, var(--mc-def-space-5));
      --mc-data-grid-pad-y: var(--mc-space-3, var(--mc-def-space-3));
    }

    /* 3. 外框 / 滚动容器：height / max-height 由属性给；没有就按内容长 */
    .mc-wrap {
      position: relative;
      box-sizing: border-box;
      /* 宿主给高度时填满剩余空间、内部滚动；宿主高度 auto 时按内容长 */
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      border: 1px solid transparent;
      border-radius: var(--mc-radius-md, var(--mc-def-radius-md));
    }
    :host([bordered]) .mc-wrap {
      border-color: rgb(var(--mc-data-grid-border));
    }
    /* layout pass 判定内容不超高时，纵向不滚（避免 ±1px 亚像素差出现滚动条） */
    .mc-wrap[data-fit-y] {
      overflow-y: hidden;
    }

    .mc-table {
      width: 100%;
      border-spacing: 0;
      text-align: left;
    }
    /* 列宽全部声明时用 fixed 布局：列宽 = 配置值，单元格内容不许把表撑宽（长文本交给 mc-ellipsis） */
    .mc-table.mc-table-fixed {
      table-layout: fixed;
    }
    .mc-table.mc-table-fixed td {
      overflow: hidden;
    }

    .mc-table th,
    .mc-table td {
      padding: var(--mc-data-grid-pad-y, var(--mc-space-2, var(--mc-def-space-2)))
        var(--mc-data-grid-pad-x, var(--mc-space-4, var(--mc-def-space-4)));
      border-bottom: 1px solid rgb(var(--mc-data-grid-border));
      white-space: nowrap;
    }

    .mc-table thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background-color: rgb(var(--mc-data-grid-head-bg));
      color: rgb(var(--mc-data-grid-head-fg));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
    }

    :host([striped]) .mc-table tbody tr:nth-child(even) td {
      background-color: rgb(var(--mc-data-grid-stripe-bg));
    }

    /* 只有数据行响应 hover（spacer / 合计行不参与） */
    .mc-table tbody.mc-body tr:hover td {
      background-color: rgb(var(--mc-data-grid-hover-bg));
    }

    /* 4. 冻结列 = 左右各一个容器（三张同源表格：左固定 / 中间可滚 / 右固定） */
    .mc-panes {
      display: flex;
      align-items: flex-start;
      width: max-content;
      min-width: 100%;
    }
    .mc-pane {
      flex: none;
      background-color: rgb(var(--mc-color-surface));
    }
    .mc-pane-left {
      position: sticky;
      left: 0;
      z-index: 3;
    }
    .mc-pane-right {
      position: sticky;
      right: 0;
      z-index: 3;
    }
    :host([data-fixed-shadow-left]) .mc-pane-left {
      box-shadow: 12px 0 16px -14px var(--mc-data-grid-fixed-shadow);
    }
    :host([data-fixed-shadow-right]) .mc-pane-right {
      box-shadow: -12px 0 16px -14px var(--mc-data-grid-fixed-shadow);
    }
    .mc-table tbody.mc-body tr[data-hover] td {
      background-color: rgb(var(--mc-data-grid-hover-bg));
    }
    /* 合计行（独立 zone）：表内最后一行，列严格对齐；sticky 在滚动区底部（横向滚动条上方） */
    .mc-table tfoot.mc-summary td {
      position: sticky;
      bottom: 0;
      z-index: 2;
      background-color: rgb(var(--mc-data-grid-summary-bg));
      border-block-start: 1px solid rgb(var(--mc-data-grid-border));
      font-weight: var(--mc-weight-semibold, var(--mc-def-weight-semibold));
      font-variant-numeric: tabular-nums;
    }
    .mc-pane-left .mc-table tfoot.mc-summary td,
    .mc-pane-right .mc-table tfoot.mc-summary td {
      z-index: 4;
    }
    :host([striped]) .mc-table tfoot.mc-summary td {
      background-color: rgb(var(--mc-data-grid-summary-bg));
    }
    /* layout 占位 zone：内容不足时把合计行顶到滚动区底部；不可交互、不参与 hover/选中 */
    .mc-table tbody.mc-layout-spacer {
      pointer-events: none;
    }
    .mc-table tbody.mc-layout-spacer td {
      height: 0;
      padding: 0;
      border: 0;
      background-color: rgb(var(--mc-color-surface));
    }

    /* 5. 对齐：列上的 align 落到表头与单元格（表头文案也一起对齐） */
    .mc-table [data-align='right'] {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .mc-table [data-align='center'] {
      text-align: center;
    }

    /* 5. 选择列：只有 selectable 才出现（表头 / 行 HTML 在脚本里按属性生成） */
    .mc-select {
      width: 40px;
      padding-inline: var(--mc-space-2, var(--mc-def-space-2));
    }
    .mc-select input {
      margin: 0;
      vertical-align: middle;
      accent-color: rgb(var(--mc-color-primary, var(--mc-def-color-primary)));
    }

    /* 6. 排序：表头按钮是键盘落点；只有列声明 sortable + 宿主开 sortable 才可点 */
    .mc-sort {
      display: inline-flex;
      align-items: center;
      gap: var(--mc-space-1, var(--mc-def-space-1));
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: inherit;
      text-align: inherit;
      cursor: default;
    }
    :host([sortable]) th[data-sortable] .mc-sort {
      cursor: pointer;
    }
    :host([sortable]) th[data-sortable] .mc-sort:hover {
      color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)));
    }
    .mc-sort:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
      border-radius: var(--mc-radius-sm, 0.25rem);
    }
    /* 排序箭头只在可排序列上出现：宿主没开 sortable / 列没声明 sortable 时，表头就是纯文字 */
    .mc-sort-icon::before {
      content: '';
      display: none;
      width: 0.5em;
      height: 0.5em;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg) translateY(-15%);
      opacity: 0.35;
    }
    :host([sortable]) th[data-sortable] .mc-sort-icon::before {
      display: inline-block;
    }
    th[data-sort='asc'] .mc-sort-icon::before {
      transform: rotate(-135deg) translateY(-15%);
      opacity: 1;
    }
    th[data-sort='desc'] .mc-sort-icon::before {
      opacity: 1;
    }

    /* 7. 空态 / 加载态：表格下面一条状态行 */
    .mc-state {
      display: none;
      padding: var(--mc-space-6, var(--mc-def-space-6)) var(--mc-space-4, var(--mc-def-space-4));
      color: rgb(var(--mc-color-fg-subtle, var(--mc-def-color-fg-subtle)));
      text-align: center;
    }
    .mc-state[data-visible] {
      display: block;
    }
  </style>

  <div
    class="mc-wrap"
    :style.height="height"
    :style.maxHeight="maxHeight"
    on:click="onWrapClick($event)"
    on:dblclick="onWrapDblClick($event)"
    on:change="onWrapChange($event)"
    on:pointerover="onHoverRow($event)"
    on:pointerleave="onHoverRowEnd()">
    <div class="mc-panes" :html="panesHtml"></div>

    <div class="mc-state mc-empty" attr:data-visible="isEmpty ? '' : null">
      <slot name="empty">{{emptyText}}</slot>
    </div>
    <div class="mc-state mc-loading" attr:data-visible="loading !== null ? '' : null">
      <slot name="loading">加载中…</slot>
    </div>
  </div>

  <script>
    import { withOptions } from '../boot/options.js';

    /** :html 是 HTML 通道，不转义 —— 文本单元格与属性值都自己转义 */
    const escapeHtml = (value) =>
      String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    /**
     * 行 / 表头用「整段 HTML 字符串」渲染，而不是 o-fill 逐行 + reactive 行数组：
     * ofa 在**组件上下文**里给数组属性（行对象超过 3 个键时必现）包 stanz 会抛
     * 「设置属性值 rows 出错」（mc-table 也复现）。整段字符串是原始值通道，不经过那层包装。
     */
    export default async () =>
      withOptions({
        tag: 'mc-data-grid',

        emits: {
          'select-change': { data: ['selected'] },
          'sort-change': { data: ['key', 'order'] },
          'cell-click': { detail: true },
          'cell-dblclick': { detail: true },
          'cell-action': { detail: true },
        },

        attrs: {
          /* 对象数组：属性通道只作初始值 / JSON 兼容，运行时推荐 property（同 mc-table） */
          columns: null,
          /* 行主键字段：默认 id */
          rowKey: 'id',
          sortable: null,
          selectable: null,
          striped: null,
          bordered: null,
          size: 'md',
          loading: null,
          emptyText: '暂无数据',
          /* 合计行：属性通道只作 JSON 初始值，运行时推荐 property（同 columns / data） */
          summary: null,
          summaryLabel: '合计',
          /* 滚动容器高度：任意 CSS 长度；只给 max-height 时表格按内容长、超出才滚 */
          height: '',
          maxHeight: '',
        },

        /* ⚠️ 只放原始值：行 / 列的渲染结果都是字符串，不要再把对象数组放进 data（见文件头） */
        data: {
          panesHtml: '',
          isEmpty: true,
        },

        ready() {
          this._wrap = this.shadow.$('.mc-wrap');
          this._cols = [];
          this._rows = [];
          this._selectedKeys = [];
          this._sortKey = '';
          this._sortOrder = '';
          this._summary = {};

          const hasOwn = (key) => Object.prototype.hasOwnProperty.call(this.ele, key);
          this._presetColumns = hasOwn('columns') ? this.ele.columns : undefined;
          this._presetData = hasOwn('data') ? this.ele.data : undefined;
          this._presetSelected = hasOwn('selected') ? this.ele.selected : undefined;
          this._presetSummary = hasOwn('summary') ? this.ele.summary : undefined;

          /* 对象属性走宿主 accessor → 组件内部 plain 字段（不进 ofa 数据通道） */
          Object.defineProperty(this.ele, 'columns', {
            configurable: true,
            get: () => this._cols,
            set: (value) => {
              this._propColumns = true;
              this.applyColumns(value);
            },
          });
          Object.defineProperty(this.ele, 'data', {
            configurable: true,
            get: () => this._rows,
            set: (value) => {
              this._propData = true;
              this.applyData(value);
            },
          });
          Object.defineProperty(this.ele, 'summary', {
            configurable: true,
            get: () => this._summary,
            set: (value) => this.applySummary(value),
          });
          Object.defineProperty(this.ele, 'selected', {
            configurable: true,
            get: () => [...this._selectedKeys],
            set: (value) => this.setSelected(value),
          });

          for (const name of ['clearSelection', 'selectAll', 'scrollTo', 'reload']) {
            Object.defineProperty(this.ele, name, {
              configurable: true,
              value: (...args) => this[name](...args),
            });
          }

          this._mounted = true; // 之后的 watch 才算真变化（P5）
        },

        attached() {
          this._onWrapScroll = () => this.updateFixedShadow();
          this._wrap?.ele?.addEventListener('scroll', this._onWrapScroll, { passive: true });
          if (typeof ResizeObserver !== 'undefined' && this._wrap?.ele) {
            this._layoutRo = new ResizeObserver(() => this.scheduleLayout());
            this._layoutRo.observe(this._wrap.ele);
          }
          if (!this._applied) {
            this._applied = true;
            /* 顺序 = 属性（JSON 兼容）→ 挂载前赋的 property（property 赢） */
            if (this.ele.hasAttribute('columns'))
              this.applyColumns(this.ele.getAttribute('columns'));
            if (this.ele.hasAttribute('data')) this.applyData(this.ele.getAttribute('data'));
            if (this.ele.hasAttribute('summary')) {
              try {
                this.applySummary(JSON.parse(this.ele.getAttribute('summary') ?? '{}'));
              } catch {
                this.applySummary({});
              }
            }
            if (this.ele.hasAttribute('selected'))
              this.setSelected(this.ele.getAttribute('selected'));
            if (this._presetColumns !== undefined) {
              this._propColumns = true;
              this.applyColumns(this._presetColumns);
            }
            if (this._presetData !== undefined) {
              this._propData = true;
              this.applyData(this._presetData);
            }
            if (this._presetSelected !== undefined) this.setSelected(this._presetSelected);
            if (this._presetSummary !== undefined) this.applySummary(this._presetSummary);
          }

          /* data 没进 attrs（保留名），属性通道自己听；我们从不写这个属性，不会自激 */
          this._attrMo = new MutationObserver(() => {
            if (this._propData) return;
            this.applyData(this.ele.getAttribute('data'));
          });
          this._attrMo.observe(this.ele, { attributes: true, attributeFilter: ['data'] });

          this.applyEmpty();
          this.queueSyncSelection();
        },

        detached() {
          this._attrMo?.disconnect();
          this._wrap?.ele?.removeEventListener('scroll', this._onWrapScroll);
          this._layoutRo?.disconnect();
          if (this._layoutRaf) cancelAnimationFrame(this._layoutRaf);
        },

        watch: {
          columns(value) {
            if (!this._mounted || this._propColumns) return;
            this.applyColumns(value);
          },
          selectable() {
            if (!this._mounted) return;
            this.renderPanes();
          },
          rowKey() {
            if (!this._mounted) return;
            this.applyData(this._lastRows);
          },
          loading() {
            this.applyEmpty();
          },
        },

        proto: {
          /** 属性文本 / 数组 / null → 数组（属性通道 JSON 兼容；首屏绑定可能直接给数组） */
          toArray(value) {
            if (value == null) return [];
            if (typeof value === 'string') {
              const text = value.trim();
              if (!text) return [];
              try {
                const parsed = JSON.parse(text);
                return Array.isArray(parsed) ? parsed : [];
              } catch {
                return [];
              }
            }
            return Array.isArray(value) ? value : [];
          },

          /** 列定义 → 内部 cols（plain），并重渲染表头 / 行（单元格结构跟列走） */
          applyColumns(value) {
            this._lastColumns = value;
            this._cols = this.toArray(value)
              .filter((col) => col && typeof col === 'object')
              .map((col) => ({
                key: String(col.key ?? ''),
                title: col.title == null ? String(col.key ?? '') : String(col.title),
                width: col.width == null ? '' : String(col.width),
                align: col.align === 'right' || col.align === 'center' ? col.align : 'left',
                sortable: col.sortable === true,
                fixed: col.fixed === 'left' || col.fixed === 'right' ? col.fixed : '',
              }));
            this.renderPanes();
          },

          /** 行数据 → 内部 rows（plain），并重渲染行 HTML */
          applyData(value) {
            this._lastRows = value;
            const keyName = this.ele.getAttribute('row-key') || 'id';
            this._rows = this.toArray(value).map((row, index) => {
              if (!row || typeof row !== 'object') return { rowKey: String(index) };
              return { ...row, rowKey: String(row.rowKey ?? row[keyName] ?? index) };
            });
            this.renderPanes();
            this.applyEmpty();
            this.queueSyncSelection();
          },

          /** 合计行：页面算好「列 key → 展示字符串」传进来；库只负责渲染与 sticky，不碰业务格式 */
          /** 合计行：页面算好「列 key → 展示字符串」传进来；库渲染成表内对齐的 tfoot 行 */
          applySummary(value) {
            this._summary =
              value && typeof value === 'object' && !Array.isArray(value) ? { ...value } : {};
            this.renderPanes();
          },

          applyEmpty() {
            this.isEmpty = this._rows.length === 0 && this.loading === null;
          },

          /** 渲染三张同源表格：左固定 / 中间 / 右固定，各装进自己的容器；无冻结列时退回单表 */
          renderPanes() {
            const selectable = this.ele.hasAttribute('selectable');
            const leftCols = this._cols.filter((column) => column.fixed === 'left');
            const rightCols = this._cols.filter((column) => column.fixed === 'right');
            const mainCols = this._cols.filter((column) => !column.fixed);
            const hasFixed = leftCols.length > 0 || rightCols.length > 0;
            const keys = new Set(this._selectedKeys);
            const hostSortable = this.ele.hasAttribute('sortable');

            const headCell = (column) => {
              const sortable = hostSortable && column.sortable;
              const sort = this._sortKey === column.key ? this._sortOrder : '';
              const attrs = [
                'scope="col"',
                'data-align="' + column.align + '"',
                sortable ? 'data-sortable=""' : '',
                sort ? 'data-sort="' + sort + '"' : '',
                column.width ? 'style="width: ' + escapeHtml(column.width) + '"' : '',
              ]
                .filter(Boolean)
                .join(' ');
              return (
                '<th ' +
                attrs +
                '><button class="mc-sort" type="button" data-sort-key="' +
                escapeHtml(column.key) +
                '"><span>' +
                escapeHtml(column.title) +
                '</span><span class="mc-sort-icon"></span></button></th>'
              );
            };
            const headRow = (columns, withCheckbox) => {
              let cells = withCheckbox
                ? '<th class="mc-select" scope="col"><input type="checkbox" data-select-all aria-label="全选"></th>'
                : '';
              for (const column of columns) cells += headCell(column);
              return '<tr>' + cells + '</tr>';
            };
            const cellHtml = (row, column) => {
              const raw = row.cells?.[column.key];
              const content = typeof raw === 'string' ? raw : escapeHtml(row[column.key]);
              return (
                '<td data-col="' +
                escapeHtml(column.key) +
                '" data-align="' +
                column.align +
                '">' +
                content +
                '</td>'
              );
            };
            const bodyRows = (columns, withCheckbox) => {
              let html = '';
              for (const row of this._rows) {
                html += '<tr data-row-key="' + escapeHtml(row.rowKey) + '">';
                if (withCheckbox) {
                  html +=
                    '<td class="mc-select"><input type="checkbox" data-pick="' +
                    escapeHtml(row.rowKey) +
                    '"' +
                    (keys.has(row.rowKey) ? ' checked' : '') +
                    '></td>';
                }
                for (const column of columns) html += cellHtml(row, column);
                html += '</tr>';
              }
              return html;
            };
            /* 合计 zone：整张表的「第一列」放标签，其余列按 key 取展示值；空格占位保证列对齐 */
            const summary = this._summary && typeof this._summary === 'object' ? this._summary : {};
            const hasSummary = Object.keys(summary).length > 0;
            const firstKey = this._cols[0]?.key;
            const summaryLabel = String(this.summaryLabel ?? '合计');
            const summaryCell = (column) => {
              if (column.key === firstKey) {
                return '<td data-summary-label="">' + escapeHtml(summaryLabel) + '</td>';
              }
              const value = summary[column.key];
              if (value == null || value === '') return '<td></td>';
              return (
                '<td data-summary="' +
                escapeHtml(column.key) +
                '">' +
                escapeHtml(String(value)) +
                '</td>'
              );
            };
            /**
             * 一张表 = 四个 zone：
             * thead.mc-head（吸顶）/ tbody.mc-body（数据行）/ tbody.mc-layout-spacer（仅布局）/
             * tfoot.mc-summary（合计）。-spacer 不属于数据行，不参与 hover / 选中 / 行事件。
             */
            const table = (columns, checkbox = false) => {
              const fixed = columns.length > 0 && columns.every((column) => column.width);
              const count = (checkbox ? 1 : 0) + columns.length;
              const spacer = hasSummary
                ? '<tbody class="mc-layout-spacer" aria-hidden="true"><tr><td colspan="' +
                  count +
                  '"></td></tr></tbody>'
                : '';
              let summaryCells = checkbox ? '<td class="mc-select"></td>' : '';
              for (const column of columns) summaryCells += summaryCell(column);
              return (
                '<table class="mc-table' +
                (fixed ? ' mc-table-fixed' : '') +
                '"><thead class="mc-head">' +
                headRow(columns, checkbox) +
                '</thead><tbody class="mc-body">' +
                bodyRows(columns, checkbox) +
                '</tbody>' +
                spacer +
                (hasSummary
                  ? '<tfoot class="mc-summary"><tr class="mc-summary-row">' +
                    summaryCells +
                    '</tr></tfoot>'
                  : '') +
                '</table>'
              );
            };

            this._hasFixed = hasFixed;
            this._hasLeftPane = hasFixed && leftCols.length > 0;
            this._hasRightPane = hasFixed && rightCols.length > 0;
            let html = '';
            if (!hasFixed) {
              html =
                '<div class="mc-pane mc-pane-main">' + table(this._cols, selectable) + '</div>';
            } else {
              if (this._hasLeftPane) {
                html +=
                  '<div class="mc-pane mc-pane-left">' + table(leftCols, selectable) + '</div>';
              }
              html +=
                '<div class="mc-pane mc-pane-main">' +
                table(mainCols, selectable && !this._hasLeftPane) +
                '</div>';
              if (this._hasRightPane) {
                html += '<div class="mc-pane mc-pane-right">' + table(rightCols) + '</div>';
              }
            }
            this.panesHtml = html;
            this.isEmpty = this._rows.length === 0 && this.loading === null;
            this.scheduleLayout();
          },

          scheduleLayout() {
            if (this._layoutRaf) cancelAnimationFrame(this._layoutRaf);
            this._layoutRaf = requestAnimationFrame(() => {
              this._layoutRaf = 0;
              this.runLayout();
            });
          },

          /** layout pass：宽度 → 表头/数据/合计 zone 高度 → layout 占位 → 冻结阴影（只做布局，不碰渲染） */
          runLayout() {
            if (!this.shadow?.all) return;
            const panesEl = this.shadow.$('.mc-panes')?.ele;
            if (!panesEl) return;
            const wrap = this._wrap?.ele;
            const panes = {
              left: panesEl.querySelector('.mc-pane-left'),
              main: panesEl.querySelector('.mc-pane-main'),
              right: panesEl.querySelector('.mc-pane-right'),
            };
            const tables = [...panesEl.querySelectorAll('table.mc-table')];
            if (!tables.length) return;
            this.layoutPaneWidths({ panes, tables, wrap });
            this.layoutZoneHeights({ tables });
            this.layoutSpacer({ panesEl, tables, wrap });
            this.updateFitState({ panesEl, wrap });
            this.updateFixedShadow();
          },

          /** 左右容器按内容定宽、中间吃掉剩余；三张表都拉伸到容器宽 */
          layoutPaneWidths({ panes, tables, wrap }) {
            for (const pane of [panes.left, panes.main, panes.right]) {
              if (pane) pane.style.width = '';
            }
            for (const table of tables) table.style.width = 'auto';
            const available = wrap ? wrap.clientWidth - 2 : 0;
            const measure = (pane) => (pane ? pane.querySelector('table').offsetWidth : 0);
            const leftWidth = measure(panes.left);
            const rightWidth = measure(panes.right);
            const mainWidth = measure(panes.main);
            if (panes.left) panes.left.style.width = leftWidth + 'px';
            if (panes.right) panes.right.style.width = rightWidth + 'px';
            if (panes.main) {
              panes.main.style.width =
                Math.max(mainWidth, available - leftWidth - rightWidth) + 'px';
            }
            for (const table of tables) table.style.width = '100%';
          },

          /** zone 高度对齐：表头（跨表）、数据行逐行、合计行；spacer 不参与 */
          layoutZoneHeights({ tables }) {
            const syncRows = (rows) => {
              const max = rows.reduce((height, row) => Math.max(height, row.offsetHeight), 0);
              for (const row of rows) row.style.height = max + 'px';
            };
            syncRows(
              tables.map((table) => table.querySelector('thead.mc-head tr')).filter(Boolean),
            );
            const bodyRows = tables.map((table) => [...table.querySelectorAll('tbody.mc-body tr')]);
            const count = bodyRows.reduce((max, rows) => Math.max(max, rows.length), 0);
            for (let index = 0; index < count; index += 1) {
              syncRows(bodyRows.map((rows) => rows[index]).filter(Boolean));
            }
            const summaryRows = tables
              .map((table) => table.querySelector('tfoot.mc-summary tr'))
              .filter(Boolean);
            if (summaryRows.length) syncRows(summaryRows);
          },

          /** 内容不足时，用独立的 layout-spacer 把合计行顶到滚动区底部；spacer 不可交互 */
          layoutSpacer({ panesEl, tables, wrap }) {
            const spacers = tables
              .map((table) => table.querySelector('tbody.mc-layout-spacer td'))
              .filter(Boolean);
            if (!spacers.length) return;
            for (const cell of spacers) cell.style.height = '0px';
            const viewport = wrap ? wrap.clientHeight : 0;
            const contentHeight = panesEl.offsetHeight;
            if (viewport <= contentHeight) return;
            const delta = viewport - contentHeight;
            for (const cell of spacers) cell.style.height = delta + 'px';
          },

          /** 行悬停跨三张表同步：只认数据行（mc-body tr），spacer / 合计行不参与 */
          onHoverRow(event) {
            const target = event.target;
            const tr =
              target && typeof target.closest === 'function'
                ? target.closest('tbody.mc-body tr')
                : null;
            const key = tr?.getAttribute('data-row-key') ?? '';
            if (key === this._hoverKey) return;
            this._hoverKey = key;
            const panesEl = this.shadow.$('.mc-panes')?.ele;
            if (!panesEl) return;
            for (const row of panesEl.querySelectorAll('tbody.mc-body tr')) {
              if (key && row.getAttribute('data-row-key') === key)
                row.setAttribute('data-hover', '');
              else row.removeAttribute('data-hover');
            }
          },

          onHoverRowEnd() {
            this._hoverKey = '';
            const panesEl = this.shadow.$('.mc-panes')?.ele;
            if (!panesEl) return;
            for (const row of panesEl.querySelectorAll('tbody.mc-body tr[data-hover]')) {
              row.removeAttribute('data-hover');
            }
          },

          /** 内容是否装得下：装得下就锁纵向 overflow，避免浏览器舍入/缩放产生滚动条 */
          updateFitState({ panesEl, wrap }) {
            if (!wrap) return;
            const fits = panesEl.offsetHeight <= wrap.clientHeight;
            wrap.toggleAttribute('data-fit-y', fits);
          },

          /** 冻结容器阴影只跟随滚动状态：贴左不显示左阴影、贴右不显示右阴影 */
          updateFixedShadow() {
            const wrap = this._wrap?.ele;
            if (!wrap) return;
            const max = wrap.scrollWidth - wrap.clientWidth;
            const canScroll = this._hasFixed === true && max > 1;
            this.ele.toggleAttribute(
              'data-fixed-shadow-left',
              canScroll && this._hasLeftPane === true && wrap.scrollLeft > 1,
            );
            this.ele.toggleAttribute(
              'data-fixed-shadow-right',
              canScroll && this._hasRightPane === true && max - wrap.scrollLeft > 1,
            );
          },

          setSelected(value) {
            this._selectedKeys = this.toArray(value).map((key) => String(key));
            this.queueSyncSelection();
          },

          queueSyncSelection() {
            if (this._syncRaf) cancelAnimationFrame(this._syncRaf);
            this._syncRaf = requestAnimationFrame(() => {
              this._syncRaf = 0;
              this.syncSelection();
            });
          },

          /** 选中态以 property 为真相；只同步 DOM 复选框与表头全选，不重算行 HTML */
          syncSelection() {
            if (!this.shadow?.all) return;
            const keys = new Set(this._selectedKeys);
            for (const box of this.shadow.all('tbody input[data-pick]') ?? []) {
              const el = box.ele ?? box;
              el.checked = keys.has(el.getAttribute('data-pick'));
            }
            const head = this.shadow.$('[data-select-all]');
            if (!head) return;
            const total = this._rows.length;
            const picked = this._rows.filter((row) => keys.has(row.rowKey)).length;
            head.ele.checked = total > 0 && picked === total;
            head.ele.indeterminate = picked > 0 && picked < total;
          },

          /** 行 / 单元格坐标：从事件目标往上找 <tr> / <td>（都在本 shadow 内） */
          cellOf(event) {
            const target = event.target;
            if (!(target instanceof Element)) return null;
            const tr = target.closest('tbody tr');
            if (!tr) return null;
            const rowKey = tr.getAttribute('data-row-key');
            const row = this._rows.find((item) => item.rowKey === rowKey);
            if (!row) return null;
            const td = target.closest('td');
            const columnKey = td?.getAttribute('data-col') ?? '';
            const column = this._cols.find((item) => item.key === columnKey) ?? null;
            return { row, rowKey, column, columnKey, td };
          },

          onWrapClick(event) {
            const target = event.target;
            if (!(target instanceof Element)) return;
            /* 表头排序按钮 */
            const sortButton = target.closest('[data-sort-key]');
            if (sortButton) {
              this.onSort(sortButton.getAttribute('data-sort-key'));
              return;
            }
            const cell = this.cellOf(event);
            if (!cell) return;
            const actionEl = target.closest('[data-action]');
            if (actionEl) {
              this.$emit('cell-action', {
                rowKey: cell.rowKey,
                columnKey: cell.columnKey,
                action: actionEl.getAttribute('data-action'),
                row: cell.row,
                column: cell.column,
                event,
              });
              return;
            }
            if (target instanceof HTMLInputElement) return;
            if (!cell.td) return;
            this.$emit('cell-click', {
              rowKey: cell.rowKey,
              columnKey: cell.columnKey,
              row: cell.row,
              column: cell.column,
              event,
            });
          },

          onWrapDblClick(event) {
            const cell = this.cellOf(event);
            if (!cell?.td) return;
            this.$emit('cell-dblclick', {
              rowKey: cell.rowKey,
              columnKey: cell.columnKey,
              row: cell.row,
              column: cell.column,
              event,
            });
          },

          /** 选择：行内复选框 / 表头全选（change 不穿 shadow，监听挂在本 shadow 的容器上） */
          onWrapChange(event) {
            const target = event.target;
            if (!(target instanceof HTMLInputElement) || target.type !== 'checkbox') return;
            const pick = target.getAttribute('data-pick');
            const all = target.hasAttribute('data-select-all');
            if (pick === null && !all) return;

            if (all) {
              this.selectAll(target.checked);
              return;
            }
            const keys = new Set(this._selectedKeys);
            if (target.checked) keys.add(pick);
            else keys.delete(pick);
            this._selectedKeys = [...keys];
            this.syncSelection();
            this.$emit('select-change', { selected: [...this._selectedKeys] });
          },

          onSort(key) {
            if (!this.ele.hasAttribute('sortable')) return;
            const column = this._cols.find((item) => item.key === key && item.sortable);
            if (!column) return;
            const order =
              this._sortKey !== key
                ? 'asc'
                : this._sortOrder === 'asc'
                  ? 'desc'
                  : this._sortOrder === 'desc'
                    ? ''
                    : 'asc';
            this._sortKey = order ? key : '';
            this._sortOrder = order;
            this.renderPanes();
            this.$emit('sort-change', { key, order: order || null });
          },

          /** 表头上那一列当前的排序态（模板 / 外部读） */
          orderOf(column) {
            return this._sortKey === column.key ? this._sortOrder : '';
          },

          selectAll(checked = true) {
            this._selectedKeys = checked ? this._rows.map((row) => row.rowKey) : [];
            this.syncSelection();
            this.$emit('select-change', { selected: [...this._selectedKeys] });
          },

          clearSelection() {
            this.selectAll(false);
          },

          scrollTo(rowKey) {
            const rows = this.shadow.all('tbody tr') ?? [];
            const target = rows.find(
              (el) => (el.ele ?? el).getAttribute('data-row-key') === String(rowKey),
            );
            target?.ele?.scrollIntoView({ block: 'nearest' });
          },

          /** 按最近一次输入重渲染（外部改了行对象字段时用） */
          reload() {
            this.applyColumns(this._lastColumns ?? [...this._cols]);
            this.applyData(this._lastRows ?? [...this._rows]);
          },
        },
      });
  </script>
</template>
