<!-- mc-tag — 分类 / 状态标签；设计取舍见 README.md「设计取舍」。这份文件经 CDN 直发，注释算体积。 -->
<template component>
  <link rel="stylesheet" href="../boot/component-base.css" />
  <link rel="stylesheet" href="../icon/icons.generated.css" />
  <style>
    /* 1. 宿主盒模型 + 色槽默认值。尺寸/圆角/内边距都写在这里，使用者 style="…" 才压得住 */
    :host {
      display: inline-flex;
      align-items: center;
      box-sizing: border-box;
      position: relative; /* .mc-layer / .mc-toggle / .mc-close 的包含块（P21） */
      gap: var(--mc-tag-gap);
      padding-inline: var(--mc-tag-pad-x);
      padding-block: var(--mc-tag-pad-y);
      /* 三档外观都保留 1px 透明的线：切 variant / 切选中态时高度不抖 */
      border: 1px solid transparent;
      border-radius: var(--mc-tag-radius);
      font-family: var(--mc-font-sans, var(--mc-def-font-sans));
      font-size: var(--mc-text-sm, var(--mc-def-text-sm));
      line-height: var(--mc-text-sm-lh, var(--mc-def-text-sm-lh));
      font-weight: var(--mc-weight-medium, var(--mc-def-weight-medium));
      white-space: nowrap;
      vertical-align: middle;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition:
        background-color var(--mc-duration-fast, var(--mc-def-duration-fast))
          var(--mc-ease-standard, var(--mc-def-ease-standard)),
        color var(--mc-duration-fast, var(--mc-def-duration-fast))
          var(--mc-ease-standard, var(--mc-def-ease-standard)),
        border-color var(--mc-duration-fast, var(--mc-def-duration-fast))
          var(--mc-ease-standard, var(--mc-def-ease-standard));

      /* L3 组件令牌：默认引用 L2 语义令牌。按实例覆盖写在宿主 style 上 */
      --mc-tag-pad-x: var(--mc-space-3, var(--mc-def-space-3));
      --mc-tag-pad-y: var(--mc-space-1, var(--mc-def-space-1));
      --mc-tag-gap: var(--mc-space-1, var(--mc-def-space-1));
      --mc-tag-radius: var(--mc-radius-md, var(--mc-def-radius-md));
      /* 关闭图标的字号：命中区固定 24px；1.25em 与按钮同档的光学补偿（14px + medium 文字旁的描边图标偏轻） */
      --mc-tag-close-size: 1.25em;
      /* hover 反馈的强度：0 = 不响应（静态标签），checkable 才打开 */
      --mc-tag-layer: 0;

      /* 色槽：fill / on-fill 是实心那套，accent 是文字与描边，subtle-fill 是浅底（中性色没有 -subtle，用下沉面色） */
      --mc-tag-fill: var(--mc-color-neutral, var(--mc-def-color-neutral));
      --mc-tag-on-fill: var(--mc-color-neutral-fg, var(--mc-def-color-neutral-fg));
      --mc-tag-accent: var(--mc-color-fg-muted, var(--mc-def-color-fg-muted));
      --mc-tag-subtle-fill: var(--mc-color-surface-sunken, var(--mc-def-color-surface-sunken));

      /* subtle 是默认外观，直接写在 :host 上（:host(:not([variant])) 会静默失效，P14） */
      background-color: rgb(var(--mc-tag-subtle-fill));
      color: rgb(var(--mc-tag-accent));
    }

    /* 2. 维度一 color：只往色槽里填值。neutral 是默认，已经写在上面 */
    :host([color='primary']) {
      --mc-tag-fill: var(--mc-color-primary, var(--mc-def-color-primary));
      --mc-tag-on-fill: var(--mc-color-primary-fg, var(--mc-def-color-primary-fg));
      --mc-tag-accent: var(--mc-color-primary, var(--mc-def-color-primary));
      --mc-tag-subtle-fill: var(--mc-color-primary-subtle, var(--mc-def-color-primary-subtle));
    }
    :host([color='info']) {
      --mc-tag-fill: var(--mc-color-info, var(--mc-def-color-info));
      --mc-tag-on-fill: var(--mc-color-info-fg, var(--mc-def-color-info-fg));
      --mc-tag-accent: var(--mc-color-info, var(--mc-def-color-info));
      --mc-tag-subtle-fill: var(--mc-color-info-subtle, var(--mc-def-color-info-subtle));
    }
    :host([color='success']) {
      --mc-tag-fill: var(--mc-color-success, var(--mc-def-color-success));
      --mc-tag-on-fill: var(--mc-color-success-fg, var(--mc-def-color-success-fg));
      --mc-tag-accent: var(--mc-color-success, var(--mc-def-color-success));
      --mc-tag-subtle-fill: var(--mc-color-success-subtle, var(--mc-def-color-success-subtle));
    }
    :host([color='warning']) {
      --mc-tag-fill: var(--mc-color-warning, var(--mc-def-color-warning));
      --mc-tag-on-fill: var(--mc-color-warning-fg, var(--mc-def-color-warning-fg));
      --mc-tag-accent: var(--mc-color-warning, var(--mc-def-color-warning));
      --mc-tag-subtle-fill: var(--mc-color-warning-subtle, var(--mc-def-color-warning-subtle));
    }
    :host([color='danger']) {
      --mc-tag-fill: var(--mc-color-danger, var(--mc-def-color-danger));
      --mc-tag-on-fill: var(--mc-color-danger-fg, var(--mc-def-color-danger-fg));
      --mc-tag-accent: var(--mc-color-danger, var(--mc-def-color-danger));
      --mc-tag-subtle-fill: var(--mc-color-danger-subtle, var(--mc-def-color-danger-subtle));
    }

    /* 3. 维度二 variant：只决定色槽贴到哪儿 */
    :host([variant='solid']) {
      background-color: rgb(var(--mc-tag-fill));
      color: rgb(var(--mc-tag-on-fill));
    }
    :host([variant='outline']) {
      background-color: transparent;
      color: rgb(var(--mc-tag-accent));
      border-color: rgb(var(--mc-tag-accent));
    }

    /* 4. 尺寸：只有字号与左右内边距两档变量，高度由行高撑（sm/md/lg = 26 / 30 / 34px） */
    :host([size='sm']) {
      --mc-tag-pad-x: var(--mc-space-2, var(--mc-def-space-2));
      font-size: var(--mc-text-xs, var(--mc-def-text-xs));
      line-height: var(--mc-text-xs-lh, var(--mc-def-text-xs-lh));
    }
    :host([size='lg']) {
      --mc-tag-pad-x: var(--mc-space-4, var(--mc-def-space-4));
      font-size: var(--mc-text-base, var(--mc-def-text-base));
      line-height: var(--mc-text-base-lh, var(--mc-def-text-base-lh));
    }

    /* 状态 —— 选中：覆盖 variant，换成该色的实心。选中是状态，不是第三档外观 */
    :host([selected]) {
      background-color: rgb(var(--mc-tag-fill));
      color: rgb(var(--mc-tag-on-fill));
      border-color: transparent;
    }

    /* checkable 才有整块反馈与手型；disabled 用正向选择器把它们归零（不用 :not()，P14） */
    :host([checkable]) {
      --mc-tag-layer: 0.08;
      cursor: pointer;
    }
    :host([disabled]) {
      --mc-tag-layer: 0;
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 5. 内部元素：工具类表达不了的部分 */
    /* state layer：currentColor + 半透明，任意配色与主题都自动协调；强度由 --mc-tag-layer 给 */
    .mc-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background-color: currentColor;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--mc-duration-fast, var(--mc-def-duration-fast))
        var(--mc-ease-standard, var(--mc-def-ease-standard));
    }
    :host(:hover) .mc-layer {
      opacity: var(--mc-tag-layer);
    }
    :host(:active) .mc-layer {
      opacity: calc(var(--mc-tag-layer) * 1.5);
    }

    /* toggle 层：透明原生 button 铺满宿主，点击/键盘/焦点环都是浏览器给的。z-index 必须高于 .mc-layer，否则点击被叠层拦掉（P21）；非 checkable 时 display:none（P10） */
    .mc-toggle {
      all: unset;
      display: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: inherit;
      border-radius: inherit;
    }
    :host([checkable]) .mc-toggle {
      display: block;
    }
    /* 焦点环用 ring 令牌，不用 currentColor：实心标签上白圈画在浅色页面里看不见（P16） */
    .mc-toggle:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }

    .mc-close {
      display: none;
      position: relative;
      z-index: 3;
      flex: none;
      box-sizing: border-box;
      width: var(--mc-space-6, var(--mc-def-space-6));
      height: var(--mc-space-6, var(--mc-def-space-6));
      /* 24px 的命中区不能反过来把标签撑高：负外边距抵消落在上下内边距里的那 8px，高度仍由字号决定 */
      margin-block: calc(var(--mc-tag-pad-y) * -1);
      padding: 0;
      border: 0;
      border-radius: var(--mc-radius-full, var(--mc-def-radius-full));
      background-color: transparent;
      color: inherit;
      font: inherit;
      font-size: var(--mc-tag-close-size);
      line-height: 1;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    :host([closable]) .mc-close {
      display: inline-flex;
    }
    .mc-close:hover {
      background-color: rgb(var(--mc-color-fg, var(--mc-def-color-fg)) / 0.12);
    }
    .mc-close:focus-visible {
      outline: 2px solid rgb(var(--mc-color-ring, var(--mc-def-color-ring)));
      outline-offset: 2px;
    }
    .mc-close:disabled {
      /* 禁用态不响应 hover（设计规范第五节），光标也不该变手型 */
      background-color: transparent;
      cursor: not-allowed;
    }
  </style>

  <span class="mc-layer" aria-hidden="true"></span>

  <button
    class="mc-toggle"
    type="button"
    attr:aria-pressed="selected !== null ? 'true' : 'false'"
    :disabled="disabled !== null"
    on:click="onToggle($event)"
  ></button>

  <slot></slot>

  <!-- 关闭：内置图标（静态图标直接用类，省一个组件请求）；无障碍名由 aria-label 给，图形本身要有语义就再 aria-hidden -->
  <button
    class="mc-close"
    part="close"
    type="button"
    aria-label="移除"
    :disabled="disabled !== null"
    on:click="onClose($event)"
  >
    <span class="mc-icon-close" aria-hidden="true"></span>
  </button>

  <script>
    import { colorAttr } from '../boot/color-attr.js';

    const color = colorAttr({ slots: ['fill', 'on-fill', 'accent', 'subtle-fill'] });

    export default async () => ({
      tag: 'mc-tag',

      attrs: {
        color: 'neutral',
        variant: 'subtle',
        size: 'md',
        // 布尔属性默认值必须是 null（P1）
        closable: null,
        checkable: null,
        // 既是初始值也是运行时状态（规范 1.4）：el.selected = true 立刻生效
        selected: null,
        disabled: null,
      },

      ready() {
        this._toggle = this.ele.shadowRoot.querySelector('.mc-toggle');
        this._slot = this.ele.shadowRoot.querySelector('slot');

        // 运行时状态走 property（规范 1.4）：setter 只写宿主属性，CSS 当次就读得到（P4）
        Object.defineProperty(this.ele, 'selected', {
          configurable: true,
          get: () => this.ele.hasAttribute('selected'),
          set: (value) => {
            if (value) this.ele.setAttribute('selected', '');
            else this.ele.removeAttribute('selected');
          },
        });
      },

      attached() {
        // 宿主 style 等构造期结束再写（P31），color 的首次同步在这里
        color.sync(this.ele, this.color);

        /* slotchange 覆盖「插槽内容变了」这一路；运行时不再盯子树 */
        this._onSlotChange = () => this.applyLabel();
        this._slot.addEventListener('slotchange', this._onSlotChange);
        this.applyLabel();
      },

      detached() {
        this._slot?.removeEventListener('slotchange', this._onSlotChange);
      },

      watch: {
        // 首次触发落在构造期（P5），跳过由 colorAttr 内部处理；这里只关心"值变了"
        color(value) {
          color.change(this.ele, value);
        },
      },

      proto: {
        /** 插槽文本 → toggle 按钮的 aria-label（空内容就不写，避免出现没有名字的按钮） */
        applyLabel() {
          const text = [...this._slot.assignedNodes()]
            .map((node) => node.textContent ?? '')
            .join(' ')
            .replace(/\s+/g, ' ')
            .trim();
          if (text) this._toggle.setAttribute('aria-label', text);
          else this._toggle.removeAttribute('aria-label');
        },

        /** 选中态以宿主属性为唯一真相；立刻写属性，事件带 selected（规范 1.4 / 1.5） */
        onToggle() {
          if (this.ele.hasAttribute('disabled')) return;
          const selected = !this.ele.hasAttribute('selected');
          if (selected) this.ele.setAttribute('selected', '');
          else this.ele.removeAttribute('selected');
          this.emit('change', { data: { selected }, bubbles: true, composed: true });
        },

        /** 只发事件，不删 DOM */
        onClose() {
          if (this.ele.hasAttribute('disabled')) return;
          this.emit('close', { bubbles: true, composed: true });
        },
      },
    });
  </script>
</template>
