<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.5/dist/ofa.min.mjs"
      type="module"></script>
  </head>
  <body>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/space/space.html"></l-m>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/tag/tag.html"></l-m>

    <mc-space direction="vertical" block>
      <mc-space block wrap-items>
        <mc-tag>前端</mc-tag>
        <mc-tag>后端</mc-tag>
        <mc-tag>设计</mc-tag>
      </mc-space>

      <mc-space block wrap-items>
        <mc-tag color="primary">主要</mc-tag>
        <mc-tag color="info">信息</mc-tag>
        <mc-tag color="success">成功</mc-tag>
        <mc-tag color="warning">警告</mc-tag>
        <mc-tag color="danger">危险</mc-tag>
        <mc-tag>中性（默认）</mc-tag>
      </mc-space>
    </mc-space>

  </body>
</html>
