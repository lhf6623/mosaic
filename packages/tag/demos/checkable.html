<template component>
  <div class="flex flex-wrap items-center gap-3">
    <mc-tag checkable selected color="primary" on:change="onChange($event)">已实现</mc-tag>
    <mc-tag checkable color="primary" on:change="onChange($event)">待建</mc-tag>
    <mc-tag checkable color="danger" on:change="onChange($event)">已废弃</mc-tag>
    <mc-tag checkable closable color="info" on:change="onChange($event)" on:close="onClose($event)"
      >可关也可选</mc-tag
    >
  </div>

  <p class="mt-3 text-sm text-muted">
    最近一次 <code>change</code>：<strong>{{lastChange}}</strong>
  </p>

  <script>
    export default async () => ({
      tag: 'demo-tag-checkable',

      data: {
        lastChange: '（还没选过）',
      },

      proto: {
        onChange(event) {
          const name = event.target.textContent.trim();
          this.lastChange = `${name} → ${event.data.selected ? '选中' : '取消'}`;
        },
        onClose(event) {
          // 可关 + 可选同时开：点 × 走这条，不该同时触发 change
          event.target.remove();
          this.lastChange = '（被关掉了，没有 change）';
        },
      },
    });
  </script>
</template>
