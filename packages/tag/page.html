    <h1>
      Tag
      <code>mc-tag</code>
    </h1>
    <p class="doc-lead">分类 / 状态标签：一块小色片，可选可关。</p>

    <h2>例子</h2>

    <!-- 演示区三段：标题 → 说明（可选，是导语不是脚注）→ 可编辑示例（doc-playground）；取词规则见 packages/README.md「演示区三段」。 -->
    <doc-demos>
      <section class="doc-demo">
        <h3>语义色</h3>
        <p class="doc-hint">
          默认是
          <strong>中性</strong>
          —— 标签是分类标记，语义色应当在需要强调时才用；六个色值都有。
        </p>
        <doc-playground src="./demos/colors.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>hex 颜色</h3>
        <p class="doc-hint">
          <code>color</code>
          也直接收 hex（
          <code>#fff000</code>
          /
          <code>#fc0</code>
          ）：浅底按主题派生，
          文字色按对比度自动给；极浅的牌子色在浅底上读不清时会有一条控制台警告。
        </p>
        <doc-playground src="./demos/hex.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>外观</h3>
        <p class="doc-hint">
          <code>subtle</code>
          （默认）浅底深字，最不抢视线；
          <code>solid</code>
          实心底；
          <code>outline</code>
          只有一圈描边。三档都保留 1px 边框，切换时高度不抖。
        </p>
        <doc-playground src="./demos/variants.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>尺寸</h3>
        <p class="doc-hint">
          尺寸只改字号与左右内边距，
          <strong>高度由字号撑</strong>
          ：
          <code>sm</code>
          /
          <code>md</code>
          /
          <code>lg</code>
          = 26 / 30 / 34px（行高 + 上下内边距 + 上下 1px 边框）。
          标签不折行：长文本要么短，要么自己在宿主上截断（
          <code>max-width</code>
          +
          <code>overflow: hidden</code>
          ）。
        </p>
        <doc-playground src="./demos/sizes.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>可关闭</h3>
        <p class="doc-hint">
          <code>closable</code>
          在右侧加一个原生
          <code>&lt;button&gt;</code>
          ；点击只发
          <code>close</code>
          ，组件
          <strong>不自己删 DOM</strong>
          ，例子里的
          <code>on:close</code>
          里那句
          <code>remove()</code>
          就是使用者那一半。
        </p>
        <doc-playground src="./demos/closable.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>可选中</h3>
        <p class="doc-hint">
          <code>checkable</code>
          让整块可点（shadow 里一个铺满宿主的原生按钮）， 切换时发
          <code>change</code>
          ，
          <code>$event.data.selected</code>
          是切换后的状态；选中态换成该色的实心。 选中态统一实心，所以可切换的标签用默认
          <code>subtle</code>
          才看得出变化。
        </p>
        <doc-playground src="./demos/checkable.html"></doc-playground>
      </section>

      <section class="doc-demo">
        <h3>事件回调</h3>
        <p class="doc-hint">
          <code>checkable</code>
          的标签切换时发
          <code>change</code>
          （载荷
          <code>$event.data.selected</code>
          ）；点 × 发
          <code>close</code>
          ，
          <strong>不删 DOM</strong>
          —— 要消失自己在事件里
          <code>remove()</code>
          。
        </p>
        <doc-playground src="./demos/events.html"></doc-playground>
      </section>

          <code>::part(名字)</code>

          <code>close</code>
          ）。
        </p>
        <doc-playground src="./demos/part.html"></doc-playground>
      </section>
    </doc-demos>
