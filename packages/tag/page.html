    <h2>注意事项</h2>
    <ul>
      <li>
        <strong>和 <code>mc-badge</code> 的分工</strong>：badge 是挂在别的元素上的徽标（计数、圆点、
        不交互），tag 是内容本身的标签 —— 它才有关闭与选中。
      </li>
      <li>
        <strong><code>selected</code> 会覆盖 <code>variant</code></strong
        >：选中的标签统一用该色<strong>实心</strong>。所以可切换的标签用默认
        <code>subtle</code> 才看得出变化；写死 <code>variant="solid"</code> 时选中前后一个样（那时用
        <code>::part()</code> 或自己的 <code>aria-pressed</code> 样式补区别）。
      </li>
      <li>
        <strong>不写死控件高</strong>：标签不是控件，高度由字号撑。需要固定高度就写宿主
        <code>style="height: …"</code>；项目规范里 32px 的图标按钮下限对行内标签不适用 —— ×
        的命中区是 24×24（WCAG 2.2 AA 的下限），别把 tag 当主操作。
      </li>
      <li>
        <strong><code>closable</code> 不会把标签撑高</strong>：那个 24×24 的 × 比行高还高，
        它靠负外边距抵消掉落在上下内边距里的部分 —— 加不加 <code>closable</code>、三档尺寸，
        高度都只由字号决定。
      </li>
      <li>
        <strong><code>closable</code> 不删 DOM</strong>：只发 <code>close</code>。要在页面上消失，
        自己在事件里 <code>el.remove()</code> 或改数据（组件不替使用者动 DOM）。
      </li>
      <li>
        <strong>可关 + 可选同时开时，× 压在 toggle 层上面</strong>：点 × 只发
        <code>close</code>，不会顺带切换选中。
      </li>
      <li>
        <strong>长文本不折行</strong>（<code>white-space: nowrap</code>）：标签要么短，要么自己在
        宿主上做截断（<code>max-width</code> + <code>overflow: hidden</code>）。
      </li>
      <li>
        <strong>颜色与圆角全在宿主上</strong>：<code>&lt;mc-tag style="…"&gt;</code> 直接覆盖，
        不需要 <code>!important</code>；内部只有 × 一个 <code>part</code>。
      </li>
      <li>
        <strong>裸点击就是原生 <code>click</code></strong
        >（自带 <code>composed</code>，会穿过 shadow 边界冒泡），组件不另造事件。
      </li>
      <li>
        <strong>在脏宿主页面里也正常</strong>：标签不依赖页面 reset，宿主页面的 <code>a</code> /
        <code>p</code> 全局样式也够不到 shadow 里的两个按钮。
      </li>
    </ul>
