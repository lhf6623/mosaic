<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.5/dist/ofa.min.mjs"
      type="module"></script>
  </head>
  <body>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/space/space.html"></l-m>
    <l-m src="https://cdn.jsdelivr.net/gh/lhf6623/mosaic@0.1.0/packages/rate/rate.html"></l-m>

    <mc-space direction="vertical" block>
      <!-- value：初始 / 受控值 -->
      <mc-rate value="3"></mc-rate>
      <!-- default-value：只在挂载时读一次的非受控初值 -->
      <mc-rate default-value="4"></mc-rate>
      <!-- 什么都不写就是 0 —— 未评分 -->
      <mc-rate></mc-rate>
    </mc-space>

  </body>
</html>
